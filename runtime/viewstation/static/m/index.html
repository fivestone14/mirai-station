<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E4E0D8">
<title>SNDK · Mirai</title>
<!--
  The phone glance — light rebuild, 2026-09-09.

  It answers three questions in reading order: what kind of day, where price
  sits against the levels that matter, and what the model made of it. The
  READING is the payload; the chart is context. The old build had that the
  other way round — 44% of the screen was chart and the sentence got a strip at
  the bottom, clamped to three lines, which cut 44.5% of recorded readings
  mid-sentence.

  FOUR LAWS, unchanged from the dark build. They are older than the theme.

    1. Honest-absent. No datum yields no mark. A measured emptiness is a
       finding and gets drawn; a missing datum is not zero. On a light ground
       this needs ACTIVE work: empty dark space reads as unlit, empty white
       space reads as loading. So an absence is drawn, never left blank.
    2. One hue, one meaning. Green is the call side, coral the put side, amber
       the magnet, blue price. NOTHING else on this screen is coloured — not
       the live card, not the active tab. Chrome is neutral and hierarchy is
       carried by fill, size and shadow. The one sanctioned exception is the
       day's-move chip, of which there is exactly one on screen.
    3. No Greek on the surface. Every distance is in dollars. The sigma ruler
       is stated once, in English, in the regime row.
    4. Market time everywhere. The station is on Pacific; every clock face
       here is Eastern.

  WHY THE PAGE SCROLLS NOW. The old build was a fixed-height column with
  overflow:hidden, and every region's height was a constant that had to sum to
  less than the viewport. That budget was the source of three separate
  documented failures — a region overrunning and printing through the footer,
  a dead media block, and a JS/CSS disagreement about which viewport to
  measure. It also made an unclamped reading impossible: a paragraph that can
  be six lines or thirteen cannot live in a fixed box. The reading is the
  payload, so the box goes.

  WHY THE COLOURS ARE NOT WHITE. The ground is 74.8% relative luminance and
  the card 88.1%; pure white is 100%. Both are warmed off the grey axis. This
  is read outdoors in daylight, where a light screen beats a dark one — but a
  bright white panel in the same conditions is its own problem.
-->
<link rel="preload" href="/m/pjs-153fc85b7029.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* The station serves this immutable for a year; the hash in the name is what
   makes that safe. font-display:swap so a cold cache shows Roboto for a beat
   rather than nothing — a glance must never wait on a typeface. */
@font-face{
  font-family:"Jakarta";
  src:url("/m/pjs-153fc85b7029.woff2") format("woff2");
  font-weight:200 800;
  font-style:normal;
  font-display:swap;
}

:root{
  /* ---- surfaces ---- */
  --g:#E4E0D8;          /* ground — warm putty, 74.8% luminance   */
  --s:#F4F1EB;          /* card   — warm off-white, 88.1%         */
  --s2:#DCD7CD;         /* inset  — bar track, chip               */
  --fill:#1F2622;       /* the one filled card: the reading       */

  /* ---- ink. Every step clears 4.5:1 on card AND ground. Subordination is
         by SIZE, never by contrast: this is read outdoors, and a low-contrast
         grey outdoors means gone. ---- */
  --i:#161A17;          /* 15.60 on card · 13.36 on ground        */
  --i-body:#333B35;     /* 10.25 · 8.78                           */
  --i-mute:#535B52;     /*  6.24 · 5.34 · 4.90 on inset           */
  --i-faint:#5C6459;    /*  5.44 · 4.66 — card+ground ONLY; it
                            measures 4.28 on the inset            */
  --on-body:#E4E6DF;    /* 12.28 — not pure white; white halates
                            over six lines of reversed prose      */
  --on-mute:#A9B0A6;    /*  6.95                                  */
  --on-faint:#8E958A;   /*  5.02                                  */

  /* ---- one hue, one meaning.
         -ink is text (>=4.5:1), -mark is a stroke (>=3:1), -tint a wash.
         The dark build's values all FAIL on a light ground — jade measured
         2.16:1 on white, amber 1.96:1 — so these are re-derived, not
         re-used. ---- */
  --call-ink:#136B52;  --call-mark:#2A9070;  --call-tint:#DDEBE0;
  --put-ink:#AE3020;   --put-mark:#D2543E;   --put-tint:#F3E1DA;
  --mag-ink:#845307;   --mag-mark:#B8740C;
  --px-ink:#2F44B8;    --px-mark:#5470E4;
  --path:#5F6A62;      --rule-soft:#7E8779;  --band:#EAE6DE;
  --band-edge:#D5CFC4;

  /* STALENESS HAS NO HUE ANY MORE. Amber carried both the magnet and aging in
     the dark build. Darkened enough to be legible on this ground they land on
     #845307 and #9B6E17 — six to thirteen units apart out of 255, which is no
     distinction at all. Amber keeps the magnet; aging becomes a SHAPE, the
     outlined chip below. */

  /* ---- shadow: the card edge, since the card/ground step is only 1.17:1.
         One light source, straight down. Blur grows faster than offset and
         spread goes negative on the wide layers, or the ambient leaks
         sideways and dirties the paper. Tinted with the ground's own warm
         hue — black over a warm ground goes muddy. ---- */
  --sh1:0 1px 1px -.5px rgba(58,48,32,.05),
        0 3px 6px -1px rgba(58,48,32,.06),
        0 10px 22px -6px rgba(58,48,32,.07);
  --sh2:0 1px 2px 0 rgba(31,38,34,.08),
        0 6px 14px -3px rgba(31,38,34,.12),
        0 20px 40px -12px rgba(31,38,34,.16);

  /* ---- touch + press. Material's md.sys tokens; 48px is the strictest of
         the three target specs in play, so meeting it meets all of them. ---- */
  --tap-min:48px;
  --state-hover:.08; --state-press:.12;
  --press-in:80ms; --press-out:200ms;
  --ease-in:cubic-bezier(0,0,0,1);
  --ease-out:cubic-bezier(.2,0,0,1);

  --sans:"Jakarta",system-ui,Roboto,"Segoe UI",sans-serif;

  /* The FIRST-PAINT value only. The tab bar is position:fixed, so the body has
     to reserve its height or the last line of the page renders underneath it —
     and this constant was 64 against a bar that measures 74, which clipped the
     footer by 5px from the day it shipped. A number that asserts a measurement
     is exactly what the old region budget was made of.
     fitTabs() in page.js measures the bar and overwrites this on load and on
     resize; 74 is here so the first frame is already right, and so the page
     degrades to correct-and-slightly-roomy if the script never runs. */
  --tab-h:74px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{height:100%;background:var(--g)}
body{
  min-height:100dvh;
  background:var(--g);
  color:var(--i-body);
  font:400 15px/1.5 var(--sans);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  /* the bar's own height already includes the safe-area inset it pads itself
     with, so adding the inset again here would double-count it */
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(var(--tab-h) + 16px);
  display:flex; flex-direction:column; gap:12px;
}
body.failed > *:not(.fail):not(.tabs){display:none}

/* ============ A. MASTHEAD — on the ground, uncarded ============ */
.mast{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 4px}
.mast-l{min-width:0}
.mast-row{display:flex;align-items:center;gap:7px}
.ticker{font:700 11px/1 var(--sans);letter-spacing:.16em;color:var(--i-faint)}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--call-mark);flex:none;
         box-shadow:0 0 0 0 rgba(42,144,112,.5);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,144,112,.45)}
                 70%{box-shadow:0 0 0 7px rgba(42,144,112,0)}
                 100%{box-shadow:0 0 0 0 rgba(42,144,112,0)}}
@media (prefers-reduced-motion:reduce){.livedot{animation:none}}
.expiry{font:500 11px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--i-faint)}
.px{margin-top:10px;font:700 34px/1 var(--sans);letter-spacing:-.025em;color:var(--i);display:block}
.px.withdrawn{color:var(--i-mute)}
.chg{display:inline-flex;align-items:center;gap:4px;margin-top:9px;padding:5px 10px;
     border-radius:999px;font:700 12px/1 var(--sans);white-space:nowrap}
.chg.up{color:var(--call-ink);background:var(--call-tint)}
.chg.dn{color:var(--put-ink);background:var(--put-tint)}
.chg.flat{color:var(--i-mute);background:var(--s2)}
.lastscan{display:block;margin-top:7px;font:500 11px/1.3 var(--sans);letter-spacing:.04em;
          text-transform:uppercase;color:var(--i-faint)}
/* aging is an OUTLINE, not a colour — see the staleness note in :root */
.fresh{flex:none;font:700 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
       color:var(--i-mute);padding:5px 10px;border-radius:999px;white-space:nowrap}
.fresh.warn,.fresh.bad{border:1px solid var(--i-mute)}
.fresh.bad{color:var(--i);border-color:var(--i);border-width:1.5px}

/* ============ B. REGIME ============ */
.regime{display:flex;align-items:baseline;gap:10px;padding:0 4px}
.reg-left{min-width:0;flex:1 1 auto}
.reg-word{font:700 17px/1.25 var(--sans);letter-spacing:-.01em;color:var(--i);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg-word:empty{display:none}
.reg-gloss{font:400 13px/1.4 var(--sans);color:var(--i-mute);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg-ruler{flex:none;font:500 11px/1 var(--sans);letter-spacing:.05em;
           text-transform:uppercase;color:var(--i-faint)}

/* ============ C. THE CARD SYSTEM ============ */
.card{background:var(--s);border-radius:18px;padding:16px;box-shadow:var(--sh1)}
.lab{display:flex;align-items:center;gap:8px;font:700 11px/1.2 var(--sans);
     letter-spacing:.12em;text-transform:uppercase;color:var(--i-faint)}
.lab .r{margin-left:auto;color:var(--i-mute);white-space:nowrap}

/* ============ D. LADDER ============ */
.ladder{margin-top:10px}
#svg{display:block;width:100%;height:auto}

.p-band   {fill:var(--band)}
.p-path   {fill:none;stroke:var(--path);stroke-width:1.8;
           stroke-linejoin:round;stroke-linecap:round}
.p-reach  {fill:none;stroke:var(--path);stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:2 4}
.p-break  {stroke:var(--band-edge);stroke-width:1}
.p-vwap   {stroke:var(--rule-soft);stroke-width:1.25;stroke-dasharray:1 5}
.p-wall   {stroke-linecap:butt}
.p-wall.call{stroke:var(--call-mark)} .p-wall.put{stroke:var(--put-mark)}
/* the magnet is a LONG DASH as well as amber. On a light ground hue alone is
   not enough to separate five 1-3px lines, and it is the worst channel for a
   red-green deficient reader. Position, dash and weight carry it redundantly. */
.p-mag    {stroke:var(--mag-mark);stroke-width:1.8;stroke-dasharray:6 3}
.p-magrun {stroke:var(--mag-mark);stroke-width:1.3;stroke-dasharray:4 3}
.p-prule  {stroke:var(--px-mark);stroke-opacity:.30;stroke-width:1}
.p-dot    {fill:var(--px-mark);stroke:var(--s);stroke-width:2}
.p-halo   {fill:none;stroke:var(--px-mark);stroke-opacity:.30;stroke-width:1.2}
.p-brk    {fill:none;stroke:var(--path);stroke-opacity:.55;stroke-width:1.5;stroke-linecap:butt}
.p-chip   {fill:var(--px-mark)}
.p-chiptx {fill:var(--s);font:700 12px/1 var(--sans);text-anchor:end}
.p-tie    {fill:none;stroke:var(--band-edge);stroke-width:.9}
.p-bar    {fill-opacity:.9}
.p-bar.call{fill:var(--call-mark)} .p-bar.put{fill:var(--put-mark)}
.p-clip   {fill:var(--i-mute)}
.p-diamond{fill:var(--mag-mark)}
.p-tag    {font:700 12px/1 var(--sans);text-anchor:end;fill-opacity:.9}
.p-tag.lead{fill-opacity:1}
.p-tag.call{fill:var(--call-ink)} .p-tag.put{fill:var(--put-ink)}
.p-tag.mag {fill:var(--mag-ink)}  .p-tag.vwap{fill:var(--i-mute)}
.p-lane    {font:500 10px/1 var(--sans);letter-spacing:.1em;fill:var(--i-faint);text-anchor:end}
/* the halo punches the word through whatever it crosses; it strokes the CARD
   colour now, not the old dark ground */
.p-word    {font:500 10px/1 var(--sans);letter-spacing:.12em;fill:var(--i-mute);
            paint-order:stroke;stroke:var(--s);stroke-width:3;stroke-linejoin:round}
.p-word.dim{fill:var(--i-faint)}
.p-edge    {font:700 11px/1 var(--sans);text-anchor:end;fill:var(--i-mute)}
.p-edge.lead{fill:var(--i)}
.p-axis    {font:500 10px/1 var(--sans);letter-spacing:.12em;fill:var(--i-faint)}

/* ============ E. THE READING — the one filled card ============ */
.read{background:var(--fill);border-radius:18px;padding:20px;box-shadow:var(--sh2)}
.read .lab{color:var(--on-faint)}
.read .lab .r{color:var(--on-mute)}
.rd-body{display:flex;gap:9px;margin-top:12px}
.rd-mark{flex:none;font:700 11px/1.8 var(--sans);color:var(--on-faint)}
.rd-mark:empty{display:none}
/* NO CLAMP. Measured against 84 recorded readings at this measure: three lines
   cut 47.6% of them and two lines cut every single one. The median reading
   needs six. A truncated sentence is indistinguishable from a finished one,
   which makes the clamp worse than the scroll it saves. */
.rd-line{flex:1 1 auto;min-width:0;font:400 16px/1.55 var(--sans);color:var(--on-body);
         text-wrap:pretty;hyphens:none}
.rd-line.aged{color:var(--on-mute)}
/* a level's annotation shown where a sentence would be: not the model's voice */
.rd-line.wordless{color:var(--on-mute)}

/* ============ F. THE NEAREST LEVEL ============ */
.g-lab{display:flex;align-items:baseline;gap:8px}
.g-dir{font:700 11px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;
       color:var(--i-faint);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.g-meas{margin-left:auto;font:500 11px/1.2 var(--sans);letter-spacing:.04em;
        text-transform:uppercase;color:var(--i-mute);white-space:nowrap;flex:none}
.g-head{display:flex;align-items:baseline;gap:12px;margin-top:11px;min-width:0}
.g-k{flex:none;font:700 26px/1 var(--sans);letter-spacing:-.02em}
.g-k.call{color:var(--call-ink)} .g-k.put{color:var(--put-ink)}
.g-mech{flex:1 1 auto;min-width:0;font:400 13px/1.45 var(--sans);color:var(--i-body)}
.g-load{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px;
        align-items:center;margin-top:13px}
.g-row{display:contents}
.g-row[hidden]{display:none}
.g-bar{position:relative;height:6px;border-radius:99px;background:var(--s2);overflow:hidden;
       box-shadow:inset 0 1px 2px 0 rgba(58,48,32,.07)}
/* NEUTRAL. Share-of-book is a magnitude, not a side, and colouring it would
   assert a side the number does not carry. */
.g-bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:#3A4557;width:0}
.g-bar.behind>i{opacity:.45}
.g-bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--s)}
.g-val{font:500 11px/1.2 var(--sans);color:var(--i-mute);white-space:nowrap}
.g-val b{font-weight:700;color:var(--i-body)}
.g-foot{margin-top:11px;font:400 13px/1.45 var(--sans);color:var(--i-mute)}
.g-foot:empty{display:none}
.gate.empty .g-head{margin-top:9px}

/* ============ G. FOOT ============ */
.foot{padding:2px 4px 0;font:400 11px/1.4 var(--sans);color:var(--i-faint)}

/* ============ H. TABS ============ */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;justify-content:center;gap:64px;
  padding:11px 0 calc(env(safe-area-inset-bottom) + 12px);
  background:var(--s);border-radius:22px 22px 0 0;
  box-shadow:0 -6px 22px -10px rgba(58,48,32,.16);
}
.tab{position:relative;isolation:isolate;
     display:flex;flex-direction:column;align-items:center;gap:4px;
     min-width:var(--tap-min);padding:4px 12px 2px;border-radius:14px;
     color:var(--i-faint);text-decoration:none;
     touch-action:manipulation;-webkit-user-select:none;user-select:none;
     transition:color var(--press-out) var(--ease-out)}
.tab::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:max(100%,var(--tap-min));height:var(--tap-min)}
.tab::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
             background:var(--i);opacity:0;
             transition:opacity var(--press-out) var(--ease-out)}
.tab.on{color:var(--i)}
.tab.is-pressed{color:var(--i);transition-duration:var(--press-in);
                transition-timing-function:var(--ease-in)}
.tab.is-pressed::before{opacity:var(--state-press);transition-duration:var(--press-in);
                        transition-timing-function:var(--ease-in)}
@media (hover:hover){.tab:hover::before{opacity:var(--state-hover)}}
.tab:focus-visible{outline:2px solid var(--px-ink);outline-offset:2px}
.tab svg{display:block;width:22px;height:22px;stroke:currentColor;fill:none;
         stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab s{font:500 10px/1 var(--sans);letter-spacing:.1em;text-decoration:none}
.tab i{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
.tab.on i{background:var(--i)}

@media (prefers-reduced-motion:reduce){
  .tab.is-pressed::before{opacity:.20}
}
@media (forced-colors:active){
  .tab::before{display:none}
  .tab.is-pressed,.tab.on{color:Highlight}
}

/* ============ FAILURE ============ */
.fail{margin:auto 0;padding:24px 6px;text-align:left}
.fail-1{font:400 16px/1.5 var(--sans);color:var(--i);margin-bottom:10px}
.fail-2{font:500 13px/1.5 var(--sans);color:var(--i-mute)}
</style>
</head>
<body>

<section class="mast">
  <div class="mast-l">
    <div class="mast-row">
      <span class="ticker"  id="ticker"></span>
      <span class="livedot" id="livedot" hidden></span>
      <span class="expiry"  id="expiry"></span>
    </div>
    <span class="px"  id="px">—</span>
    <span class="chg" id="chg" hidden></span>
    <span class="lastscan" id="lastscan" hidden></span>
  </div>
  <span class="fresh" id="fresh"></span>
</section>

<section class="regime">
  <div class="reg-left">
    <div class="reg-word"  id="regWord"></div>
    <div class="reg-gloss" id="regGloss"></div>
  </div>
  <div class="reg-ruler" id="ruler"></div>
</section>

<section class="card">
  <div class="lab">Today</div>
  <div class="ladder" id="ladder"><svg id="svg"></svg></div>
</section>

<section class="read">
  <div class="lab">Model read<span class="r" id="rdAge"></span></div>
  <div class="rd-body">
    <span class="rd-mark" id="rdMark"></span>
    <span class="rd-line" id="rdLine"></span>
  </div>
</section>

<section class="card gate" id="gate">
  <div class="g-lab">
    <span class="g-dir"  id="gDir"></span>
    <span class="g-meas" id="gMeas"></span>
  </div>
  <div class="g-head">
    <span class="g-k"    id="gStrike"></span>
    <span class="g-mech" id="gMech"></span>
  </div>
  <div class="g-load">
    <div class="g-row" id="gRowA">
      <div class="g-bar"><i id="gBarA"></i></div><div class="g-val" id="gValA"></div>
    </div>
    <div class="g-row" id="gRowB">
      <div class="g-bar behind"><i id="gBarB"></i></div><div class="g-val" id="gValB"></div>
    </div>
  </div>
  <div class="g-foot" id="gFoot"></div>
</section>

<div class="foot" id="foot"></div>

<div class="fail" id="fail" hidden>
  <p class="fail-1" id="fail1"></p>
  <p class="fail-2" id="fail2"></p>
</div>

<nav class="tabs">
  <span class="tab on" data-press>

    <s>NOW</s><i></i>
  </span>
  <a class="tab" href="/m/thread.html" data-press data-haptic>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <s>READS</s><i></i>
  </a>
</nav>
