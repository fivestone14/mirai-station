<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0C1017">
<title>SNDK thread · Mirai</title>
<!--
  The reading THREAD (2026-09-07) — everything the model said today, in order.

  This is the glance's opposite number and deliberately breaks its two laws.
  The glance is one screen that never scrolls and has nothing tappable, because
  it is read at arm's length in a second. This is the archive: it scrolls, it
  has a day picker, and it is arrived at on purpose.

  Five things it is built on.

    1. A SESSION IS ~26 MESSAGES, NOT ~190 ROWS. Every scan appends a row and a
       scan that did not wake the model carries the previous reading forward
       verbatim. /api/sndk/thread does the de-duplication server-side on
       distinct reading_ts, which is the same key the desktop history modal and
       the glance both already use.

    2. QUIET IS A MESSAGE, NOT A GAP. Roughly half of what the model says is
       "price has held between X and Y since your last read". The doctrine is
       explicit that finding nothing is complete work, so those ship — but
       subordinate, in one dim line, because fifteen of them in a row is what
       this screen would otherwise be. What it found something in gets the
       full bubble.

    3. A QUIET STRETCH IS ONE SHAPE, NOT N PARAGRAPHS. Consecutive quiet reads
       are gathered behind a single hairline spine, so a run of them reads as
       one band of calm the eye can skip in a flick without any of it being
       hidden or folded away. Every word the model wrote is still on screen.
       The rhythm — spine, break, gold bubble, spine — is the whole point: the
       gold left edges are the map of where the session actually moved.

    4. THE THREAD HAS A CLOCK DOWN ITS SIDE. A sticky day bar names the session
       and its span and never leaves. Sticky hour rules sit under it, so at any
       scroll depth you know what hour you are reading. Where the model went
       quiet for longer than its own cadence, that silence is drawn — in
       lantern, which is this palette's colour for age — instead of being
       closed up into an ordinary gap.

    5. MARKET TIME, ALWAYS. Every clock here is ET, matching the glance and the
       station's live card, and every one of them is the server's own string,
       printed as given. The only time arithmetic on this page is a DIFFERENCE
       between two ISO timestamps, which is offset-free and never displayed as
       a clock. The desktop's history modal renders these same readings in
       Pacific; that is the odd one out, not this.

  Model prose reaches the DOM through setSaid() only, which escapes first and
  then adds its own <b> tags for prices. Nothing else ever writes model text.

  Tokens are the glance's, byte-for-byte, which are the desktop's. The hue law
  holds: iris is price, jade the call side, coral the put side, lantern is age
  and only age, and the gold is the magnet.
-->
<style>
:root{
  --ground:#0C1017;
  --surface:#141A24;
  --surface-2:#1B2330;
  --hairline:#28313F;
  --hairline-2:#333E50;

  /* TOUCH + PRESS (2026-09-09). See the same block in the glance for the
     reasoning; the numbers are Material's md.sys tokens and the 48px target is
     the strictest of the three specs in play. Both controls in this header
     were under it: the back chevron was 30x30 (46% of the required AREA) and
     the day picker 57x30. */
  --tap-min:48px;
  --state-hover:.08;
  --state-press:.12;
  --press-in:80ms;
  --press-out:200ms;
  --ease-in:cubic-bezier(0,0,0,1);
  --ease-out:cubic-bezier(.2,0,0,1);
  --press-scale:.97;

  --ink:#E7EBF3;
  --ink-dim:#98A2B6;
  --ink-faint:#8A93A8;

  --iris:#8B9CFF;      /* price, and only price   */
  --jade:#43C59E;      /* the call side           */
  --coral:#EB6A57;     /* the put side            */
  --lantern:#E7B85C;   /* aging, and nothing else */
  --l-grav:#F3AB3E;    /* the magnet, and nothing else */

  --iris-wash:rgba(139,156,255,.10);
  --jade-wash:rgba(67,197,158,.10);
  --coral-wash:rgba(235,106,87,.10);

  --mono:ui-monospace,"SF Mono","JetBrains Mono","Menlo",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style","Palatino",Georgia,serif;

  /* The sticky stack. The hour rule parks exactly under the day bar, so the
     two are one 60px block of context that is always on screen. */
  --daybar-h:31px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{height:100%}
body{
  height:100dvh; overflow:hidden;
  background:var(--ground); color:var(--ink);
  font:400 13px/1.4 var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}

/* ============ HEAD ============ */
.hd{flex:none;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
    border-bottom:1px solid var(--hairline);background:var(--ground)}
/* 44 painted inside a 53px header, 48 tapped. Painting the full 48 would leave
   2.5px each side; 44 leaves 4.5 and the invisible ::after carries the target
   the rest of the way. The glyph grew with it — a 16px chevron in a 44px box
   reads as a smudge. */
.back{position:relative;isolation:isolate;
      flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
      border:1px solid var(--hairline);border-radius:12px;background:var(--surface);
      color:var(--ink-dim);font:400 22px/1 var(--sans);text-decoration:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      -webkit-user-select:none;user-select:none;
      transition:transform var(--press-out) var(--ease-out),
                 border-color var(--press-out) var(--ease-out),
                 color var(--press-out) var(--ease-out)}
.back::after{content:"";position:absolute;top:50%;left:50%;
             transform:translate(-50%,-50%);
             width:var(--tap-min);height:var(--tap-min)}
.back::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
              background:var(--ink);opacity:0;
              transition:opacity var(--press-out) var(--ease-out)}
/* The label brightening is not decoration. Modelled against veiling glare, a
   12% state layer on this surface is a 2.84x luminance cue indoors but only
   1.06x in bright shade — the glare floor swamps it. Dim->ink on the GLYPH is
   1.94x/1.26x across the same conditions, because it moves the one thing on
   screen that is actually bright. Iris is deliberately not used for this: at
   Y=0.365 against ink-dim's 0.359 it is a pure hue change, worth 1.00x, and
   hue is the first thing sunlight takes. Iris earns its place on the border. */
.back.is-pressed{transform:scale(var(--press-scale));
                 border-color:var(--iris);color:var(--ink);
                 transition-duration:var(--press-in);
                 transition-timing-function:var(--ease-in)}
.back.is-pressed::before{opacity:var(--state-press);
                         transition-duration:var(--press-in);
                         transition-timing-function:var(--ease-in)}
@media (hover:hover){ .back:hover::before{opacity:var(--state-hover)} }
.back:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.hd-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.hd-1{font:500 11px/1.2 var(--mono);letter-spacing:.18em;color:var(--ink-dim)}
.hd-2{font:400 11px/1.2 var(--sans);color:var(--ink-faint);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-2 b{font-weight:600;color:var(--ink-dim)}
/* 44 tall to match the chevron, and the year is back: "09-09" alone in a list
   of 28 sessions spanning two months says nothing about which year, and the
   picker is the one place the full date is cheap. */
.day{position:relative;isolation:isolate;
     margin-left:auto;flex:none;background:var(--surface);color:var(--ink);
     border:1px solid var(--hairline);border-radius:12px;
     font:500 13px/1 var(--mono);padding:0 12px;height:44px;min-width:var(--tap-min);
     appearance:none;
     -webkit-tap-highlight-color:transparent;
     touch-action:manipulation;
     transition:border-color var(--press-out) var(--ease-out),
                background-color var(--press-out) var(--ease-out)}
/* A native select opens an OS sheet, so the press state only has to live for
   the moment before it appears — no transform, which would fight the sheet's
   own entry animation. */
.day.is-pressed{border-color:var(--iris);background:var(--surface-2);
                transition-duration:var(--press-in);
                transition-timing-function:var(--ease-in)}
.day:focus-visible{outline:2px solid var(--iris);outline-offset:2px}

/* Same rule as the glance: the state layer is opacity, which WCAG does not
   count as motion, so it stays and takes over the whole cue. The transform is
   perceived-size and goes. */
@media (prefers-reduced-motion:reduce){
  .back.is-pressed{transform:none}
  .back.is-pressed::before{opacity:.20}
}
@media (forced-colors:active){
  .back::before{display:none}
  .back.is-pressed{border-color:Highlight;color:Highlight}
}

/* ============ THREAD ============ */
/* Spacing is per-block rather than a flex gap: the sticky bars have to sit
   flush against what they cover, and the quiet spine has to swallow the space
   between the readings inside it. */
.wrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      padding:0 14px calc(env(safe-area-inset-bottom) + 16px);
      display:flex;flex-direction:column}

/* ---- the day, which never leaves ---- */
.daybar{position:sticky;top:0;z-index:3;flex:none;
        height:var(--daybar-h);display:flex;align-items:center;gap:10px;
        background:var(--ground);border-bottom:1px solid var(--hairline)}
.d-day{font:600 10.5px/1 var(--mono);letter-spacing:.16em;
       font-variant-numeric:tabular-nums;color:var(--ink-dim)}
.d-span{margin-left:auto;font:500 10.5px/1 var(--mono);
        font-variant-numeric:tabular-nums;color:var(--ink-faint)}

/* ---- the hour, which parks under it ---- */
.oldcontract{flex:none;margin:2px 0 4px;padding:8px 11px;border-radius:9px;
        border:1px solid var(--hairline-2);background:var(--surface);
        font:400 11.5px/1.5 var(--sans);color:var(--ink-faint)}
.hourbar{position:sticky;top:var(--daybar-h);z-index:2;flex:none;margin-top:6px;
         display:flex;align-items:center;gap:9px;
         padding:9px 0 8px;background:var(--ground)}
.hourbar .h{flex:none;font:600 10px/1 var(--mono);letter-spacing:.14em;
            font-variant-numeric:tabular-nums;color:var(--ink-faint)}
.hourbar .hl{flex:1 1 auto;height:1px;background:var(--hairline)}
/* A silence longer than the model's own cadence. Lantern, because on this
   palette age is the only thing that colour ever means. */
.hourbar .hgap,.gapbar .g{flex:none;font:600 9.5px/1 var(--mono);letter-spacing:.1em;
                          text-transform:uppercase;color:var(--lantern)}
.gapbar{flex:none;display:flex;align-items:center;gap:9px;margin:15px 0 1px}
.gapbar .gl{flex:1 1 auto;height:1px;
            background:repeating-linear-gradient(90deg,
              var(--hairline-2) 0 2px,transparent 2px 6px)}

/* ---- a reading ---- */
.msg{flex:none;display:flex;flex-direction:column;gap:6px;margin-top:15px}
.m-top{display:flex;align-items:baseline;gap:8px;padding-left:2px}
.m-at{flex:none;font:600 11.5px/1.2 var(--mono);
      font-variant-numeric:tabular-nums;color:var(--ink)}
.m-why{font:600 9.5px/1.2 var(--mono);letter-spacing:.13em;text-transform:uppercase;
       color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The wake reason is the one thing on this screen that names a side. */
.m-why.call{color:var(--jade)}
.m-why.put{color:var(--coral)}
/* Spot is price, so it is iris — held back, because it is the same fact the
   prose is about to state. Right-aligned so the column reads as the path. */
.m-spot{margin-left:auto;flex:none;font:500 10.5px/1.2 var(--mono);
        font-variant-numeric:tabular-nums;color:var(--iris);opacity:.7}

/* A bubble the model had something to say in. */
.bub{background:var(--surface-2);border:1px solid var(--hairline);
     border-radius:16px 16px 16px 5px;padding:10px 13px 11px;
     box-shadow:inset 3px 0 0 var(--l-grav)}
.bub .said{font:400 13.5px/1.5 var(--serif);color:var(--ink)}
.bub .said b.n{font:600 13px/1 var(--mono);font-variant-numeric:tabular-nums;
               color:var(--iris);background:var(--iris-wash);
               border-radius:4px;padding:1px 4px;font-style:normal}

/* ---- quiet ---- */
/* A run of consecutive quiet reads is one shape: a hairline spine with the
   readings hung off it. Nothing is folded, nothing is summarised away — the
   run is simply given a silhouette the eye can identify and pass over. */
.run{flex:none;margin-top:15px;padding-left:13px;
     border-left:1px solid var(--hairline-2);
     display:flex;flex-direction:column}
.run .msg{margin-top:0;gap:3px}
.run .msg + .msg{margin-top:11px}

.msg.q .m-at{font:500 10.5px/1.2 var(--mono);color:var(--ink-faint)}
.msg.q .m-why{font-size:9px;letter-spacing:.11em;color:var(--ink-faint);opacity:.72}
.msg.q .m-spot{font-size:10px;opacity:.5}
.msg.q .bub{background:transparent;border-color:transparent;box-shadow:none;
            padding:0;border-radius:0}
.msg.q .said{font:italic 400 12px/1.5 var(--serif);color:var(--ink-dim)}
/* The numbers are the only thing anyone reads off a quiet line. They were the
   same dim grey as the sentence around them; now they are price-coloured, and
   they are the reason a quiet line is scannable at all. */
.msg.q .said b.n{font:600 11.5px/1 var(--mono);font-variant-numeric:tabular-nums;
                 color:var(--iris);background:transparent;padding:0;
                 font-style:normal;opacity:.92}

/* The model spoke and every claim was deleted by the checks. A fault, drawn
   as one — silence here would hide the one case worth seeing. */
.msg.dropped .bub{box-shadow:inset 3px 0 0 var(--coral)}
.msg.dropped .said{color:var(--ink-dim);font-style:italic}

.pts{list-style:none;display:flex;flex-direction:column;gap:4px;margin-top:9px;
     padding-top:8px;border-top:1px solid var(--hairline)}
.pts li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:baseline}
.pts .lv{font:600 12px/1.3 var(--mono);font-variant-numeric:tabular-nums;color:var(--iris)}
.pts .nt{font:400 12px/1.35 var(--sans);color:var(--ink-dim)}

/* The bottom of the thread, so landing here reads as arrival and not as a
   sentence cut in half. */
.endcap{flex:none;display:flex;align-items:center;gap:9px;margin:17px 0 2px;
        font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
        color:var(--ink-faint)}
.endcap::before,.endcap::after{content:"";flex:1 1 auto;height:1px;background:var(--hairline)}

.state{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
       padding:0 26px;text-align:center;font:400 13px/1.55 var(--sans);color:var(--ink-dim)}

/* The small phone. Everything loses a little air; nothing loses a rank. */
@media (max-width:359px){
  .wrap{padding-left:11px;padding-right:11px}
  .bub{padding:9px 11px 10px;border-radius:14px 14px 14px 5px}
  .bub .said{font-size:13px}
  .run{padding-left:11px}
  .m-why{letter-spacing:.1em}
}
</style>
</head>
<body>

<header class="hd">
  <a class="back" href="/m/" aria-label="Back to the glance" data-press data-haptic>‹</a>
  <div class="hd-t">
    <div class="hd-1">SNDK · THE READ</div>
    <div class="hd-2" id="sub">loading…</div>
  </div>
  <select class="day" id="day" aria-label="Session" data-press></select>
</header>

<main class="wrap" id="wrap"><div class="state" id="state">loading…</div></main>

<script src="/m/press.js"></script>
<script>
const $ = id => document.getElementById(id);
const S = {day:'', last:'', timer:0, run:null, hour:'', ts:'', open:'', shut:''};

/* A silence longer than this is drawn rather than closed up. The model's own
   cadence is ten to twenty minutes, so this is "it skipped a turn or two". */
const GAP_MIN = 25;

/* Returns the document, or null. `getJSON.failed` says which KIND of null the
   last call produced (2026-09-09): a request that never landed is a different
   fact from a session with nothing in it, and this function used to erase the
   difference. Everything downstream then treated a dropped packet as "the model
   said nothing today" — and, worse, never tried again. */
async function getJSON(url){
  getJSON.failed = false;
  try{
    const r = await fetch(url, {cache:'no-store'});
    const t = await r.text();
    try{ return JSON.parse(t); }catch(e){ getJSON.failed = true; return null; }
  }catch(e){ getJSON.failed = true; return null; }
}

/* The one boundary for model-authored text. Strip the characters the desktop
   strips (it learned the hard way that data-tip is decoded twice), then add
   our own <b> around anything price-shaped. The <b> tags are the only markup
   that ever enters this string. */
function setSaid(el, text){
  const safe = String(text == null ? '' : text)
    .replace(/[<>"¦]/g, ' ').replace(/&/g, '&amp;').replace(/\s+/g, ' ').trim();
  // The punctuation stays OUTSIDE the chip. The desktop folds it in, which is
  // invisible there because its numbers are only bolded; here they carry a
  // tinted background and a trailing comma inside the chip reads as part of
  // the price.
  el.innerHTML = safe.replace(
    /(\$?\d{1,3}(?:,\d{3})+(?:\.\d+)?|\$?\d{3,5}(?:\.\d+)?)/g,
    (m, a) => `<b class="n">${a}</b>`);
}

/* The only time arithmetic on the page. Both operands carry their own offset,
   so the subtraction is timezone-free, and the answer is a length rather than
   a clock — no market time is ever re-derived here. */
function minutesBetween(a, b){
  const x = Date.parse(a), y = Date.parse(b);
  if(!isFinite(x) || !isFinite(y)) return null;
  const m = Math.round((y - x) / 60000);
  return m > 0 ? m : null;
}
function elapsed(m){
  if(m < 60) return m + ' min later';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? h + 'h ' + r + 'm later' : h + 'h later';
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}

/* The hour this reading falls in, taken straight off the server's ET clock —
   sliced, never parsed. */
function hourBar(hh, gap){
  const bar = el('div', 'hourbar');
  bar.append(el('span', 'h', hh + ':00'), el('i', 'hl'));
  if(gap != null && gap >= GAP_MIN) bar.append(el('span', 'hgap', elapsed(gap)));
  return bar;
}
function gapBar(gap){
  const bar = el('div', 'gapbar');
  bar.append(el('i', 'gl'), el('span', 'g', elapsed(gap)), el('i', 'gl'));
  return bar;
}

function bubble(m){
  const wrap = document.createElement('div');
  // A reading whose every claim was deleted is flagged `struck` by the station.
  // That is a message about a fault, not an empty one, and it says so.
  // NOT `!m.read` (2026-09-09): a reading that authored no prose line but did
  // leave observations has no `read` either, and calling that "struck out"
  // printed a denial directly above the surviving claims it was denying.
  const dropped = m.struck === true;
  const wordless = !dropped && !m.read;
  wrap.className = 'msg' + (m.quiet && !dropped ? ' q' : '') + (dropped ? ' dropped' : '');
  if(wordless) wrap.classList.add('q');   // no sentence: it reads as a quiet one

  const top = el('div', 'm-top');
  top.append(el('span', 'm-at', m.at || ''));

  const why = el('span', 'm-why', dropped ? 'held back' : (m.wake || ''));
  // The wake reason is the one label here that can name a side of the book,
  // and the palette already has a colour for each of them.
  const w = String(m.wake == null ? '' : m.wake).toLowerCase();
  if(!dropped && /\bcall\b/.test(w)) why.classList.add('call');
  else if(!dropped && /\bput\b/.test(w)) why.classList.add('put');
  top.append(why);

  if(m.spot != null) top.append(el('span', 'm-spot', Number(m.spot).toFixed(2)));

  const bub = el('div', 'bub');
  const said = el('div', 'said');
  if(dropped){
    said.textContent = 'It spoke, and every claim it made was struck out by the checks.';
    bub.append(said);
  }else if(wordless){
    // It wrote no sentence this time. The levels below ARE the reading, and a
    // caption invented for them would be the station speaking, not the model.
    if(!(Array.isArray(m.points) && m.points.length)){
      said.textContent = 'Nothing to say at this scan.';
      bub.append(said);
    }
  }else{
    setSaid(said, m.read);
    bub.append(said);
  }

  if(Array.isArray(m.points) && m.points.length){
    const ul = el('ul', 'pts');
    for(const p of m.points){
      if(!p || p.level == null) continue;
      const li = document.createElement('li');
      // No thousands separator: the prose beside it writes 1750, the board
      // writes 1750, and 1,750 in the same bubble reads as a different number.
      li.append(el('span', 'lv', String(Number(p.level))),
                el('span', 'nt', String(p.note == null ? '' : p.note).replace(/[<>"¦]/g, ' ')));
      ul.append(li);
    }
    if(ul.childElementCount) bub.append(ul);
  }

  wrap.append(top, bub);
  return wrap;
}

/* Newest at the bottom, which is where the eye already is — and landed on
   cleanly, after layout, so it is the last message and not the middle of one. */
function toBottom(){
  const w = $('wrap');
  w.scrollTop = w.scrollHeight;
  requestAnimationFrame(() => {
    w.scrollTop = w.scrollHeight;
    requestAnimationFrame(() => { w.scrollTop = w.scrollHeight; });
  });
}
function atBottom(){
  const w = $('wrap');
  return w.scrollHeight - w.scrollTop - w.clientHeight < 60;
}

function paint(doc, append){
  const wrap = $('wrap');
  const msgs = (doc && doc.messages) || [];
  const stick = append ? atBottom() : true;

  if(!append){
    wrap.textContent = '';
    S.run = null; S.hour = ''; S.ts = ''; S.open = ''; S.shut = '';
    if(!msgs.length){
      wrap.append(el('div', 'state', doc && doc.error
        ? 'Could not read this session.'
        : 'Nothing said this session yet.'));
      $('sub').textContent = S.day;
      return;
    }
    const bar = el('div', 'daybar');
    bar.append(el('span', 'd-day', S.day), el('span', 'd-span'));
    wrap.append(bar);
    // A session written by the RETIRED design does not get drawn as if it were
    // an observation. Those eras made direction calls — a vector, a magnitude
    // and a level that would break the call — and that product was measured at
    // zero forward value and removed. The sentences are still worth keeping and
    // reading; they are just not the same claim as everything after them.
    if(msgs.length && msgs.every(m => m.contract === 'direction_call')){
      wrap.append(el('div', 'oldcontract',
        'An earlier design. These read the board and called a direction — a '
        + 'question later measured to carry no information, and retired.'));
    }
  }

  const oldCap = wrap.querySelector('.endcap');
  if(oldCap) oldCap.remove();

  for(const m of msgs){
    const at = String(m.at == null ? '' : m.at);
    const hh = at.slice(0, 2);
    const gap = S.ts ? minutesBetween(S.ts, m.ts) : null;

    // An hour boundary and a long silence are the same kind of event, so when
    // they land together the hour rule carries the silence rather than the
    // page drawing two rules in a row.
    if(hh && hh !== S.hour){
      wrap.append(hourBar(hh, gap)); S.hour = hh; S.run = null;
    }else if(gap != null && gap >= GAP_MIN){
      wrap.append(gapBar(gap)); S.run = null;
    }

    const node = bubble(m);
    if(node.classList.contains('q')){
      if(!S.run){ S.run = el('div', 'run'); wrap.append(S.run); }
      S.run.append(node);
    }else{
      S.run = null; wrap.append(node);
    }

    if(!S.open) S.open = at;
    if(at) S.shut = at;
    if(m.ts) S.ts = m.ts;
  }

  if(msgs.length){
    S.last = msgs[msgs.length - 1].ts;
    wrap.append(el('div', 'endcap', 'latest read'));
    const span = wrap.querySelector('.d-span');
    if(span) span.textContent = S.open && S.shut ? S.open + ' – ' + S.shut : '';
  }
  if(stick) toBottom();
}

async function loadDay(day){
  S.day = day; S.last = '';
  const doc = await getJSON('/api/sndk/thread?day=' + encodeURIComponent(day));
  S.stalled = getJSON.failed;      // the poll below is the retry
  paint(doc, false);
  if(S.stalled){
    const w = $('wrap');
    w.textContent = '';
    w.append(el('div', 'state', 'Could not reach the station. Retrying…'));
    return;
  }
  if(doc && doc.count != null){
    const n = doc.count, k = doc.with_something;
    const sub = $('sub');
    sub.textContent = '';
    sub.append(el('b', null, String(k)),
               document.createTextNode(` of ${n} read${n === 1 ? '' : 's'} said something`));
  }
}

/* Only ever asks for the tail, once there IS a tail. Otherwise it re-asks for
   the whole day, which is what makes this the retry as well as the poll.

   THE BUG THIS REPLACES (2026-09-09). The guard was `if(!S.day || !S.last)
   return;`, and S.last is only set once a message has been painted. So:
     * one dropped request on the first load — a phone changing cells, the
       tunnel reconnecting — left the page reading "Nothing said this session
       yet." with a poll that could never run again. Not for 45 seconds: for
       the life of the page. The only recovery was a manual reload, and the
       page gave no hint that one was needed.
     * opening the thread before the model's first read of the day did the
       same thing, permanently, on a session that was about to fill up.
   Both looked from the phone like the history simply not working. */
async function poll(){
  if(!S.day) return;
  const tail = S.last
    ? '&since=' + encodeURIComponent(S.last)
    : '';                                   // no tail yet: ask for the day
  const doc = await getJSON('/api/sndk/thread?day=' + encodeURIComponent(S.day) + tail);
  if(getJSON.failed) return;                // still down; the next tick tries again
  if(!S.last){
    // A recovery, or the session's first message. Repaint from scratch — and
    // only now clear the stalled banner, so it stands while it is still true.
    if(S.stalled || (doc && doc.messages && doc.messages.length)){
      S.stalled = false;
      paint(doc, false);
    }
    return;
  }
  if(doc && doc.messages && doc.messages.length) paint(doc, true);
}

async function boot(){
  const d = await getJSON('/api/sndk/thread/days');
  const days = (d && d.days) || [];
  const sel = $('day');
  if(!days.length){
    // Same distinction as the poll: an unreachable station is not an empty
    // archive, and the day list failing used to end the page outright — no
    // timer was ever started below, so there was nothing left but a reload.
    const down = getJSON.failed;
    $('wrap').textContent = '';
    $('wrap').append(el('div', 'state', down
      ? 'Could not reach the station. Retrying…'
      : 'No recorded sessions.'));
    $('sub').textContent = '';
    if(down) setTimeout(boot, 5000);      // the station comes back; so do we
    return;
  }
  for(const day of days){
    const o = document.createElement('option');
    // The whole date, not day.slice(5). "09-09" in a list that reaches back to
    // 07-31 does not say which year, and the closed picker is the one place on
    // this page where a reader looks to find out what they are reading.
    o.value = day; o.textContent = day;
    sel.append(o);
  }
  sel.value = days[0];
  sel.addEventListener('change', () => loadDay(sel.value));
  await loadDay(days[0]);
  S.timer = setInterval(poll, 45000);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') poll();
  });

  /* TELL THE ANDROID SHELL WHERE WE ARE (2026-09-09).
     This page scrolls #wrap and pins the document at overflow:hidden, so the
     shell's SwipeRefreshLayout — which arms itself by asking the WEBVIEW
     whether it can scroll up — was told "no" at every position in a 4300px
     feed. Every drag downward became a reload that threw the reader back to
     the top, which is what "the history does not work" looked like from the
     phone. The document's scroll position is a lie here; #wrap's is the truth,
     and only this page can say so.

     Guarded on every side: absent off the phone (a browser has no MiraiShell),
     absent on an older shell that has no atTop, and wrapped because a bridge
     call that throws inside a scroll handler would take the scrolling with it.
     Only edge crossings are sent — a call per scroll event would be thousands
     of binder hops for one boolean that changed twice. */
  (function reportScrollToShell(){
    const bridge = window.MiraiShell;
    if(!bridge || typeof bridge.atTop !== 'function') return;
    // getElementById, not the outer `wrap`: this file binds that name twice
    // (a detached div in the message builder, and the scroller here), and the
    // one that matters is too important to resolve by scope luck.
    const scroller = document.getElementById('wrap');
    if(!scroller) return;
    let last = null;
    const send = () => {
      const atTop = scroller.scrollTop <= 0;
      if(atTop === last) return;
      last = atTop;
      try { bridge.atTop(atTop); } catch(e){ /* never break the scroll */ }
    };
    scroller.addEventListener('scroll', send, {passive:true});
    send();                       // the shell starts with no opinion; give it one
  })();
}

boot();
</script>
</body>
</html>
