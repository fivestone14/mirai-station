<!--
  The reads — light rebuild, 2026-09-09.

  WHAT CHANGED, and it is the whole point of the rebuild: the list runs
  NEWEST FIRST. The old page appended oldest-to-newest and auto-scrolled to the
  bottom on arrival, which is the right shape for a chat you are catching up on
  and the wrong one for this. You open it to see what the model just said. On a
  33-message session the newest reading was 33 cards down and the banner
  explaining a whole retired era scrolled past on every open.

  Descending also fixes the poll: a new reading now lands at the TOP, in view,
  instead of below the fold.

  THE GUTTER holds the clock over the PRICE AT THAT READING. The reference this
  design borrows from puts a start time over an end time; a reading has no end
  time, so rather than invent one the second slot carries a fact the reader
  actually wants. Read straight down the gutter and you get the session's path
  in numbers, running beside the prose describing it.

  The four laws from the glance hold here: honest-absent, one hue one meaning
  (nothing on this page is coloured except a strike chip), no Greek on the
  surface, market time everywhere.
-->

<style>
@font-face{
  font-family:"Jakarta";
  src:url("/m/pjs-153fc85b7029.woff2") format("woff2");
  font-weight:200 800; font-style:normal; font-display:swap;
}

:root{
  --g:#E4E0D8; --s:#F4F1EB; --s2:#DCD7CD; --fill:#1F2622;
  --i:#161A17; --i-body:#333B35; --i-mute:#535B52; --i-faint:#5C6459;
  --on:#FFFFFF; --on-body:#E4E6DF; --on-mute:#A9B0A6; --on-faint:#8E958A;
  --px-ink:#2F44B8; --px-tint:#E2E4F5;
  --put-ink:#AE3020; --rule-soft:#7E8779;

  --sh1:0 1px 1px -.5px rgba(58,48,32,.05),
        0 3px 6px -1px rgba(58,48,32,.06),
        0 10px 22px -6px rgba(58,48,32,.07);
  --sh2:0 1px 2px 0 rgba(31,38,34,.08),
        0 6px 14px -3px rgba(31,38,34,.12),
        0 20px 40px -12px rgba(31,38,34,.16);

  --tap-min:48px;
  --state-hover:.08; --state-press:.12;
  --press-in:80ms; --press-out:200ms;
  --ease-in:cubic-bezier(0,0,0,1);
  --ease-out:cubic-bezier(.2,0,0,1);
  --press-scale:.97;

  --sans:"Jakarta",system-ui,Roboto,"Segoe UI",sans-serif;

  /* The visible height, MEASURED — the script at the top of <body> writes it
     in pixels on load, resize and rotation. Nothing on the phone pages may
     read a viewport unit directly, because inside the app every one of them
     reads ZERO: measured 2026-09-10 on a Galaxy S20+ (Chrome 152 WebView),
     100vh = 0 and 100dvh = 0 against a visible height of 779px. Android
     WebView reports a zero-height viewport when the view is sized
     wrap-content, which is what the shell's SwipeRefreshLayout gave it by
     default, so every phone running the app did the same — and no desktop
     browser ever showed it. The explainer sheet's max-height:84dvh came out
     at 0 and it opened as a 32px strip of its own padding. 100dvh stays here
     only as the value a page with no script would fall back to. */
  --app-h:100dvh;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
/* THE DOCUMENT SCROLLS (2026-09-09, second pass).
   This was `html,body{height:100%}` with `body{overflow:hidden}` and an inner
   flex scroller. In a desktop browser that measures correctly; in the Android
   WebView the page came up showing only the top of the list with the rest
   unreachable — `height:100%` needs a definite height to resolve against, and
   when it does not get one the column collapses to its content while
   overflow:hidden clips everything past it. There is no way to be sure of that
   resolution across every WebView build, so the page stops depending on it:
   nothing has a fixed height, the header sticks, and the document scrolls.
   That also scales to any screen for free, which the fixed column never did.

   It removes a second class of bug with it — the shell's SwipeRefreshLayout
   asks the WEBVIEW whether it can scroll up, and that question is now
   answerable, because the document is the thing that scrolls. */
html{background:var(--g)}
body{
  min-height:var(--app-h);
  background:var(--g);color:var(--i-body);
  font:400 15px/1.5 var(--sans);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}

/* ============ HEADER ============ */
.hd{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  /* opaque: the list scrolls UNDER this now */
  background:var(--g);
}
.back{
  position:relative;isolation:isolate;flex:none;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:14px;background:var(--s);box-shadow:var(--sh1);
  color:var(--i-mute);font:400 22px/1 var(--sans);text-decoration:none;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  transition:transform var(--press-out) var(--ease-out),
             color var(--press-out) var(--ease-out);
}
/* painted 44, tapped 48 */
.back::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
             width:var(--tap-min);height:var(--tap-min)}
.back::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
              background:var(--i);opacity:0;
              transition:opacity var(--press-out) var(--ease-out)}
/* the label brightening is the cue that survives daylight; a state layer alone
   is a 2.8x luminance change indoors and 1.06x in bright shade */
.back.is-pressed{transform:scale(var(--press-scale));color:var(--i);
                 transition-duration:var(--press-in);transition-timing-function:var(--ease-in)}
.back.is-pressed::before{opacity:var(--state-press);transition-duration:var(--press-in);
                         transition-timing-function:var(--ease-in)}
@media (hover:hover){.back:hover::before{opacity:var(--state-hover)}}
.back:focus-visible{outline:2px solid var(--px-ink);outline-offset:2px}

.hd-t{min-width:0;flex:1 1 auto}
.hd-1{font:700 11px/1.2 var(--sans);letter-spacing:.16em;color:var(--i-faint)}
.hd-2{margin-top:3px;font:400 13px/1.3 var(--sans);color:var(--i-mute);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-2 b{font-weight:700;color:var(--i-body)}

.day{
  flex:none;height:44px;min-width:var(--tap-min);padding:0 12px;
  background:var(--s);color:var(--i);border:none;border-radius:14px;
  box-shadow:var(--sh1);
  font:700 13px/1 var(--sans);font-variant-numeric:tabular-nums;
  appearance:none;touch-action:manipulation;
  transition:background-color var(--press-out) var(--ease-out);
}
/* a native select opens an OS sheet, so no transform — it would fight the
   sheet's own entry animation */
.day.is-pressed{background:var(--s2);transition-duration:var(--press-in)}
.day:focus-visible{outline:2px solid var(--px-ink);outline-offset:2px}

/* ============ THE LIST ============ */
.wrap{
  /* No height, no inner scrolling. The overscroll-behavior that used to live
     here is gone with the inner scroller it was containing: the document is
     the scroller now, so a drag at the top is the browser's own gesture and
     the shell's SwipeRefreshLayout can read it directly. */
  padding:4px 16px calc(env(safe-area-inset-bottom) + 28px);
  display:flex;flex-direction:column;gap:16px;
}
.state{padding:40px 4px;font:400 15px/1.5 var(--sans);color:var(--i-mute);text-align:center}

.row{display:flex;gap:12px;align-items:flex-start}
.gut{flex:none;width:56px;text-align:right;padding-top:17px;
     display:flex;flex-direction:column;gap:4px}
.gut b{font:700 15px/1 var(--sans);color:var(--i)}
.gut s{font:400 12px/1 var(--sans);color:var(--i-mute);text-decoration:none}

.rc{flex:1;min-width:0;background:var(--s);border-radius:18px;padding:16px;
    box-shadow:var(--sh1)}
/* exactly one filled card per screen, and it is the newest reading */
.rc.now{background:var(--fill);padding:20px;box-shadow:var(--sh2)}
.rc.quiet{opacity:.82}

.wake{display:inline-block;padding:3px 8px;border-radius:10px;background:var(--s2);
      font:700 11px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;
      color:var(--i-mute)}
.rc.now .wake{background:rgba(255,255,255,.10);color:var(--on-mute)}
/* a reading whose every claim was struck out is a message about a fault */
.rc.struck .wake{background:transparent;border:1px solid var(--put-ink);color:var(--put-ink)}
/* ...but --put-ink on the dark --fill card is 2.39:1, under even the 3:1 floor
   for a border. Same specificity as .rc.now .wake, so source order alone was
   deciding it. On the filled card the fault reads in the reversed ink and the
   outline carries it. (Not reachable today: zero struck readings in the whole
   archive. `read: null` is a live contract, so it is waiting rather than dead.) */
.rc.now.struck .wake{border-color:var(--on-mute);color:var(--on-body)}

.said{margin-top:11px;font:400 15px/1.5 var(--sans);color:var(--i-body);
      text-wrap:pretty;hyphens:none}
.rc.now .said{color:var(--on-body);font-size:16px;line-height:1.55}
.said.none{color:var(--i-mute)}
.rc.now .said.none{color:var(--on-mute)}
.said .n{font-weight:700;color:var(--i);background:var(--px-tint);
         border-radius:5px;padding:0 4px}
.rc.now .said .n{color:var(--on);background:rgba(255,255,255,.12)}

.pts{list-style:none;margin:13px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.pt{display:flex;gap:12px;align-items:baseline}
.pt-l{flex:none;width:44px;text-align:right;font:700 13px/1.45 var(--sans);color:var(--i)}
.pt-n{font:400 13px/1.45 var(--sans);color:var(--i-mute)}
.rc.now .pt-l{color:var(--on)} .rc.now .pt-n{color:var(--on-mute)}

/* A silence is a finding, not a gap to close up. Drawn BELOW the newer reading,
   because in a descending list the older one comes after it. */
.quiet-gap{display:flex;align-items:center;gap:10px;padding:0 4px 0 68px;
           font:700 10px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;
           color:var(--i-faint)}
.quiet-gap i{flex:1;height:1px;background:var(--s2);display:block}

.oldcontract{
  background:var(--s2);border-radius:14px;padding:13px 15px;
  font:400 13px/1.5 var(--sans);color:var(--i-mute);
}
.endcap{padding:6px 4px 0;text-align:center;
        font:700 10px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;
        color:var(--i-faint)}

/* ============ LOADING ============ */
/* A glance that shows nothing while it fetches is indistinguishable from a
   glance that is broken — and on a light ground an empty screen reads as
   "loading" far less than an empty DARK one did, because blank white IS what a
   loading page looks like. So say it.

   The delay matters as much as the spinner: a station on the same LAN answers
   in well under 200ms, and a spinner that flashes for 80ms is a flicker that
   makes the page feel slower, not faster. It appears only if the wait is long
   enough to be noticed. */
.load{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:11px;
  background:var(--g);
  font:700 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--i-faint);
  /* OPAQUE FROM THE FIRST FRAME. The first version faded in after 350ms to
     avoid flashing on a fast local load — but that inverted the thing it was
     for: the reader saw the empty page for 350ms and the spinner arrived
     afterwards, which is exactly the blank screen the overlay exists to cover.
     A loading state that appears after the wait is not a loading state.
     Flicker is handled at the other end instead: clearLoading holds it for
     LOAD_MIN_MS, so a fast load either never shows it long enough to register
     or shows it properly. Never a stutter. */
  opacity:1;pointer-events:none;
  transition:opacity .18s ease-out;
}
.load.going{opacity:0}
.load[hidden]{display:none}
.load i{
  width:17px;height:17px;flex:none;border-radius:50%;
  border:2px solid var(--s2);border-top-color:var(--i-mute);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  /* the ring stops turning; the wait still has to be visible, so it pulses
     instead — opacity is not motion under WCAG's own definition */
  .load i{animation:pulse-dim 1.4s ease-in-out infinite}
  .load{transition:none}
}
@keyframes pulse-dim{0%,100%{opacity:.35}50%{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .back.is-pressed{transform:none}
  .back.is-pressed::before{opacity:.20}
}
@media (forced-colors:active){
  .back::before{display:none}
  .back.is-pressed{border:1px solid Highlight;color:Highlight}
}
</style>

<script>
/* --app-h: the visible height in pixels, measured before anything paints. Why
   the pages cannot use vh / dvh inside the app is on the token in :root. */
(function(){
  function set(){
    var h = window.innerHeight || document.documentElement.clientHeight;
    if(h > 0) document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  set();
  window.addEventListener('resize', set);
  window.addEventListener('orientationchange', set);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', set);
})();
</script>

<header class="hd">
  <a class="back" href="/m/" aria-label="Back to the glance" data-press data-haptic>‹</a>
  <div class="hd-t">
    <div class="hd-1">SNDK · THE READS</div>
    <div class="hd-2" id="sub">loading…</div>
  </div>
  <select class="day" id="day" aria-label="Session" data-press></select>
</header>

<main class="wrap" id="wrap"></main>

<div class="load" id="load"><i></i>Reading the archive</div>

<script src="/m/press.js"></script>
<script>
const $ = id => document.getElementById(id);
const S = {day:'', last:'', stalled:false, polling:false, msgs:[]};

/* A silence longer than this is drawn rather than closed up. The model's own
   cadence is ten to twenty minutes, so this is "it skipped a turn or two". */
const GAP_MIN = 25;

/* The overlay is painted opaque so it covers the empty page from the first
   frame. The floor keeps a fast answer from reading as a flash. */
const LOAD_MIN_MS = 260;
let LOAD_T0 = Date.now();

function showLoading(){
  const el = $('load');
  if(!el) return;
  LOAD_T0 = Date.now();
  delete el.dataset.going;
  el.classList.remove('going');
  el.hidden = false;
}

function hideLoading(){
  const el = $('load');
  if(!el || el.hidden || el.dataset.going) return;
  el.dataset.going = '1';
  const wait = Math.max(0, LOAD_MIN_MS - (Date.now() - LOAD_T0));
  setTimeout(() => {
    el.classList.add('going');
    setTimeout(() => { el.hidden = true; }, 200);
  }, wait);
}

/* Returns the document, or null. `getJSON.failed` says which KIND of null the
   last call produced: a request that never landed is a different fact from a
   session with nothing in it, and conflating them used to leave this page
   reading "Nothing said this session yet" forever after one dropped packet. */
async function getJSON(url){
  getJSON.failed = false;
  try{
    const r = await fetch(url, {cache:'no-store'});
    const t = await r.text();
    try{ return JSON.parse(t); }catch(e){ getJSON.failed = true; return null; }
  }catch(e){ getJSON.failed = true; return null; }
}

/* The one boundary for model-authored text. Strip the characters the desktop
   strips, then add our own <b> around anything price-shaped. Those <b> tags are
   the only markup that ever enters this string. */
function setSaid(node, text){
  const safe = String(text == null ? '' : text)
    .replace(/[<>"¦]/g, ' ').replace(/&/g, '&amp;').replace(/\s+/g, ' ').trim();
  // Punctuation stays OUTSIDE the chip: a trailing comma inside a tinted chip
  // reads as part of the price.
  node.innerHTML = safe.replace(
    /(\$?\d{1,3}(?:,\d{3})+(?:\.\d+)?|\$?\d{3,5}(?:\.\d+)?)/g,
    (m, a) => `<b class="n">${a}</b>`);
}

/* The only time arithmetic on the page. Both operands carry their own offset,
   so the subtraction is timezone-free and the answer is a length, never a
   clock — no market time is re-derived here. */
function minutesBetween(a, b){
  const x = Date.parse(a), y = Date.parse(b);
  if(!isFinite(x) || !isFinite(y)) return null;
  const m = Math.round((y - x) / 60000);
  return m > 0 ? m : null;
}
function elapsed(m){
  if(m < 60) return m + ' MIN QUIET';
  const h = Math.floor(m / 60), r = m % 60;
  return (r ? h + 'H ' + r + 'M' : h + 'H') + ' QUIET';
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}

/* Whole dollars in the gutter. A decimal in a column being scanned downward is
   noise, and the prose beside it carries the exact figure wherever it matters. */
function gutPrice(v){
  const n = Number(v);
  return isFinite(n) ? n.toLocaleString('en-US', {maximumFractionDigits:0}) : '';
}

function card(m, newest){
  const rc = el('div', 'rc');
  // `struck` comes from the station and means the model spoke and every claim
  // was deleted by the checks. NOT `!m.read`: a reading that wrote no prose but
  // left observations also has no `read`, and calling that "struck out" printed
  // a denial directly above the claims it was denying.
  const struck = m.struck === true;
  const wordless = !struck && !m.read;
  if(newest) rc.classList.add('now');
  if(struck) rc.classList.add('struck');
  else if(m.quiet && !newest) rc.classList.add('quiet');

  rc.append(el('span', 'wake', struck ? 'Held back' : (m.wake || 'read')));

  if(struck){
    rc.append(el('div', 'said none',
      'It spoke, and every claim it made was struck out by the checks.'));
  }else if(wordless){
    // No sentence this time. The levels below ARE the reading; a caption
    // invented for them would be the station talking, not the model.
    if(!(Array.isArray(m.points) && m.points.length)){
      rc.append(el('div', 'said none', 'Nothing to say at this scan.'));
    }
  }else{
    const said = el('div', 'said');
    setSaid(said, m.read);
    rc.append(said);
  }

  if(Array.isArray(m.points) && m.points.length){
    const ul = el('ul', 'pts');
    for(const p of m.points){
      if(!p || p.level == null) continue;
      const li = el('li', 'pt');
      // No thousands separator on a level: the prose beside it writes 1750 and
      // the board writes 1750; 1,750 in the same card reads as a different
      // number.
      li.append(el('span', 'pt-l', String(Number(p.level))),
                el('span', 'pt-n', String(p.note == null ? '' : p.note).replace(/[<>"¦]/g, ' ')));
      ul.append(li);
    }
    if(ul.childElementCount) rc.append(ul);
  }
  return rc;
}

function render(){
  const wrap = $('wrap');
  wrap.textContent = '';
  const msgs = S.msgs;

  if(!msgs.length){
    wrap.append(el('div', 'state', S.stalled
      ? 'Could not reach the station. Retrying…'
      : 'Nothing said this session yet.'));
    return;
  }

  // A session written by the RETIRED design does not get drawn as if it were an
  // observation. Those eras called a direction — a claim later measured to
  // carry no information, and removed. Placed FIRST, where a descending list
  // actually shows it; the old page appended it at the top and then scrolled to
  // the bottom, so it was never seen.
  if(msgs.every(m => m.contract === 'direction_call')){
    wrap.append(el('div', 'oldcontract',
      'An earlier design. These read the board and called a direction — a '
      + 'question later measured to carry no information, and retired.'));
  }

  // NEWEST FIRST. The API hands them oldest-first; this is the one place the
  // order is inverted, and everything below reads bottom-up as a result.
  for(let i = msgs.length - 1; i >= 0; i--){
    const m = msgs[i];
    const row = el('div', 'row');
    const gut = el('div', 'gut');
    gut.append(el('b', null, String(m.at == null ? '' : m.at)),
               el('s', null, gutPrice(m.spot)));
    row.append(gut, card(m, i === msgs.length - 1));
    wrap.append(row);

    // The silence BEFORE this reading, drawn under it — in a descending list
    // the older reading is the next one down, so the gap belongs between them.
    const prev = msgs[i - 1];
    if(prev){
      const gap = minutesBetween(prev.ts, m.ts);
      if(gap != null && gap >= GAP_MIN){
        const g = el('div', 'quiet-gap');
        g.append(el('i'), el('span', null, elapsed(gap)), el('i'));
        wrap.append(g);
      }
    }
  }
  wrap.append(el('div', 'endcap', 'first read of the session'));
}

async function loadDay(day){
  S.day = day; S.last = ''; S.msgs = [];
  const doc = await getJSON('/api/sndk/thread?day=' + encodeURIComponent(day));
  S.stalled = getJSON.failed;
  if(!S.stalled && doc && Array.isArray(doc.messages)){
    S.msgs = doc.messages;
    if(S.msgs.length) S.last = S.msgs[S.msgs.length - 1].ts;
  }
  render();
  window.scrollTo(0, 0);                // a new day opens at its newest reading
  paintSub(doc);
  hideLoading();
}

/* The subheader, extracted because the POLL has to be able to repaint it. It
   was written only by loadDay, so a page that recovered from a dropped request
   kept asserting "station unreachable" above a fully populated list. */
function paintSub(doc){
  const sub = $('sub');
  sub.textContent = '';
  if(S.stalled){
    sub.textContent = 'station unreachable';
  }else if(doc && doc.count != null){
    const n = doc.count, k = doc.with_something;
    sub.append(el('b', null, String(k)),
               document.createTextNode(` of ${n} scan${n === 1 ? '' : 's'} said something`));
  }else{
    sub.textContent = S.day;
  }
}

/* Only ever asks for the tail, once there IS a tail. Otherwise it re-asks for
   the whole day, which is what makes this the retry as well as the poll — one
   dropped request on the first load used to silence it for the life of the
   page, and opening the thread before the day's first read did the same. */
async function poll(){
  if(S.polling) return;      // no second request while one is airborne — see below
  if(!S.day) return;
  S.polling = true;
  let docJson;
  try{
    const tail = S.last ? '&since=' + encodeURIComponent(S.last) : '';
    docJson = await getJSON('/api/sndk/thread?day=' + encodeURIComponent(S.day) + tail);
  }finally{
    S.polling = false;
  }
  if(getJSON.failed) return;                    // still down; the next tick tries again

  // THE STATION IS BACK, and that is true whether or not it had anything to
  // say. Clearing this only on a non-empty answer left the banner "Could not
  // reach the station. Retrying…" on screen permanently for a day with no
  // readings yet, while every poll behind it quietly succeeded. The subheader
  // has to be repainted too: it is the element that was asserting
  // "station unreachable", and nothing else ever touches it again.
  const wasStalled = S.stalled;
  S.stalled = false;
  if(!docJson || !Array.isArray(docJson.messages)) return;
  if(!docJson.messages.length){
    if(wasStalled) render(), paintSub(docJson);
    return;
  }

  if(!S.last){
    S.msgs = docJson.messages;                      // a recovery, or the day's first
  }else{
    // DEDUP BY TIMESTAMP. `since` is exclusive on the server, but this function
    // has two callers — the 45s interval and every visibilitychange — and
    // before the in-flight guard above two of them could be airborne with the
    // same `since`. Both answers concat, and the pair drew as two identical
    // cards with no divider between them, because minutesBetween returns null
    // for equal timestamps. The guard makes this belt-and-braces; keep both,
    // because the cost is a string compare and the symptom is silent.
    const seen = S.last;
    const fresh = docJson.messages.filter(m => m && m.ts > seen);
    if(!fresh.length){ if(wasStalled) paintSub(docJson); return; }
    S.msgs = S.msgs.concat(fresh);
  }
  S.last = S.msgs[S.msgs.length - 1].ts;

  // HOLD THE READER'S PLACE. render() empties the container and rebuilds every
  // node, so scrollTop survives nothing and browser scroll anchoring has no
  // anchor left to hold. A new reading is inserted ABOVE everything, so a
  // reader parked mid-list would silently shift by the height of whatever
  // arrived — a different card, mid-sentence.
  //
  // Measured rather than assumed: record the height before, re-render, and add
  // the difference back. At the top (or near it) that difference is exactly
  // what we do NOT want to add, because arriving at the top is the whole point
  // of a descending list.
  const doc = document.documentElement;
  const atTop = window.scrollY <= 8;
  const hBefore = doc.scrollHeight;
  const yBefore = window.scrollY;
  render();
  paintSub(docJson);
  window.scrollTo(0, atTop ? 0 : yBefore + (doc.scrollHeight - hBefore));
}

async function boot(){
  const d = await getJSON('/api/sndk/thread/days');
  const days = (d && d.days) || [];
  const sel = $('day');
  if(!days.length){
    // An unreachable station is not an empty archive, and the day list failing
    // used to end the page outright — no timer was started below, so there was
    // nothing left but a manual reload.
    const down = getJSON.failed;
    $('wrap').textContent = '';
    $('wrap').append(el('div', 'state', down
      ? 'Could not reach the station. Retrying…'
      : 'No recorded sessions.'));
    $('sub').textContent = '';
    hideLoading();
    if(down) setTimeout(boot, 5000);
    return;
  }
  sel.textContent = '';
  for(const day of days){
    const o = document.createElement('option');
    // The whole date. "09-09" in a list reaching back to July does not say
    // which year, and the closed picker is where a reader looks to find out
    // what they are reading.
    o.value = day; o.textContent = day;
    sel.append(o);
  }
  sel.value = days[0];
  sel.addEventListener('change', () => {
    // Switching sessions is a real wait — a whole day is fetched — so the
    // spinner comes back rather than leaving the previous day's list on screen
    // pretending to be the new one.
    showLoading();
    loadDay(sel.value);
  });
  await loadDay(days[0]);
  setInterval(poll, 45000);   // no handle: nothing on this page ever stops it
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') poll();
  });

  /* THE SHELL BRIDGE IS GONE, and its absence is the fix.

     It existed because this page used to scroll an inner element while the
     document stayed pinned — so the shell's SwipeRefreshLayout, which arms
     itself by asking the WEBVIEW whether it can scroll up, was told "no" at
     every position in the feed and turned every downward drag into a reload.
     The page had to report its own position through MiraiShell.atTop().

     The document is the scroller now, so the WebView can answer that question
     itself and correctly. The shell keeps its bridge and its callback — a page
     that never calls in falls back to the WebView's own answer, which is
     exactly right for this one. One fewer moving part between a finger and a
     scroll. */
}

boot();
</script>
</body>
</html>
