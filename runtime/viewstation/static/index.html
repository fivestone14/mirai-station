     +`<line x1="${X.lineEnd}" x2="${X.lineEnd}" y1="${Math.min(X.H-X.padB,sy+8).toFixed(1)}" y2="${(X.H-X.padB).toFixed(1)}" style="stroke:var(--hairline)"/>`
     +`<line x1="${X.railX0}" x2="${X.railX0}" y1="${X.padT}" y2="${(X.H-X.padB).toFixed(1)}" style="stroke:var(--hairline)"/>`;
  // single-row column headers — identity as TEXT, read not decoded
  profs.forEach(p=>{
    const cx=colX(p.i)+STRIP.colW/2;
    // per-band freshness (H9): an aged column DIMS (the <g> wrap below) and its
    // header carries the age in the hover title — a text suffix ("·3d") was
    // tried and collides at the 21px column pitch, so the ink stays quiet
    // sits just above the panel — follows padT so it stays put when the rail's taller
    // header band raises it (both gutters then share ONE header baseline)
    svg+=`<text x="${cx.toFixed(1)}" y="${(X.padT-9).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" font-family="var(--mono)" letter-spacing=".04em" style="fill:var(--ink-dim);${_HALO}">${p.head}<title>${p.tag} · pulled ${p.age===0?'today':p.age+'d ago'}</title></text>`;
  });
  profs.forEach(p=>{
    const cx=colX(p.i), xC=cellX(p.i), cells=[];
    svg+=`<g opacity="${p.age>=2?0.62:1}">`;   // aged band (H9): whole column recedes —
                                               // visible, but never as loud as fresh ink
    // heat cells — CLAMPED to the panel (an edge row must never paint over the
    // headers or spill past the panel foot); collected for cluster/arrow detection
    MSTRIKES.forEach((k,j)=>{
      const net=p.buckets[j]; if(!net) return;
      const q=Math.sqrt(Math.abs(net)/mx);
      if(q<0.07) return;                            // cull: sub-legible ambient dust
      const stp=q<0.25?1:q<0.45?2:q<0.65?3:q<0.85?4:5;
      const C=(net>=0?_DGLP:_DGLN)[stp-1];
      const yT=Math.max(clampT, yFor(k)-cellH/2), yB=Math.min(clampB, yFor(k)+cellH/2);
      const h=yB-yT; if(h<1) return;                // fully outside the panel → skip
      cells.push({j, k, net, q, stp, yc:Math.max(clampT+4,Math.min(clampB-4,yFor(k)))});
      svg+=`<rect x="${xC.toFixed(1)}" y="${yT.toFixed(1)}" width="${cellW}" height="${h.toFixed(1)}" fill="${C}"><title>${p.tag} · ${k.toLocaleString('en-US')} · ${net>=0?'+':'−'}${_gfmt(Math.abs(net))}</title></rect>`;
    });
    // CLUSTERS: maximal runs of adjacent same-sign cells; magnitude = Σ|net|, anchor
    // = the run's biggest cell. Gate: peak step ≥3 AND run ≥ 35% of the book max —
    // nothing litters a calm day, but a distributed wall still qualifies by mass.
    const clusters=[]; let run=null;
    cells.forEach(c=>{ const s=c.net>=0;
      if(run&&run.s===s&&c.j===run.lastJ+1){ run.lastJ=c.j; run.M+=Math.abs(c.net); if(c.q>run.peak.q) run.peak=c; }
      else { run={s, lastJ:c.j, M:Math.abs(c.net), peak:c}; clusters.push(run); } });
    const worthy=clusters.filter(r=>r.peak.stp>=3 && r.M>=0.35*mx).sort((a,b)=>b.M-a.M);
    const pick=worthy.slice(0,1);
    const opp=worthy.find(r=>pick.length&&r.s!==pick[0].s); if(opp) pick.push(opp);   // ≤2, 2nd only if opposite-sign
    // ARROW = market-maker ACTION at the level (validated from dealer hedging):
    //   ↑ BUY / promote = (green & below spot) OR (red & above spot)
    //   ↓ SELL hard into = (green & above spot) OR (red & below spot)
    // GREEN points TOWARD spot (fade: support below / cap above); RED points AWAY
    // (chase: accelerate the break). Ink glyph + surface halo ⇒ ≥3:1 on any cell,
    // both themes; the CELL HUE still carries pin-vs-push, the ARROW carries buy/sell.
    pick.forEach(r=>{
      const green=r.s, up = green ? (r.peak.k<D.spot) : (r.peak.k>D.spot);
      const cxc=xC+cellW/2, yc=r.peak.yc, t=(6+3*Math.min(1,r.M/mx))/2;
      const d = up ? `M${cxc.toFixed(1)},${(yc-t).toFixed(1)} L${(cxc-t).toFixed(1)},${(yc+t).toFixed(1)} L${(cxc+t).toFixed(1)},${(yc+t).toFixed(1)} Z`
                   : `M${(cxc-t).toFixed(1)},${(yc-t).toFixed(1)} L${(cxc+t).toFixed(1)},${(yc-t).toFixed(1)} L${cxc.toFixed(1)},${(yc+t).toFixed(1)} Z`;
      svg+=`<path d="${d}" style="fill:var(--ink);paint-order:stroke;stroke:var(--surface-2);stroke-width:2;stroke-linejoin:round"><title>${p.tag} · ${r.peak.k.toLocaleString('en-US')} · MM ${up?'BUY / promote':'SELL hard into'} · ${_gfmt(r.M)}</title></path>`;
    });
    // plain wall tick only where NO arrow claimed the column (arrow supersedes it)
    if(!pick.length&&cells.length){
      let top=cells[0]; for(const c of cells) if(c.q>top.q) top=c;
      const yT=Math.max(clampT,yFor(top.k)-cellH/2), h=Math.min(clampB,yFor(top.k)+cellH/2)-yT;
      svg+=`<rect x="${(cx-(STRIP.gap/2+STRIP.tickW/2)).toFixed(1)}" y="${Math.max(clampT,yT-1).toFixed(1)}" width="${STRIP.tickW}" height="${Math.min(h+2,clampB-Math.max(clampT,yT-1)).toFixed(1)}" fill="var(--ink)"/>`;
    }
    svg+='</g>';                               // close the per-band freshness group (H9)
  });
  MAP.datedOIG.innerHTML=svg;
  // LEGEND — bottom caption strip, right-aligned (outside every plot element by
  // construction; Watchtower marker is clamped into the frame). Discloses the
  // 5-step √ heat quantization + the global-max anchor + the AS-OF pull price
  // (nightly-priced gamma reshapes 25-150% on a ±1% spot move — it must say so).
  const spotP=(b.spot!=null&&isFinite(b.spot))?(+b.spot).toLocaleString('en-US',{maximumFractionDigits:0}):'—';
  const kx=(kmax!=null)?kmax.toLocaleString('en-US'):'—';
  const tiers=[
    `Dated γ ladders · heat = √|net|, 5 steps · full = ${_gfmt(mx)} @ ${kx} · nightly @ ${spotP}`,
    `Dated γ · heat = √|net| · full = ${_gfmt(mx)} @ ${kx}`,
    `full = ${_gfmt(mx)} · @ ${spotP}`];
  if(MAP.datedOILgdG){
    for(let t=0;t<tiers.length;t++){
      MAP.datedOILgdG.innerHTML=`<text x="${X.tagX}" y="${(X.H-6).toFixed(1)}" text-anchor="end" font-size="9" font-weight="700" font-family="var(--sans)" letter-spacing=".03em" style="fill:var(--ink-dim);${_HALO}">${tiers[t]}</text>`;
      try{
        const cap=document.getElementById('gx-cap'), lgd=MAP.datedOILgdG.firstChild;
        if(!cap||!lgd) break;
        const cb=cap.getBBox(), lb=lgd.getBBox();
        if(!cb.width) break;                        // hidden-panel measure → keep tier
        if(lb.x>=cb.x+cb.width+24) break;           // clear of the caption → done
      }catch(e){ break; }                            // getBBox unavailable → keep tier
    }
  }
}
// ================= HEDGE RAIL (>7DTE) — what dealers must DO ====================
// The heat ladder says a dated strike is BIG. It cannot say what price does there, or
// what a market maker has to trade to stay neutral. The rail answers both, on the map's
// OWN price axis, in its own gutter to the right of the ladder.
//
//   x = net dealer gamma ($B of delta per 1% move) against a vertical zero rule.
//       RIGHT of zero = jade = dealers trade AGAINST the move (sell rallies, buy dips)
//                            → the move is DAMPED. LEFT = coral = they trade WITH it
//                            → the move is FED. Same sign language as the live bars.
//   y = yFor() VERBATIM. There is never a second price scale on this map.
//
// The header number is the whole product: what a +1% move forces dealers to trade.
//
// CONTESTED: net gamma at spot is a small difference of two large numbers, and the
// vanna channel can out-vote it. The feed sweeps the spot-vol beta (0→1) and asks
// whether the sign of that hedge FLIPS. When it does, the lane gets a lantern hatch,
// no directional fill, and both bounds in the tooltip — "gamma says sell, vanna says
// buy" is worth more than a confident colour that is a coin-flip. A panel that never
// says "I don't know" has never told you anything.
//
// Sign is ASSUMED (dealers long calls / short puts) — the store is magnitude-only by
// design. Record-only: feeds nothing. Not the fade lens, not Watchtower, not the reasoner.
let RAIL_ON=(function(){ try{ return localStorage.getItem('gx.hedgeRail')==='1'; }catch(e){ return false; } })();
let RAIL_CUR=null;                        // scrubbed price, or null = the resting +1% read
function railOn(){ return RAIL_ON; }
function _rlDte(bd){                       // LIVE dte — the book only ships dte_at_pull
  try{ const d=Math.round((new Date(String(bd.expiry))-new Date(new Date().toISOString().slice(0,10)))/86400000);
       return isFinite(d)?d:-1; }catch(e){ return -1; }
}
// ADMISSION GATE — a lane draws only with a nightly profile, an EXPLICIT contested
// verdict, and >7 DTE. A band that has AGED to <=7DTE belongs to the live chain, not a
// days-old sidecar: it leaves the rail on its own while staying in the heat ladder.
// (Today JUL17 is 5 DTE — it is 84% of the book's hedge flow and it does NOT belong here.)
function _railBands(){
  return _dglBands().filter(bd=>{
    const p=bd&&bd.profile;
    return _rlDte(bd)>7 && p && Array.isArray(p.grid) && Array.isArray(p.gex)
      && p.grid.length>1 && p.grid.length===p.gex.length && typeof p.contested==='boolean';
  }).slice(0,RAIL.maxLanes);
}
function railAvail(){ return datedOIAvail() && _railBands().length>0; }   // never a dead switch
function toggleHedgeRail(){
  RAIL_ON=!RAIL_ON;
  try{ localStorage.setItem('gx.hedgeRail', RAIL_ON?'1':'0'); }catch(e){}
  if(MAP){ MAP._rkey=null; }
  buildMap();          // REFRAME: the rail gutter changes the lane geometry
  gxOverview();
}
function _rlAt(p,x){                       // net γ ($B/1%) at a price — linear interp
  const g=p.grid, v=p.gex, n=g.length;
  if(!(x>g[0])) return +v[0];
  if(x>=g[n-1]) return +v[n-1];
  for(let i=1;i<n;i++) if(x<=g[i]){ const t=(x-g[i-1])/(g[i]-g[i-1]); return +v[i-1]+t*((+v[i])-(+v[i-1])); }
  return +v[n-1];
}
const _rlB=v=>{ const a=Math.abs(v); return a<0.995?'$'+Math.round(a*1000)+'M':'$'+a.toFixed(1)+'B'; };
// $B of delta dealers must trade to stay neutral moving spot -> px. gex is $B per 1%,
// so integrate over PERCENT. Sign: + = they must BUY. This is the same trapezoid the
// nightly feed uses for h1 (the +1% case); scrubbing just moves the upper limit.
function _rlHedge(p,spot,px){
  const lo=Math.min(spot,px), hi=Math.max(spot,px), n=32;
  if(!(spot>0)||hi-lo<1e-9) return 0;
  let acc=0;
  for(let i=0;i<n;i++){ const a=lo+(hi-lo)*i/n, b=lo+(hi-lo)*(i+1)/n;
    acc+=0.5*(_rlAt(p,a)+_rlAt(p,b))*((b-a)/spot*100); }
  if(px<spot) acc=-acc;
  return -acc;
}
function paintHedgeRail(){
  if(!MAP||!MAP.railG) return;
  const X=MAPX, b=DBOOK.book;
  const ok=RAIL_ON&&(typeof LIVE==='undefined'||LIVE)&&X.nR>0&&railAvail()&&MSTRIKES.length;
  // spot bucketed to 5pts — the spot tick re-evaluates as price eases without rebuilding
  // this <g> every frame (the same key discipline paintDatedOI uses)
  const key=(ok?String(b.as_of)+'@'+new Date().toISOString().slice(0,10):'off')
    +`#${X.nR}|${X.railLaneW}|${X.railX0}|${X.padT}|${X.pLow}|${X.pHigh}|${Math.round((D.spot||0)/5)}`
    +`@${RAIL_CUR==null?'-':Math.round(RAIL_CUR)}`;
  if(key===MAP._rkey) return;
  MAP._rkey=key;
  if(!ok){ MAP.railG.innerHTML=''; return; }
  const bands=_railBands().slice(0,X.nR);
  const spot=(D.spot&&isFinite(D.spot))?D.spot:(+b.spot||0);
  if(!bands.length||!spot){ MAP.railG.innerHTML=''; return; }
  const lw=X.railLaneW||RAIL.minLane, half=lw/2-RAIL.inset;
  // type scales with the lane — a 78px lane on a 13" tablet should not wear 8px labels
  const fHead=lw>=120?12:lw>=96?11:10, fVal=lw>=120?17:lw>=96?15:13;
  const T0=X.padT, B0=X.H-X.padB, sy=Math.max(T0,Math.min(B0,yFor(spot)));
  // ONE x-scale, SHARED across lanes (so AUG's $1.4B still visibly out-leans SEP's $830M
  // — per-lane normalization is as banned here as it is on the bars).
  //
  // Anchored on the max |net| across the VISIBLE FRAME, not the full ±6% profile. The
  // full-profile anchor was the honest-sounding choice and it was wrong: the frame is
  // only ~200pts of a 900pt curve, so every lane collapsed into a dead vertical line and
  // the lean — the entire point of the rail — was invisible. The frame only moves on a
  // reframe (>15% drift), never tick-to-tick, so this does not breathe with the tape.
  let mx=1e-9;
  bands.forEach(bd=>{
    for(let j=0;j<=24;j++){
      const a=Math.abs(_rlAt(bd.profile, X.pLow+(X.pHigh-X.pLow)*j/24));
      if(a>mx) mx=a;
    }
  });
  mx*=1.08;                                 // a hair of headroom so the peak never kisses the wall
  let s='';
  s+=`<rect x="${X.railX0}" y="${T0}" width="${X.railGutter}" height="${(B0-T0).toFixed(1)}" rx="3" fill="var(--dgl-gutter)" style="shape-rendering:auto"/>`
   + `<line x1="${X.stripEnd}" x2="${X.stripEnd}" y1="${T0}" y2="${B0.toFixed(1)}" style="stroke:var(--hairline)"/>`;
  bands.forEach((bd,i)=>{
    const p=bd.profile, cx0=X.railX0+RAIL.padL+i*(lw+RAIL.gap), zx=cx0+lw/2, cont=!!p.contested;
    const xF=v=>zx+Math.max(-1,Math.min(1,(+v)/mx))*half;   // clamped — never bleeds into a neighbour
    const head=_dexp(bd.expiry), dte=_rlDte(bd);
    // SCRUBBING: read the lane at the dragged price. Otherwise the resting headline is
    // the +1% answer the nightly feed already computed (p.h1 — γ-only, so the CONTESTED
    // bounds in p.h1_range still apply to it).
    const scrub=(RAIL_CUR!=null&&isFinite(RAIL_CUR))?+RAIL_CUR:null;
    const tgt=scrub!=null?scrub:spot*1.01;
    const gv=_rlAt(p, scrub!=null?scrub:spot);              // net γ AT the read price
    const h1=scrub!=null ? _rlHedge(p,spot,scrub)
                         : ((p.h1!=null&&isFinite(p.h1))?+p.h1:null);
    const rg=Array.isArray(p.h1_range)?p.h1_range:null;
    // the curve, sampled ONLY across the visible frame — the sills close the fill exactly
    const N=60, pts=[];
    for(let j=0;j<=N;j++){ const pr=X.pLow+(X.pHigh-X.pLow)*j/N; pts.push({y:yFor(pr), v:_rlAt(p,pr)}); }
    const yA=pts[0].y.toFixed(1), yZ=pts[N].y.toFixed(1);
    if(cont){                                               // CONTESTED: shape, no sign
      const d=`M ${zx} ${yA} `+pts.map(q=>`L ${xF(q.v).toFixed(1)} ${q.y.toFixed(1)}`).join(' ')+` L ${zx} ${yZ} Z`;
      s+=`<path d="${d}" fill="url(#rlHatch)"/>`;
    } else {
      const up=`M ${zx} ${yA} `+pts.map(q=>`L ${xF(Math.max(0,q.v)).toFixed(1)} ${q.y.toFixed(1)}`).join(' ')+` L ${zx} ${yZ} Z`;
      const dn=`M ${zx} ${yA} `+pts.map(q=>`L ${xF(Math.min(0,q.v)).toFixed(1)} ${q.y.toFixed(1)}`).join(' ')+` L ${zx} ${yZ} Z`;
      s+=`<path d="${up}" fill="var(--jade)" opacity=".16"/><path d="${dn}" fill="var(--coral)" opacity=".16"/>`;
    }
    // HEDGE BAND — the stretch of price the number is about. In the artifact this area IS
    // the dollars; here the curve is x-clamped to the lane, so the AREA is indicative and
    // the NUMBER carries the value. Nothing on the map claims otherwise.
    if(spot&&Math.abs(tgt-spot)>1){
      const ys=yFor(spot), yt=Math.max(T0,Math.min(B0,yFor(tgt)));
      const bc=cont?'var(--lantern)':((h1||0)>0?'var(--jade)':'var(--coral)');
      s+=`<rect x="${(cx0+1).toFixed(1)}" y="${Math.min(ys,yt).toFixed(1)}" width="${lw-2}" height="${Math.abs(ys-yt).toFixed(1)}" fill="${bc}" opacity="${scrub!=null?.22:.10}"/>`;
    }
    // zero rule + the spot row inside the lane (the level system's spot line now stops
    // at railX0 so its --ground casing can't gash the curve)
    s+=`<line x1="${zx}" x2="${zx}" y1="${T0}" y2="${B0.toFixed(1)}" style="stroke:var(--ink-faint);opacity:.55" stroke-dasharray="2 3"/>`
     + `<line x1="${cx0}" x2="${cx0+lw}" y1="${sy.toFixed(1)}" y2="${sy.toFixed(1)}" style="stroke:var(--iris);opacity:.5;stroke-width:1.2"/>`
     + `<path d="${pts.map((q,j)=>`${j?'L':'M'} ${xF(q.v).toFixed(1)} ${q.y.toFixed(1)}`).join(' ')}" fill="none" stroke="${cont?'var(--lantern)':'var(--iris)'}" stroke-width="1.8" stroke-linejoin="round" opacity=".95"/>`;
    // FLIP — where the mechanic inverts.
    const fl=(p.flip!=null&&isFinite(p.flip))?+p.flip:null;
    if(fl!=null&&fl>=X.pLow&&fl<=X.pHigh){                  // IN FRAME → tick + price
      const fy=yFor(fl);
      s+=`<line x1="${(zx-9).toFixed(1)}" x2="${(zx+9).toFixed(1)}" y1="${fy.toFixed(1)}" y2="${fy.toFixed(1)}" style="stroke:var(--lantern);stroke-width:1.6"/>`
       + `<text x="${(cx0+lw-3).toFixed(1)}" y="${(fy-5).toFixed(1)}" text-anchor="end" font-size="${fHead}" font-weight="700" font-family="var(--mono)" style="fill:var(--lantern);${_HALO}">${Math.round(fl).toLocaleString('en-US')}</text>`;
    } else if(fl!=null){
      // OFF FRAME (the normal case — SEP30's flip sits ~90pts under pLow). A lane that is
      // one-sided IN VIEW while its flip lies just past the sill reads "all safe" and is a
      // lie. So the sill it lies beyond gets the colour the book turns into out there:
      // a 3-step bleed, a horizon rule that reads CUT (not ended), and a caret + price.
      // All clamped inside padT..H-padB — #gx-cap and the ladder legend own the 24px
      // below and are never entered, so their collision-degrade loop is untouched.
      const below=fl<X.pLow, bs=_rlAt(p, below?fl-20:fl+20);
      const bcol=bs>=0?'var(--jade)':'var(--coral)', BH=12;
      for(let t=0;t<3;t++){
        const yy=below?(B0-BH+t*(BH/3)):(T0+t*(BH/3));
        const op=below?(0.10+0.09*t):(0.28-0.09*t);
        s+=`<rect x="${cx0}" y="${yy.toFixed(1)}" width="${lw}" height="${(BH/3+0.5).toFixed(1)}" fill="${bcol}" opacity="${op.toFixed(2)}"/>`;
      }
      const hy=below?B0:T0;
      s+=`<line x1="${cx0}" x2="${cx0+lw}" y1="${hy.toFixed(1)}" y2="${hy.toFixed(1)}" style="stroke:var(--lantern);stroke-width:2.5;opacity:.9"/>`
       + `<text x="${zx.toFixed(1)}" y="${(below?B0-4:T0+11).toFixed(1)}" text-anchor="middle" font-size="${fHead}" font-weight="700" font-family="var(--mono)" style="fill:var(--lantern);${_HALO}">${below?'⌄':'⌃'}${Math.round(fl).toLocaleString('en-US')}</text>`;
    }
    // HEADER — two rows in the y<padT band the ladder headers already own (different
    // COLUMNS, x>=railX0). Zero vertical cost, no new DOM, legend untouched.
    // ▲/▼ = BUY/SELL in --ink, NOT jade/coral: those two hues already mean damp-vs-amplify
    // 40px away, and one hue must never carry two meanings on the same screen.
    // A CONTESTED lane still shows the γ-only number — with a trailing "?" and no fill.
    // A bare "?" throws away something we DO know (gamma says sell $1.4B) and reads as
    // broken; the honest render is the number plus the doubt, not the doubt alone. The
    // no-fill + lantern hue + "?" carry the uncertainty; the tooltip carries both bounds.
    const t2=(h1!=null)?`${h1>0?'▲':'▼'}${_rlB(h1)}${cont?'?':''}`:(cont?'?':'—');
    const t0=scrub!=null?`→ ${Math.round(scrub).toLocaleString('en-US')}`:head;
    const ttl=`${head} · ${dte} DTE · net ${gv>=0?'+':'−'}${_rlB(gv)} per 1% at spot`
      +` · ${scrub!=null?`a move to ${Math.round(scrub).toLocaleString('en-US')}`:'a +1% move'} forces dealers to ${h1>0?'BUY':'SELL'} ${_rlB(h1)} of delta to stay neutral`
      +(cont
        ? ` · CONTESTED — sweeping the spot-vol beta (0→1) FLIPS the sign of the +1% hedge: γ alone says ${(p.h1||0)>0?'BUY':'SELL'} ${_rlB(p.h1||0)}, but with vanna the range is ${_rlB(rg?rg[0]:0)} ${rg&&rg[0]<0?'sell':'buy'} → ${_rlB(rg?rg[1]:0)} ${rg&&rg[1]>0?'buy':'sell'}. No fill, no direction claimed.`
        : '')
      +(fl!=null?` · flip ${Math.round(fl).toLocaleString('en-US')}${(fl>X.pHigh||fl<X.pLow)?' (OFF-FRAME — the lane inverts beyond the marked sill)':''}`:' · no flip in range')
      +` · assumed sign (calls long / puts short) · record-only, feeds nothing`;
    s+=`<text x="${zx.toFixed(1)}" y="${(T0-24).toFixed(1)}" text-anchor="middle" font-size="${fHead}" font-weight="700" font-family="var(--mono)" letter-spacing=".06em" style="fill:var(--${scrub!=null?'iris':'ink-dim'});${_HALO}">${t0}<title>${ttl}</title></text>`
     + `<text x="${zx.toFixed(1)}" y="${(T0-9).toFixed(1)}" text-anchor="middle" font-size="${fVal}" font-weight="${cont?800:700}" font-family="var(--mono)" style="fill:var(--${cont?'lantern':'ink'});${_HALO}">${t2}<title>${ttl}</title></text>`;
  });
  MAP.railG.innerHTML=s;
}
// ---- PRICE SCRUB: drag the map, the rail answers -------------------------------
// The rail's headline is "what a +1% move forces dealers to trade". The obvious next
// question is "…and at 7,650?" — so drag. A scrub line follows the finger, and every
// lane re-reads: net γ at that price, and the dollars of delta dealers must trade to
// get there from spot. Release and it STICKS (a tablet has no hover; a value that
// evaporates on lift is unreadable). Tap the spot row, or press Esc, to clear.
//
// The whole-chart click that opened Magnet Zones was removed — this is a DRAG, and a
// tap that never moves clears rather than opens, so nothing fires by accident.
const _RAIL_SLOT='display:inline-block;min-width:7ch;text-align:left;font-variant-numeric:tabular-nums';
function _railChipTail(){                 // FIXED WIDTH — see the note above _railChipSync
  return RAIL_CUR!=null
    ? ` · <span style="${_RAIL_SLOT};color:var(--iris)">${Math.round(RAIL_CUR).toLocaleString('en-US')}</span>`
    : ` · <span style="${_RAIL_SLOT}">+1%</span>`;
}
function _railChipSync(){                 // patch the ONE node the scrub owns
  const el=document.getElementById('gx-rail-v');
  if(!el||!RAIL_ON||!(MAPX.nR||0)) return;
  const tail=_railChipTail();
  const head='<span style="color:var(--jade)">On</span> · '
    + _railBands().slice(0,MAPX.nR).map(bd=>_dexp(bd.expiry)).join('·');
  const html=head+tail;
  if(el.innerHTML!==html) el.innerHTML=html;
}
function _scrubPrice(y){                  // inverse of yFor(), clamped to the plot
  const X=MAPX, t=X.padT, b=X.H-X.padB;
  const yy=Math.max(t,Math.min(b,y));
  return X.pHigh-(yy-t)/(b-t)*(X.pHigh-X.pLow);
}
function gxMountScrub(){
  const svg=MAP&&MAP.svg; if(!svg) return;
  let drag=false, moved=false;
  const toY=e=>{ const r=svg.getBoundingClientRect();
    return (e.clientY-r.top)*(MAPX.H/Math.max(1,r.height)); };
  let raf=0, pend=null;
  const set=p=>{                          // coalesced: at most one repaint per frame
    pend=p;
    if(raf) return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      RAIL_CUR=pend;
      MAP._rkey=null; MAP._skey=null;
      paintHedgeRail(); paintScrub(); _railChipSync();
    });
  };
  const setNow=p=>{                       // clears must land immediately, not next frame
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    RAIL_CUR=p; MAP._rkey=null; MAP._skey=null;
    paintHedgeRail(); paintScrub(); _railChipSync();
  };
  svg.style.touchAction='pan-x';          // let the page still scroll sideways
  svg.addEventListener('pointerdown',e=>{
    if(!MAPX.nR) return;                  // no rail → nothing to scrub
    drag=true; moved=false;
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    set(_scrubPrice(toY(e)));
  });
  svg.addEventListener('pointermove',e=>{ if(!drag) return; moved=true; set(_scrubPrice(toY(e))); });
  const end=e=>{
    if(!drag) return;
    drag=false;
    // a tap that never moved = clear (and a scrub parked ON spot means "never mind")
    if(!moved || (D.spot && RAIL_CUR!=null && Math.abs(RAIL_CUR-D.spot)/D.spot < 0.0008)) setNow(null);
  };
  svg.addEventListener('pointerup',end);
  svg.addEventListener('pointercancel',()=>{ drag=false; });
  svg.addEventListener('pointerleave',()=>{ drag=false; });
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&RAIL_CUR!=null){
  RAIL_CUR=null; if(MAP){MAP._rkey=null; MAP._skey=null;} paintHedgeRail(); paintScrub(); _railChipSync(); } });
function paintScrub(){
  if(!MAP||!MAP.scrubG) return;

  if(key===MAP._skey) return;

  const y=yFor(RAIL_CUR), spot=D.spot||0;

     `<line x1="${X.x0}" x2="${X.stripEnd}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--iris);stroke-width:1.5;opacity:.9"/>`
   + `<rect x="${(X.x0+2).toFixed(1)}" y="${(y-9).toFixed(1)}" width="104" height="18" rx="4" fill="var(--iris)"/>`
   + `<text x="${(X.x0+8).toFixed(1)}" y="${(y+4).toFixed(1)}" font-size="11" font-weight="700" font-family="var(--mono)" style="fill:var(--ground)">${lbl}</text>`;
}
// ---- DATED BOOK overlay: far structural OI walls (next 2 monthlies + quarter-end) ----
// Shaded by EXPIRATION — nearer expiries brighter, further dimmer — so one glance says
// which tenor a wall belongs to. Walls picked moneyness-aware at DISPLAY time (a max-OI
// call strike BELOW spot is real OI but not a ceiling): the ceiling = biggest-OI call
// strike >= spot, the floor = biggest-OI put strike <= spot, falling back to the raw
// max-OI wall tagged ITM. In-band walls draw as dashed lines; off-plot walls become
// edge markers (▲/▼ + price + tenor) so hundreds-of-points-out structure stays visible.
// The book updates ~daily (nightly sidecar) — the chip strip carries its as-of stamp.
const _DSHADE=[0.85,0.62,0.45];                       // per-band shade ladder: front → far
                                                      // (raised 07-10: the old .30 floor fell
                                                      // below the 3:1 graphics-contrast line in
                                                      // BOTH themes — an illegible encoding isn't
                                                      // an encoding)
const _DDASH=['6 3','4 4','2 5'];                     // dash length also encodes tenor (redundant
                                                      // channel: longer dash = nearer expiry)
function _dexp(iso){ const m=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  try{ const p=iso.split('-'); return m[+p[1]-1]+p[2]; }catch(e){ return iso; } }
function _dwalls(b, spot){
  const pick=(arr,pred)=>{ for(const kv of (arr||[])) if(kv&&isFinite(kv[0])&&pred(kv[0])) return +kv[0]; return null; };
  // m7: the engine's nearest-STRONG wall leads when present — the put wall should
  // mark support NEAR price, not a 7000-class crash bet 8% below. The ranked pick
  // and the magnitude king stay as fallbacks (pre-m7 books carry no near_* keys).
  // live-side guard (verify round): near_* was computed at pull-time spot — a wall
  // price has since walked through must not lead; the ranked pick takes over.
  const ncw=(b.near_call_wall!=null&&isFinite(b.near_call_wall)&&b.near_call_wall>spot)?+b.near_call_wall:null;
  const npw=(b.near_put_wall!=null&&isFinite(b.near_put_wall)&&b.near_put_wall<spot)?+b.near_put_wall:null;
  const cw=ncw??pick(b.top_calls,k=>k>=spot), pw=npw??pick(b.top_puts,k=>k<=spot);
  return { cw: cw??(isFinite(b.call_wall)?+b.call_wall:null), cItm: cw==null&&b.call_wall!=null,
           pw: pw??(isFinite(b.put_wall)?+b.put_wall:null),  pItm: pw==null&&b.put_wall!=null };
}
// Walls toggle (2026-07-10): the wall LINES layer — dated tenor walls + the
// structural near-dated Call Ceiling / Put Floor (which moved here from the
// strip chips). Default ON; localStorage-persisted like the Dated γ toggle.
function wallsOn(){ try{ return localStorage.getItem('gx.walls')!=='0'; }catch(e){ return true; } }
function toggleWalls(){
  try{ localStorage.setItem('gx.walls', wallsOn()?'0':'1'); }catch(e){}
  if(MAP){ MAP._dkey=null; MAP._dokey=null; }
  buildMap();          // REFRAME: walls view widens the band to include the walls
  gxOverview();
}
const _HALO='paint-order:stroke;stroke:var(--surface-2);stroke-width:3px;';   // surface halo: labels stay legible over the (now longer) bars
const _HALO2='paint-order:stroke;stroke:var(--surface-2);stroke-width:3.8px;';  // wall labels: 12px ink, and a max-length bar can reach either anchor rail
function paintDated(){
  if(!MAP||!MAP.datedG) return;
  const X=MAPX, d=D.dated, bands=(d&&Array.isArray(d.bands))?d.bands.slice(0,4):[];   // 4-band world (H8: two quarterlies)
  const on=wallsOn();
  const sg=(D.sigma&&isFinite(D.sigma)&&D.sigma>0)?D.sigma:0;
  const key=(on?bands.map(b=>`${b.expiry}|${b.call_wall}|${b.put_wall}|${b.as_of||''}`).join(';'):'off')
    +`#${X.pLow}|${X.pHigh}|${Math.round((D.spot||0)/10)}|${Math.round(sg)}|${D.callCeil}|${D.putFloor}|${X.H}|${X.lineEnd}`;   // spot bucketed to 10pts → σ-labels stay honest, no 60fps churn; H/lineEnd → the nudge re-lays out on resize
  if(key===MAP._dkey) return;
  MAP._dkey=key;
  if(!on){ MAP.datedG.innerHTML=''; return; }
  const spot=(D.spot&&isFinite(D.spot))?D.spot:((d&&d.spot_at_pull)||0);
  // GROUP walls shared across tenors (today's real book: all 3 bands floor at 7000)
  // — one line/marker at the FRONT band's shade with the tenor tags merged, instead
  // of three identical lines and three labels stamped on the same y (unreadable smear
  // exactly on the crash day the far floor matters most).
  const ent=new Map();
  const put_=(side,k,itm,tag,i)=>{
    if(k==null||!isFinite(k)) return;
    const kk=side+'|'+k, e=ent.get(kk);
    if(e){ if(!e.tags.includes(tag)) e.tags.push(tag); e.itm=e.itm||itm; }
    else ent.set(kk,{side,k,itm,tags:[tag],idx:i});
  };
  bands.forEach((b,i)=>{
    const w=_dwalls(b,spot), tag=_dexp(b.expiry);
    put_('c',w.cw,w.cItm,tag,i); put_('p',w.pw,w.pItm,tag,i);
  });
  // structural near-dated (1-7DTE OI) Call Ceiling / Put Floor — the former strip
  // chips, now lines on the graph; merged by strike so a level shared with a
  // monthly wall draws once with combined tags
  if(D.callCeil!=null&&isFinite(D.callCeil)&&D.callCeil>0) put_('c',+D.callCeil,false,'0-7D',0);
  if(D.putFloor!=null&&isFinite(D.putFloor)&&D.putFloor>0) put_('p',+D.putFloor,false,'0-7D',0);
  if(!ent.size){ MAP.datedG.innerHTML=''; return; }
  const colOf=e=>e.side==='c'?'var(--jade)':'var(--coral)';
  // LABEL LAYOUT (2026-07-13). The label used to be stamped at yFor(k)−3 at 9px with no
  // spacing check, so a 0-7D ceiling a few points off a dated monthly wall smeared the
  // two lines of text together — unreadable exactly when the two levels agree, which is
  // when they matter most. Three fixes, in order of effect:
  //   1. MERGE same-side walls that sit within a label-height of each other into ONE
  //      label carrying a price RANGE and the union of tenor tags. Text merges; every
  //      wall keeps its own LINE at its own true price, so no level ever disappears.
  //   2. NUDGE what is left using the map's existing idiom (the MIDS block in gxPaint):
  //      sort by y, push down, pull back up, and draw a LEADER whenever a label had to
  //      leave its line — a displaced label that doesn't say so is a lie about which
  //      line it belongs to.
  //   3. ROUND the price. near_* walls are floats: the label read "7,626.451". At 0dp it
  //      reads "7,626" and buys back the 4 characters the 9px→12px bump costs.
  // Layout is SPOT-FREE (it depends only on yFor(k) and the frame) and widths are
  // computed analytically from the character count — never getBBox, which is the classic
  // measure-then-relayout jitter loop. So nothing here moves as spot eases or you scrub.
  const LABF=12, LABH=16;
  const T=X.padT+LABH/2, B=X.H-X.padB-LABH/2-6;      // -6 clears #gx-cap
  const inB=[], hiE=[], loE=[];
  for(const e of ent.values()){
    if(e.k>X.pHigh) hiE.push(e);
    else if(e.k<X.pLow) loE.push(e);
    else inB.push({e, y:yFor(e.k)});
  }
  inB.sort((a,b)=>a.y-b.y);
  // 1. cluster — same side only (jade and coral must never fuse into one label)
  const groups=[];
  for(const m of inB){
    const g=groups[groups.length-1];
    if(g && g.side===m.e.side && (m.y-g.ms[0].y)<LABH) g.ms.push(m);
    else groups.push({side:m.e.side, ms:[m]});
  }
  for(const g of groups){
    const ks=g.ms.map(m=>m.e.k), call=g.side==='c';
    const tags=[...new Set(g.ms.flatMap(m=>m.e.tags))];
    const kLo=Math.min(...ks), kHi=Math.max(...ks);
    const kT=(g.ms.length===1||Math.round(kLo)===Math.round(kHi))
      ? f(Math.round(kLo),0)
      : `${f(Math.round(kLo),0)}–${f(Math.round(kHi),0)}`;
    const kRef=call?kHi:kLo;                          // σ measured off the OUTER edge
    const sd=(sg&&spot)?((kRef-spot)/sg):null;
    const sdT=(sd!=null&&isFinite(sd))?` ${sd>=0?'+':'−'}${Math.abs(sd).toFixed(1)}σ`:'';
    g.lbl=`${call?'▲':'▼'} ${kT}${sdT} · ${tags.join('·')}${g.ms.some(m=>m.e.itm)?' · ITM':''}`;
    g.col=call?'var(--jade)':'var(--coral)';
    g.idx=Math.min(...g.ms.map(m=>m.e.idx));          // the front-most band owns the shade
    g.y=g.ms.reduce((a,m)=>a+m.y,0)/g.ms.length;      // desired y = cluster centroid
    g.w=Math.round(g.lbl.length*LABF*0.60)+6;         // ANALYTIC width — never getBBox
  }
  // 2. TWO COLUMNS — ceilings (▲, jade) hug the RIGHT edge of the lane, floors (▼, coral)
  //    hug the LEFT. One right-anchored column made every label reach ~200px back into the
  //    bar lane and sit on top of the gamma bars; splitting by side uses the empty left
  //    margin, halves the labels per column (so far less nudging), and gives the map a free
  //    read: floors on the left, ceilings on the right. Each column de-collides on its OWN,
  //    so a ceiling can never be pushed around by a floor.
  const nudge=(gs)=>{
    gs.sort((a,b)=>a.y-b.y);
    const GAP=Math.min(LABH, gs.length>1?(B-T)/(gs.length-1):LABH);
    let last=T-GAP;
    gs.forEach(g=>{ g.ly=Math.min(B,Math.max(g.y,last+GAP)); last=g.ly; });
    for(let i=gs.length-2;i>=0;i--)
      if(gs[i].ly>gs[i+1].ly-GAP) gs[i].ly=Math.max(T,gs[i+1].ly-GAP);
    return gs;
  };
  const RIGHT=nudge(groups.filter(g=>g.side==='c'));
  const LEFT =nudge(groups.filter(g=>g.side==='p'));
  // 3. draw — every wall keeps its true-price LINE; only the text is displaced
  let svg='';
  for(const m of inB){
    const sh=_DSHADE[Math.min(m.e.idx,2)], dash=_DDASH[Math.min(m.e.idx,2)];
    svg+=`<line x1="${X.x0}" y1="${m.y.toFixed(1)}" x2="${X.lineEnd}" y2="${m.y.toFixed(1)}" style="stroke:${colOf(m.e)};stroke-width:1.1;opacity:${sh}" stroke-dasharray="${dash}"/>`;
  }
  const RX=X.lineEnd-8, LX=X.x0+8;                    // the two anchor rails
  for(const g of RIGHT){
    const sh=_DSHADE[Math.min(g.idx,2)];
    if(Math.abs(g.ly-g.y)>2)                          // leader ONLY when displaced
      svg+=`<line x1="${X.lineEnd.toFixed(1)}" y1="${g.y.toFixed(1)}" x2="${(RX-g.w-6).toFixed(1)}" y2="${g.ly.toFixed(1)}" style="stroke:${g.col};stroke-width:1;opacity:.3"/>`;
    svg+=`<text x="${RX.toFixed(1)}" y="${(g.ly+LABF*0.35).toFixed(1)}" text-anchor="end" font-size="${LABF}" font-weight="700" font-family="var(--mono)" style="fill:${g.col};opacity:${Math.min(1,sh+0.12)};${_HALO2}">${g.lbl}</text>`;
  }
  for(const g of LEFT){
    const sh=_DSHADE[Math.min(g.idx,2)];
    if(Math.abs(g.ly-g.y)>2)
      svg+=`<line x1="${X.x0.toFixed(1)}" y1="${g.y.toFixed(1)}" x2="${(LX+g.w+6).toFixed(1)}" y2="${g.ly.toFixed(1)}" style="stroke:${g.col};stroke-width:1;opacity:.3"/>`;
    svg+=`<text x="${LX.toFixed(1)}" y="${(g.ly+LABF*0.35).toFixed(1)}" text-anchor="start" font-size="${LABF}" font-weight="700" font-family="var(--mono)" style="fill:${g.col};opacity:${Math.min(1,sh+0.12)};${_HALO2}">${g.lbl}</text>`;
  }
  // off-frame edge markers — same side split: ceilings right, floors left
  const edge=(e,i,yy,ar)=>{
    const sh=_DSHADE[Math.min(e.idx,2)], call=e.side==='c';
    const sd=(sg&&spot)?((e.k-spot)/sg):null;
    const sdT=(sd!=null&&isFinite(sd))?` ${sd>=0?'+':'−'}${Math.abs(sd).toFixed(1)}σ`:'';
    const lbl=`${call?'▲':'▼'} ${f(Math.round(e.k),0)}${sdT} · ${e.tags.join('·')}${e.itm?' · ITM':''}`;
    return `<text x="${(call?X.lineEnd-6:X.x0+6).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="${call?'end':'start'}" font-size="11" font-weight="700" font-family="var(--mono)" style="fill:${colOf(e)};opacity:${sh};${_HALO2}">${call?lbl+' '+ar:ar+' '+lbl}</text>`;
  };
  let hR=0,hL=0,lR=0,lL=0;
  hiE.forEach(e=>{ const c=e.side==='c'; svg+=edge(e,0,X.padT+13+(c?hR++:hL++)*LABH,'↑'); });
  loE.forEach(e=>{ const c=e.side==='c'; svg+=edge(e,0,X.H-X.padB-4-(c?lR++:lL++)*LABH,'↓'); });
  MAP.datedG.innerHTML=svg;
}
// The always-on overview strip. SPX→magnet chip = lead (where are we, where is the
// pull); the auto-gap before Gamma Balance splits the strip into live tape (left)
// vs dealer structure (right). The mold/regime chips died 07-10 (regime is shown
// three other ways: wash split, GAMMA FLIP line, vitals pill; the motion read
// lives on the motion tile); the structural Call Ceiling / Put Floor chips became
// wall LINES on the graph (Walls toggle) with on-line price+σ labels.
function gxOverview(){
  const el=document.getElementById('gx-strip'); if(!el) return;
  const sg=(D.sigma||1);
  const dMag=(D.magnet-D.spot)/sg, pts=Math.abs(D.magnet-D.spot), pullUp=dMag>=0;
  // N5: the WINDOWED tape leads when present — the day-cumulative can say "buyers" at
  // 15:30 on a day whose last 45 minutes were pure selling. Label carries the basis.
  const fv=(T.flowR!=null&&isFinite(T.flowR))?T.flowR:null;
  const fx=fv!=null?fv:D.flow, ftag=fv!=null?' now':' (day)';
  const flow=(fx>0.02?'buyers pressing':fx<-0.02?'sellers pressing':'flow balanced')+ftag;
  const tot=(D.gAbove+D.gBelow)||1, aP=Math.round(D.gAbove/tot*100);
  // DATED BOOK chips — one per expiration (front monthly → quarter-end), walls picked
  // moneyness-aware; nightly cadence, so the as-of/staleness stamp says "old by design"
  // rather than letting a quiet day read as broken.
  let datedChips='';
  const dd=(T&&T.dated!==undefined&&T.dated!==null)?T.dated:D.dated;   // T leads D by one frame at build time
  if(dd&&Array.isArray(dd.bands)){
    datedChips=dd.bands.slice(0,4).map(b=>{
      const w=_dwalls(b, D.spot||dd.spot_at_pull||0);
      // ITM tag rides the chip too (a jade ▲7,000 a thousand points BELOW spot must
      // never read as overhead resistance); "· OI" qualifies these as resting-OI
      // magnitude walls, same language as the structural floor/ceiling chips —
      // NOT a signed conviction (the sidecar deliberately ships unsigned).
      const cwT=w.cw!=null?`<span style="color:var(--jade)">▲${f(w.cw,0)}${w.cItm?' ITM':''}</span>`:'';
      const pwT=w.pw!=null?`<span style="color:var(--coral)">▼${f(w.pw,0)}${w.pItm?' ITM':''}</span>`:'';
      // per-band age: the quarterly rides a weekly cadence, so its pull can be days
      // older than the book while the book itself reads "fresh" — surface that.
      let age='';
      try{
        const a=String(b.as_of||'').slice(0,10);
        if(a&&dd.oi_date&&a<dd.oi_date){
          const n=Math.round((new Date(dd.oi_date)-new Date(a))/86400000);
          if(n>=1) age=` · ${n}d-old pull`;
        }
      }catch(e){}
      return `<span class="gx-chip"><b>${_dexp(b.expiry)}</b><i>${cwT} ${pwT} · ${b.dte}d · OI${age}</i></span>`;
    }).join('');
    // warn on the BOOK's age (a dead nightly job), not dd.staleness — H9 made
    // that read the oldest band, and the quarterly's weekly cadence is 1-6d old
    // by design (cadence must not read as breakage; per-band ages carry it)
    const bookAge=dd.stale_days;
    if(bookAge>=1) datedChips+=`<span class="gx-chip"><b>Dated Book</b><i>Stale ${bookAge}d · as of ${String(dd.oi_date||'')}</i></span>`;
  }
  // H9: a dropped book is LOUD — the silence after erasing the walls must not read
  // as "no walls today"
  if(!dd && GX_DHAD && GX_DGONE>10){
    datedChips+=`<span class="gx-chip" style="border-color:var(--coral);color:var(--coral)"><b>Dated Book GONE</b><i>walls erased · nightly sidecar not reporting</i></span>`;
  }
  // Walls toggle: the wall LINES layer (dated tenor walls + structural ceiling/floor,
  // labeled on-line with arrow + price + σ). Default On.
  const wallsChip=`<button type="button" class="gx-chip gx-toggle" onclick="toggleWalls()" aria-pressed="${wallsOn()}" title="Wall lines on the map: dated tenor walls + the structural Call Ceiling / Put Floor, labeled with price and σ-distance"><span class="gx-sw" aria-hidden="true"></span><span class="gx-tx"><b>Walls</b><i>${wallsOn()?'<span style="color:var(--jade)">On</span>':'Off'} · ceiling · floor · dated</i></span></button>`;
  // v2 toggle: the full per-strike dated OI slabs (only offered when a live
  // book has been fetched — no dead switches)
  const doiChip=(typeof datedOIAvail==='function'&&datedOIAvail())
    ? `<button type="button" class="gx-chip gx-toggle" onclick="toggleDatedOI()" aria-pressed="${datedOIOn()}" title="Per-strike dated net GEX (call−put, assumed-sign like the live bars; √ width), under the live gamma bars"><span class="gx-sw" aria-hidden="true"></span><span class="gx-tx"><b>Dated γ</b><i>${datedOIOn()?'<span style="color:var(--jade)">On</span>'+((t=>t?' · '+t:'')(_dglBands().map(_dglHead).join('·'))):'Off · strikes × expiry'}</i></span></button>`
    : '';
  // γ-scale toggle (07-12 ruling): LINEAR pure-net ÷ single max is the DEFAULT —
  // the only scale that keeps cross-strike magnitude honest (pins vs pushes at
  // true ratio). Log is the opt-in for reading the weak side through the 0DTE

  paintMap(); paintVitals();
  requestAnimationFrame(frame);
}
function setMode(live){
  LIVE=live; MODE=live?'live':'demo';

}
async function probeAndRun(){
  try{
    const L=await fetchRecent();
    if(!L) throw 0;
    if(GX.demoTimer){ clearInterval(GX.demoTimer); GX.demoTimer=null; }   // recovered → stop demo
    FEED.fails=0; FEED.lastOkAt=Date.now();
    setMode(true); feedAll(L); setTimeout(poll, FEED.pollMs);
    pollSpot();                                                   // the price streams on its own clock
    loadDiaryHistory(); setInterval(loadDiaryHistory, 1200000);   // fill the book's past pages; refresh every 20 min
    fetchDatedBook(); setInterval(fetchDatedBook, 1200000);       // dated OI book (changes only on the nightly pull)
  }catch(e){ setMode(false); if(!GX.demoTimer) GX.demoTimer=setInterval(nextTarget, 2600); setTimeout(probeAndRun, 5000); }   // keep retrying the live feed
}
function startLive(){
  buildVitals(); buildMap(); paintVitals(); updateTower();
  // once the chart cell is really laid out, refit the viewBox to it (kills the letterbox)
  const m0=measureChart(); if(m0 && (Math.abs(m0.w-_mapW)>8 || Math.abs(m0.h-_mapH)>8)){ buildMap(); }
  tickClock(); setInterval(tickClock,1000);
  requestAnimationFrame(frame);
  let rt=null;
  const ro=new ResizeObserver(()=>{ clearTimeout(rt); rt=setTimeout(()=>{
    const m=measureChart(); if(m && (Math.abs(m.w-_mapW)>8 || Math.abs(m.h-_mapH)>8)){ buildMap(); paintMap(); }
  },140); });
  ro.observe(document.getElementById('p-map'));
  probeAndRun();
}

function pill(st){ return `<span class="pill ${st[0]}"><span class="dot"></span>${st[1]}</span>`; }
function pipRow(n,on){ let h=''; for(let i=0;i<n;i++) h+=`<i class="${i<on?'on':''}"></i>`; return `<div class="pips">${h}</div>`; }

// one-pass schema highlighter: strings → .sv, keys → .sk, numbers/null/bool → .sn,
// a trailing // comment → .scm; everything else (braces, commas) keeps the quiet base ink.
function hlLine(raw){
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let cm=''; const ci=raw.indexOf('//');
  let code = ci>=0 ? raw.slice(0,ci) : raw;
  if(ci>=0) cm = `<span class="scm">${esc(raw.slice(ci))}</span>`;
  code = esc(code).replace(/"[^"]*"\s*:|"[^"]*"|(?:^|[\s{,\[])[A-Za-z_]\w*\s*:|-?\d+(?:\.\d+)?|\b(?:null|true|false)\b/g, tok=>{
    if(/^".*"\s*:$/.test(tok)) return tok.replace(/^("[^"]*")(\s*:)$/, '<span class="sk">$1</span>$2');
    if(tok[0]==='"') return `<span class="sv">${tok}</span>`;
    if(/:\s*$/.test(tok)) return tok.replace(/([A-Za-z_]\w*)(\s*:)$/, '<span class="sk">$1</span>$2');
    return `<span class="sn">${tok}</span>`;
  });
  return code + cm;
}

// ---- stack geometry: one shared deck-local z axis, z=0 = the glass floor ----
// Constants sized so a selected plane (scale 1.13 + 24px pop) keeps clear air inside the
// glass box (x ±170 vs sel ±162.7 · y ±112 vs ±105.1 · lid clears the popped top feed by
// 10px) and between planes. More boxed stacks later = more entries in the same z layout.
const STK = {PGAP:34, TGAP:56, BEAM:80, BOXPAD:28, BOXTOP:34, POP:24, W:288, D:186, BOXHW:170, BOXHD:112};
function stackGeo(){
  const FEEDS = LY.filter(l=>l.tier==='feed'), MAIN = LY.filter(l=>l.tier!=='feed');
  const z = new Map();
  FEEDS.forEach((l,i)=>z.set(l.id, STK.BOXPAD + i*STK.PGAP));
  const boxTop = STK.BOXPAD + (FEEDS.length-1)*STK.PGAP + STK.BOXTOP;
  const gaps=[]; let zc = boxTop + STK.BEAM;
  MAIN.forEach((l,i)=>{
    if(i>0){
      const tierBreak = l.tier!==MAIN[i-1].tier;
      zc += tierBreak ? STK.TGAP : STK.PGAP;
      if(tierBreak) gaps.push({z0:zc-STK.TGAP+10, z1:zc-10});
    }
    z.set(l.id, zc);
  });
  return {z, boxTop, zTop:zc, FEEDS, MAIN};
}

// fit + place the whole composition in the container, then align the rail brackets and the
// DATA FEEDS pill to the REAL projected positions (getBoundingClientRect of 3D children).
function layoutStacks(){
  const stacks=$("#stacks"), deck=$("#deck");
  if(!stacks || !deck || !deck._geo) return;
  const cs=getComputedStyle(stacks);
  const padL=parseFloat(cs.paddingLeft), padR=parseFloat(cs.paddingRight);
  const padT=parseFloat(cs.paddingTop),  padB=parseFloat(cs.paddingBottom);
  const w=stacks.clientWidth-padL-padR, h=stacks.clientHeight-padT-padB;
  if(w<80 || h<80) return;                       // hidden tab — the ResizeObserver re-fires on reveal
  const g=deck._geo;
  const SIN=0.8192, COS=0.5736, R=0.7071;        // rotateX(55) · rotateZ(-45)
  const diag=(STK.W/2+STK.D/2)*R, boxDiag=(STK.BOXHW+STK.BOXHD)*R;
  const upper=(g.zTop+STK.POP+16)*SIN + diag*COS;      // px above deck center at s=1 (popped top plane)
  const lower=boxDiag*COS;                              // glass floor (z=0) governs below
  const compH=upper+lower, compW=2*Math.max(diag*1.13, boxDiag)+16;
  const s=Math.min(1.1, h/compH, w/compW);
  deck.style.setProperty('--ds', s.toFixed(4));
  deck.style.left=(padL+w/2).toFixed(1)+'px';
  // 42% of the spare height above, the rest below → the feed box sits toward the bottom
  deck.style.top =(padT+(h-compH*s)*0.42+upper*s).toFixed(1)+'px';
  requestAnimationFrame(()=>{                    // measure AFTER the new transform paints
    const card=stacks.closest('.scene-card'); if(!card) return;
    const cardR=card.getBoundingClientRect(), sr=stacks.getBoundingClientRect();
    card.querySelectorAll('.cat[data-tier]').forEach(el=>{
      const rs=LY.filter(l=>l.tier===el.dataset.tier)
        .map(l=>deck.querySelector(`[data-id="${l.id}"]`)).filter(Boolean)
        .map(p=>p.getBoundingClientRect());
      if(!rs.length) return;
      const top=Math.min(...rs.map(r=>r.top))-cardR.top, bot=Math.max(...rs.map(r=>r.bottom))-cardR.top;
      el.style.top=(top-4).toFixed(0)+'px'; el.style.height=(bot-top+8).toFixed(0)+'px';
    });
    const fb=deck.querySelector('.gb.f-bot'), pill=$("#fblabel");
    if(fb && pill){
      const r=fb.getBoundingClientRect();
      pill.style.left=(r.left+r.width/2-sr.left).toFixed(0)+'px';
      pill.style.top =(r.bottom-sr.top-8).toFixed(0)+'px';
    }
  });
}

function renderLayers(){
  const shape = t => t==='lens' ? 'lens' : t==='processor' ? 'proc' : '';
  const tag = t => t==='lens' ? 'lens' : t==='processor' ? 'proc' : t==='feed' ? 'feed' : 'sensory';
  const planeHTML = (L,z,d) => `
    <div class="plane ${L.base?'base':''} ${shape(L.tier)} ${L.id===selLayer?'sel':''}" data-id="${L.id}" tabindex="0" role="button" aria-label="${L.name} — ${L.tier}"
         style="--c:var(${L.hue}); --z:${z.toFixed(1)}px; --d:${d.toFixed(2)}s">
      <span class="pn"><i class="ptag ${tag(L.tier)}" title="${L.tier}"></i>${L.num}</span><span class="pc">${L.name}</span>
    </div>`;
  const geo = stackGeo();
  const planes = LY.map((L,i)=>planeHTML(L, geo.z.get(L.id), i*0.07)).join('');
  // glass box faces — geometry derived from the SAME constants as the planes
  const hw=STK.BOXHW, hd=STK.BOXHD, bh=geo.boxTop, zc=bh/2;
  const glass = `<div class="glassbox" aria-hidden="true">
    <i class="gb f-bot" style="width:${2*hw}px;height:${2*hd}px;margin:${-hd}px 0 0 ${-hw}px;transform:translateZ(0px)"></i>
    <i class="gb f-n" style="width:${2*hw}px;height:${bh}px;margin:${-zc}px 0 0 ${-hw}px;transform:translateZ(${zc}px) rotateX(-90deg) translateZ(${-hd}px)"></i>
    <i class="gb f-s" style="width:${2*hw}px;height:${bh}px;margin:${-zc}px 0 0 ${-hw}px;transform:translateZ(${zc}px) rotateX(-90deg) translateZ(${hd}px)"></i>
    <i class="gb f-e" style="width:${bh}px;height:${2*hd}px;margin:${-hd}px 0 0 ${-zc}px;transform:translateZ(${zc}px) rotateY(90deg) translateZ(${hw}px)"></i>
    <i class="gb f-w" style="width:${bh}px;height:${2*hd}px;margin:${-hd}px 0 0 ${-zc}px;transform:translateZ(${zc}px) rotateY(90deg) translateZ(${-hw}px)"></i>
    <i class="gb f-top" style="width:${2*hw}px;height:${2*hd}px;margin:${-hd}px 0 0 ${-hw}px;transform:translateZ(${bh}px)"></i>
  </div>`;
  // beams: a vertical connector from z0 to z1 on the stack axis (element bottom = z0)
  const beamAt=(z0,z1,cls,inner='')=>{
    const len=z1-z0, c=(z0+z1)/2;
    return `<div class="beam ${cls}" aria-hidden="true" style="height:${len}px;margin-top:${-len/2}px;transform:translateZ(${c}px) rotateX(-90deg)">${inner}</div>`;
  };
  const flowBeam = beamAt(geo.boxTop, geo.boxTop+STK.BEAM, 'flow',
    '<s class="node n0"></s><s class="node n1"></s><b><i></i></b><b><i></i></b><b><i></i></b>');
  const tierBeams = (geo.gaps||[]).map(gp=>beamAt(gp.z0,gp.z1,'dots')).join('');
  const nShadow = LY.filter(l=>/shadow/.test(l.status[1])).length;
  $("#p-layers").innerHTML = `
    <div class="phead">
      <div><h2>Layers</h2><div class="desc">Data feeds → sensory layers → lenses → processor · tap any block for what it does</div></div>
      <span class="pill grey">Live since 2026-07-06 · 0 / ${nShadow} shadow layers promotion-ready</span>
    </div>
    <div class="layers3d">
      <div class="scene-card">
        <div class="scene-top"><span class="st">forward pass · feeds → processor</span><span class="st" style="color:var(--iris)">decision ↑</span></div>
        <div class="cat-rail">
          <div class="cat" data-tier="processor" style="top:6%;height:12%; --tc:var(--l-tower)"><i class="cat-ico proc"></i><span class="lbl">Processor</span></div>
          <div class="cat" data-tier="lens" style="top:21%;height:12%; --tc:var(--l-fade)"><i class="cat-ico lens"></i><span class="lbl">Lenses</span></div>
          <div class="cat" data-tier="sensory" style="top:36%;height:34%; --tc:var(--l-base)"><i class="cat-ico sensory"></i><span class="lbl">Sensory</span></div>
        </div>
        <div class="stack-scene" id="stacks">
          <div class="deck hassel" id="deck">${glass}${planes}${flowBeam}${tierBeams}</div>
          <span class="fb-label" id="fblabel">data feeds</span>
        </div>
        <div class="deckhint">tap a block</div>
      </div>
      <div class="detail" id="dt"></div>
    </div>`;
  const stacks=$("#stacks");
  stacks.addEventListener('click', e=>{ const p=e.target.closest('.plane'); if(p) selectLayer(p.dataset.id); });
  stacks.addEventListener('keydown', e=>{
    const p=e.target.closest('.plane'); if(!p) return;
    const idx=LY.findIndex(x=>x.id===p.dataset.id);
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectLayer(p.dataset.id); }
    else if(e.key==='ArrowUp' && idx<LY.length-1){ e.preventDefault(); const n=stacks.querySelector(`[data-id="${LY[idx+1].id}"]`); n.focus(); selectLayer(LY[idx+1].id); }
    else if(e.key==='ArrowDown' && idx>0){ e.preventDefault(); const n=stacks.querySelector(`[data-id="${LY[idx-1].id}"]`); n.focus(); selectLayer(LY[idx-1].id); }
  });
  $("#deck")._geo = geo;
  layoutStacks();
  if(window._stkRO) window._stkRO.disconnect();
  window._stkRO = new ResizeObserver(layoutStacks);
  window._stkRO.observe(stacks);
  renderDetail();
}

// ---------- DIARY (book · page 1 = newest → oldest to the right) ----------
let dpage = 0; // 0 = most recent DAY
const _enOpt = o => iso => new Date(iso+'T12:00:00').toLocaleDateString('en-US',o);
const enWeekday  = _enOpt({weekday:'long'});
const enMonthDay = _enOpt({month:'long', day:'numeric', year:'numeric'});
const enDateShort= _enOpt({weekday:'short', month:'short', day:'numeric'});
const rowTime = s => new Date(scanTs(s)).toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit', timeZone:PT});
function diaryDayGroups(){
  const byDay=new Map();
  const put=rows=>{ for(const s of rows){ const d=scanTs(s).slice(0,10); if(!byDay.has(d)) byDay.set(d,new Map()); byDay.get(d).set(scanTs(s), s); } };
  put(DIARY_ROWS); put(LIVEROWS);            // live rows overwrite history on the same timestamp (freshest wins)
  return [...byDay.keys()].sort().reverse().map(day=>({
    day, entries:[...byDay.get(day).values()].sort((a,b)=>scanTs(b).localeCompare(scanTs(a)))   // newest entry first
  }));
}
// One kid-level sentence translating the whole diary entry — what its JSON is really saying.
function childSentence(s){
  const g=gateStates(s).filter(x=>x.on).length, w=s.wt;
  const wd = w.dir==='call' ? 'bounce back up' : 'drop back down';
  const fd = s.fade.dir==='call' ? 'spring back up' : 'come back down';
  if(w.fired && !w.agrees)

  if(s.fade.fired && w.fired && w.agrees)
    return `The price stretched too far from the middle, so both robots agreed it should ${fd} and pointed the same way — a clean, matching call.`;
  if(w.votes && w.votes.agree < 0.6)
    return `The market was wiggly and hard to read, so the thinking robot shrugged and decided to sit still instead of guessing.`;
  if(g < 4 && !w.fired)
    return `A trade was starting to take shape but wasn’t ready yet, so everyone just watched and waited.`;
  return `Nothing much happened — the price sat calmly near a big wall, so both robots just watched and did nothing.`;

    `${i(2)}${K('direction')}: ${dir?S(dir):NU},${c('which way the fade leans — call = up, put = down')}`,
    `${i(2)}${K('runway_sigma')}: ${N(s.fade.runway)}, ${K('runway_ok')}: ${Bl(s.fade.runwayOk)}${c('gate 3 (runway): room to the magnet in σ — ok only when ≥ 0.35σ')}`,

    `${i(2)}${K('fired')}: ${Bl(s.wt.fired)}, ${K('direction')}: ${wdir?S(wdir):NU},${c('the tower’s own call, formed blind to the gates')}`,
    `${i(2)}${K('magnitude_sigma')}: ${N(s.wt.mag)},${c('expected move size in σ — this drives the ▶▶ NEXT read on the map')}`,
    `${i(2)}${K('conviction')}: ${N(s.wt.conv)},${c('share of votes that agreed = the conviction we actually trust')}`,

function rpPriceAt(ms){

function rpPriceDomain(){
  // Anchor the vertical scale on the PRICE PATH; let a level (magnet/flip/wall) stretch

  // wall clips to an edge chip instead of squashing the price action into a thin strip.
  let plo=Infinity,phi=-Infinity;
  for(const p of RP.path){ if(p.lo<plo)plo=p.lo; if(p.hi>phi)phi=p.hi; }
  if(!isFinite(plo)||!isFinite(phi)) for(const s of RP.scans){ if(s.spot!=null){ plo=Math.min(plo,s.spot); phi=Math.max(phi,s.spot); } }
  if(!isFinite(plo)||!isFinite(phi)){ plo=0; phi=1; }
  const span=phi-plo, band=Math.max(span*1.5, phi*0.006);
  let lo=plo, hi=phi;
  for(const s of RP.scans) for(const v of [s.magnet,s.flip,s.callWall,s.putWall]){
    if(v!=null&&isFinite(v)&&v>=plo-band&&v<=phi+band){ if(v<lo)lo=v; if(v>hi)hi=v; }
  }

const RP_LOCK_MIN=60;   // the follow-through mark that decides "leaned right / wrong" (move_60m)
// one plot-ready fire: authoritative outcome/excursions `g` when present, else a client walk
function rpMakeFire(scan, g, tgt, stp){
  const dir=scan.wt.dir, sign=dir==='call'?1:dir==='put'?-1:0;
  const entry=scan.spot, sigma=scan.sigma||1, t=+new Date(scanTs(scan));
  const target=tgt||RP_TARGET, stop=stp||RP_STOP, winEnd=Math.min(t+RP_HOLD_MIN*60000, RP.t1);
  const lockT=Math.min(t+RP_LOCK_MIN*60000, RP.t1);
  let outcome='scratch', mfe=0, mae=0, move60=null;
  if(g){ outcome=g.outcome; mfe=g.mfe??0; mae=g.mae??0; move60=(g.move60==null?null:g.move60); }
  else if(sign) for(const p of RP.path){          // client fallback: excursions + target-before-stop
    if(p.t<=t) continue; if(p.t>winEnd) break;
    const fav=sign*((sign>0?p.hi:p.lo)-entry)/sigma, adv=sign*((sign>0?p.lo:p.hi)-entry)/sigma;
    if(fav>mfe)mfe=fav; if(adv<mae)mae=adv;
    if(outcome==='scratch'){
      const tgtHit=sign>0?p.hi>=entry+target*sigma:p.lo<=entry-target*sigma;
      const stpHit=sign>0?p.lo<=entry-stop*sigma:p.hi>=entry+stop*sigma;
      if(tgtHit&&stpHit) outcome='loss'; else if(tgtHit) outcome='win'; else if(stpHit) outcome='loss';
    }
  }
  if(move60==null && sign) move60=+(sign*(rpPriceAt(lockT)-entry)/sigma).toFixed(3);   // 60-min follow-through
  return { scan, dir, sign, entry, sigma, t, lockT, outcome,
    mfe:+(+mfe).toFixed(2), mae:+(+mae).toFixed(2), move60,
    mag:scan.wt.mag, horMin:scan.wt.horizon||60 };
}
// headline verdict — did price go the way the tower called, by the 60-min mark?
// (win=leaned right/green, loss=leaned wrong/red, scratch=too flat to call/grey)
function rpVerdict(fr){
  const mv=fr.move60;
  if(mv!=null) return mv>=0.05?'win':mv<=-0.05?'loss':'scratch';
  if(fr.outcome==='win'||fr.outcome==='loss') return fr.outcome;
  const net=(fr.mfe||0)+(fr.mae||0); return net>=0.05?'win':net<=-0.05?'loss':'scratch';

function rpAssembleFires(graded){
  if(graded && graded.byTs.size){
    const byTs=new Map(RP.scans.filter(s=>s.ts).map(s=>[s.ts,s]));
    const out=[];
    for(const [ts,g] of graded.byTs){
      const scan=byTs.get(ts) || rpScanAtMs(+new Date(ts));
      if(scan && scan.wt && scan.wt.dir) out.push(rpMakeFire(scan, g, graded.target, graded.stop));
    }
    return out.sort((a,b)=>a.t-b.t);
  }
  return RP.scans.filter(s=>s.wt&&s.wt.fired&&s.wt.dir).map(s=>rpMakeFire(s, null));
}

  RP.els.dot =RP.els.chart.querySelector('#rp-dot');

const RP_ARR={up:'▲',down:'▼',flat:'–',none:'·'};
// Every layer's read at the current slice → the residual-stream snapshot the console draws (top→bottom,
// lenses then sensory). Directional layers get an up/down/flat arrow + an agree badge vs the Watchtower;
// context layers (Base, Range Ruler, Event Lens) carry a plain reading with no arrow. Null data = "not recorded".
function rpStream(s){
  const hb=(s.wt&&s.wt.fired&&s.wt.dir)?(s.wt.dir==='call'?'up':'down'):null;
  const dv=(x,p,n)=> x==null?'none': x>p?'up': x<n?'down':'flat';
  const rows=[];
  const push=(name,tier,dir,thought,has)=>{
    const directional=(dir==='up'||dir==='down');
    rows.push({name,tier,dir:dir||'none',thought,has:has!==false,
      agree:(has!==false&&directional&&hb)?(dir===hb):null});
  };
  // — lenses (nearest the processor) —
  const bactive=s.brk&&((s.brk.state&&s.brk.state!=='idle')||(s.brk.dir&&s.brk.dir!=='none'));
  const bd=s.brk&&s.brk.dir;
  push('Break Lens','lens', bactive?(bd==='call'?'up':bd==='put'?'down':'flat'):'flat',
    bactive?`${s.brk.state} · escape ${bd==='call'?'up':'down'}`:'idle · contained', !!s.brk);
  const fd=s.fade&&s.fade.dir;
  push('Fade Lens','lens', fd==='call'?'up':fd==='put'?'down':'flat',
    (s.fade&&(s.fade.armed||s.fade.fired))?`fade ${fd==='call'?'up':'down'}${s.fade.fired?' · fired':''}`:'no fade armed', !!s.fade);
  // — sensory (top → base) —
  const ev=s.evl;
  push('Event Lens','sensory','none',
    ev?(ev.kind?`${ev.kind}${ev.ratio!=null?` · ratio ${f(ev.ratio,2)}`:''}`:'no event today'):'not recorded this day', !!ev);
  const gr=s.groll;
  const grDir=gr&&gr.div?(gr.dir==='far_above'?'up':gr.dir==='far_below'?'down':'flat'):'flat';   // divergence_dir = far_above/far_below
  // N12: an ACCELERANT strike (net short γ) must never be worded as "the pin" —
  // on the live 07-10 mark both "pins" were net SHORT gamma (fuel, not defense)
  push('Gamma Roll','sensory', grDir,
    gr?(gr.div?(gr.kind==='accelerant'
        ?`0DTE mass at ${f(gr.zw,0)} is net SHORT γ — fuel, not a defended pin (structural wall ${f(gr.fw,0)})`
        :`pin may roll ${grDir==='up'?'up':grDir==='down'?'down':'sideways'}${gr.zw!=null&&gr.fw!=null?` (${f(gr.zw,0)}→${f(gr.fw,0)})`:''}`)
      :'walls aligned'):'not recorded this day', !!gr);
  const rr=s.rr;
  push('Range Ruler','sensory','none',
    rr&&rr.cons!=null?`${Math.round(rr.cons*100)}% of ±${f(rr.emo??rr.em,0)}pt budget used`:'not recorded this day', !!(rr&&rr.cons!=null));
  const sp=s.spd;
  const spDir=sp?(sp.jsign==='up'?'up':sp.jsign==='down'?'down':sp.down==null?'flat':sp.down>0.6?'down':sp.down<0.4?'up':'flat'):'none';   // jump-sign first, else semivar down-share
  push('Speedometer','sensory', spDir,
    sp?(sp.jsign?`jolt ${sp.jsign==='up'?'↑':'↓'}${sp.jz!=null?` · z ${f(sp.jz,1)}`:''}`:`${sp.pace!=null?`pace ${f(sp.pace,1)}×`:'running'}${sp.down!=null?(sp.down>0.6?' · downside heavy':sp.down<0.4?' · upside tilt':''):''}`):'not recorded this day', !!sp);
  const tilt=s.lob&&s.lob.tilt;
  push('Flow','sensory', dv(tilt,0.02,-0.02),
    tilt==null?'no book read':Math.abs(tilt)<0.02?'balanced tape':`${tilt>0?'buyers':'sellers'} leaning`, tilt!=null);
  const soft=s.motion&&s.motion.soft;
  push('Motion','sensory', soft==='up'?'up':soft==='down'?'down':(s.motion?'flat':'none'),
    s.motion?(soft==='up'?'path opens up':soft==='down'?'path opens down':'map holding'):'no read', !!s.motion);
  const dmag=(s.magnet!=null&&s.spot)?(s.magnet-s.spot)/(s.sigma||1):null;
  push('Gravity','sensory', dv(dmag,0.05,-0.05),
    dmag==null?'no read':Math.abs(dmag)<0.05?`at the magnet (${f(s.magnet,0)})`:`pull ${dmag>0?'up':'down'} → ${f(s.magnet,0)}`, dmag!=null);
  push('Base map','sensory','none',
    s.spot!=null?`spot ${f(s.spot,0)} · σ ${f(s.sigma,0)}${s.regime?` · ${s.regime}`:''}`:'—', s.spot!=null);
  return rows;
}
function rpReadout(now,t){

  const key=(s.ts||'-')+`|${t.win}|${t.loss}|${t.scr}|${t.live}|${curState}`;
  if(key===RP._rk) return; RP._rk=key;

    const conv=w.conv!=null?` · ${Math.round(w.conv*100)}% sure`:'';
    const vs=w.agrees===false?` <span class="rp-vs">overrides Fade</span>`:'';
    call=`<span class="who">🗼 Watchtower</span> · <span class="dir">${w.dir==='call'?'UP ▲':'DOWN ▼'}</span> · ${sig(w.mag)}${conv}${vs}`;

    `<i class="rp-wt-mark"></i>`+
    `<div class="rp-wt-main"><div class="rp-wt-call">${call}</div><div class="rp-wt-scene">“${scene}”</div></div>`+
    `<div class="rp-wt-side">${verdict}<span class="rp-wt-rec">today ${t.win}–${t.loss}${dec?` · ${Math.round(100*t.win/dec)}%`:''}</span></div>`;
  // --- the layer stream + how it aligned ---
  const stream=rpStream(s);
  RP.els.stream.innerHTML=stream.map(r=>{
    const badge=r.agree===true?`<span class="rp-lbadge y">✓</span>`:r.agree===false?`<span class="rp-lbadge n">·</span>`:`<span class="rp-lbadge"></span>`;
    return `<div class="rp-cell${r.agree===true?' agree':''}${!r.has?' nodata':''}">`+
      `<div class="rp-cell-top"><i class="rp-lmark ${r.tier}"></i><span class="rp-lname">${r.name}</span>`+
      `<span class="rp-larr ${r.dir}">${RP_ARR[r.dir]}</span>${badge}</div>`+
      `<div class="rp-lthought">${r.thought}</div></div>`;
  }).join('');
  const dirs=stream.filter(r=>r.has&&(r.dir==='up'||r.dir==='down'));
  const up=dirs.filter(r=>r.dir==='up').length, down=dirs.filter(r=>r.dir==='down').length;
  const tally=`<span class="up">${up}▲</span> / <span class="dn">${down}▼</span>`;
  if(hbDir){
    const withMaj=hbDir==='up'?up>=down:down>=up;
    RP.els.consensus.innerHTML=`Stack leans ${tally} — the Watchtower went <b>${hbDir==='up'?'UP':'DOWN'}</b>, `+
      (withMaj?`with the stack.`:`<b style="color:var(--coral)">against the stack.</b>`);
  } else RP.els.consensus.innerHTML=`Stack leans ${tally} — the Watchtower stood aside.`;
}
