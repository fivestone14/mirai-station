  try{ const res=await fetch(`/api/raw/file?root=state&path=reversion/bars/${day}-SPX.json&limit=1000`,{cache:'no-store'});
    const d=await res.json(); RP.barsCache[day]=(d&&d.kind==='json'&&Array.isArray(d.data))?d.data:null; }
  catch(e){ RP.barsCache[day]=null; }
  return RP.barsCache[day];
}
async function rpLoadDay(di){
  if(!RP.days.length) return;
  RP.di=Math.max(0,Math.min(RP.days.length-1,di));
  const D0=RP.days[RP.di];
  RP.scans=D0.scans;
  RP.t0=+new Date(D0.day+'T09:30:00-04:00'); RP.t1=+new Date(D0.day+'T16:00:00-04:00');
  RP.playing=false; RP.pos=0; RP.last=0; rpSyncPlayBtn(); rpUpdateDayNav();
  RP.bars=await rpFetchBars(D0.day);
  if(RP.days[RP.di]!==D0) return;            // day changed while awaiting — abort this load
  RP.path=rpPricePath();
  const graded=await rpFetchGraded(D0.day);
  if(RP.days[RP.di]!==D0) return;
  RP.fires=rpAssembleFires(graded);
  // ts → fire, built HERE and not inside rpBuild(): rpBuild measures the chart and bails
  // when it is hidden, so in table view the map would otherwise keep the PREVIOUS day's
  // keys and every row would fall back to "held".
  RP.fireByTs=new Map(RP.fires.filter(f=>f.scan&&f.scan.ts).map(f=>[f.scan.ts,f]));
  rpBuild(); rpPaint();
  // the chart is hidden in table view, so rpBuild/rpPaint can't measure — redraw the table itself
  if(RP.view==='table') rpRenderTable();
}
/* ================= Replay TABLE view =================
   The chart answers "what shape was the day?"; the table answers "what was every lens
   actually SAYING at the moment the tower spoke?" — one row per judged scan, one column
   per lens, each cell an arrow (which way it pointed) plus the number behind it.

   Two columns carry a "was blind" tag: SHOVE and SPEED were computed on every scan since
   the Break Lens build and never reached the Watchtower prompt until wt-6/m8 (2026-07-13),
   the day all five of its CALLs fired into the absorbing side of the book and all five lost.
   The tag stays until the wt-6 record is long enough to retire it — it is the whole reason
   this table exists: a reading nobody can see is a reading nobody uses. */
const rpArrow = d => d==='up'   ? '<span class="rp-arw rp-up">▲</span>'
                   : d==='down' ? '<span class="rp-arw rp-dn">▼</span>'
                   : d==='flat' ? '<span class="rp-arw rp-fl">–</span>'
                   :              '<span class="rp-arw rp-fl">·</span>';
const rpSig = (v,d=2) => (v==null||!isFinite(v)) ? '·' : (v>=0?'+':'')+(+v).toFixed(d);

/* which way is dealer hedging leaning? The shove test re-prices net dealer gamma at spot ±
   a flow shove: the LOWER (more negative) margin is the side that goes/stays SHORT gamma,
   where hedging pushes WITH the move — the ACCELERANT side. The other side absorbs. */
function rpAccelSide(s){
  const u=s.shove&&s.shove.up, d=s.shove&&s.shove.down;
  if(u==null||d==null||!isFinite(u)||!isFinite(d)) return null;
  if(Math.abs(u-d)<0.15) return null;                    // symmetric — do not manufacture an edge
  return d<u ? 'down' : 'up';
}
function rpTableRows(){
  // judged scans only — the slices where the tower actually looked
  return RP.scans.filter(s => s.wt && (s.wt.scene || s.wt.dir) && !s.wt.skipped);
}
function rpRenderTable(){
  const T=RP.els&&RP.els.table; if(!T) return;
  const rows=rpTableRows();
  if(!rows.length){ T.innerHTML=`<tbody><tr><td class="rp-sm" style="padding:22px">No judged scans on this day.</td></tr></tbody>`; return; }
  const head=`<thead><tr>
    <th class="rp-tcol">Time · PT<span class="nw" style="color:var(--ink-faint)">ET below</span></th>
    <th>Spot</th><th>Gamma</th><th>Magnet</th>
    <th>Shove<span class="nw">the book's slope</span></th>
    <th>Speed<span class="nw">who owns the motion</span></th>
    <th>Soft side</th><th>Break lens</th><th>Fade lens</th>
    <th>Gap</th><th>VWAP</th><th>Flow</th><th>Verdict</th><th>60m</th>
  </tr></thead>`;
  const body=rows.map(s=>{
    const fr=RP.fireByTs?RP.fireByTs.get(s.ts):null;
    const vd=fr?(fr.verdict||rpVerdict(fr)):null;                     // win / loss / scratch
    const cls=vd==='win'?'win':vd==='loss'?'loss':'';

    // gamma sign — the master switch (long = damped/pin, short = amplified/breakout)
    const gam=s.sign==='negative'?'<span class="rp-pill dn">short</span>'
            :s.sign==='positive'?'<span class="rp-pill up">long</span>'
            :'<span class="rp-pill mute">unknown</span>';

    // magnet: which side of spot the pull sits on (a LOCATION only, under short gamma)
    const md=(s.magnet==null||s.spot==null)?null
            :s.magnet>s.spot+2?'up':s.magnet<s.spot-2?'down':'flat';

    const acc=rpAccelSide(s);
    const shove=acc
      ? `${rpArrow(acc)} <span class="rp-sm">${rpSig(s.shove.down)}↓ ${rpSig(s.shove.up)}↑</span>`
      : `${rpArrow(null)} <span class="rp-sm">symmetric</span>`;

    const dn=s.spd&&s.spd.q==='ok'?s.spd.down:null;
    const speed=dn==null?rpArrow(null)
      : `${rpArrow(dn>=0.6?'down':dn<=0.4?'up':'flat')} <span class="rp-sm">${Math.round(dn*100)}% sell</span>`;

    const soft=(s.motion&&s.motion.soft)
      ? `${rpArrow(s.motion.soft)} <span class="rp-sm">${s.motion.above!=null?(s.motion.above*100).toFixed(1)+'%':''}</span>`
      : rpArrow(null);

    // COCKED IS NOT FIRED — a cocked break is a WATCH level, never a direction taken
    const bs=s.brk&&s.brk.state;
    const brk = bs==='cocked' ? `<span class="rp-pill warn">cocked ${s.brk.dir!=='none'?s.brk.dir:''}</span>`
              : s.brk&&s.brk.fired ? `<span class="rp-pill up">FIRED ${s.brk.dir!=='none'?s.brk.dir:''}</span>`
              : bs==='expired' ? '<span class="rp-pill mute">expired</span>'
              : '<span class="rp-pill mute">idle</span>';

    const fade = s.fade&&s.fade.armed
      ? `<span class="rp-pill warn">armed ${s.fade.dir!=='none'?s.fade.dir:''}</span>` +
        `<span class="rp-sm"> ${s.fade.runwayOk?'runway ok':'no runway'}</span>`
      : '<span class="rp-pill mute">idle</span>';

    const flow=(s.flow==null||Math.abs(s.flow)<0.05)
      ? `${rpArrow('flat')} <span class="rp-sm">flat</span>`
      : `${rpArrow(s.flow>0?'up':'down')} <span class="rp-sm">${rpSig(s.flow)}</span>`;

    // verdict + the rail: did the tower fire INTO the side the book was built to swallow?
    let verdict='<span class="rp-vd stand">stand down</span>', against=false;
    if(s.wt.dir){
      const want=s.wt.dir==='call'?'up':'down';
      against=!!acc && acc!==want;
      const cv=s.wt.convStated!=null?s.wt.convStated:s.wt.conv;
      verdict=`<span class="rp-vd ${s.wt.dir}">${s.wt.dir.toUpperCase()}</span>`
            + `<span class="rp-sm"> ${cv!=null?(+cv).toFixed(2):''}</span>`;
    }
    /* FRESH vs HELD. The paper resolver grades only a FRESH would-fire: when the tower
       keeps the same direction across scans it is HOLDING one thesis, not opening a new
       trade. Grading every repeat would double-count a standing call (07-13 reads as
       "14 verdicts" per-scan but is 7 fresh trades on the ledger). A held row shows the
       call it is still carrying and says so — it never borrows a grade it didn't earn. */
    const mv=fr?fr.move60:null;
    const mark=vd==='win'?'<span class="rp-up">✓</span>':vd==='loss'?'<span class="rp-dn">✗</span>':'';
    // a fire inside the last hour has no 60-min mark yet — say so, never print a "·σ" move
    const m60 = (fr && mv!=null) ? `<span class="${mv<0?'rp-dn':'rp-up'}">${rpSig(mv)}σ</span> ${mark}`
              : fr ? '<span class="rp-sm">no 60m yet</span>'
              : s.wt.dir ? '<span class="rp-pill mute">held</span>'
              : '';

    const gapC=s.fade&&s.fade.gap!=null&&s.fade.gap<0?'rp-dn':'';
    const vwpC=s.fade&&s.fade.vwap!=null&&s.fade.vwap<0?'rp-dn':'';
    return `<tr class="${cls}" data-ts="${s.ts||''}">
      <td class="rp-tcol">${rpClock(+new Date(s.ts))}<span class="et">${rpClockET(+new Date(s.ts))} ET</span></td>
      <td class="num">${s.spot!=null?Math.round(s.spot):'·'}</td>
      <td>${gam}</td>
      <td>${rpArrow(md)} <span class="rp-sm">${s.magnet!=null?Math.round(s.magnet):''}</span></td>
      <td>${shove}</td><td>${speed}</td><td>${soft}</td><td>${brk}</td><td>${fade}</td>
      <td class="num ${gapC}">${rpSig(s.fade&&s.fade.gap)}</td>
      <td class="num ${vwpC}">${rpSig(s.fade&&s.fade.vwap)}</td>
      <td>${flow}</td>
      <td class="${against?'against':''}">${verdict}</td>
      <td class="num">${m60}</td>
    </tr>`;
  }).join('');
  T.innerHTML=head+`<tbody>${body}</tbody>`;
  // A row is a moment: clicking it moves the PLAYHEAD there and STAYS in the table.
  // (It used to bounce you back to the chart — a view switch nobody asked for. Picking a
  // row is a scrub, not a change of view; the toggle is the only thing that changes views.)
  T.querySelectorAll('tbody tr[data-ts]').forEach(tr=>{
    tr.onclick=()=>{
      const ts=tr.dataset.ts; if(!ts) return;
      const f=(+new Date(ts)-RP.t0)/((RP.t1-RP.t0)||1);
      RP.pos=Math.max(0,Math.min(1,f)); RP.playing=false;
      if(RP.els.scrub) RP.els.scrub.value=Math.round(RP.pos*1000);   // keep the scrubber honest
      rpSyncPlayBtn(); rpPaint();          // rpPaint marks the row and re-times the chart underneath
    };
  });
  rpMarkTableAt();
}
// keep the table's "you are here" band in step with the playhead
function rpMarkTableAt(){
  const T=RP.els&&RP.els.table; if(!T||RP.view!=='table') return;
  const now=RP.t0+(RP.t1-RP.t0)*RP.pos;
  let best=null;
  T.querySelectorAll('tbody tr[data-ts]').forEach(tr=>{
    tr.classList.remove('at');
    const t=+new Date(tr.dataset.ts);
    if(t<=now && (!best || t>+new Date(best.dataset.ts))) best=tr;
  });
  if(best) best.classList.add('at');
}
function rpSetView(v){
  RP.view=(v==='table')?'table':'chart';
  const E=RP.els; if(!E) return;
  const tbl=RP.view==='table';
  E.chart.hidden=tbl; E.controls.hidden=tbl; E.console.hidden=tbl; E.legend.hidden=tbl;
  E.tablewrap.hidden=!tbl;
  E.vChart.classList.toggle('on',!tbl); E.vTable.classList.toggle('on',tbl);
  E.vChart.setAttribute('aria-selected', String(!tbl));
  E.vTable.setAttribute('aria-selected', String(tbl));
  const on=tbl?E.vTable:E.vChart;
  E.thumb.style.left=on.offsetLeft+'px'; E.thumb.style.width=on.offsetWidth+'px';
  if(tbl) rpRenderTable(); else requestAnimationFrame(()=>{ if(RP.path){ rpBuild(); rpPaint(); } });
}
function rpEnsureDom(){
  if(RP.els) return;
  const p=document.getElementById('p-replay');
  p.innerHTML=`
    <div class="phead">
      <div><h2>Replay</h2><div class="desc">How each Watchtower call played out · Pacific time</div></div>
      <div class="rp-head-nav">
        <div class="rp-viewtog" id="rp-viewtog" role="tablist" aria-label="Replay view">
          <div class="thumb" id="rp-thumb"></div>
          <button id="rp-view-chart" class="on" role="tab" aria-selected="true">${RP_ICON_CHART}Chart</button>
          <button id="rp-view-table" role="tab" aria-selected="false">${RP_ICON_TABLE}Table</button>
        </div>
        <button class="rp-daybtn" id="rp-newer" title="Newer day">‹</button>
        <div class="rp-daylabel" id="rp-daylabel">—</div>
        <button class="rp-daybtn" id="rp-older" title="Older day">›</button>
      </div>
    </div>
    <div class="chartcard" id="rp-chart"></div>
    <div class="rp-controls">
      <button class="rp-play" id="rp-play" aria-label="Play">${RP_ICON_PLAY}</button>
      <button class="rp-speed" id="rp-speed">1×</button>
      <input class="rp-scrub" id="rp-scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub time"/>
      <div class="rp-time" id="rp-time">—</div>
    </div>
    <div class="rp-tablewrap" id="rp-tablewrap" hidden>
      <div class="rp-tablescroll"><table class="rp-table" id="rp-table"></table></div>
      <div class="rp-tfoot">
        <span><b>Row</b> = one judged scan · click to move the playhead there</span>
        <span><b class="rp-arw rp-dn">↓</b>/<b class="rp-arw rp-up">↑</b> where that lens pointed</span>
        <span><b>Shove</b> which way dealer hedging FEEDS the move</span>
        <span><b>Speed</b> share of today's motion that was selling</span>
        <span><b style="color:var(--coral)">▎</b> fired into the side the book absorbs</span>
        <span><b>60m</b> follow-through in σ, one hour on</span>
        <span><b>held</b> = still carrying the same call (not a new trade — the ledger grades fresh fires only)</span>
      </div>
    </div>
    <div class="rp-console">
      <div class="rp-wt-head" id="rp-wt-head"></div>
      <div class="rp-consensus" id="rp-consensus"></div>
      <div class="rp-stream" id="rp-stream"></div>
    </div>
    <div class="rp-legend">
      <span class="k">the stack now → 🗼 the Watchtower's call · ✓ = layer backs it · ▲up ▼down –flat ·context</span>
      <span class="k">markers +1h:</span>
      <span><i style="background:var(--jade)"></i>right</span>
      <span><i style="background:var(--coral)"></i>wrong</span>
      <span><i style="background:var(--lantern)"></i>live</span>
    </div>`;
  RP.els={ chart:p.querySelector('#rp-chart'), play:p.querySelector('#rp-play'), speed:p.querySelector('#rp-speed'),
    scrub:p.querySelector('#rp-scrub'), time:p.querySelector('#rp-time'),
    wthead:p.querySelector('#rp-wt-head'), consensus:p.querySelector('#rp-consensus'), stream:p.querySelector('#rp-stream'),
    dayLabel:p.querySelector('#rp-daylabel'), newer:p.querySelector('#rp-newer'), older:p.querySelector('#rp-older'),
    controls:p.querySelector('.rp-controls'), console:p.querySelector('.rp-console'), legend:p.querySelector('.rp-legend'),
    tablewrap:p.querySelector('#rp-tablewrap'), table:p.querySelector('#rp-table'), thumb:p.querySelector('#rp-thumb'),
    vChart:p.querySelector('#rp-view-chart'), vTable:p.querySelector('#rp-view-table') };
  RP.els.vChart.onclick=()=>rpSetView('chart');
  RP.els.vTable.onclick=()=>rpSetView('table');
  RP.els.play.onclick=rpTogglePlay;
  RP.els.speed.onclick=rpCycleSpeed;
  RP.els.scrub.oninput=()=>{ RP.playing=false; rpSyncPlayBtn(); RP.pos=(+RP.els.scrub.value)/1000; rpPaint(); };
  RP.els.newer.onclick=()=>{ if(RP.di>0) rpLoadDay(RP.di-1); };
  RP.els.older.onclick=()=>{ if(RP.di<RP.days.length-1) rpLoadDay(RP.di+1); };
  let rt=null; const ro=new ResizeObserver(()=>{ clearTimeout(rt); rt=setTimeout(()=>{
    if(RP.view==='chart' && RP.path){ rpBuild(); rpPaint(); }
    const on=RP.view==='table'?RP.els.vTable:RP.els.vChart;   // the thumb tracks its button
    RP.els.thumb.style.left=on.offsetLeft+'px'; RP.els.thumb.style.width=on.offsetWidth+'px';
  },140); });
  ro.observe(p);
  // seat the toggle thumb once the buttons have been laid out (offsetWidth is 0 before that)
  requestAnimationFrame(()=>rpSetView(RP.view||'chart'));
}
function rpEmpty(){ RP.els.chart.innerHTML=`<div class="rp-empty">No recorded sessions with Watchtower data yet.</div>`;
  RP.els.dayLabel.textContent='—'; RP.els.time.textContent='—';
  RP.els.wthead.innerHTML=''; RP.els.consensus.innerHTML=''; RP.els.stream.innerHTML='';
  // the table must empty with everything else — otherwise the last day's grid sits there
  // looking like live data on a day that has none
  RP.fires=[]; RP.fireByTs=new Map();
  RP.els.table.innerHTML=`<tbody><tr><td class="rp-sm" style="padding:22px">No recorded sessions with Watchtower data yet.</td></tr></tbody>`; }
// (re)build the day list, preserving the selected day across refreshes
function rpSyncDays(reload){
  const prev=RP.days[RP.di]&&RP.days[RP.di].day, wasEmpty=!RP.days.length;
  rpBuildDays();
  if(!RP.days.length){ rpEmpty(); return; }
  let di=0; if(prev){ const j=RP.days.findIndex(d=>d.day===prev); if(j>=0) di=j; }
  RP.di=di;
  if(reload||wasEmpty) rpLoadDay(di); else rpUpdateDayNav();
}
function initReplay(){ rpEnsureDom(); rpSyncDays(true); }

// ---------- tabs ----------
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.panel===name));
  if(name==='replay'){ if(!RP.els) initReplay();
    else requestAnimationFrame(()=>{ rpSetView(RP.view); if(RP.view==='chart'&&RP.path){ rpBuild(); rpPaint(); } }); }
  if(name==='map') requestAnimationFrame(()=>{ buildMap(); paintMap(); });
}
$("#rail").addEventListener("click", e=>{ const b=e.target.closest(".tab"); if(b) switchTab(b.dataset.tab); });

// ---------- boot ----------
renderLayers(); renderDiary(false); renderHeads(); startLive();
const _modal=document.getElementById('modal');
_modal.addEventListener('click', e=>{ if(e.target===_modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
