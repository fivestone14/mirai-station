    font-family:var(--serif); font-size:12px; line-height:1.42; color:var(--ink)}
  /* Sweep Ledger · area shading — the integral DRAWN. Per sweep call, the region between
     the price path and its entry level: jade where price sat on the called side, coral
     where against. Green area minus red area = the call's signed score; the thin dashed
     baseline is the entry the slices are measured from. Subtle, under the price path. */
  .rp-swp-fav{fill:var(--jade); opacity:.14}
  .rp-swp-adv{fill:var(--coral); opacity:.14}
  .rp-swp-base{stroke:var(--ink-dim); stroke-width:1; stroke-dasharray:2 3; opacity:.55}
  /* controls */
  .rp-controls{display:flex; align-items:center; gap:14px; margin-top:14px; flex:0 0 auto}
  .rp-play{appearance:none; cursor:pointer; width:52px; height:52px; border-radius:50%; border:0; background:var(--iris); color:var(--ground); display:grid; place-items:center; flex:none; box-shadow:0 3px 14px -3px rgba(0,0,0,.55); transition:.15s}
  .rp-play:hover{filter:brightness(1.08)}
  .rp-play:active{transform:scale(.94)}
  .rp-play svg{width:23px; height:23px; fill:currentColor}
  .rp-speed{appearance:none; cursor:pointer; border:1px solid var(--hairline); background:var(--surface-2); color:var(--ink-dim); font-family:var(--mono); font-size:13.5px; font-weight:700; padding:0 14px; height:40px; border-radius:10px; flex:none; min-width:52px; transition:.15s}
  .rp-speed:hover{color:var(--iris); border-color:var(--iris-dim)}
  .rp-scrub{flex:1; -webkit-appearance:none; appearance:none; height:8px; border-radius:5px; background:var(--surface-3); outline:none; cursor:pointer}
  .rp-scrub::-webkit-slider-thumb{-webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--iris); border:3px solid var(--surface); box-shadow:0 1px 7px rgba(0,0,0,.55)}
  .rp-scrub::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:var(--iris); border:3px solid var(--surface)}
  .rp-time{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:15px; font-weight:600; color:var(--ink); min-width:74px; text-align:right; flex:none}
  @keyframes rp-scene-in{from{opacity:0; transform:translateY(3px)} to{opacity:1; transform:none}}
  .rp-legend{display:flex; align-items:center; gap:14px; margin-top:10px; font-size:11px; color:var(--ink-faint); flex-wrap:wrap; flex:0 0 auto}
  .rp-legend span{display:flex; align-items:center; gap:6px}
  .rp-legend i{width:10px; height:10px; border-radius:50%; display:inline-block}
  .rp-legend .k{color:var(--ink-dim)}

  /* ---- Replay VIEW TOGGLE: chart or table. Deliberately loud — a segmented control with a
     moving thumb, sat in the panel head where the eye lands first. The two views answer
     different questions (the chart = shape of the day, the table = the readings behind
     every call), so the switch must never be a thing you have to hunt for. ---- */
  /* The toggle SWAPS the view, it does not stack it. `[hidden]` is only a UA rule
     (display:none) and every panel here carries an AUTHOR display (.chartcard is grid,
     .rp-controls/.rp-console/.rp-legend/.rp-tablewrap are flex) — author beats UA, so
     hidden was a no-op and both views rendered at once. This wins it back. */
  #p-replay [hidden]{display:none !important}
  .rp-viewtog{display:inline-flex; align-items:center; gap:2px; padding:3px; border-radius:11px;
    background:var(--surface-3); border:1px solid var(--hairline-2); position:relative}
  .rp-viewtog button{position:relative; z-index:1; display:flex; align-items:center; gap:6px;
    padding:6px 14px; border:0; border-radius:8px; background:transparent; cursor:pointer;
    font:600 12px/1 var(--sans,inherit); letter-spacing:.02em; color:var(--ink-faint);
    transition:color .18s ease}
  .rp-viewtog button svg{width:14px; height:14px; fill:currentColor}
  .rp-viewtog button:hover{color:var(--ink-dim)}
  .rp-viewtog button.on{color:var(--ground)}
  .rp-viewtog .thumb{position:absolute; z-index:0; top:3px; bottom:3px; border-radius:8px;
    background:var(--iris,#8B9CFF); box-shadow:0 1px 6px rgba(0,0,0,.28);
    transition:left .2s cubic-bezier(.4,0,.2,1), width .2s cubic-bezier(.4,0,.2,1)}
  @media (prefers-reduced-motion:reduce){ .rp-viewtog .thumb{transition:none} }
  .rp-viewtog button:focus-visible{outline:2px solid var(--iris,#8B9CFF); outline-offset:2px}

  /* ---- Replay TABLE: every judged scan as a row, every lens as a column ---- */
  .rp-tablewrap{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
    background:var(--surface-2); border:1px solid var(--hairline); border-radius:16px; overflow:hidden}
  .rp-tablescroll{overflow:auto; overscroll-behavior:contain; min-height:0}
  /* sized for the tablet (2026-07-18): the table view has vertical room to spare, so
     the data type runs larger — the horizontal budget is held by trimming cell side
     padding, so everything still fits without a sideways scroll */
  .rp-table{border-collapse:separate; border-spacing:0; width:100%; font-size:15.5px}
  .rp-table th,.rp-table td{padding:12px 10px; text-align:left; white-space:nowrap;
    border-bottom:1px solid var(--hairline)}
  .rp-table thead th{position:sticky; top:0; z-index:3; background:var(--surface-3);
    font:600 11.5px/1.35 var(--mono); letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-faint); border-bottom:1px solid var(--hairline-2)}
  .rp-table thead th .nw{display:block; color:var(--iris,#8B9CFF); font-size:9.5px; letter-spacing:.08em}
  /* the time column is the row's anchor — it stays put while the lenses scroll past it */
  .rp-table th.rp-tcol,.rp-table td.rp-tcol{position:sticky; left:0; z-index:2;
    box-shadow:1px 0 0 var(--hairline)}
  .rp-table th.rp-tcol{z-index:4}
  .rp-table td.rp-tcol{background:var(--surface-2); font-family:var(--mono);
    font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600}
  .rp-table td.rp-tcol .et{display:block; font-size:11.5px; font-weight:400; color:var(--ink-faint)}
  /* the row tint must be BAKED onto the sticky cell too, or rows slide under it and lose colour */
  .rp-table tr.win  td{background:var(--jade-wash)}
  .rp-table tr.loss td{background:var(--coral-wash)}
  .rp-table tr.win  td.rp-tcol{background:linear-gradient(var(--jade-wash),var(--jade-wash)),var(--surface-2)}
  .rp-table tr.loss td.rp-tcol{background:linear-gradient(var(--coral-wash),var(--coral-wash)),var(--surface-2)}
  .rp-table tbody tr{cursor:pointer}
  .rp-table tbody tr:hover td{background:var(--surface-3)}
  .rp-table tbody tr:hover td.rp-tcol{background:linear-gradient(var(--surface-3),var(--surface-3)),var(--surface-2)}
  .rp-table tbody tr.at td{box-shadow:inset 0 1px 0 var(--iris,#8B9CFF), inset 0 -1px 0 var(--iris,#8B9CFF)}
  .rp-table td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-dim)}
  .rp-arw{font-family:var(--mono); font-weight:700; font-size:15px}
  .rp-up{color:var(--jade)} .rp-dn{color:var(--coral)} .rp-fl{color:var(--ink-faint)}
  .rp-sm{font-family:var(--mono); font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
  .rp-pill{display:inline-block; font:600 11px/1.5 var(--mono); letter-spacing:.05em;
    text-transform:uppercase; padding:2.5px 8px; border-radius:5px}
  .rp-pill.up{background:var(--jade-wash); color:var(--jade)}
  .rp-pill.dn{background:var(--coral-wash); color:var(--coral)}
  .rp-pill.warn{background:var(--lantern-wash); color:var(--lantern)}
  .rp-pill.mute{background:var(--surface-3); color:var(--ink-faint)}
  .rp-vd{font:700 13.5px/1 var(--mono); letter-spacing:.05em}
  .rp-vd.call{color:var(--jade)} .rp-vd.put{color:var(--coral)}
  .rp-vd.stand{color:var(--ink-faint); font-weight:500}
  /* the rail that says: this call was fired INTO the side the book was built to swallow */
  .rp-table td.against{box-shadow:inset 3px 0 0 var(--coral)}
  /* the SIEGE column — the second deck's data, set apart from the main-stack lenses by
     its own left rule + hue (wt-7). Reversed-sign pills: SIEGE = expect BREAK (deck
     orange), QUIET = expect HOLD (jade calm). */
  .rp-table th.rp-sgcol,.rp-table td.rp-sgcol{border-left:1px solid color-mix(in srgb,var(--l-seffort) 40%, var(--hairline))}
  .rp-table thead th.rp-sgcol .nw{color:color-mix(in srgb,var(--l-seffort) 85%, var(--ink-faint))}
  /* the call group opens with its own quiet rule, mirroring the siege column's;
     an against-rail cell turns that rule coral so the two edges never smudge */
  .rp-table th.rp-callcol,.rp-table td.rp-callcol{border-left:1px solid color-mix(in srgb,var(--l-tower) 30%, var(--hairline))}
  .rp-table td.rp-callcol.against{border-left-color:var(--coral)}
  /* THE CALL stays on screen: Verdict + 60m pin to the right edge (mirror of the sticky
     Time column) while the main stack scrolls beneath. The 60m column's width is FIXED
     so the Verdict offset stays exact; backgrounds are baked like the tcol's so the
     win/loss row tints survive the overlap. */
  .rp-table th.rp-60col,.rp-table td.rp-60col{position:sticky; right:0; z-index:2;
    width:140px; min-width:140px; max-width:140px; overflow:hidden}
  .rp-table th.rp-callcol,.rp-table td.rp-callcol{position:sticky; right:140px; z-index:2}
  .rp-table td.rp-callcol,.rp-table td.rp-60col{background:var(--surface-2)}
  .rp-table thead th.rp-callcol,.rp-table thead th.rp-60col{z-index:4}
  .rp-table tr.win td.rp-callcol,.rp-table tr.win td.rp-60col{background:linear-gradient(var(--jade-wash),var(--jade-wash)),var(--surface-2)}
  .rp-table tr.loss td.rp-callcol,.rp-table tr.loss td.rp-60col{background:linear-gradient(var(--coral-wash),var(--coral-wash)),var(--surface-2)}
  .rp-table tbody tr:hover td.rp-callcol,.rp-table tbody tr:hover td.rp-60col{background:linear-gradient(var(--surface-3),var(--surface-3)),var(--surface-2)}
  /* ---- group band (2026-07-18): main stack · siege deck · the call. A thin underline
     in each group's hue — obvious on scan, quiet enough not to fight the data. Hue mixes
     are TOKENS because the light ground needs stronger mixes than the dark one. ---- */
  :root{ --grp-main-ink:color-mix(in srgb,var(--l-grav) 65%, var(--ink-faint));
         --grp-main-rule:color-mix(in srgb,var(--l-grav) 40%, transparent);
         --grp-siege-ink:color-mix(in srgb,var(--l-seffort) 85%, var(--ink-faint));
         --grp-siege-rule:color-mix(in srgb,var(--l-seffort) 55%, transparent);
         --grp-call-ink:color-mix(in srgb,var(--l-tower) 80%, var(--ink-faint));
         --grp-call-rule:color-mix(in srgb,var(--l-tower) 45%, transparent) }
  @media (prefers-color-scheme:light){:root{
         --grp-main-ink:color-mix(in srgb,var(--l-grav) 88%, var(--ink-dim));
         --grp-main-rule:color-mix(in srgb,var(--l-grav) 65%, transparent);
         --grp-siege-ink:color-mix(in srgb,var(--l-seffort) 95%, var(--ink-dim));
         --grp-siege-rule:color-mix(in srgb,var(--l-seffort) 70%, transparent);
         --grp-call-ink:color-mix(in srgb,var(--l-tower) 92%, var(--ink-dim));
         --grp-call-rule:color-mix(in srgb,var(--l-tower) 62%, transparent) }}
  :root[data-theme="dark"]{ --grp-main-ink:color-mix(in srgb,var(--l-grav) 65%, var(--ink-faint));
         --grp-main-rule:color-mix(in srgb,var(--l-grav) 40%, transparent);
         --grp-siege-ink:color-mix(in srgb,var(--l-seffort) 85%, var(--ink-faint));
         --grp-siege-rule:color-mix(in srgb,var(--l-seffort) 55%, transparent);
         --grp-call-ink:color-mix(in srgb,var(--l-tower) 80%, var(--ink-faint));
         --grp-call-rule:color-mix(in srgb,var(--l-tower) 45%, transparent) }
  :root[data-theme="light"]{ --grp-main-ink:color-mix(in srgb,var(--l-grav) 88%, var(--ink-dim));
         --grp-main-rule:color-mix(in srgb,var(--l-grav) 65%, transparent);
         --grp-siege-ink:color-mix(in srgb,var(--l-seffort) 95%, var(--ink-dim));
         --grp-siege-rule:color-mix(in srgb,var(--l-seffort) 70%, transparent);
         --grp-call-ink:color-mix(in srgb,var(--l-tower) 92%, var(--ink-dim));
         --grp-call-rule:color-mix(in srgb,var(--l-tower) 62%, transparent) }
  .rp-table thead tr.rp-grp th{height:22px; line-height:22px; padding:0 10px;
    font:700 9.5px/22px var(--mono); letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); border-bottom:0}
  .rp-table thead tr.rp-grp th.rp-tcol{z-index:5}
  .rp-table thead tr.rp-grp th.g-main{color:var(--grp-main-ink); box-shadow:inset 0 -2px 0 var(--grp-main-rule)}
  /* the label stays readable mid-scroll: it rides sticky just past the Time column
     instead of vanishing off the left edge of its ~1100px colspan */
  .rp-table thead tr.rp-grp th.g-main .glab{display:inline-block; position:sticky; left:104px}
  .rp-table thead tr.rp-grp th.g-siege{color:var(--grp-siege-ink);
    box-shadow:inset 0 -2px 0 var(--grp-siege-rule);
    border-left:1px solid color-mix(in srgb,var(--l-seffort) 40%, var(--hairline))}
  .rp-table thead tr.rp-grp th.g-call{color:var(--grp-call-ink); position:sticky; right:0; z-index:4;
    box-shadow:inset 0 -2px 0 var(--grp-call-rule);
    border-left:1px solid color-mix(in srgb,var(--l-tower) 30%, var(--hairline))}
  /* both header rows are sticky: the band at 0, the column row tucked under its 22px
     (+0 border — the band's rule is an inset shadow precisely so this offset stays exact) */
  .rp-table thead tr:not(.rp-grp) th{top:22px}
  /* the playhead band must ADD to a cell's own edges, not replace them — .at's
     box-shadow would otherwise silently erase the against-rail and the tcol separator
     on exactly the row being looked at */
  .rp-table tbody tr.at td.rp-tcol{box-shadow:inset 0 1px 0 var(--iris,#8B9CFF), inset 0 -1px 0 var(--iris,#8B9CFF), 1px 0 0 var(--hairline)}
  .rp-table tbody tr.at td.against{box-shadow:inset 0 1px 0 var(--iris,#8B9CFF), inset 0 -1px 0 var(--iris,#8B9CFF), inset 3px 0 0 var(--coral)}
  /* ---- tap detail row: the per-moment layer stream, one chip per layer. The cell is
     table-wide (~1600px), so the chips ride a sticky inner wrap sized to the SCROLLER —
     they stay in view wherever the table is scrolled. ---- */
  .rp-tablescroll{container-type:inline-size}
  .rp-table tr.rp-detail td{background:var(--surface-3); padding:8px 14px 9px; white-space:normal; cursor:default}
  .rp-dwrap{position:sticky; left:0; width:max-content; max-width:96cqw}
  .rp-dchip{display:inline-flex; align-items:baseline; gap:5px; margin:3px 14px 3px 0;
    font:400 12.5px/1.45 var(--sans); color:var(--ink-dim)}
  .rp-dchip b{font-weight:600; color:var(--ink)}
  .rp-dchip.nodata{opacity:.55}
  .rp-dchip.siege b{color:color-mix(in srgb,var(--l-seffort) 80%, var(--ink))}
  .rp-darr{font-family:var(--mono); font-weight:800}
  .rp-darr.up{color:var(--jade)} .rp-darr.down{color:var(--coral)}
  .rp-darr.flat,.rp-darr.none{color:var(--ink-faint); font-weight:600}
  .rp-pill.sg-break{background:color-mix(in srgb,var(--l-seffort) 16%, transparent); color:var(--l-seffort)}
  /* NOT jade-wash: that is also the win-row tint, and the pill would dissolve into
     exactly the rows it most often sits on */
  .rp-pill.sg-hold{background:color-mix(in srgb,var(--jade) 22%, transparent); color:var(--jade)}
  /* the Outcome column (S3 scorekeeper) sits inside the siege band, no second rule */
  .rp-table td.rp-sgcol2{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
  /* column → layer ownership: a 2px tick in the OWNING layer's hue under each column
     header; adjacent columns of one layer merge into one continuous tick (Gamma·Magnet·
     Shove = gravity, Fade·Stretch = fade lens). Sub-labels name the layer in words.
     DATA FEEDS have no columns — a feed carries no reading for the ledger to review.
     The mix strength is a TOKEN (same discipline as --grp-*): the light ground washes
     a 45% tick out to ~1.5:1, so light mode runs hotter. */
  :root{--lt-mix:45%}
  @media (prefers-color-scheme:light){:root{--lt-mix:72%}}
  :root[data-theme="dark"]{--lt-mix:45%}
  :root[data-theme="light"]{--lt-mix:72%}
  .rp-table thead tr:not(.rp-grp) th.lt-base{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-base) var(--lt-mix), transparent)}
  .rp-table thead tr:not(.rp-grp) th.lt-grav{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-grav) var(--lt-mix), transparent)}
  .rp-table thead tr:not(.rp-grp) th.lt-speed{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-speed) var(--lt-mix), transparent)}
  .rp-table thead tr:not(.rp-grp) th.lt-motion{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-motion) var(--lt-mix), transparent)}
  .rp-table thead tr:not(.rp-grp) th.lt-break{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-break) var(--lt-mix), transparent)}
  .rp-table thead tr:not(.rp-grp) th.lt-fade{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-fade) var(--lt-mix), transparent)}
  .rp-table thead tr:not(.rp-grp) th.lt-flow{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-flow) var(--lt-mix), transparent)}
  .rp-table thead tr:not(.rp-grp) th.lt-seffort{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-seffort) var(--lt-mix), transparent)}
  .rp-table thead tr:not(.rp-grp) th.lt-sscore{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-sscore) var(--lt-mix), transparent)}
  .rp-table thead tr:not(.rp-grp) th.lt-tower{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--l-tower) var(--lt-mix), transparent)}
  /* doctrine-grade colors (hit/miss) — deliberately separate classes from the
     directional rp-up/rp-dn vocabulary, same jade/coral inks */
  .rp-hit{color:var(--jade)} .rp-miss{color:var(--coral)}
  /* ---- header tips: hover a column head ~.6s (or tap it) → one floating card with a
     plain-english sentence. position:fixed so the scroller's overflow can't clip it.
     Shadow strength is a TOKEN (--lt-mix discipline): the dark ground wants a deep
     throw, the light ground wants a breath. ---- */
  :root{--tip-shade:rgba(5,9,15,.42)}
  @media (prefers-color-scheme:light){:root{--tip-shade:rgba(26,34,48,.15)}}
  :root[data-theme="dark"]{--tip-shade:rgba(5,9,15,.42)}
  :root[data-theme="light"]{--tip-shade:rgba(26,34,48,.15)}
  .rp-htip{position:fixed; z-index:80; max-width:300px; padding:11px 14px 12px; border-radius:12px;
    background:var(--surface-2); border:1px solid var(--hairline-2);
    box-shadow:0 16px 40px var(--tip-shade), 0 3px 10px var(--tip-shade);
    font:400 12.5px/1.55 var(--sans); color:var(--ink-dim);
    opacity:0; transform:translateY(-3px); pointer-events:none; transition:opacity .16s ease, transform .16s ease}
  .rp-htip.on{opacity:1; transform:none}
  .rp-htip b{display:block; font:600 10px/1.4 var(--mono); letter-spacing:.11em;
    text-transform:uppercase; color:var(--ink); margin-bottom:4px}
  /* GW notation titles are case-sensitive (GWp ≠ GWP — docs/gw-vocab.md): render verbatim.
     The card TINTS toward what it is about (rpShowHeadTip sets tt-*): side ink for
     walls (jade GWc / coral GWp), lantern for MagP, iris for Pin — title + meter only,
     never the body ink. */
  .rp-htip b.gw-verbatim{text-transform:none; letter-spacing:.05em; font-size:11.5px; color:var(--tt,var(--ink))}
  .rp-htip.tt-jade{--tt:var(--jade)} .rp-htip.tt-coral{--tt:var(--coral)}
  .rp-htip.tt-mag{--tt:var(--lantern)} .rp-htip.tt-pin{--tt:var(--iris)}
  /* plain rows — legacy '¦' tips without role prefixes; the LAST row reads brighter */
  .rp-htip .tp-r{display:block; margin-top:4px; font:400 12px/1.5 var(--sans); color:var(--ink-dim); font-variant-numeric:tabular-nums}
  .rp-htip .tp-r:last-child:not(:first-of-type){color:var(--ink); font-weight:500}
  /* structured rows (k: f: m: v: n: role prefixes — see rpShowHeadTip).
     KEY row: the one number the card exists for — the loudest thing on it. */
  .rp-htip .tp-k{display:flex; align-items:baseline; gap:7px; margin-top:3px}
  .rp-htip .tp-k em{font-style:normal; font:600 9.5px/1 var(--sans); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint)}
  .rp-htip .tp-k b{display:inline; margin:0; text-transform:none; letter-spacing:.01em;
    font:600 16px/1.25 var(--mono); color:var(--ink); font-variant-numeric:tabular-nums}
  /* facts — the quiet middle register */
  .rp-htip .tp-f{display:block; margin-top:3px; font:400 11.5px/1.5 var(--sans); color:var(--ink-dim); font-variant-numeric:tabular-nums}
  /* share meter — a 3px filament of the card's tint (share of the strongest wall) */
  .rp-htip .tp-m{display:block; height:3px; margin:6px 0 1px; border-radius:2px;
    background:color-mix(in srgb, var(--tt,var(--ink-faint)) 14%, transparent)}
  .rp-htip .tp-m i{display:block; height:100%; border-radius:2px; background:var(--tt,var(--ink-faint)); opacity:.62}
  /* verdict — the card's one conclusion, set off by a hairline; a leading MagP/Pin
     notation token wears its accent; terrain (no active pull) stays muted */
  .rp-htip .tp-v{display:block; margin-top:9px; padding-top:8px; border-top:1px solid var(--hairline);
    font:500 12px/1.5 var(--sans); color:var(--ink)}
  .rp-htip .tp-v.mute{color:var(--ink-dim); font-weight:400}
  .rp-htip .tp-v b{display:inline; margin:0; text-transform:none; letter-spacing:.04em; font:600 11.5px/1.4 var(--mono)}
  .rp-htip .tp-v b.tv-pin{color:var(--iris)} .rp-htip .tp-v b.tv-mag{color:var(--lantern)}
  /* footnote — the fine print (data caveats), smallest and faintest */
  .rp-htip .tp-n{display:block; margin-top:6px; font:400 10.5px/1.45 var(--sans); color:var(--ink-faint)}
  @media (prefers-reduced-motion:reduce){ .rp-htip{transition:none} }
  .rp-tfoot{flex:0 0 auto; display:flex; gap:16px; flex-wrap:wrap; padding:10px 14px;
    border-top:1px solid var(--hairline); background:var(--surface-3);
    font-size:11.5px; color:var(--ink-faint)}
  .rp-tfoot b{color:var(--ink-dim); font-weight:600}

  /* ---- Replay console: the Watchtower head card at the playhead. The residual-stream
     layer cards + consensus line that used to ride under it moved into the TABLE view
     (2026-07-18): one moment's stream belongs beside the day's other moments, not
     crowding the chart. rpStream() itself lives on — the table's Lean column and the
     fire popover read it. ---- */
  .rp-console{display:flex; flex-direction:column; gap:8px; margin-top:10px; flex:0 0 auto}
  /* the Watchtower — the decision the stream feeds into */
  .rp-wt-head{display:grid; grid-template-columns:14px 1fr auto; align-items:start; gap:8px;
    padding:8px 12px; border-radius:12px; background:color-mix(in srgb,var(--l-tower) 13%, var(--surface-2));
    border:1px solid color-mix(in srgb,var(--l-tower) 36%, var(--hairline))}
  .rp-wt-mark{width:14px; height:15px; margin-top:2px; background:var(--l-tower);
    clip-path:polygon(50% 0%,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%); filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}
  .rp-wt-main{min-width:0}
  .rp-wt-call{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; overflow:hidden; min-width:0; white-space:nowrap; font-family:var(--sans); font-size:13.5px; font-weight:700; color:var(--ink)}
  .rp-wt-call .who{color:var(--l-tower)}

const el = (t,c,h)=>{ const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const f = (n,d)=> n==null||isNaN(n) ? "—" : Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sig = v => (v>=0?"+":"") + f(v,2) + "σ";
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
// times display in Pacific; the raw record timestamps stay as written (Eastern)
const PT = 'America/Los_Angeles', ET = 'America/New_York';
const clockIn = (ts,tz)=> new Date(ts).toLocaleTimeString('en-US',{hour12:false, timeZone:tz});
const scanTs = s => s.ts || (SYS.date+'T'+s.t+'-04:00');
const ptTime = s => clockIn(scanTs(s), PT);

// ================= GW — wall / magnet / pin notation (THE standard) =================
// The ONE display vocabulary for dealer structure, defined in docs/gw-vocab.md and
// mirrored by the Python twin skills/mirai-left-eye/gw_vocab.py. Every tab labels
// walls THROUGH these helpers — the thresholds live here and nowhere else.
// Display-only (the gex_views doctrine): storage keys and code identifiers are never
// renamed; call_wall stays call_wall on disk, it *renders* as GWc.
const GW = {
  // prime intensity vs the strongest structure ON THE SAME SURFACE (same tenor set,
  // same scan): share ≥0.60 → ''' (dominant) · 0.25–0.60 → '' (significant) · else '
  primeTier(share){
    if(share==null||!isFinite(share)) return "'";
    return share>=0.60 ? "'''" : share>=0.25 ? "''" : "'";
  },
  // hysteresis for a TRACKED wall (live map): a share breathing around a cut must not
  // flicker the mark between scans — promote only when the boundary is cleared by
  // +0.07, demote only when the share falls 0.07 below it (spec 07-19 amendment)
  tierStable(share, prevTier){
    // exact mirror of gw_vocab.prime_tier(share, prev_tier): the whole cut ladder
    // shifts ±0.07, so EVERY boundary (including a two-tier jump's far cut) gates —
    // prev ' at share 0.62 reads '' (0.67 not cleared), never '''
    const marks=["'","''","'''"], tn=(s,c1,c2)=> s>=c2?3 : s>=c1?2 : 1;
    const s=(share==null||!isFinite(share))?0:share;
    const pi=marks.indexOf(prevTier);
    if(pi<0) return GW.primeTier(s);
    const prev=pi+1;
    const up=tn(s, 0.25+0.07, 0.60+0.07), down=tn(s, 0.25-0.07, 0.60-0.07);
    if(up>prev) return marks[up-1];
    if(down<prev) return marks[down-1];
    return prevTier;
  },
  // MagP tier (spec 07-19 amendment): MagP inherits the GW tier of the wall the magnet
  // sits ON (peak within one strike step); a magnet on no displayed wall reads the ''
  // default. (Zone-share cuts were DROPPED: recorded pin_zones are one zone at
  // share ≈ 1.0, so the old 0.50/0.30 thresholds could never fire on real data.)
  magpTier(magnet, clusters){
    // mirror of gw_vocab.magp_tier: the magnet's HOST wall is found the same way a
    // pin is (span ± one step, nearest peak winning) — not peak-only, not first-match
    if(magnet==null||!isFinite(magnet)) return "''";
    const host=GW.pinStatus(clusters, magnet);
    return host ? host.tier : "''";
  },
  // "[0DTE]GWc'''" — tenor prefix optional: un-prefixed is allowed only where the
  // whole surface is one tenor and the surface says so once (the live map's caption)
  gwLabel(side, tier, tenor){
    const s=(side==='c'||side==='call')?'c':'p';
    return (tenor?`[${tenor}]`:'')+'GW'+s+(tier||'');
  },
  // dated-book tenor tag: MMMDD from the expiry date ([AUG21]) — never a DTE number,
  // because that number changes daily (rides the existing _dexp formatter)
  tenorTag(iso){ return _dexp(iso); },
  // Clustering rule (gw-vocab.md §how a wall is found), amended 07-19 with a
  // per-strike concentration floor: keep only strikes carrying ≥25% of the scan's
  // single strongest strike |netγ| (without it real surfaces merge into one ~220-pt
  // blob per side). Then group same-sign adjacent survivors, allowing ≤1 missing
  // strike step inside a group; strength = Σ|γ|; label price = the peak-|γ| strike;
  // drop clusters under 5% of the strongest. Returns them sorted by strike.
  clusterWalls(netByStrike, spot){
    if(!Array.isArray(netByStrike)) return [];
    let pts=netByStrike
      .filter(p=>Array.isArray(p)&&isFinite(p[0])&&isFinite(p[1]))
      .map(p=>[+p[0],+p[1]]).sort((a,b)=>a[0]-b[0]);
    if(!pts.length) return [];
    // the strike pitch comes from the FULL grid — zero-gamma strikes INCLUDED — before
    // anything thins it (mirror of gw_vocab.infer_step: MODAL spacing, default 1.0);
    // a proxy grid dotted with zero-γ strikes must still read its true 5-pt pitch, or
    // clusters merge across gaps and the ±1-step pin/MagP tolerances go wide
    const counts=new Map();
    for(let i=1;i<pts.length;i++){ const d=Math.round((pts[i][0]-pts[i-1][0])*1e6)/1e6;
      if(d>0) counts.set(d,(counts.get(d)||0)+1); }
    // modal pick tie-breaks to the FIRST-SEEN diff, exactly like Python's
    // Counter.most_common(1) — a rescaled grid's 10.03/10.04 rounding tie must
    // resolve the same on both twins or knife-edge gaps cluster differently
    let step=1.0, best=0;
    for(const [d,n] of counts) if(n>best){ best=n; step=d; }
    let kmx=0; for(const p of pts){ const a=Math.abs(p[1]); if(a>kmx) kmx=a; }
    if(!kmx) return [];
    pts=pts.filter(p=>Math.abs(p[1])>=0.25*kmx-1e-9);   // the concentration floor (−1e-9: twin parity w/ gw_vocab floor−_EPS)
    const cls=[]; let cur=null;
    for(const [k,v] of pts){
      const pos=v>=0;
      if(cur&&cur.pos===pos&&(k-cur.hi)<=2*step+1e-6){  // ≤1 missing step stays one wall
        cur.hi=k; cur.strength+=Math.abs(v);
        if(Math.abs(v)>cur.peakAbs){ cur.peakAbs=Math.abs(v); cur.peak=k; }
      } else { cur={pos, lo:k, hi:k, strength:Math.abs(v), peak:k, peakAbs:Math.abs(v)}; cls.push(cur); }
    }
    let mx=0; for(const c of cls) if(c.strength>mx) mx=c.strength;
    if(!mx) return [];
    return cls.filter(c=>c.strength>=0.05*mx).map(c=>({
      side:c.pos?'c':'p', lo:c.lo, hi:c.hi, peak:c.peak, strength:c.strength, step,
      share:c.strength/mx, tier:GW.primeTier(c.strength/mx),
      above:(spot!=null&&isFinite(spot))?c.peak>spot:null }));
  },
  // the map rule: up to `perSide` nearest clusters above and below spot — show what
  // exists, NEVER force 3. Returned above-first (nearest→far), then below.
  nearestWalls(clusters, spot, perSide=3){
    if(!Array.isArray(clusters)||spot==null||!isFinite(spot)) return [];
    const above=clusters.filter(c=>c.peak> spot).sort((a,b)=>a.peak-b.peak).slice(0,perSide);
    const below=clusters.filter(c=>c.peak<=spot).sort((a,b)=>b.peak-a.peak).slice(0,perSide);
    return above.concat(below);
  },
  // Pin: spot sits inside a wall's cluster span ± one strike step; Pin inherits the
  // pinning wall's prime tier. Null when nothing pins (a wall can be plain terrain).
  pinStatus(clusters, spot){
    // mirror of gw_vocab.pin_status: ALL spans containing spot compete and the
    // nearest peak wins (ties break low — strike order), not first-in-strike-order
    if(!Array.isArray(clusters)||spot==null||!isFinite(spot)) return null;
    const inside=clusters.filter(c=>spot>=c.lo-c.step-1e-9&&spot<=c.hi+c.step+1e-9);
    if(!inside.length) return null;
    let best=inside[0];
    for(const c of inside) if(Math.abs(c.peak-spot)<Math.abs(best.peak-spot)) best=c;
    return {wall:best, tier:best.tier};
  },
  // MagP status for one wall: the magnet sits inside its span ± one strike step
  isMagp(cluster, magnet){
    return !!(cluster&&magnet!=null&&isFinite(magnet)
              &&magnet>=cluster.lo-cluster.step-1e-9&&magnet<=cluster.hi+cluster.step+1e-9);
  },
  // the tooltip status line — one wall, one honest sentence (gw-vocab.md §status rules).
  // Pin is checked FIRST: the magnet's wall becomes the pinning wall the moment spot
  // reaches it. MagP wears the wall's own tier (the 07-19 inheritance rule).
  statusLine(cluster, spot, magnet){
    const pin=GW.pinStatus([cluster], spot);
    if(pin) return `Pin${pin.tier} — price held at this wall`;
    if(GW.isMagp(cluster, magnet)&&spot!=null&&isFinite(spot))
      return `MagP${cluster.tier} — pulling spot ${Math.round(spot)} → ${Math.round(cluster.peak)}`;
    return 'terrain — no active pull';
  },
};
// bind the shared floating-card tips (#rp-htip — the replay-table / sweep-ledger card)
// onto a container's [data-tip] descendants: hover shows after a beat, tap toggles
// (a wall tablet has no hover). Used by the GEX map + the replay chart's GW labels.
function gwBindTips(host){
  if(!host||host._gwTips) return; host._gwTips=true;
  host.addEventListener('pointerover',e=>{
    const el=e.target.closest&&e.target.closest('[data-tip]'); if(!el) return;
    const t=document.getElementById('rp-htip');
    if(t&&t._th===el&&t.classList.contains('on')) return;
    clearTimeout(_htipTmr); _htipTmr=setTimeout(()=>rpShowHeadTip(el),350);
  });
  host.addEventListener('pointerout',e=>{
    const el=e.target.closest&&e.target.closest('[data-tip]'); if(!el) return;
    if(e.relatedTarget&&el.contains(e.relatedTarget)) return;
    rpHideHeadTip();
  });
  host.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('[data-tip]'); if(!el) return;
    clearTimeout(_htipTmr); rpShowHeadTip(el);
  });
}

// ================= LIVE ENGINE (status strip + GEX map) =================
// Served from the viewstation (:8787), it polls the newest diary row from the
// same-origin file API and eases to it. Anywhere the API is unreachable (e.g. the
// hosted preview) it auto-falls back to a simulated feed so the map still breathes.
const FEED = { pollMs: 4000, fails: 0, lastOkAt: null };   // fails = CONSECUTIVE poll misses (N20)
/* STREAMING PRICE (2026-07-13). The map's SPX used to be a SCAN SNAPSHOT: the poll above
   re-reads the diary, and the diary only gains a row when the left-eye scanner writes one
   — launchd asks for 60s but an RTH scan overruns it and the overlapping fire is DROPPED.
   Measured 07-13: a new price every 2 min at best, 4.1 min median, 12.5 min WORST, while
   the 60fps easing made a 12-minute-old print look live. Now the price streams on its own
   clock from /api/spot (one cached Schwab quote) and the diary keeps owning the GRAVITY.
   A live price on stale gravity is honest — and the readout says which is which. */
const SPOT = { pollMs: 2500, px: null, at: 0, fails: 0, prev: null, live: false,
               paused: 'boot', timer: null };
const SPOT_STALE_MS = 15000;         // 6 missed polls → stop claiming the price is live
/* IDLE = 60 min, not 5. This screen is a WALL DISPLAY — it is meant to be watched, not
   touched, so "no interaction" is its normal resting state, not a sign nobody is there.
   A 5-min gate froze the price for most of the session and defeated the point of making
   it live at all. An hour still reaps a genuinely abandoned tab (a laptop left open on
   another desk) while a wall display streams the whole session untouched. The gates that
   actually carry the savings are market-hours and visibility, which are unaffected. */
const SPOT_IDLE_MS  = 3600000;       // 60 min with no touch/click/key → the tab is abandoned
const SPOT_RECHECK_MS = 30000;       // while paused, re-ask LOCALLY (no network) every 30s
let SPOT_LAST_ACT = Date.now();

/* WHEN NOT TO POLL. The first cut of this looped forever — all night, all weekend, and
   while the tab was hidden: ~34,500 quotes/day, nearly all of them into a closed market
   for a screen nobody was looking at. Worse, those calls share a rate-limit budget with
   the SCANNER's chain fetches, so a wasteful price poll can slow down the very scans that
   already overrun their 60s slot. Three gates, cheapest first — all evaluated LOCALLY, so
   a paused poller costs zero network. */
function spotIsRTH(){
  // ET 09:30–16:00, Mon–Fri (±5 min pad). Holidays are not modelled here on purpose: on a
  // holiday the quote simply returns the prior close, which is harmless — whereas hard-coding
  // a calendar in the client is a thing that silently rots.
  const et = new Date(new Date().toLocaleString('en-US', {timeZone:'America/New_York'}));
  const d = et.getDay();
  if(d===0 || d===6) return false;
  const m = et.getHours()*60 + et.getMinutes();
  return m >= (9*60+30-5) && m <= (16*60+5);
}
function spotPauseReason(){
  if(document.hidden)                              return 'screen off / tab hidden';
  if(!spotIsRTH())                                 return 'market closed';
  if(Date.now()-SPOT_LAST_ACT > SPOT_IDLE_MS)      return 'idle — no activity for 60 min';
  return null;
}
// any sign of life resumes the stream IMMEDIATELY — a paused price must never make you
// wait for the next tick to find out what the market is doing
function spotKick(){
  SPOT_LAST_ACT = Date.now();
  if(SPOT.timer){ clearTimeout(SPOT.timer); SPOT.timer=null; }
  pollSpot();
}
for(const ev of ['pointerdown','keydown','touchstart','wheel','click'])
  addEventListener(ev, ()=>{ SPOT_LAST_ACT=Date.now(); if(SPOT.paused) spotKick(); }, {passive:true});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) spotKick(); });
let LIVE = false;
let MODE = 'connecting';   // 'connecting' → 'live' | 'demo'; feedBadge derives 'lost' from FEED.fails
// Ask the viewstation's file index for the newest reversion/<date>.jsonl (robust across the
// midnight rollover / pre-market gap), pull its last 40 rows: newest row drives the map,
// and the most-recent JUDGED watchtower (skipping quiet/cap rows) drives the reading.
// map a raw diary row → the internal scan shape used by the Map / Diary / Heads renderers
function normWt(w){
  w=w||{};
  return { fired:!!w.fired, dir:w.direction||w.dir||null, mag:w.magnitude_sigma??w.mag??0,
    range:w.range_sigma||[0,0], horizon:w.horizon_min??60,
    conv:w.conviction ?? (w.votes&&(w.votes.agreement??w.votes.agree)) ?? 1, convStated:w.conviction_stated??null,
    votes:w.votes?{n:w.votes.n??1, agree:w.votes.agreement??w.votes.agree??1}:{n:1,agree:1},
    agrees:('agrees_with_gates' in w)?!!w.agrees_with_gates:(w.agrees??true),
    scene:w.scene||'', change:w.would_change_mind||w.change||'', interest:w.interest||'',
    wallS:w.wall_s??w.wallS??0, revised:!!w.revised, snippet:w.snippet||null, skipped:w.skipped||null,
    pv:w.prompt_version||null,     // actual head version from the row (H1: badge must not be inferred from a constant)
    stance:w.stance||null,         // N4 (wt-5): fight / settle / no_read — the prison-yard axis
    dissent:w.reveal_dissent||null };  // N19: a reveal sample that disagreed with a unanimous majority
}
// magnet zones (2026-07-09) — normalize an engine dict's pin_zones list. Rows
// written before the zones landed carry no key → null → the map falls back to
// exactly the single-magnet display.
function normZones(g){
  const pz=g&&g.pin_zones;
  if(!Array.isArray(pz)||!pz.length) return null;
  const zs=[];
  for(const z of pz){
    if(!z || z.center==null || !isFinite(z.center)) continue;
    zs.push({ c:+z.center,
      s:(z.share!=null&&isFinite(z.share))?Math.max(0,Math.min(1,+z.share)):0,
      side:z.side||null,
      lo:(z.lo!=null&&isFinite(z.lo))?+z.lo:null,
      hi:(z.hi!=null&&isFinite(z.hi))?+z.hi:null,
      n:(z.n!=null&&isFinite(z.n))?+z.n:null });
  }
  return zs.length?zs:null;
}
// DEX surface (2026-07-25) — normalize a row's dex_views dict (lefteye_dex, SHADOW).
// Engine contract: absent key = NO READ (render nothing, never a zero); dex_v gates
// every consumer (a version bump makes rows unpoolable — the era-tag doctrine).
function normDex(dv){
  if(!dv||typeof dv!=='object') return null;
  const num=v=>(v!=null&&isFinite(v))?+v:null;
  return { v:num(dv.dex_v), src:dv.source??null,
    tot:num(dv.net_dex_total), tot0:num(dv.net_dex_0dte),
    nbs:Array.isArray(dv.net_dex_by_strike)?dv.net_dex_by_strike:null,
    flow:num(dv.dex_flow_signed),
    fbs:Array.isArray(dv.dex_flow_by_strike)?dv.dex_flow_by_strike:null,
    above:num(dv.dex_above_spot), below:num(dv.dex_below_spot),
    word:dv.dex_word??null, fword:dv.dex_flow_word??null,
    basis:dv.basis??null, basis0:dv.basis_0dte??null,
    n:num(dv.n), fN:num(dv.dex_flow_n_strikes) };
}
function rowToScan(r){
  const gt=r.gex_theta||{}, gv=r.gex_views||{}, g=Object.keys(gt).length?gt:gv, sh=gv.shove||gt.shove||{};
  const re=r.reversion_extreme||{}, lr=r.level_reclaim||{}, mo=r.gex_motion;
  return { ts:r.ts, t:clockIn(r.ts,ET), spot:r.spot, regime:r.regime, conf:r.regime_conf??1, sign:r.gamma_sign,
    /* H2 (07-12): r.call/put_wall are now the OPERATIVE near walls; the structural
       ceiling/floor moved to r.*_wall_tenor (fallback keeps pre-H2 rows correct) */
    flip:r.gamma_flip, flipSrc:gv.regime_source??null, flipGv:(gv.flip!=null&&isFinite(gv.flip))?+gv.flip:null, flipBand:Array.isArray(gv.flip_band)?gv.flip_band:null, callWall:gv.call_wall_gamma??r.call_wall, putWall:gv.put_wall_gamma??r.put_wall, putFloor:r.put_wall_tenor??r.put_wall??null, callCeil:r.call_wall_tenor??r.call_wall??null, netByStrike:g.net_by_strike??gv.net_by_strike??null, nbsTenor:g.net_by_strike_tenor??gv.net_by_strike_tenor??null, oiBS:g.oi_by_strike??gv.oi_by_strike??null, volBS:g.vol_by_strike??gv.vol_by_strike??null, dated:r.dated_gex??null,
    /* magnet policy (locked, mirrors resolve_dealer_map): gex_views LEADS, gex_theta is the
       challenger; the armed-only reversion magnet is wall-clamped (a fade target, not the pull) */
    magnet:gv.magnet??g.magnet??re.magnet_raw??r.gamma_flip,
    pin:gv.pin_centroid??g.pin_centroid??g.magnet??r.spot, sigma:r.sigma??1, gAbove:g.gamma_above_spot??0, gBelow:g.gamma_below_spot??0, flow:g.aggressor_flow??0,
    /* magnet MASS field (2026-07-18): the sign-free per-strike gravity mass the magnet
       v3 engine resolves its winner FROM — [[strike, mass], ...] at 5-pt strikes, both
       sides of spot, on every row. The replay cloud draws this; the magnet line stays
       the resolved winner. */
    massBS:Array.isArray(gv.mass_by_strike)?gv.mass_by_strike:null,
    cwShare:g.call_wall_gamma_share??0, pwShare:g.put_wall_gamma_share??0, pinShare:g.pin_top_share??0, zones:normZones(g), contested:(g.pin_contested!=null?!!g.pin_contested:null),   // shares/zones for the live GEX field
    shove:{ up:sh.shove_up_margin??0, down:sh.shove_down_margin??0, upFlip:sh.up_flips||false, downFlip:sh.down_flips||false },
    fade:{ score:re.score??0, fired:!!re.fired, armed:!!re.armed, reaction:!!re.reaction, dir:re.direction||'none', arm:re.arm_reason||'none',
      runway:re.runway_sigma??0, runwayOk:!!re.runway_ok, dCall:re.wall_dist_call, dPut:re.wall_dist_put,
      /* the raw tape stretches — carried for the Replay TABLE (gap = how far below/above
         yesterday's close we opened; vwap = are today's buyers underwater) */
      gap:re.gap_stretch??null, vwap:re.vwap_stretch??null },
    brk:{ state:lr.break_state||'idle', cocks:lr.cock_count||0, dir:lr.cock_direction||lr.direction||'none',
      /* COCKED IS NOT FIRED (wt-6/m8): the table must never show a cocked trigger as a
         direction the map took — only a FIRED break is a directional fact */
      fired:!!lr.fired || lr.break_state==='fired' },
    motion: mo?{ lookback:mo.lookback_min, magnetWalk:mo.magnet_walk_sigma, flipCreep:mo.flip_creep_sigma, gripSlope:mo.grip_slope, soft:mo.soft_side,
      /* the SHARE behind soft_side — 0.494 is a coin flip wearing a direction's clothes */
      above:mo.gamma_above_share??null }:null,
    lob:{ tilt:(r.lob_flow||{}).tilt, regime:(r.lob_flow||{}).regime },
    // 2026-07-09 shadow layers — all optional; old rows simply carry null and render as before
    spd: r.speedometer?{ pace:r.speedometer.rv_pace??null, jz:r.speedometer.jump_z??null, jsign:r.speedometer.jump_sign??null,
      down:r.speedometer.semivar_down_share??null, q:r.speedometer.quality??null }:null,
    rr: r.range_ruler?{ em:r.range_ruler.em_points??null, emo:r.range_ruler.em_open??null,
      cons:r.range_ruler.em_consumed??null, q:r.range_ruler.quality??null }:null,
    groll: r.gamma_roll?{ div:!!r.gamma_roll.divergence, dir:r.gamma_roll.divergence_dir??null,
      zw:r.gamma_roll.zero_dte_wall??null, fw:r.gamma_roll.far_wall??null,
      kind:r.gamma_roll.zero_dte_wall_kind??null }:null,   // N12: defended pin vs accelerant fuel
    evl: r.event_lens?{ kind:r.event_lens.event_kind??null, phase:r.event_lens.phase??null,
      ratio:r.event_lens.surprise_ratio??null }:null,
    /* containment facts (2026-07-18): wall_breach + regime_road have been recorded since
       wt-5 but the replay pipeline DROPPED them — the chart's breach ✕ and road line read
       these; an un-drawable recorded fact was the whole audit's lesson */
    breach:r.wall_breach??null, road:r.regime_road??null,
    /* 2026-07-25 DEX (SHADOW) — the direction-side twin: absent key = no read */
    dex:normDex(r.dex_views),
    /* 2026-07-18 SIEGE stack (wt-7) — the SECOND deck's diary field, kept apart from the
       main-stack lenses on every replay surface. Rows before 07-18 carry no key → null
       → the siege cell/column says so instead of faking a quiet read. */
    sg: r.siege?{ health:r.siege.health??null, sat:!!r.siege.saturated, base:r.siege.baseline??null,
      towers:(Array.isArray(r.siege.towers)?r.siege.towers:[]).map(t=>({ kind:t.kind, level:t.level, status:t.status,
        pct:t.effort_pct??null, verdict:t.verdict??null, outcome:t.outcome??null,
        near:!!t.near_spot })) }:null,
    wt: normWt(r.watchtower) };
}
async function fetchRecent(){
  const idx = await fetch('/api/raw/index',{cache:'no-store'});
  const j = await idx.json();
  const files = (j.state||[]).filter(e=>/^reversion\/\d{4}-\d{2}-\d{2}\.jsonl$/.test(e.rel||''));
  if(!files.length) return null;
  files.sort((a,b)=>(b.mtime||0)-(a.mtime||0));
  const res = await fetch(`/api/raw/file?root=state&path=${files[0].rel}&limit=60`,{cache:'no-store'});
  const d = await res.json();
  const raw = (d && d.rows) ? d.rows : [];
  if(!raw.length) return null;

// ---- LABEL-CLOUD DISPLACEMENT (07-22): where label text crosses a level line, the
// line itself parts — a soft gap that fades out approaching the text and feathers
// back in past it, like a cloud displaced by a plane. Mechanics: #gxLabMask (white
// base = visible) gets one feathered black blob per in-plot label; the MagP/flip/
// spot glow+casing+core lines and the WT target line wear the mask. Feathering is a
// per-blob userSpaceOnUse gradient (stop-opacity ramp — additive where blobs touch),
// NOT a blur filter: filters inside masks are the slow/flaky road on WebKit tablets.
// Cost discipline: blob geometry comes from the label layers' own ANALYTIC widths
// (never getBBox) and rebuilds only inside their key-gated innerHTML updates —
// zero work in the 2.5s ease frames; the mask is static geometry the lines slide
// through, so an easing line y needs no recompute at all.
const _MKPAD=10, _MKFEA=14;   // px: solid clearance past the text · feather ramp per side
function mkCloud(id,xa,xb,cy){
  const x0=xa-_MKPAD-_MKFEA, x1=xb+_MKPAD+_MKFEA, w=x1-x0, fr=Math.min(0.42,_MKFEA/w);
  return `<linearGradient id="gxmk-${id}" gradientUnits="userSpaceOnUse" x1="${x0.toFixed(1)}" y1="0" x2="${x1.toFixed(1)}" y2="0">`
    +`<stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="${fr.toFixed(3)}" stop-color="#000" stop-opacity="1"/>`
    +`<stop offset="${(1-fr).toFixed(3)}" stop-color="#000" stop-opacity="1"/><stop offset="1" stop-color="#000" stop-opacity="0"/>`
    +`</linearGradient><rect x="${x0.toFixed(1)}" y="${(cy-11).toFixed(1)}" width="${w.toFixed(1)}" height="22" fill="url(#gxmk-${id})"/>`;
}
function gxMaskPaint(){   // called only from inside the label layers' key gates
  if(!MAP||!MAP.maskB) return;
  const key=MAP._mkGw+'\u0001'+MAP._mkDt;   // separator can't appear in SVG markup, so the key never aliases
  if(key===MAP._mkKey) return; MAP._mkKey=key;
  MAP.maskB.innerHTML=MAP._mkGw+MAP._mkDt;

function gxPaint(){

  // regime wash, split at the gamma-flip

  MAP.washBot.setAttribute('y',fy.toFixed(1)); MAP.washBot.setAttribute('height',Math.max(0,X.H-X.padB-fy).toFixed(1));
  // m5: the background only speaks when the ENGINE's sign read does — on a tie or a
  // blackout (sign unknown) the calm/amplify washes go near-invisible instead of
  // painting a confident story the pill (grey · sign?) is simultaneously denying.
  // ...and on ISLAND geometry (multi-crossing books: sign-at-spot disagrees with
  // spot's side of the nearest flip) the split-at-flip picture itself is wrong —
  // no confident background there either (verify round).
  const _known=(D.sign==='positive'||D.sign==='negative');
  const _island=_known&&isFinite(D.flip)&&isFinite(D.spot)&&((D.spot>D.flip)!==(D.sign==='positive'));
  const _wOp=(_known&&!_island)?'.045':'.012';
  MAP.washTop.style.opacity=_wOp; MAP.washBot.style.opacity=_wOp;
  // m3: a SPREAD-OUT pull draws as a cloud, not a line — when zone-1 is wide (>25pts)
  // or thin (share <35%), a translucent gravity band spans the zone so a 5%-of-mass
  // smear can never read as a precise target. The line stays (it IS the weighted
  // center); the cloud says how much neighborhood to give it.
  if(MAP.magCloud){
    const z1=(T.zones&&T.zones[0])||null;
    const fuzzy=z1&&z1.lo!=null&&z1.hi!=null&&z1.hi>z1.lo&&((z1.hi-z1.lo)>25||(z1.s!=null&&z1.s<0.35));
    if(fuzzy){

      // off-frame zone edge must not bleed behind the caption/rail headers
      const cT=y=>Math.min(X.H-X.padB, Math.max(X.padT, y));
      const yT=cT(yFor(z1.hi)), yB=cT(yFor(z1.lo));
      MAP.magCloud.setAttribute('y',Math.min(yT,yB).toFixed(1));
      MAP.magCloud.setAttribute('height',Math.abs(yB-yT).toFixed(1));
    } else MAP.magCloud.setAttribute('height','0');
  }
  // net-gamma-by-strike profile. PREFERRED: the MEASURED per-strike field the engine
  // now persists (net_by_strike = real net dealer GEX, calls +/puts −). FALLBACK

  // live levels — clearly flagged "modeled" vs "measured" in the caption below.

            bsrc.style.fill=!show0?'var(--ink-faint)':measured?'var(--ink-dim)':'var(--coral)'; }

  if(GX_MEASURED!==measured){ GX_MEASURED=measured; try{ gxOverview(); }catch(e){} }   // chip gates on measured (never a dead switch)
  const bscale=document.getElementById('bar-scale');

  // AMPLITUDE (07-12 ruling): DEFAULT = pure net ÷ single max, LINEAR — the only

// the pill list — dated expiries from the sidecar book (state/dated_gex/book.json),
// merged with the diary row's dated_gex bands by expiry so the pills exist as soon
// as EITHER source has spoken (the walls tooltip prefers the diary band, which the
// wall lines actually draw from)
function gxTenorBands(){
  const out=new Map();
  const dd=(typeof T!=='undefined'&&T&&T.dated!==undefined&&T.dated!==null)?T.dated:(D&&D.dated);
  if(dd&&Array.isArray(dd.bands)) dd.bands.slice(0,4).forEach(b=>{
    if(b&&b.expiry) out.set(String(b.expiry),{expiry:String(b.expiry), dd:b}); });
  const bk=DBOOK.book;
  if(bk&&Array.isArray(bk.bands)) bk.bands.slice(0,5).forEach(b=>{
    if(!b||!b.expiry) return;
    const e=out.get(String(b.expiry));
    if(e) e.bk=b; else out.set(String(b.expiry),{expiry:String(b.expiry), bk:b}); });
  const today=new Date().toISOString().slice(0,10);
  return [...out.values()].filter(e=>e.expiry>=today).sort((a,b)=>a.expiry<b.expiry?-1:1);
}
function tenorAllOn(){
  if(!GXT0) return false;

  return gxTenorBands().every(e=>tenorExpOn(e.expiry));

// FRESHNESS (07-13): whatever the map shows must SAY how old it is. The anchor
// is the newest diary row's own clock (GX_ASOF, set in applyMap) — if the
// collector dies mid-session the poll keeps succeeding on a frozen file, and
// without this the map would ease forever on stale numbers with no tell.
let GX_ASOF=null;
function gxFreshInfo(){
  if(!GX_ASOF||(typeof LIVE!=='undefined'&&!LIVE)) return null;   // demo mode: no claim to freshness
  const age=(Date.now()-new Date(GX_ASOF).getTime())/60000;
  if(!isFinite(age)) return null;
  const t=clockIn(GX_ASOF,ET);
  try{
    const etNow=new Date().toLocaleString('en-CA',{timeZone:'America/New_York',hour12:false});
    const et=new Date(etNow.replace(',',''));
    const mins=et.getHours()*60+et.getMinutes(), wk=et.getDay();
    const rth=wk>=1&&wk<=5&&mins>=570&&mins<960;
    const rowDay=new Date(GX_ASOF).toLocaleDateString('en-CA',{timeZone:'America/New_York'});
    const todayEt=etNow.slice(0,10);
    // scan cadence is ~5 min; a TODAY row >12 min old inside RTH = frozen feed, LOUD.
    // A yesterday row is quiet pre-open (grace to 9:45) so every morning doesn't
    // scream; past 9:45 with no row today, the silence itself is the alarm.
    // (Weekday NYSE holidays will read "no scans today" — true, if blunt.)
    if(rth&&rowDay===todayEt&&age>12) return {txt:`STALE ${Math.round(age)}m — frozen at ${t} ET`, stale:true};
    if(rth&&rowDay!==todayEt&&mins>=585) return {txt:`STALE — no scans today (last ${t} ET ${rowDay})`, stale:true};
  }catch(e){}
  return {txt:`as of ${t} ET`, stale:false};
}
function datedOIAvail(){               // book present AND young enough to draw —
  const b=DBOOK.book;                  // the chip must never be a dead switch
  if(!b||!Array.isArray(b.bands)||!b.bands.length) return false;
  const age=(Date.now()-new Date(b.as_of).getTime())/86400000;
  return age>=0&&age<=5;
}
function toggleDatedOI(){
  DOI_ON=!DOI_ON;

  gxOverview();        // chip reflects the new state immediately
}
// TENOR LADDER GUTTER: each expiry is its own labeled heat-ladder column between
// the bar lane and the right tags — POSITION carries tenor (the one channel that
// is instantly legible at any mark size; the pigment fade never was), hue carries
// sign (jade-family pins / coral-family pushes, same convention as the live bars),
// and a 5-step heat ramp carries √|net| magnitude (monotone, global-max anchored,
// disclosed in the legend; exact values ride each cell's native <title>).
// Steps s1/s2 are DECLARED non-essential ambient texture (sub-3:1 by design);
// the essential read is s3-s5 + the per-column ink peak tick, all ≥3:1 both themes.
const _DGLP=['var(--dgl-p1)','var(--dgl-p2)','var(--dgl-p3)','var(--dgl-p4)','var(--dgl-p5)'];
const _DGLN=['var(--dgl-n1)','var(--dgl-n2)','var(--dgl-n3)','var(--dgl-n4)','var(--dgl-n5)'];
function _gfmt(v){ return v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+Math.round(v/1e6)+'M':'$'+Math.round(v/1e3)+'k'; }
function _dglHead(bd){                       // column header: monthly = 3-letter month;
  try{                                       // quarter-end = ◆-prefixed quarter (species cue)
    const m=+String(bd.expiry).split('-')[1];
    if(bd.band==='quarter_end') return '◆Q'+Math.ceil(m/3);
    return _dexp(bd.expiry).slice(0,3);
  }catch(e){ return _dexp(bd.expiry).slice(0,3); }
}
function _dbAge(bd){                         // a band's OWN age in CALENDAR days (H9) —
  try{                                       // date-string diff to match the engine's
    const a=String(bd.as_of||(DBOOK.book&&DBOOK.book.as_of)||'').slice(0,10);   // age_days (a rolling-24h floor read 2d as 1d overnight)
    const d=Math.round((new Date(new Date().toISOString().slice(0,10))-new Date(a))/86400000);
    return isFinite(d)?Math.max(0,d):Infinity;   // unparsable stamp = unverifiable → over-floor (drop)
  }catch(e){ return Infinity; }
}
const _DBAND_FLOOR={monthly:5, quarter_end:10};   // per-band staleness floors — mirrors
                                                  // dated_gex_feed._BAND_STALE_FLOOR_DAYS
function _dglBands(){                        // the drawn (non-expired, FRESH, ≤5) bands
  const b=DBOOK.book; if(!b||!Array.isArray(b.bands)) return [];
  const today=new Date().toISOString().slice(0,10);
  return b.bands.filter(bd=>String(bd.expiry||'')>=today)
                .filter(bd=>_dbAge(bd)<=(_DBAND_FLOOR[bd.band]??5))   // stale band ≠ live structure
                .slice(0,5);
}
// the drawn bands AFTER the tenor date pills (07-25): the ladder + its gutter count
// honor per-expiry visibility; the HEDGE RAIL stays on _dglBands — the pills toggle
// walls/OI columns only, never the rail's admission
function _dglVis(){ return _dglBands().filter(bd=>tenorExpOn(String(bd.expiry))); }
function paintDatedOI(){
  if(!MAP||!MAP.datedOIG) return;
  const b=DBOOK.book;
  const ok=DOI_ON&&(typeof LIVE==='undefined'||LIVE)&&datedOIAvail()&&MSTRIKES.length;
  const key=(ok?String(b.as_of)+'@'+new Date().toISOString().slice(0,10):'off')+`#${MAPX.pLow}|${MAPX.pHigh}|${MSTRIKES.length}|${MAPX.nT}|${MAPX.lineEnd}|${Math.round((D.spot||0)/10)}`;   // spot bucket → arrows re-evaluate as spot eases across a cluster; date → ages re-dim at midnight without a new pull
  if(key===MAP._dokey) return;
  MAP._dokey=key;
  if(!ok||!MAPX.nT){ MAP.datedOIG.innerHTML=''; if(MAP.datedOILgdG)MAP.datedOILgdG.innerHTML=''; return; }
  const X=MAPX, step=((X.pHigh-X.pLow)>520)?10:5, k0=MSTRIKES[0];
  const profs=[]; let mx=0, kmax=null;
  _dglVis().forEach(bd=>{
    const buckets=new Array(MSTRIKES.length).fill(0); let placed=0;
    for(const row of (bd.strikes||[])){
      if(!Array.isArray(row)||!isFinite(row[0])||row.length<5) continue;
      // NET dated GEX per strike = call_gex − put_gex (assumed dealer sign,
      // the SAME convention the live bars use — one sign language on the map)
      const net=((+row[3]||0)-(+row[4]||0));
      const a=Math.abs(net);
      if(a>mx){ mx=a; kmax=+row[0]; }               // GLOBAL max: every strike counts,
      const idx=Math.round((row[0]-k0)/step);       // in-frame or not (scale honesty)
      if(idx>=0&&idx<buckets.length){ buckets[idx]+=net; placed++; }
    }
    if(placed>0) profs.push({i:profs.length, head:_dglHead(bd), tag:_dexp(bd.expiry),
                             age:_dbAge(bd), buckets});   // per-band freshness (H9)
  });
  if(!mx||!profs.length){ MAP.datedOIG.innerHTML=''; if(MAP.datedOILgdG)MAP.datedOILgdG.innerHTML=''; return; }
  const colX=i=>X.stripX0+STRIP.padL+i*STRIP.pitch;   // stripX0===lineEnd when the raw-book panes are off
  const cellX=i=>colX(i)+STRIP.cellInset, cellW=STRIP.colW-2*STRIP.cellInset;
  const cellH=Math.max(2, Math.min(MROWH-1, 14));
  const clampT=X.padT, clampB=X.H-X.padB, sy=yFor(D.spot);
  let svg='';
  // gutter room: recessed panel + edge hairlines. The LEFT hairline is SPLIT at spot
  // so the unified iris crosshair reads as carrying THROUGH the divider — live lane
  // and dated columns become one field joined at the price you care about.
  svg+=`<rect x="${X.stripX0}" y="${X.padT}" width="${X.stripGutter}" height="${(X.H-X.padT-X.padB).toFixed(1)}" rx="3" fill="var(--dgl-gutter)" style="shape-rendering:auto"/>`
     +`<line x1="${X.stripX0}" x2="${X.stripX0}" y1="${X.padT}" y2="${Math.max(X.padT,sy-8).toFixed(1)}" style="stroke:var(--hairline)"/>`
     +`<line x1="${X.stripX0}" x2="${X.stripX0}" y1="${Math.min(X.H-X.padB,sy+8).toFixed(1)}" y2="${(X.H-X.padB).toFixed(1)}" style="stroke:var(--hairline)"/>`
     +`<line x1="${X.railX0}" x2="${X.railX0}" y1="${X.padT}" y2="${(X.H-X.padB).toFixed(1)}" style="stroke:var(--hairline)"/>`;
  // single-row column headers — identity as TEXT, read not decoded
  profs.forEach(p=>{
    const cx=colX(p.i)+STRIP.colW/2;
    // per-band freshness (H9): an aged column DIMS (the <g> wrap below) and its
    // header carries the age in the hover title — a text suffix ("·3d") was
    // tried and collides at the 21px column pitch, so the ink stays quiet
    // sits just above the panel — follows padT so it stays put when the rail's taller
    // header band raises it (both gutters then share ONE header baseline)
    svg+=`<text x="${cx.toFixed(1)}" y="${(X.padT-9).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" font-family="var(--mono)" letter-spacing=".04em" style="fill:var(--ink-dim);${_HALO}">${p.head}<title>${p.tag} · pulled ${p.age===0?'today':p.age+'d ago'}</title></text>`;
  });
  profs.forEach(p=>{
    const cx=colX(p.i), xC=cellX(p.i), cells=[];
    svg+=`<g opacity="${p.age>=2?0.62:1}">`;   // aged band (H9): whole column recedes —
                                               // visible, but never as loud as fresh ink
    // heat cells — CLAMPED to the panel (an edge row must never paint over the
    // headers or spill past the panel foot); collected for cluster/arrow detection
    MSTRIKES.forEach((k,j)=>{
      const net=p.buckets[j]; if(!net) return;
      const q=Math.sqrt(Math.abs(net)/mx);
      if(q<0.07) return;                            // cull: sub-legible ambient dust
      const stp=q<0.25?1:q<0.45?2:q<0.65?3:q<0.85?4:5;
      const C=(net>=0?_DGLP:_DGLN)[stp-1];
      const yT=Math.max(clampT, yFor(k)-cellH/2), yB=Math.min(clampB, yFor(k)+cellH/2);
      const h=yB-yT; if(h<1) return;                // fully outside the panel → skip
      cells.push({j, k, net, q, stp, yc:Math.max(clampT+4,Math.min(clampB-4,yFor(k)))});
      svg+=`<rect x="${xC.toFixed(1)}" y="${yT.toFixed(1)}" width="${cellW}" height="${h.toFixed(1)}" fill="${C}"><title>${p.tag} · ${k.toLocaleString('en-US')} · ${net>=0?'+':'−'}${_gfmt(Math.abs(net))}</title></rect>`;
    });
    // CLUSTERS: maximal runs of adjacent same-sign cells; magnitude = Σ|net|, anchor
    // = the run's biggest cell. Gate: peak step ≥3 AND run ≥ 35% of the book max —
    // nothing litters a calm day, but a distributed wall still qualifies by mass.
    const clusters=[]; let run=null;
    cells.forEach(c=>{ const s=c.net>=0;
      if(run&&run.s===s&&c.j===run.lastJ+1){ run.lastJ=c.j; run.M+=Math.abs(c.net); if(c.q>run.peak.q) run.peak=c; }
      else { run={s, lastJ:c.j, M:Math.abs(c.net), peak:c}; clusters.push(run); } });
    const worthy=clusters.filter(r=>r.peak.stp>=3 && r.M>=0.35*mx).sort((a,b)=>b.M-a.M);
    const pick=worthy.slice(0,1);
    const opp=worthy.find(r=>pick.length&&r.s!==pick[0].s); if(opp) pick.push(opp);   // ≤2, 2nd only if opposite-sign
    // ARROW = market-maker ACTION at the level (validated from dealer hedging):
    //   ↑ BUY / promote = (green & below spot) OR (red & above spot)
    //   ↓ SELL hard into = (green & above spot) OR (red & below spot)
    // GREEN points TOWARD spot (fade: support below / cap above); RED points AWAY
    // (chase: accelerate the break). Ink glyph + surface halo ⇒ ≥3:1 on any cell,
    // both themes; the CELL HUE still carries pin-vs-push, the ARROW carries buy/sell.
    pick.forEach(r=>{
      const green=r.s, up = green ? (r.peak.k<D.spot) : (r.peak.k>D.spot);
      const cxc=xC+cellW/2, yc=r.peak.yc, t=(6+3*Math.min(1,r.M/mx))/2;
      const d = up ? `M${cxc.toFixed(1)},${(yc-t).toFixed(1)} L${(cxc-t).toFixed(1)},${(yc+t).toFixed(1)} L${(cxc+t).toFixed(1)},${(yc+t).toFixed(1)} Z`
                   : `M${(cxc-t).toFixed(1)},${(yc-t).toFixed(1)} L${(cxc+t).toFixed(1)},${(yc-t).toFixed(1)} L${cxc.toFixed(1)},${(yc+t).toFixed(1)} Z`;
      svg+=`<path d="${d}" style="fill:var(--ink);paint-order:stroke;stroke:var(--surface-2);stroke-width:2;stroke-linejoin:round"><title>${p.tag} · ${r.peak.k.toLocaleString('en-US')} · MM ${up?'BUY / promote':'SELL hard into'} · ${_gfmt(r.M)}</title></path>`;
    });
    // plain wall tick only where NO arrow claimed the column (arrow supersedes it)
    if(!pick.length&&cells.length){
      let top=cells[0]; for(const c of cells) if(c.q>top.q) top=c;
      const yT=Math.max(clampT,yFor(top.k)-cellH/2), h=Math.min(clampB,yFor(top.k)+cellH/2)-yT;
      svg+=`<rect x="${(cx-(STRIP.gap/2+STRIP.tickW/2)).toFixed(1)}" y="${Math.max(clampT,yT-1).toFixed(1)}" width="${STRIP.tickW}" height="${Math.min(h+2,clampB-Math.max(clampT,yT-1)).toFixed(1)}" fill="var(--ink)"/>`;
    }
    svg+='</g>';                               // close the per-band freshness group (H9)
  });
  MAP.datedOIG.innerHTML=svg;
  // LEGEND — bottom caption strip, right-aligned (outside every plot element by
  // construction; Watchtower marker is clamped into the frame). Discloses the

      try{

        if(!cap||!lgd) break;

        if(!cb.width) break;                        // hidden-panel measure → keep tier

    }

}
// ---- DEX OVERLAY (07-25, Layers toggle, default OFF): the direction-side field on

//     the naive net is LONG by construction, so its sign must never draw as a signal;

function dexAvail(){ const x=(typeof T!=='undefined'&&T&&T.dex)||D.dex; return !!(x&&x.v===1&&(x.nbs||x.fbs)); }

  const bucket=src=>{

// vanna channel can out-vote it. The feed sweeps the spot-vol beta (0→1) and asks
// whether the sign of that hedge FLIPS. When it does, the lane gets a lantern hatch,
// no directional fill, and both bounds in the tooltip — "gamma says sell, vanna says

// ---- PRICE SCRUB: drag the map, the rail answers -------------------------------
// The rail's headline is "what a +1% move forces dealers to trade". The obvious next
// question is "…and at 7,650?" — so drag. A scrub line follows the finger, and every
// lane re-reads: net γ at that price, and the dollars of delta dealers must trade to
// get there from spot. Release and it STICKS (a tablet has no hover; a value that
// evaporates on lift is unreadable). Tap the spot row, or press Esc, to clear.
//
// The whole-chart click that opened Magnet Zones was removed — this is a DRAG, and a

const _RAIL_SLOT='display:inline-block;min-width:7ch;text-align:left;font-variant-numeric:tabular-nums';
function _railChipTail(){                 // FIXED WIDTH — see the note above _railChipSync

function _railChipSync(){                 // patch the ONE node the scrub owns

function _scrubPrice(y){                  // inverse of yFor(), clamped to the plot
  const X=MAPX, t=X.padT, b=X.H-X.padB;
  const yy=Math.max(t,Math.min(b,y));

function gxMountScrub(){

    return (e.clientY-r.top)*(MAPX.H/Math.max(1,r.height)); };
  let raf=0, pend=null;
  const set=p=>{                          // coalesced: at most one repaint per frame
    pend=p;

      RAIL_CUR=pend;

// ---- DATED BOOK overlay: far structural OI walls (next 2 monthlies + quarter-end) ----
// Shaded by EXPIRATION — nearer expiries brighter, further dimmer — so one glance says
// which tenor a wall belongs to. Walls picked moneyness-aware at DISPLAY time (a max-OI
// call strike BELOW spot is real OI but not a ceiling): the ceiling = biggest-OI call
// strike >= spot, the floor = biggest-OI put strike <= spot, falling back to the raw
// max-OI wall tagged ITM. In-band walls draw as dashed lines; off-plot walls become
// edge markers (▲/▼ + price + tenor) so hundreds-of-points-out structure stays visible.
// The book updates ~daily (nightly sidecar) — the chip strip carries its as-of stamp.
const _DSHADE=[0.85,0.62,0.45];                       // per-band shade ladder: front → far
                                                      // (raised 07-10: the old .30 floor fell
                                                      // below the 3:1 graphics-contrast line in
                                                      // BOTH themes — an illegible encoding isn't
                                                      // an encoding)
const _DDASH=['6 3','4 4','2 5'];                     // dash length also encodes tenor (redundant
                                                      // channel: longer dash = nearer expiry)
function _dexp(iso){ const m=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  try{ const p=iso.split('-'); return m[+p[1]-1]+p[2]; }catch(e){ return iso; } }
function _dwalls(b, spot){
  const pick=(arr,pred)=>{ for(const kv of (arr||[])) if(kv&&isFinite(kv[0])&&pred(kv[0])) return +kv[0]; return null; };
  // m7: the engine's nearest-STRONG wall leads when present — the put wall should
  // mark support NEAR price, not a 7000-class crash bet 8% below. The ranked pick
  // and the magnitude king stay as fallbacks (pre-m7 books carry no near_* keys).
  // live-side guard (verify round): near_* was computed at pull-time spot — a wall
  // price has since walked through must not lead; the ranked pick takes over.
  const ncw=(b.near_call_wall!=null&&isFinite(b.near_call_wall)&&b.near_call_wall>spot)?+b.near_call_wall:null;
  const npw=(b.near_put_wall!=null&&isFinite(b.near_put_wall)&&b.near_put_wall<spot)?+b.near_put_wall:null;
  const cw=ncw??pick(b.top_calls,k=>k>=spot), pw=npw??pick(b.top_puts,k=>k<=spot);
  return { cw: cw??(isFinite(b.call_wall)?+b.call_wall:null), cItm: cw==null&&b.call_wall!=null,
           pw: pw??(isFinite(b.put_wall)?+b.put_wall:null),  pItm: pw==null&&b.put_wall!=null };
}

const _HALO='paint-order:stroke;stroke:var(--surface-2);stroke-width:3px;';   // surface halo: labels stay legible over the (now longer) bars
const _HALO2='paint-order:stroke;stroke:var(--surface-2);stroke-width:3.8px;';  // wall labels: 12px ink, and a max-length bar can reach either anchor rail
function paintDated(){
  if(!MAP||!MAP.datedG) return;

    bands=((d&&Array.isArray(d.bands))?d.bands.slice(0,4):[])           // 4-band world (H8: two quarterlies)
      .filter(b=>tenorExpOn(String(b&&b.expiry)));                      // tenor date pills (07-25): per-expiry visibility inside the Walls master
  const on=wallsOn();
  const sg=(D.sigma&&isFinite(D.sigma)&&D.sigma>0)?D.sigma:0;
  const key=(on?bands.map(b=>`${b.expiry}|${b.call_wall}|${b.put_wall}|${b.as_of||''}`).join(';'):'off')
    +`#${X.pLow}|${X.pHigh}|${Math.round((D.spot||0)/10)}|${Math.round(sg)}|${D.callCeil}|${D.putFloor}|${X.H}|${X.lineEnd}`;   // spot bucketed to 10pts → σ-labels stay honest, no 60fps churn; H/lineEnd → the nudge re-lays out on resize

  // — one line/marker at the FRONT band's shade with the tenor tags merged, instead
  // of three identical lines and three labels stamped on the same y (unreadable smear
  // exactly on the crash day the far floor matters most).

  const put_=(side,k,itm,tag,i)=>{
    if(k==null||!isFinite(k)) return;
    const kk=side+'|'+k, e=ent.get(kk);
    if(e){ if(!e.tags.includes(tag)) e.tags.push(tag); e.itm=e.itm||itm; }
    else ent.set(kk,{side,k,itm,tags:[tag],idx:i});
  };

    const w=_dwalls(b,spot), tag=_dexp(b.expiry);
    put_('c',w.cw,w.cItm,tag,i); put_('p',w.pw,w.pItm,tag,i);
  });

  // chips, now lines on the graph; merged by strike so a level shared with a
  // monthly wall draws once with combined tags. Tag = the standard's tenor prefix.

  if(D.putFloor!=null&&isFinite(D.putFloor)&&D.putFloor>0) put_('p',+D.putFloor,false,'1-7DTE',0);

  // two lines of text together — unreadable exactly when the two levels agree, which is
  // when they matter most. Three fixes, in order of effect:
  //   1. MERGE same-side walls that sit within a label-height of each other into ONE
  //      label carrying a price RANGE and the union of tenor tags. Text merges; every
  //      wall keeps its own LINE at its own true price, so no level ever disappears.
  //   2. NUDGE what is left using the map's existing idiom (the MIDS block in gxPaint):
  //      sort by y, push down, pull back up, and draw a LEADER whenever a label had to
  //      leave its line — a displaced label that doesn't say so is a lie about which
  //      line it belongs to.
  //   3. ROUND the price. near_* walls are floats: the label read "7,626.451". At 0dp it
  //      reads "7,626" and buys back the 4 characters the 9px→12px bump costs.

  // computed analytically from the character count — never getBBox, which is the classic
  // measure-then-relayout jitter loop. So nothing here moves as spot eases or you scrub.

    const kLo=Math.min(...ks), kHi=Math.max(...ks);

    const sdT=(sd!=null&&isFinite(sd))?` ${sd>=0?'+':'−'}${Math.abs(sd).toFixed(1)}σ`:'';

    g.gwT=tags.map(t=>`[${t}]`).join('')+'GW'+g.side;
    // the title's tenor tags already name the book — no "book …" row repeating them
    g.tip=`k:wall=${kT}${sdT}`
      +(g.ms.some(m=>m.e.itm)?`¦f:ITM pick`:'')
      +`¦n:resting OI · magnitude only — untiered`;
    // declutter 07-22: hue lives only on the ▲/▼ glyph; the text dims to --ink-dim
    // so months-out OI walls stop competing with the live GW labels (which stay
    // jade/coral). g.lbl (full string) still sizes the analytic width below.

    svg+=`<text x="${LX.toFixed(1)}" y="${(g.ly+LABF*0.35).toFixed(1)}" text-anchor="start" font-size="${LABF}" font-weight="700" font-family="var(--mono)" style="fill:var(--ink-dim);opacity:${Math.min(1,sh+0.12)};cursor:pointer;${_HALO2}" data-name="${g.gwT}" data-tip="${g.tip}"><tspan style="fill:${g.col}">${g.glyph}</tspan>${g.rest}</text>`;

// N22 SHARED ANCHOR (review 07-16): the map marker and the call block BOTH resolve
// the called-from spot/σ here, and a fallback freezes ONCE onto the wt object — the
// anchorless path (demo / synthetic) had the marker re-anchoring to the per-frame
// eased spot while the block anchored at render time: two targets, ~3pts apart, on
// screen at once. No σ-ruler anywhere → null, and NO target is drawn — the marker
// used to invent one from the modeled-σ default while the block refused.
function wtAnchor(w){
  if(w._aS===undefined) w._aS=(w.anchorSpot!=null&&isFinite(w.anchorSpot))?w.anchorSpot:(isFinite(D.spot)?D.spot:null);
  if(w._aG===undefined) w._aG=(w.anchorSigma!=null&&isFinite(w.anchorSigma)&&w.anchorSigma>0)?w.anchorSigma:((D.sigma>0)?D.sigma:null);
  return w;
}
// THE CALL BLOCK (07-16) — direction + magnitude as one glanceable unit: the target
// price big on top, "σ ≈ points · horizon" under it. Same N22 anchor math as the
// map marker (wtAnchor), so the two can never disagree. Non-calls stay honest:
// SETTLE (grey) / FIGHT (lantern) / no read — a stance must never wear a call's
// jade or coral.
function towerCallHTML(w){
  if(w && w._none) return {cls:'', html:`<span class="dir">—</span><span class="mag">no read yet</span>`};
  if(w && w.fired && w.dir){
    const up=w.dir==='call', mag=+w.mag||0;
    const hzm=(+w.horizon>0)?+w.horizon:30, ageMin=w.ts?(Date.now()-(+new Date(w.ts)))/60000:0;
    const {_aS:aS, _aG:aG}=wtAnchor(w);
    const pts=(mag&&aG!=null)?mag*aG:null;
    const tgt=(aS!=null&&pts!=null)?aS+(up?1:-1)*pts:null;
    const dirT=`${up?'▲':'▼'} ${tgt!=null?f(tgt,0):cap(String(w.dir))}`;
    // a fired row can arrive sizeless (mag null/0) — the direction is real, the
    // ruler isn't: say "size unstated" instead of demoting a live call to FLAT
    // while the sentence beside it still reads ▲/▼ (second review, 07-16)
    const magT=`${mag?`${mag.toFixed(2)}σ${pts!=null?` ≈ ${Math.round(pts)} pts`:''}`:'size unstated'} · ${hz(hzm)}`;
    if(ageMin>hzm) return {cls:'', aged:true, html:`<span class="dir">${dirT}</span><span class="mag">${magT} · aged out</span>`};   // horizon spent — the map marker is down too
    return {cls:up?'up':'dn', html:`<span class="dir">${dirT}</span><span class="mag">${magT}</span>`};
  }
  if(w && w.stance==='fight') return {cls:'fight', html:`<span class="dir">⚔ FIGHT</span><span class="mag">two-sided · no call</span>`};
  if(w && w.stance==='settle') return {cls:'', html:`<span class="dir">■ SETTLE</span><span class="mag">pin / drift · no call</span>`};
  return {cls:'', html:`<span class="dir">■ FLAT</span><span class="mag">no clear edge</span>`};
}

function pickWt(spot){ let best=SCANS[0],bd=1e9; for(const s of SCANS){ const d=Math.abs(spot-s.spot); if(d<bd){bd=d;best=s;} } return best.wt; }
function hz(mins){ if(!mins) return ''; return (mins%60===0) ? `~${mins/60}h` : `~${mins}m`; }
function towerNextHTML(wt, magnet, spot, sigma){
  // N20: a live session with no judged Watchtower row yet says so — it must never
  // wear the demo snapshot's verdict as its own
  if(wt && wt._none) return `<span class="nx-dir flat">■ No read yet</span> — the Watchtower hasn't judged a scan today.`;
  if(wt && wt.snippet){
    const sn=String(wt.snippet), m=sn.match(/NEXT:\s*(.+)$/m);
    // a "⚠ contested — …" line appended to the snippet rides along, muted (its own
    // line would otherwise be dropped by the NEXT-line extraction above)
    if(m){ const wr=sn.match(/^\s*(⚠.+)$/m);
      return `<span class="nx-chev">▶</span>${cap(m[1].trim())}`+(wr?` <span class="nx-warn">${wr[1].trim()}</span>`:''); }
  }

    const up = wt.dir==='call';

    const aG=(wt.anchorSigma!=null&&isFinite(wt.anchorSigma)&&wt.anchorSigma>0)?wt.anchorSigma:((sigma>0)?sigma:null);
    const bits=[ wt.mag?`~${(+wt.mag).toFixed(2)}σ${aG?` ≈ ${Math.round((+wt.mag)*aG)} pts`:''}`:'', hz(wt.horizon) ].filter(Boolean).join(' · ');
    // wt-2 wording (mirrors render_snippet): name the call by its relation to the
    // magnet — "ride" WITH the pull toward it, or a move AGAINST the pull; never
    // "fade toward" a magnet on the wrong side of the move (the wt-1 contradiction).
    let tail='';
    if(magnet!=null && isFinite(magnet) && spot!=null && isFinite(spot)){
      const tgt=Math.round(magnet).toLocaleString('en-US');
      const toward=(magnet>=spot)===up;

// one-pass schema highlighter: strings → .sv, keys → .sk, numbers/null/bool → .sn,
// a trailing // comment → .scm; everything else (braces, commas) keeps the quiet base ink.
function hlLine(raw){
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let cm=''; const ci=raw.indexOf('//');
  let code = ci>=0 ? raw.slice(0,ci) : raw;
  if(ci>=0) cm = `<span class="scm">${esc(raw.slice(ci))}</span>`;
  code = esc(code).replace(/"[^"]*"\s*:|"[^"]*"|(?:^|[\s{,\[])[A-Za-z_]\w*\s*:|-?\d+(?:\.\d+)?|\b(?:null|true|false)\b/g, tok=>{
    if(/^".*"\s*:$/.test(tok)) return tok.replace(/^("[^"]*")(\s*:)$/, '<span class="sk">$1</span>$2');
    if(tok[0]==='"') return `<span class="sv">${tok}</span>`;
    if(/:\s*$/.test(tok)) return tok.replace(/([A-Za-z_]\w*)(\s*:)$/, '<span class="sk">$1</span>$2');
    return `<span class="sn">${tok}</span>`;
  });
  return code + cm;
}

// ---- DEX readiness: derived LIVE from the diary rows (storage key `dex_views` on
// each SPX row; absent = no read — the card renders the absence, never a zero).
// GREEN = the NEWEST row carries dex_views with net_dex_total; YELLOW = only older
// rows carry it (stale surface on a live diary); cold = no row has ever spoken.
// Gate on dex_v==1: a version bump makes rows unpoolable — the card says so
// instead of quietly mixing eras.
function latestDexRow(){
  const seen=new Set(); let newest=null, newestDex=null;
  for(const arr of [LIVEROWS,DIARY_ROWS]) for(const s of (arr||[])){
    if(!s||!s.ts||seen.has(s.ts)) continue; seen.add(s.ts);
    if(!newest||String(s.ts)>String(newest.ts)) newest=s;
    if(s.dex&&(!newestDex||String(s.ts)>String(newestDex.ts))) newestDex=s;
  }
  return {newest, newestDex};
}
function dexReadiness(L){

    <div class="rd-sum">${L.rd.summary}</div></div>`;
  const green=newest&&newest.ts===newestDex.ts&&d.tot!=null;
  const stTxt=green?'GREEN · live':'YELLOW · stale', stHue=green?'var(--jade)':'var(--lantern)';
  const aP=(d.above!=null)?Math.round(d.above*100):null;

  return `<div class="rd">
