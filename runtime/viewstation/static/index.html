let SIEGE=null, _siegeLoading=false;
async function loadSiege(){
  if(_siegeLoading) return; _siegeLoading=true;
  const out={latest:null, cards:[]};
  try{
    const r=await fetch('/api/raw/file?root=state&path=siege/latest.json',{cache:'no-store'});
    const d=await r.json(); if(d && d.kind==='json') out.latest=d.data;   // {"error":"not found"} → stays cold
  }catch(e){}
  try{
    const day=(out.latest&&out.latest.session)||new Date().toISOString().slice(0,10);
    const r=await fetch(`/api/raw/file?root=state&path=siege/cards/${encodeURIComponent(day)}.jsonl&limit=500`,{cache:'no-store'});
    const d=await r.json(); if(d && d.rows) out.cards=d.rows;
  }catch(e){}
  SIEGE=out; _siegeLoading=false;
  const L=LY.find(l=>l.id===selLayer);
  if(L && L.stack==='siege') renderDetail();
}
function siegeReadiness(L){
  const lt=SIEGE&&SIEGE.latest, cards=(SIEGE&&SIEGE.cards)||[];
  // store-sourced strings pass through innerHTML — escape them (same local-helper
  // pattern as hlLine/annotatedJSON; numbers go through f()/Math.round and are safe)
  const esc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const doctrine=`<div class="blockers"><span class="blk">SIEGE = volume showed up → expect BREAK</span><span class="blk ok">QUIET = nobody fought → expect HOLD</span></div>`;
  const wiredBlk=`<span class="blk ok">✓ wired — siege_effort_at_walls in the watchtower payload (since wt-7)</span>`;
  if(!lt){
    const why = SIEGE ? 'state/siege/ absent — the collector has not written yet' : 'reading state/siege/ …';
    return `<div class="rd">
      <div class="rd-h"><span class="lab">Store · state/siege/</span><span class="pct">cold</span></div>
      <div class="track" style="opacity:.45"><i style="width:100%;background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 11px)"></i></div>
      <div class="rd-fr">${why}</div>
      ${L.id==='seffort'?doctrine:''}
      <div class="blockers"><span class="blk">⛔ not yet run — no session recorded</span>${L.id==='sword'?wiredBlk:''}</div>
      <div class="rd-sum">${L.rd.summary}</div></div>`;
  }
  const ago=(()=>{ try{ const m=Math.round((Date.now()-new Date(lt.as_of).getTime())/60000);
    return m<1?'just now':(m<120? m+'m ago' : Math.round(m/60)+'h ago'); }catch(e){ return '—'; } })();
  const fresh=`as_of ${esc(String(lt.as_of||'—').replace('T',' ').slice(0,16))} · ${ago} · session ${esc(lt.session||'—')}`;
  // effort_pct is ALWAYS a 0-100 percentile (siege effort.py: 100·share) — never rescale:
  // a ratio heuristic would show a 0.8th-pct dead-quiet touch as "80%"
  const hp=v=>Math.round(v);
  const vHue=v=>v==='SIEGE'?'var(--coral)':(v==='QUIET'?'var(--jade)':'var(--ink-dim)');
  const tw=lt.towers||[], hOK=lt.health&&lt.health.feed==='OK';
  if(L.id==='sfeed'){
    const feed=esc((lt.health&&lt.health.feed)||'—');
    return `<div class="rd">
      <div class="rd-h"><span class="lab">Feed health</span><span class="pct" style="color:${hOK?'var(--jade)':'var(--coral)'}">${feed}</span></div>
      <div class="track"><i style="width:100%;${hOK?'':'background:var(--coral)'}"></i></div>
      <div class="rd-fr">${fresh}</div>
      <div class="rd-grid">
        <div class="rd-stat"><div class="k">SPX↔SPY ratio</div><div class="v">${lt.spx_spy_ratio!=null?f(lt.spx_spy_ratio,3):'—'}</div></div>
        <div class="rd-stat"><div class="k">Spot</div><div class="v">${lt.spot!=null?f(lt.spot,1):'—'}</div></div>
        <div class="rd-stat"><div class="k">Bars source</div><div class="v" style="font-size:11px">SPY 1-min tape</div></div>
        <div class="rd-stat"><div class="k">Saturated</div><div class="v" style="font-size:12px;color:${lt.saturated?'var(--coral)':'var(--jade)'}">${lt.saturated?'yes — clipped':'no'}</div></div>
      </div>
      <div class="blockers"><span class="blk ${hOK?'ok':''}">${hOK?'✓ feeding the siege stack':'⛔ '+feed+(lt.health&&lt.health.reason?' · '+esc(lt.health.reason):'')}</span></div>
      <div class="rd-sum">${L.rd.summary}</div></div>`;
  }
  if(L.id==='stouch'){
    // frozen_at may be a price or a timestamp depending on the collector build — show either honestly
    const fz=t=>t.frozen_at==null?'':(' · frozen '+(typeof t.frozen_at==='number'?'@ '+f(t.frozen_at,0):esc(String(t.frozen_at).replace('T',' ').slice(5,16))));
    const rows=tw.map(t=>`<div class="rd-stat"><div class="k">${esc(String(t.kind||'—').replace('_',' '))} · ${esc(t.status||'—')}</div>
      <div class="v" style="font-size:12px">${t.level!=null?f(t.level,0):'—'}${t.sigma_dist!=null?' · '+f(t.sigma_dist,2)+'σ':''}${fz(t)}</div></div>`).join('');
    return `<div class="rd">
      <div class="rd-h"><span class="lab">Towers on watch</span><span class="pct">${tw.length}</span></div>
      <div class="track"><i style="width:${tw.length?100:0}%"></i></div>
      <div class="rd-fr">${fresh}</div>
      ${rows?`<div class="rd-grid">${rows}</div>`:''}
      <div class="blockers"><span class="blk ${tw.length?'ok':''}">${tw.length?'✓ towers handed over by GexBox':'no towers in range this scan'}</span></div>
      <div class="rd-sum">${L.rd.summary}</div></div>`;
  }
  if(L.id==='seffort'){
    const et=tw.filter(t=>t.effort_pct!=null);
    const rows=et.map(t=>`<div class="rd-stat"><div class="k">${esc(String(t.kind||'—').replace('_',' '))} ${t.level!=null?f(t.level,0):''}</div>
      <div class="v" style="font-size:12px;color:${vHue(t.verdict)}">${hp(t.effort_pct)}% effort · ${esc(t.verdict||'—')}</div></div>`).join('');
    return `<div class="rd">
      <div class="rd-h"><span class="lab">Effort verdicts</span><span class="pct">${et.length}</span></div>
      <div class="track"><i style="width:${et.length?100:0}%"></i></div>
      <div class="rd-fr">${fresh}</div>
      ${rows?`<div class="rd-grid">${rows}</div>`:''}
      ${doctrine}
      <div class="rd-sum">${L.rd.summary}</div></div>`;
  }
  if(L.id==='sscore'){
    const res=cards.filter(c=>c&&c.outcome&&c.outcome!=='UNRESOLVED');
    const br=res.filter(c=>c.outcome==='BREAK').length, hd=res.filter(c=>c.outcome==='HOLD').length;
    const hit=res.filter(c=>(c.verdict==='SIEGE'&&c.outcome==='BREAK')||(c.verdict==='QUIET'&&c.outcome==='HOLD')).length;
    const bl=lt.baseline||{}, bw={cold:12,warming:55,robust:100}[bl.label]||0;
    return `<div class="rd">
      <div class="rd-h"><span class="lab">Baseline clock</span><span class="pct">${esc(bl.label||'—')}</span></div>
      <div class="track"><i style="width:${bw}%"></i></div>
      <div class="rd-fr">${bl.days_accrued!=null?bl.days_accrued:'—'} baseline day${bl.days_accrued===1?'':'s'} accrued · ${fresh}</div>
      <div class="rd-grid">
        <div class="rd-stat"><div class="k">Resolved today</div><div class="v">${res.length}</div></div>
        <div class="rd-stat"><div class="k">BREAK / HOLD</div><div class="v">${br} / ${hd}</div></div>
        <div class="rd-stat"><div class="k">Doctrine hits</div><div class="v">${res.length?hit+' / '+res.length:'—'}</div></div>
        <div class="rd-stat"><div class="k">Cards file</div><div class="v" style="font-size:11px">cards/${lt.session?esc(lt.session):'&lt;date&gt;'}.jsonl</div></div>
      </div>
      <div class="blockers"><span class="blk">record-only · gates nothing</span></div>
      <div class="rd-sum">${L.rd.summary}</div></div>`;
  }
  // sword — the mouth, open since wt-7 (2026-07-18)
  const words=tw.filter(t=>t.verdict&&t.verdict!=='NEUTRAL');
  return `<div class="rd">
    <div class="rd-h"><span class="lab">Watchtower wiring</span><span class="pct" style="color:var(--jade)">wired</span></div>
    <div class="track"><i style="width:${words.length?100:35}%"></i></div>
    <div class="rd-fr">${fresh}</div>
    <div class="rd-grid">
      <div class="rd-stat"><div class="k">Words composed today</div><div class="v">${words.length}</div></div>
      <div class="rd-stat"><div class="k">Who hears them</div><div class="v" style="font-size:11px">watchtower payload · wt-8</div></div>
    </div>
    <div class="blockers">${wiredBlk}<span class="blk">record-only grading · gates nothing</span></div>
    <div class="rd-sum">${L.rd.summary}</div></div>`;
}

function renderDetail(){
  const L = LY.find(x=>x.id===selLayer);
  const dt=$("#dt");
  dt.style.setProperty('--c','var('+L.hue+')');
  // DEX Schema·source box reads the LIVE source off the newest dex_views row —
  // the engine stamps it per row (native vs proxy), so a baked string would lie
  if(L.id==='dex'&&L.schema){
    const lx=(typeof latestDexRow==='function')?latestDexRow().newestDex:null;
    L.schema.src='dex_views · source: '+((lx&&lx.dex&&lx.dex.src)?String(lx.dex.src):'— (no row yet)');
  }
  const tierLabel={feed:'data feed',sensory:'sensory layer',lens:'lens',processor:'processor'}[L.tier]||L.tier;
  const tchip = `<span class="tier ${L.tier}"><i></i>${tierLabel}</span>`;
  dt.innerHTML = `
    <div class="dt-top">
      <div class="dt-badge ${L.base?'base':''}">${L.num}</div>
      <div class="dt-name">${L.name}<em>${L.code}</em></div>
    </div>
    <div class="dt-meta">${tchip}${pill(L.status)}</div>
    <div class="dt-role">${L.role}</div>
    <p class="dt-plain">${L.plain}</p>
    ${L.schema
      ? `<div class="dt-schema"><div class="sc-head"><span class="sc-k">Schema · incoming record</span><span class="sc-src">${L.schema.src}</span></div><pre>${L.schema.code.map(hlLine).join('\n')}</pre></div>`
      : `<div class="dt-eg"><span class="eg-k">For example</span>${L.example}${DGM[L.id]||''}</div>`}
    ${L.subs ? `<div class="dt-subs"><span class="subs-k">What it contributes</span><div class="subs-grid">${
      L.subs.map(s=>`<div class="dt-sub"><div class="sub-h">${s.k}</div>${s.dgm}<div class="sub-d">${s.d}</div></div>`).join('')
    }</div></div>` : ''}
    ${readinessHTML(L)}`;
}

function selectLayer(id){
  selLayer=id;
  document.querySelectorAll('.plane, .tower3d').forEach(p=>p.classList.toggle('sel', p.dataset.id===id));
  renderDetail();
}

// ---- stack geometry: one shared deck-local z axis, z=0 = the glass floor ----
// Constants sized so a selected plane (scale 1.13 + 24px pop) keeps clear air inside the
// glass box (x ±170 vs sel ±162.7 · y ±112 vs ±105.1 · lid clears the popped top feed by
// 10px) and between planes.
// SPOTS — the deck floor plan (deck-local x centers). The main stack owns x=0; the
// watchtower stands at +272 (body x 257..287, clear of the glass wall at +170 and of a
// popped plane at ±162.7). FUTURE STACKS land on the −x side (≈ −360, −720, …) so the
// tower keeps open sight over every stack; layoutStacks refits from the extents.
const STK = {PGAP:34, TGAP:56, BEAM:80, BOXPAD:28, BOXTOP:34, POP:24, W:288, D:186, BOXHW:170, BOXHD:112,
  SPOTS:{main:0, tower:272, siege:-360},
  TOWER:{BODY_HW:15, BODY_HD:15, HEAD_HW:36, HEAD_HD:36, HEAD_H:56}};
function stackGeo(){
  // one shared z map; ladder() stacks a feed box + main planes exactly like the original
  // main-stack code, so both decks obey the same constants by construction
  const z = new Map();
  const ladder=(FEEDS,MAIN)=>{
    FEEDS.forEach((l,i)=>z.set(l.id, STK.BOXPAD + i*STK.PGAP));
    const boxTop = STK.BOXPAD + (FEEDS.length-1)*STK.PGAP + STK.BOXTOP;
    const gaps=[]; let zc = boxTop + STK.BEAM;
    MAIN.forEach((l,i)=>{
      if(i>0){
        const tierBreak = l.tier!==MAIN[i-1].tier;
        zc += tierBreak ? STK.TGAP : STK.PGAP;
        if(tierBreak) gaps.push({z0:zc-STK.TGAP+10, z1:zc-10});
      }
      z.set(l.id, zc);
    });
    return {boxTop, zTop:zc, gaps};
  };
  const FEEDS = LY.filter(l=>l.stack!=='siege' && l.tier==='feed');
  const MAIN  = LY.filter(l=>l.stack!=='siege' && l.tier!=='feed' && l.tier!=='processor');
  const m = ladder(FEEDS, MAIN);
  // the SIEGE deck at SPOTS.siege — unlike the main stack, its processors ARE planes
  // (the Scorekeeper and the dormant Tower Word live in the stack; nothing watches them)
  const SFEEDS = LY.filter(l=>l.stack==='siege' && l.tier==='feed');
  const SMAIN  = LY.filter(l=>l.stack==='siege' && l.tier!=='feed');
  const sg = ladder(SFEEDS, SMAIN);
  // the processor is NOT a plane — it watches from a tower on the ground plane at
  // SPOTS.tower, its amber head straddling the stack top (body ends 4px above the top
  // lens) so the sight-line looks gently DOWN at the stack from head height.
  const T=STK.TOWER, bodyH=m.zTop+4;
  const tower={X:STK.SPOTS.tower, BODY_HW:T.BODY_HW, BODY_HD:T.BODY_HD, BODY_H:bodyH,
    HEAD_HW:T.HEAD_HW, HEAD_HD:T.HEAD_HD, TOPZ:bodyH+T.HEAD_H, SIGHT_Z:m.zTop+28};
  return {z, boxTop:m.boxTop, zTop:m.zTop, gaps:m.gaps, FEEDS, MAIN, tower,
    siege:{X:STK.SPOTS.siege, boxTop:sg.boxTop, zTop:sg.zTop, gaps:sg.gaps, FEEDS:SFEEDS, MAIN:SMAIN}};
}

// fit + place the whole composition in the container, then align the DATA FEEDS pill to
// its REAL projected position (getBoundingClientRect of the 3D floor face).
function layoutStacks(){
  const stacks=$("#stacks"), deck=$("#deck");
  if(!stacks || !deck || !deck._geo) return;
  const cs=getComputedStyle(stacks);
  const padL=parseFloat(cs.paddingLeft), padR=parseFloat(cs.paddingRight);
  const padT=parseFloat(cs.paddingTop),  padB=parseFloat(cs.paddingBottom);
  // the legend owns the bottom-left corner — reserve its full column so the composition
  // can NEVER overlap it at any screen size (offsetWidth is 0 when the <=560px rule hides it)
  const lg=stacks.closest('.scene-card')?.querySelector('.legend');
  const left0=Math.max(padL, (lg && lg.offsetWidth>0) ? lg.offsetLeft+lg.offsetWidth+12 : 0);
  const w=stacks.clientWidth-left0-padR, h=stacks.clientHeight-padT-padB;
  if(w<80 || h<80) return;                       // hidden tab — the ResizeObserver re-fires on reveal
  const g=deck._geo, T=g.tower;
  const SIN=0.8192, COS=0.5736, R=0.7071;        // rotateX(55) · rotateZ(-45)
  const diag=(STK.W/2+STK.D/2)*R, boxDiag=(STK.BOXHW+STK.BOXHD)*R;
  // projected extents at s=1: screen-x = (x+y)·R · screen-y = (y−x)·R·COS − z·SIN
  // (rotateZ(−45) sends deck +x up-right, +y down-right; z rises up-screen). The
  // composition is asymmetric now (tower on +x → up-right), so fit both x extents and
  // slide the deck so the midpoint of [xL, xR] sits at the container center.
  const SGX=STK.SPOTS.siege;                     // siege deck centre (−x → down-left on screen)
  const upper=Math.max((g.zTop+STK.POP+16)*SIN + diag*COS,                    // popped top plane
                       T.TOPZ*SIN + (T.X+T.HEAD_HW+T.HEAD_HD)*R*COS);         // head-top far corner
  const lower=(boxDiag - SGX*R)*COS;             // siege glass floor is now the lowest corner
  const xR=(T.X+T.HEAD_HW+T.HEAD_HD)*R+10, xL=SGX*R-Math.max(diag*1.13, boxDiag)-8;
  const compH=upper+lower, compW=xR-xL;
  // caption floor: the two-deck composition is ~715px wide, so a pure width fit on a
  // 390px phone would drive the scale to ~0.5 and the 8.5px pills to ~5px. Clamp the
  // width-driven scale at SMIN and let the outer corners (siege glass / tower head)
  // clip symmetrically instead — .scene-card is overflow:hidden, so the crop is clean.
  // The height fit stays a hard cap: the stacks never clip vertically.
  const SMIN=0.62;
  const s=Math.min(1.1, h/compH, Math.max(w/compW, SMIN));
  deck.style.setProperty('--ds', s.toFixed(4));
  deck.style.left=(left0+w/2-(xL+xR)/2*s).toFixed(1)+'px';
  // 42% of the spare height above, the rest below → the feed box sits toward the bottom
  deck.style.top =(padT+(h-compH*s)*0.42+upper*s).toFixed(1)+'px';
  requestAnimationFrame(()=>{                    // measure AFTER the new transform paints
    const sr=stacks.getBoundingClientRect();
    const seat=()=>{
      const put=(el,pill)=>{
        if(!el || !pill) return;
        const r=el.getBoundingClientRect();
        pill.style.left=(r.left+r.width/2-sr.left).toFixed(0)+'px';
        pill.style.top =Math.min(r.bottom-sr.top-8, stacks.clientHeight-22).toFixed(0)+'px';
      };
      put(deck.querySelector('.glassbox:not(.siege-gb) .gb.f-bot'), $("#fblabel"));
      put(deck.querySelector('.glassbox.siege-gb .gb.f-bot'),       $("#sglabel"));
    };
    // measure-and-correct: the modeled extents above can't see billboarded pills or the
    // waypointed dorm link, so measure the painted union of the deck and refit once —
    // vertical ALWAYS fits (that's the hard cap), width may still stop at SMIN and crop.
    // Centering uses the FULL width (the legend column reserve above is only the first
    // guess): the legend is a bottom-left island, so it gets a rect keep-out, not a column.
    // CRUCIAL: measure only after the entrance animations settle — a mid-`rise` measure
    // centers against transient geometry and strands the tower outside the card.
    const settle=()=>{
    let u=null;
    for(const el of deck.querySelectorAll('*')){
      if(el.classList.contains('beacon')) continue;   // infinite ping — transient inflation
      const r=el.getBoundingClientRect();
      if(r.width<2 || r.height<2) continue;
      u = u ? {top:Math.min(u.top,r.top), bottom:Math.max(u.bottom,r.bottom),
               left:Math.min(u.left,r.left), right:Math.max(u.right,r.right)}
            : {top:r.top, bottom:r.bottom, left:r.left, right:r.right};
    }
    if(u){
      const PILL=14;                             // seated pills hang ~this far below the glass floor
      const availL=sr.left+padL, availT=sr.top+padT;
      const availW=stacks.clientWidth-padL-padR, availH=h-PILL;
      const uw=u.right-u.left, uh=u.bottom-u.top;
      const f=Math.min(1.5, availH/uh, Math.max(availW/uw, SMIN/s));
      const ox=sr.left+parseFloat(deck.style.left), oy=sr.top+parseFloat(deck.style.top);
      const nu={left:ox+(u.left-ox)*f, right:ox+(u.right-ox)*f,
                top:oy+(u.top-oy)*f,  bottom:oy+(u.bottom-oy)*f};
      let dx=(availL+availW/2)-(nu.left+nu.right)/2;
      let dy=(availT+availH/2)-(nu.top+nu.bottom)/2;
      // legend keep-out: if the centered union would sit on the legend, slide right by
      // the minimum that clears it (bounded by the right edge), else lift it, else let
      // the SMIN crop absorb what little is left.
      if(lg && lg.offsetWidth>0){
        const lr=lg.getBoundingClientRect();
        const nl=nu.left+dx, nr=nu.right+dx, nt=nu.top+dy, nb=nu.bottom+dy;
        if(nl < lr.right+10 && nb > lr.top-10){
          const pushR=(lr.right+10)-nl, roomR=(availL+availW)-nr;
          const pushU=nb-(lr.top-10),   roomU=nt-availT;
          if(pushR<=roomR)      dx+=pushR;
          else if(pushU<=roomU) dy-=pushU;
          else                  dx+=Math.max(0,roomR);
        }
      }
      if(Math.abs(1-f)>0.005 || Math.abs(dx)>1.5 || Math.abs(dy)>1.5){
        deck.style.setProperty('--ds',(s*f).toFixed(4));
        deck.style.left=(parseFloat(deck.style.left)+dx).toFixed(1)+'px';
        deck.style.top =(parseFloat(deck.style.top )+dy).toFixed(1)+'px';
        requestAnimationFrame(seat);             // re-seat pills against the corrected fit
        return;
      }
    }
    seat();
    };
    // wait out the finite entrance animations (rise + delays); the beacon/electron loops
    // are infinite and must not be awaited. Timeout race = belt and braces; a token keeps
    // a resize mid-wait from letting a stale pass land on top of the fresh one.
    const anims=(typeof deck.getAnimations==='function')
      ? deck.getAnimations({subtree:true}).filter(a=>{
          try{ return a.effect.getTiming().iterations!==Infinity; }catch(_){ return false; }
        })
      : [];
    if(anims.length){
      const tok=(deck._fitTok=(deck._fitTok||0)+1);
      seat();                                    // provisional seat so pills aren't stranded meanwhile
      Promise.race([Promise.all(anims.map(a=>a.finished.catch(()=>{}))),
                    new Promise(r=>setTimeout(r,1500))])
        .then(()=>{ if(deck._fitTok===tok && deck.isConnected) requestAnimationFrame(settle); });
    } else settle();
  });
}

function renderLayers(){
  const shape = t => t==='lens' ? 'lens' : t==='processor' ? 'proc' : '';
  const tag = t => t==='lens' ? 'lens' : t==='processor' ? 'proc' : t==='feed' ? 'feed' : 'sensory';
  const planeHTML = (L,z,d) => `
    <div class="plane ${L.base?'base':''} ${shape(L.tier)} ${L.dorm?'siege-dorm':''} ${L.id===selLayer?'sel':''}" data-id="${L.id}" tabindex="0" role="button" aria-label="${L.name} — ${L.tier}"
         style="--c:var(${L.hue}); --z:${z.toFixed(1)}px; --d:${d.toFixed(2)}s">
      <span class="pn"><i class="ptag ${tag(L.tier)}" title="${L.tier}"></i>${L.num}</span><span class="pc">${L.name}${L.dorm?' · dormant':''}</span>
    </div>`;
  const geo = stackGeo();
  const planes = LY.filter(l=>l.stack!=='siege' && l.tier!=='processor').map((L,i)=>planeHTML(L, geo.z.get(L.id), i*0.07)).join('');
  // glass box faces — geometry derived from the SAME constants as the planes
  const glassFor = (bh, cls='') => {
    const hw=STK.BOXHW, hd=STK.BOXHD, zc=bh/2;
    return `<div class="glassbox ${cls}" aria-hidden="true">
    <i class="gb f-bot" style="width:${2*hw}px;height:${2*hd}px;margin:${-hd}px 0 0 ${-hw}px;transform:translateZ(0px)"></i>
    <i class="gb f-n" style="width:${2*hw}px;height:${bh}px;margin:${-zc}px 0 0 ${-hw}px;transform:translateZ(${zc}px) rotateX(-90deg) translateZ(${-hd}px)"></i>
    <i class="gb f-s" style="width:${2*hw}px;height:${bh}px;margin:${-zc}px 0 0 ${-hw}px;transform:translateZ(${zc}px) rotateX(-90deg) translateZ(${hd}px)"></i>
    <i class="gb f-e" style="width:${bh}px;height:${2*hd}px;margin:${-hd}px 0 0 ${-zc}px;transform:translateZ(${zc}px) rotateY(90deg) translateZ(${hw}px)"></i>
    <i class="gb f-w" style="width:${bh}px;height:${2*hd}px;margin:${-hd}px 0 0 ${-zc}px;transform:translateZ(${zc}px) rotateY(90deg) translateZ(${-hw}px)"></i>
    <i class="gb f-top" style="width:${2*hw}px;height:${2*hd}px;margin:${-hd}px 0 0 ${-hw}px;transform:translateZ(${bh}px)"></i>
  </div>`; };
  const glass = glassFor(geo.boxTop);
  // beams: a vertical connector from z0 to z1 on the stack axis (element bottom = z0)
  const beamAt=(z0,z1,cls,inner='')=>{
    const len=z1-z0, c=(z0+z1)/2;
    return `<div class="beam ${cls}" aria-hidden="true" style="height:${len}px;margin-top:${-len/2}px;transform:translateZ(${c}px) rotateX(-90deg)">${inner}</div>`;
  };
  const flowBeam = beamAt(geo.boxTop, geo.boxTop+STK.BEAM, 'flow',
    '<s class="node n0"></s><s class="node n1"></s><b><i></i></b><b><i></i></b><b><i></i></b>');
  const tierBeams = (geo.gaps||[]).map(gp=>beamAt(gp.z0,gp.z1,'dots')).join('');
  // the WATCHTOWER — slender mast + amber observation head (concepts weighed: stepped
  // ziggurat reads "building" not "watching"; a hex prism is indistinguishable from a
  // square one at deck scale — the wide-head-on-thin-neck control-tower silhouette wins).
  // Same wall-face technique as the glass box; every size comes from stackGeo().tower.
  // The sight-line lives in the y=0 plane (rotateX(-90) wall + in-plane rotate()), so a
  // single dashed rule runs head-front → 28px above the stack's top plane.
  const T=geo.tower, tx=T.X, bw=T.BODY_HW, bd=T.BODY_HD, tbh=T.BODY_H, tbc=tbh/2,
        hbw=T.HEAD_HW, hbd=T.HEAD_HD, hz1=T.TOPZ, hh=hz1-tbh, hzc=(tbh+hz1)/2;
  const sx0=tx-hbw, sz0=hzc, sx1=0, sz1=T.SIGHT_Z;
  const sL=Math.hypot(sx1-sx0, sz1-sz0), sTh=Math.atan2(-(sz1-sz0), sx1-sx0)*180/Math.PI;
  const TL = LY.find(l=>l.id==='tower');
  const tower = `<div class="tower3d ${TL.id===selLayer?'sel':''}" data-id="${TL.id}" tabindex="0" role="button" aria-label="${TL.name} — ${TL.tier}">
    <i class="tw" style="width:${2*bw}px;height:${tbh}px;margin:${-tbc}px 0 0 ${tx-bw}px;transform:translateZ(${tbc}px) rotateX(-90deg) translateZ(${-bd}px)"></i>
    <i class="tw" style="width:${2*bw}px;height:${tbh}px;margin:${-tbc}px 0 0 ${tx-bw}px;transform:translateZ(${tbc}px) rotateX(-90deg) translateZ(${bd}px)"></i>
    <i class="tw" style="width:${tbh}px;height:${2*bd}px;margin:${-bd}px 0 0 ${-tbc}px;transform:translateZ(${tbc}px) rotateY(90deg) translateZ(${tx+bw}px)"></i>
    <i class="tw" style="width:${tbh}px;height:${2*bd}px;margin:${-bd}px 0 0 ${-tbc}px;transform:translateZ(${tbc}px) rotateY(90deg) translateZ(${tx-bw}px)"></i>
    <i class="tw head" style="width:${2*hbw}px;height:${hh}px;margin:${-hh/2}px 0 0 ${tx-hbw}px;transform:translateZ(${hzc}px) rotateX(-90deg) translateZ(${-hbd}px)"></i>
    <i class="tw head" style="width:${2*hbw}px;height:${hh}px;margin:${-hh/2}px 0 0 ${tx-hbw}px;transform:translateZ(${hzc}px) rotateX(-90deg) translateZ(${hbd}px)"></i>
    <i class="tw head" style="width:${hh}px;height:${2*hbd}px;margin:${-hbd}px 0 0 ${-hh/2}px;transform:translateZ(${hzc}px) rotateY(90deg) translateZ(${tx+hbw}px)"></i>
    <i class="tw head" style="width:${hh}px;height:${2*hbd}px;margin:${-hbd}px 0 0 ${-hh/2}px;transform:translateZ(${hzc}px) rotateY(90deg) translateZ(${tx-hbw}px)"></i>
    <i class="tw head f-cap" style="width:${2*hbw}px;height:${2*hbd}px;margin:${-hbd}px 0 0 ${tx-hbw}px;transform:translateZ(${hz1}px)"></i>
    <i class="sight" aria-hidden="true" style="width:${sL.toFixed(1)}px;margin:-1px 0 0 ${((sx0+sx1)/2-sL/2).toFixed(1)}px;transform:translateZ(${((sz0+sz1)/2).toFixed(1)}px) rotateX(-90deg) rotate(${sTh.toFixed(2)}deg)"></i>
    <i class="beacon" aria-hidden="true" style="transform:translate3d(${tx}px,0,${hz1+9}px) rotateZ(45deg) rotateX(-55deg)"></i>
  </div>`;
  // the SIEGE deck — second stack at SPOTS.siege, built from the same constants and the
  // same glass-box/beam vocabulary; the wrapper carries the deck-local x, so every stock
  // .plane behavior (rise, pop, dim) composes untouched.
  const sg=geo.siege, SX=sg.X;
  const sPlanes=[...sg.FEEDS, ...sg.MAIN].map((L,i)=>planeHTML(L, geo.z.get(L.id), 0.35+i*0.07)).join('');
  const sFlow=beamAt(sg.boxTop, sg.boxTop+STK.BEAM, 'flow',
    '<s class="node n0"></s><s class="node n1"></s><b><i></i></b><b><i></i></b><b><i></i></b>');
  const sDots=(sg.gaps||[]).map(gp=>beamAt(gp.z0,gp.z1,'dots')).join('');
  const siege=`<div class="siege-deck" style="transform:translateX(${SX}px)">${glassFor(sg.boxTop,'siege-gb')}${sPlanes}${sFlow}${sDots}</div>`;
  // connection affordances (same y=0-plane rule technique as the tower sight-line):
  // GexBox hands the siege its towers to watch; the tower holds a dormant, dotted
  // sight over the siege top — seen, recorded, and since wt-7 HEARD every scan.
  const lk=(x0,z0,x1,z1,cls)=>{
    const ln=Math.hypot(x1-x0,z1-z0), th=Math.atan2(-(z1-z0),x1-x0)*180/Math.PI;
    return `<i class="siege-link ${cls}" aria-hidden="true" style="width:${ln.toFixed(1)}px;margin:-1px 0 0 ${((x0+x1)/2-ln/2).toFixed(1)}px;transform:translateZ(${((z0+z1)/2).toFixed(1)}px) rotateX(-90deg) rotate(${th.toFixed(2)}deg)"></i>`;
  };
  const lkTag=(x,zz,txt,cls)=>`<i class="siege-tag ${cls}" aria-hidden="true" style="transform:translate3d(${x}px,0px,${zz}px) rotateZ(45deg) rotateX(-55deg)"><s>${txt}</s></i>`;
  const zGrav=geo.z.get('grav'), zTouch=geo.z.get('stouch');
  // the siege sight BENDS: a straight head → siege-top run would pass through the
  // main stack's upper slabs (x ±144, z up to zTop) and preserve-3d shreds it into
  // fragments, worst on Safari/tablet. Segment 1 climbs from the head to a waypoint
  // just past the west glass wall, riding above the slab tops the whole way (≥32px
  // clearance — same convention as the live sight-line's +28); segment 2 descends to
  // the siege top through the clear air between the decks. The label pill sits on
  // segment 2 (lerped), so it stays attached to the line wherever the stacks land.
  const wpX=-(STK.BOXHW+14), wpZ=geo.zTop+62;
  // the siege sight is LIVE since wt-7: always faintly visible, brightens while the
  // tower is expanded (CSS: .tower3d.sel ~ .siege-link.dorm), and carries a standing
  // label on segment 2 like the gexbox handover does.
  const links = lk(-STK.W/2, zGrav, SX+STK.W/2, zTouch, '')
    + lkTag((SX)/2, (zGrav+zTouch)/2+24, 'gexbox → towers to watch', '')
    + lk(tx-hbw, hzc, wpX, wpZ, 'dorm')
    + lk(wpX, wpZ, SX, sg.zTop+28, 'dorm')
    + lkTag((wpX+SX)/2, (wpZ+sg.zTop+28)/2, 'siege word → watchtower · since wt-7', 'dorm');
  const nShadow = LY.filter(l=>/shadow/.test(l.status[1])).length;
  $("#p-layers").innerHTML = `
    <div class="phead">
      <div><h2>Layers</h2><div class="desc">Data feeds → sensory layers → lenses → processor · tap any block for what it does</div></div>
      <span class="pill grey">Live since 2026-07-06 · 0 / ${nShadow} shadow layers promotion-ready</span>
    </div>
    <div class="layers3d">
      <div class="scene-card">
        <div class="scene-top"><span class="st">forward pass · feeds → processor</span><span style="display:flex;align-items:center;gap:10px"><span class="st" style="color:var(--iris)">decision ↑</span><button class="siege-info" id="siegeinfo" aria-label="How the stacks fit together" title="How the stacks fit together">i</button></span></div>
        <div class="legend" aria-hidden="true">
          <div class="lg-row" style="--tc:var(--l-tower)"><i class="cat-ico proc"></i><b>processor</b>&nbsp;— makes the call</div>
          <div class="lg-row" style="--tc:var(--l-fade)"><i class="cat-ico lens"></i><b>lens</b>&nbsp;— takes a side</div>
          <div class="lg-row" style="--tc:var(--l-base)"><i class="cat-ico sensory"></i><b>sensory</b>&nbsp;— measures</div>
          <div class="lg-row" style="--tc:var(--l-base)"><i class="cat-ico feed"></i><b>data feed</b>&nbsp;— raw input</div>
          <div class="lg-flow">flow ↑ feeds to decision · tap any block</div>
        </div>
        <div class="stack-scene" id="stacks">
          <div class="deck hassel" id="deck">${glass}${planes}${flowBeam}${tierBeams}${siege}${tower}${links}</div>
          <span class="fb-label" id="fblabel">data feeds</span>
          <span class="fb-label" id="sglabel">spy tape · data feed</span>
        </div>
      </div>
      <div class="detail" id="dt"></div>
    </div>`;
  const stacks=$("#stacks");
  stacks.addEventListener('click', e=>{ const p=e.target.closest('.plane, .tower3d'); if(p) selectLayer(p.dataset.id); });
  stacks.addEventListener('keydown', e=>{
    const p=e.target.closest('.plane, .tower3d'); if(!p) return;
    const idx=LY.findIndex(x=>x.id===p.dataset.id);
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectLayer(p.dataset.id); }
    else if(e.key==='ArrowUp' && idx<LY.length-1){ e.preventDefault(); const n=stacks.querySelector(`[data-id="${LY[idx+1].id}"]`); n.focus(); selectLayer(LY[idx+1].id); }
    else if(e.key==='ArrowDown' && idx>0){ e.preventDefault(); const n=stacks.querySelector(`[data-id="${LY[idx-1].id}"]`); n.focus(); selectLayer(LY[idx-1].id); }
  });
  $("#siegeinfo").onclick=openSiegeArch;
  $("#deck")._geo = geo;
  layoutStacks();
  if(window._stkRO) window._stkRO.disconnect();
  window._stkRO = new ResizeObserver(layoutStacks);
  window._stkRO.observe(stacks);
  renderDetail();
}

// ⓘ architecture map — the deck flow FLIPPED into a flat diagram: feeds at the BOTTOM,
// everything climbs to the Watchtower at the TOP. Rides the shared #modal plumbing
// (esc + backdrop close are wired once at boot), so no new global listeners.

  M.innerHTML = `

      <div class="modal-head">
        <div class="mt">How the stacks fit together <em>data climbs · the call is made at the top</em></div>
        <button class="modal-x" id="modal-x" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div id="siegeModal">
          <div class="sa-box sa-tower" style="grid-column:1/4"><b>WATCHTOWER</b><i>reads both, calls direction</i></div>

const rowTime = s => new Date(scanTs(s)).toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit', timeZone:PT});
function diaryDayGroups(){
  const byDay=new Map();
  const put=rows=>{ for(const s of rows){ const d=scanTs(s).slice(0,10); if(!byDay.has(d)) byDay.set(d,new Map()); byDay.get(d).set(scanTs(s), s); } };
  put(DIARY_ROWS); put(LIVEROWS);            // live rows overwrite history on the same timestamp (freshest wins)
  return [...byDay.keys()].sort().reverse().map(day=>({
    day, entries:[...byDay.get(day).values()].sort((a,b)=>scanTs(b).localeCompare(scanTs(a)))   // newest entry first
  }));
}
// One kid-level sentence translating the whole diary entry — what its JSON is really saying.
function childSentence(s){
  const g=gateStates(s).filter(x=>x.on).length, w=s.wt;
  const wd = w.dir==='call' ? 'bounce back up' : 'drop back down';
  const fd = s.fade.dir==='call' ? 'spring back up' : 'come back down';
  if(w.fired && !w.agrees)
    return `The price slid close to an edge and the thinking robot wanted to bet it would ${wd}, but the careful rule robot said there wasn’t enough room yet — so it waited.`;
  if(s.fade.fired && w.fired && w.agrees)
    return `The price stretched too far from the middle, so both robots agreed it should ${fd} and pointed the same way — a clean, matching call.`;
  if(w.votes && w.votes.agree < 0.6)
    return `The market was wiggly and hard to read, so the thinking robot shrugged and decided to sit still instead of guessing.`;
  if(g < 4 && !w.fired)
    return `A trade was starting to take shape but wasn’t ready yet, so everyone just watched and waited.`;
  return `Nothing much happened — the price sat calmly near a big wall, so both robots just watched and did nothing.`;
}
// Annotated JSON for the modal — the real record, with plain-English comments on the key fields.
function annotatedJSON(s){
  const e=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const K=k=>`<span class="j-key">"${k}"</span>`, S=v=>`<span class="j-str">"${e(v)}"</span>`;
  const N=v=>`<span class="j-num">${v}</span>`, Bl=v=>`<span class="j-bool">${v}</span>`, NU=`<span class="j-null">null</span>`;
  const c=t=>`  <span class="j-cm">// ${t}</span>`, i=n=>'  '.repeat(n);
  const dir=s.fade.dir, wdir=s.wt.dir;
  const votes=`{ ${K('n')}: ${N(s.wt.votes.n)}, ${K('agreement')}: ${N(s.wt.votes.agree)} }`;
  const L=[
    '{',
    `${i(1)}${K('ts')}: ${S(scanTs(s))},${c('when this scan was taken (recorded in Eastern; shown in Pacific elsewhere)')}`,
    `${i(1)}${K('ticker')}: ${S('SPX')},${c('the index Mirai trades — SPX, 0DTE options')}`,
    `${i(1)}${K('spot')}: ${N(+s.spot.toFixed(2))},${c('SPX price at the moment of the scan')}`,
    `${i(1)}${K('gamma_sign')}: ${S(s.sign)},${c('dealer gamma at spot — positive = they dampen moves (pin), negative = amplify (storm)')}`,
    `${i(1)}${K('regime')}: ${S(s.regime)},${c('the regime read — "pinning" = mean-reverting, "trending" = directional')}`,
    `${i(1)}${K('gamma_flip')}: ${N(+s.flip.toFixed(2))},${c('zero-gamma level; above it dealers are long gamma (calm), below it short (volatile)')}`,
    `${i(1)}${K('call_γ')}: ${N(s.callWall)}, ${K('put_γ')}: ${N(s.putWall)},${c('the 0DTE at-the-money gamma peaks — they track spot, they are NOT the structural wall')}`,
    `${i(1)}${K('magnet')}: ${N(s.magnet)},${c('the fill-weighted 0DTE strike price gravitates toward')}`,
    `${i(1)}${K('pin_centroid')}: ${N(s.pin)},${c('gamma-weighted centre of the whole map')}`,
    `${i(1)}${K('reversion_extreme')}: {${c('HEAD A · FADE LENS — the 4-gate head that fades stretch back toward the magnet')}`,
    `${i(2)}${K('score')}: ${N(s.fade.score)},${c('signed conviction: + = fade long / − = fade short')}`,
    `${i(2)}${K('fired')}: ${Bl(s.fade.fired)},${c('did all four gates pass? — this is what fires the paper alert')}`,
    `${i(2)}${K('armed')}: ${Bl(s.fade.armed)},${c('gate 2 (stretch): price is ≥1σ stretched or tagging a wall')}`,
    `${i(2)}${K('reaction')}: ${Bl(s.fade.reaction)},${c('gate 4 (turn): the last bar turned back against the stretch')}`,
    `${i(2)}${K('direction')}: ${dir?S(dir):NU},${c('which way the fade leans — call = up, put = down')}`,
    `${i(2)}${K('runway_sigma')}: ${N(s.fade.runway)}, ${K('runway_ok')}: ${Bl(s.fade.runwayOk)}${c('gate 3 (runway): room to the magnet in σ — ok only when ≥ 0.35σ')}`,
    `${i(1)}},`,
    `${i(1)}${K('level_reclaim')}: {${c('HEAD C · BREAK LENS — the twin that bets the escape when flow overpowers the map')}`,
    `${i(2)}${K('break_state')}: ${S(s.brk.state)},${c('idle → cocked → fired state machine')}`,
    `${i(2)}${K('cock_count')}: ${N(s.brk.cocks)}${c('times it armed today')}`,
    `${i(1)}},`,
    `${i(1)}${K('watchtower')}: {${c('HEAD B · WATCHTOWER — the Claude reasoning second opinion (shadow only)')}`,
    `${i(2)}${K('fired')}: ${Bl(s.wt.fired)}, ${K('direction')}: ${wdir?S(wdir):NU},${c('the tower’s own call, formed blind to the gates')}`,
    `${i(2)}${K('magnitude_sigma')}: ${N(s.wt.mag)},${c('expected move size in σ — this drives the ▶▶ NEXT read on the map')}`,
    `${i(2)}${K('conviction')}: ${N(s.wt.conv)},${c('share of votes that agreed = the conviction we actually trust')}`,
    `${i(2)}${K('votes')}: ${votes},${c('times it was asked (up to 3 on a fire) and the agreement among them')}`,
    `${i(2)}${K('agrees_with_gates')}: ${Bl(s.wt.agrees)},${c('did the reasoning head and the machine gates concur?')}`,
    `${i(2)}${K('scene')}: ${S(s.wt.scene)}${c('the tower’s plain-English read of the setup')}`,
    `${i(1)}}`,

}

function gateStates(s){
  return [
    {on:s.regime==="pinning", nm:"Regime", dsc:"Stack reads pinning", val:`${cap(s.regime)} · ${f(s.conf,2)}`},
    {on:s.fade.armed, nm:"Stretch", dsc:`Armed · ${s.fade.arm==='none'?'—':s.fade.arm.replace('_',' ')}`, val:s.fade.dir==='none'?'—':`${cap(s.fade.dir)} fade`},
    {on:s.fade.reaction, nm:"Turn", dsc:"Last bar turned back", val:s.fade.reaction?"true":"false"},
    {on:s.fade.runwayOk, nm:"Runway", dsc:"Room to magnet ≥ 0.35σ", val:`${sig(s.fade.runway)}`},
  ];
}
// ---- SWEEP LEDGER — the one Watchtower report card (replaced the Trade/Scene two-up) ----
// One Watchtower call = one sweep. Graded like an INTEGRAL: every 1-minute slice adds the
// signed distance price sat from the entry, on the called side. Green slices (price on the
// called side) minus red slices (against) = the call's signed AREA — how far AND how long
// the call was right. Win = area positive AND most bars right; loss = both negative;
// mixed = they disagree. A day is a HIT if the summed area is positive. Calls close only
// on an opposite-direction call (dir_flip) or the session close — no more scene chopping.
// Newest nightly grade row from polarity_history.jsonl, loaded once and cached; old-shape
// rows (watchtower / watchtower_scene) are never rendered — they get the empty state.
let LEDGERS=null, _ledgersLoading=false;
async function loadLedgers(){
  if(_ledgersLoading) return; _ledgersLoading=true;
  try{
    const res=await fetch('/api/raw/file?root=state&path=reversion/polarity_history.jsonl&limit=14',{cache:'no-store'});
    const d=await res.json(); const rows=(d&&d.rows)||[];
    for(let i=rows.length-1;i>=0;i--){
      const r=rows[i]; if(!r) continue;
      const c=r.watchtower_sweep||r.sweep;
      if(c){ LEDGERS={day:r.day||null, sweep:c, legacy:false}; break; }
      // old-key rows only → remember we saw a graded past, but NEVER render the old cards
      if(!LEDGERS && (r.watchtower||r.watchtower_scene)) LEDGERS={day:r.day||null, sweep:null, legacy:true};
    }
  }catch(e){ if(!LEDGERS) LEDGERS={day:null, sweep:null, legacy:false}; }   // a failed REFRESH must not wipe a good card
  if(!LEDGERS) LEDGERS={day:null, sweep:null, legacy:false};
  _ledgersLoading=false;   // re-entrant: the 20-min timer re-runs this so the nightly grade lands without a reload
  renderHeads();
}

    ${TH('Score','the call’s score: how far price sat on its side, times how long, minus the give-backs — the bar shows its size against the day’s biggest call')}
    ${TH('Time right','how much of the call’s life price spent on the right side — the minutes for and against sit beside it')}
    ${TH('Best σ','the best the call ever looked: its biggest move in the called direction, in σ')}
    ${TH('Bankable σ','the best it looked BEFORE first going 0.20σ against — what a cautious exit could actually have banked')}
    ${TH('Closed by','what ended the call: ⇄ the tower flipped direction · ▏the closing bell')}
    ${TH('Held ×','times the tower repeated the same call while it ran — conviction folded in, not new bets')}
    </tr></thead>
    <tbody>${rows||''}</tbody></table>
    ${rows?'':'<div class="lg-empty" style="padding:12px 14px">No calls in the card yet.</div>'}</div>`;
  return `<div class="ledgercard" style="--lc:var(--l-tower)">
    <div class="lg-top">
      ${nameHTML}
      <div style="display:flex;align-items:center;gap:9px">${era?`<span class="pill grey">${era}</span>`:''}
        <button type="button" class="lg-info" onclick="openSweepInfoModal()" aria-label="How a read is scored — worked example">i</button>
        <span class="lg-dot" style="--ld:${dot}" data-tip="${hit===true?'day HIT — all the call scores added together came out positive':hit===false?'day MISS — the summed scores came out negative':'no verdict yet — fills with the nightly grade'}" data-name="Day verdict"></span></div>
    </div>
    <div class="lg-hero" data-tip="${SWEEP_EXPLAIN}" data-name="The day's score">
      <b style="color:${net!=null&&isFinite(net)?hue(net):'var(--ink)'}">${sgn(net)}</b>
      <span>the day's whole score — every call added up${hit!=null?` · <b style="color:${hit?'var(--jade)':'var(--coral)'}">day ${hit?'HIT':'MISS'}</b>`:''}${day?' · '+day:''}</span>
    </div>
    <div class="lg-sub">${c.n_calls!=null?c.n_calls:calls.length} calls · <span style="color:var(--jade)">${c.wins??0}W</span> / <span style="color:var(--coral)">${c.losses??0}L</span> / <span style="color:var(--lantern)">${c.mixed??0}M</span>${c.pending?` · ${c.pending} pending`:''}</div>
    <div class="lg-grid">
      <div class="lg-stat" data-tip="the typical call spent this share of its life with price on the right side"><div class="k">Time right · typical</div><div class="v">${pct(mDur)}</div></div>
      <div class="lg-stat" data-tip="on a typical minute, how far price sat in the typical call's favor"><div class="k">Edge σ · typical</div><div class="v">${num(mFav)}</div></div>
      <div class="lg-stat" data-tip="how good the typical call looked at its best moment"><div class="k">Best σ · typical</div><div class="v">${num(mMfe)}</div></div>
      ${c.n_dropped_early?`<div class="lg-stat" data-tip="calls dropped from the grade for closing too early to score"><div class="k">Dropped early</div><div class="v">${c.n_dropped_early}</div></div>`:''}
    </div>
    ${tableHTML}
  </div>`;
}

// ================= REPLAY (day scrubber) =================
// A play/pause + scrub timeline of a past session: the SPX price path with the
// Watchtower's directional fires plotted where they triggered, each coloured by its parent
// SWEEP call's verdict — win / loss / mixed / pending (old-shape days may still say
// scratch/live). Watchtower-only, shadow: no paper P&L. Restricted to days that carry real
// Watchtower diary rows (07-06 onward); no historical-API backfill. Reuses the loaded
// diary rows + the same /api/raw file API.
const RP = {
  els:null, days:[], di:0,                 // day list (newest first) + selected index
  scans:[], fires:[], bars:null, path:null, barsCache:{},
  swp:[],                                  // Sweep Ledger calls (plot-ready), from /api/replay's grade
  t0:0, t1:0, geo:null, dom:null,          // session window (ms) + chart geometry / price domain
  pos:0, playing:false, speed:1, raf:null, last:0, _rk:null,
  view:'chart',                              // 'chart' = the shape of the day · 'table' = the readings behind it
  pop:null, popI:null,                       // the open fire-stack popover (one at a time) + its fire index
};
const RP_SPEEDS=[1,2,4];
const RP_PLAY_MS=26000;                     // wall-clock ms to traverse one full session at 1×
const RP_ICON_PLAY ='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const RP_ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>';
const RP_ICON_CHART='<svg viewBox="0 0 24 24"><path d="M3 3h2v16h16v2H3zm4 11 4-5 3 3.5L19 6l1.6 1.2-6 8-3-3.5L8.6 16z"/></svg>';
const RP_ICON_TABLE='<svg viewBox="0 0 24 24"><path d="M3 4h18v3H3zm0 5h5v3H3zm7 0h11v3H10zM3 14h5v3H3zm7 0h11v3H10zM3 19h5v2H3zm7 0h11v2H10z"/></svg>';
const rpClock = ms => new Date(ms).toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit', timeZone:PT});
// the same instant in Eastern — the table shows PT (the screen's zone) with ET underneath,
// because the diary records ET and every cross-check against it happens in ET
const rpClockET = ms => new Date(ms).toLocaleTimeString('en-US',{hour:'2-digit', minute:'2-digit', hour12:false, timeZone:ET});
function rpMeasure(){ const cc=RP.els&&RP.els.chart; if(!cc) return null; const w=cc.clientWidth,h=cc.clientHeight; return (w<80||h<80)?null:{w,h}; }
function rpGeo(w,h){ const padL=50,padR=14,padT=14,padB=44; return {w,h,x0:padL,x1:w-padR,y0:padT,y1:h-padB}; }   // padB carries the stance-ribbon lane + time labels
function rpXT(ms){ const g=RP.geo,f=(ms-RP.t0)/((RP.t1-RP.t0)||1); return g.x0 + Math.max(0,Math.min(1,f))*(g.x1-g.x0); }
function rpYP(px){ const g=RP.geo,d=RP.dom,f=(d.hi-px)/((d.hi-d.lo)||1); return g.y0 + Math.max(-0.05,Math.min(1.05,f))*(g.y1-g.y0); }

// day list: reuse the normalized diary rows, keep only days with a real Watchtower narrative
function rpBuildDays(){
  RP.days = diaryDayGroups()
    .filter(g => g.entries.some(s => s.wt && s.wt.scene))
    .map(g => ({ day:g.day, scans:[...g.entries].sort((a,b)=>scanTs(a).localeCompare(scanTs(b))) }));
}
// minute bars → forward price path; fall back to the coarser 5-min scan spots
function rpPricePath(){
  if(RP.bars && RP.bars.length)
    return RP.bars.map(b=>({ t:+new Date(b.ts), hi:b.high, lo:b.low, close:b.close }));
  return RP.scans.map(s=>({ t:+new Date(scanTs(s)), hi:s.spot, lo:s.spot, close:s.spot }));
}
function rpPriceAt(ms){
  const P=RP.path; if(!P||!P.length) return RP.dom?((RP.dom.lo+RP.dom.hi)/2):0;
  if(ms<=P[0].t) return P[0].close;
  if(ms>=P[P.length-1].t) return P[P.length-1].close;
  for(let i=1;i<P.length;i++){ if(P[i].t>=ms){ const a=P[i-1],b=P[i],f=(ms-a.t)/((b.t-a.t)||1); return a.close+(b.close-a.close)*f; } }
  return P[P.length-1].close;
}
function rpScanAtMs(ms){ let cur=RP.scans[0]||null; for(const s of RP.scans){ if(+new Date(scanTs(s))<=ms) cur=s; else break; } return cur; }
// a recorded dealer level (magnet/flip/…) at time ms — for the live marker. STEP
// semantics, matching the drawn lines: the level HOLDS its last scanned value until
// the scan that moved it (a lerp here used to show in-between prices that never existed)
function rpLevelAt(key,ms){
  const S=RP.scans; if(!S||!S.length) return null;
  let prev=null;
  for(const s of S){ const v=s[key]; if(v==null||!isFinite(v)) continue; const t=+new Date(scanTs(s));
    if(t>=ms) return prev==null?v:prev.v;
    prev={t,v}; }
  return prev?prev.v:null;
}
function rpPriceDomain(){
  // Anchor the vertical scale on the PRICE PATH; let a level (magnet/flip/wall) stretch
  // it only if it sits within `band` of the price range — so a far magnet or an OI-fallback
  // wall clips to an edge chip instead of squashing the price action into a thin strip.
  let plo=Infinity,phi=-Infinity;
  for(const p of RP.path){ if(p.lo<plo)plo=p.lo; if(p.hi>phi)phi=p.hi; }
  if(!isFinite(plo)||!isFinite(phi)) for(const s of RP.scans){ if(s.spot!=null){ plo=Math.min(plo,s.spot); phi=Math.max(phi,s.spot); } }
  if(!isFinite(plo)||!isFinite(phi)){ plo=0; phi=1; }
  const span=phi-plo, band=Math.max(span*1.5, phi*0.006);
  let lo=plo, hi=phi;
  for(const s of RP.scans) for(const v of [s.magnet,s.flip,s.callWall,s.putWall,s.callCeil,s.putFloor]){
    if(v!=null&&isFinite(v)&&v>=plo-band&&v<=phi+band){ if(v<lo)lo=v; if(v>hi)hi=v; }
  }
  const pad=(hi-lo)*0.08 || 5; return {lo:lo-pad, hi:hi+pad};
}
// Outcomes come from the SERVER (/api/replay): each fire's `outcome` is its parent SWEEP
// call's verdict, so the tab agrees with the Sweep Ledger card exactly. If that endpoint
// is unreachable (older server), fall back to the legacy client rule: 0.30σ
// target-before-stop, ≤2h and to the close (win/loss/scratch only — never a sweep verdict).
const RP_TARGET=0.30, RP_STOP=0.30, RP_HOLD_MIN=120;   // legacy fallback rule only
async function rpFetchGraded(day){
  try{
    const r=await fetch(`/api/replay?day=${day}`,{cache:'no-store'}); if(!r.ok) return null;
    const j=await r.json(); if(!j||!Array.isArray(j.fires)) return null;
    return { target:j.target_sigma||RP_TARGET, stop:j.stop_sigma||RP_STOP,
      byTs:new Map(j.fires.map(fr=>[fr.ts,{ outcome:fr.outcome, ttr_min:fr.ttr_min,
        mfe:fr.mfe_sigma, mae:fr.mae_sigma, move60:fr.move_60m }])),
      // the Sweep Ledger card rides the SAME on-demand grade, so the area shading appears
      // for any day — including today-so-far. Old servers (replay `scene` key) → no sweep.
      sweep:(j.sweep && Array.isArray(j.sweep.calls)) ? j.sweep : null };
  }catch(e){ return null; }
}
const RP_LOCK_MIN=60;   // the 60-min follow-through mark the whisker locks to (move_60m) — a LEAN reading, not the verdict
const RP_SETTLE_MS=30*60000;   // 30 min past lock a fire's whisker fades back (arrow stays) — see .rp-fire.settled
// one plot-ready fire: authoritative outcome/excursions `g` when present, else a client walk
function rpMakeFire(scan, g, tgt, stp){
  const dir=scan.wt.dir, sign=dir==='call'?1:dir==='put'?-1:0;
  const entry=scan.spot, sigma=scan.sigma||1, t=+new Date(scanTs(scan));
  const target=tgt||RP_TARGET, stop=stp||RP_STOP, winEnd=Math.min(t+RP_HOLD_MIN*60000, RP.t1);
  const lockT=Math.min(t+RP_LOCK_MIN*60000, RP.t1);
  let outcome='scratch', mfe=0, mae=0, move60=null;
  if(g){ outcome=g.outcome; mfe=g.mfe??0; mae=g.mae??0; move60=(g.move60==null?null:g.move60); }
  else if(sign) for(const p of RP.path){          // client fallback: excursions + target-before-stop
    if(p.t<=t) continue; if(p.t>winEnd) break;
    const fav=sign*((sign>0?p.hi:p.lo)-entry)/sigma, adv=sign*((sign>0?p.lo:p.hi)-entry)/sigma;
    if(fav>mfe)mfe=fav; if(adv<mae)mae=adv;
    if(outcome==='scratch'){
      const tgtHit=sign>0?p.hi>=entry+target*sigma:p.lo<=entry-target*sigma;
      const stpHit=sign>0?p.lo<=entry-stop*sigma:p.hi>=entry+stop*sigma;
      if(tgtHit&&stpHit) outcome='loss'; else if(tgtHit) outcome='win'; else if(stpHit) outcome='loss';
    }
  }
  // 60-min follow-through — only once the recorded path actually REACHES the lock: on a
  // live morning a younger fire must say "no 60m yet", not wear a clamped last price as the mark
  if(move60==null && sign && RP.path.length && RP.path[RP.path.length-1].t>=lockT)
    move60=+(sign*(rpPriceAt(lockT)-entry)/sigma).toFixed(3);
  return { scan, dir, sign, entry, sigma, t, lockT, outcome,
    mfe:+(+mfe).toFixed(2), mae:+(+mae).toFixed(2), move60,
    mag:scan.wt.mag, horMin:scan.wt.horizon||60 };
}
// headline verdict = the SWEEP call's verdict from /api/replay (each fire inherits its
// parent call's grade), so a Replay fire is a faithful visualization of the Sweep Ledger
// card — same grader, same result. (win=right/jade, loss=wrong/coral, mixed=lantern,
// pending=still open; scratch/live are tolerated from old-shape days.) The 60-min
// follow-through is kept as a separate "lean" reading; it never decides the color.
// Fallback below only fires for an older server that returns no graded outcome.
function rpVerdict(fr){
  const o=fr.outcome;
  if(o==='win'||o==='loss'||o==='mixed'||o==='pending'||o==='scratch'||o==='live') return o;
  const mv=fr.move60;   // no graded outcome (older server) → fall back to the 60-min lean
  if(mv!=null) return mv>=0.05?'win':mv<=-0.05?'loss':'scratch';
  const net=(fr.mfe||0)+(fr.mae||0); return net>=0.05?'win':net<=-0.05?'loss':'scratch';
}
function rpAssembleFires(graded){
  // a new-shape response (sweep present) is authoritative even with ZERO fires — early
  // morning before the first call must render empty, not fall back to the legacy client
  // walk and fabricate fires the Sweep Ledger never graded
  if(graded && (graded.byTs.size || graded.sweep)){
    const byTs=new Map(RP.scans.filter(s=>s.ts).map(s=>[s.ts,s]));
    const out=[];
    for(const [ts,g] of graded.byTs){
      const scan=byTs.get(ts) || rpScanAtMs(+new Date(ts));
      if(scan && scan.wt && scan.wt.dir) out.push(rpMakeFire(scan, g, graded.target, graded.stop));
    }
    return out.sort((a,b)=>a.t-b.t);
  }
  return RP.scans.filter(s=>s.wt&&s.wt.fired&&s.wt.dir).map(s=>rpMakeFire(s, null));
}

// ---- Sweep Ledger · area shading ----
// The area IS the visualization: for each sweep call, shade the region between the price
// path and its entry level over [t_open → t_close] — jade where price sat on the CALLED
// side of the entry, coral where against. This is literally the integral the grader sums:
// green area minus red area = the call's signed score. Calls come from /api/replay's
// on-demand grade — same authority as the fires — so shading renders for any day including
// today-so-far; a pending call (no t_close) shades to the session close.
// One call → plot-ready record, or null when it can't be placed honestly (bad timestamps,
// no finite entry). Decoration, not evidence — a skipped call still counts in the card.
function rpAssembleSweepCalls(sweep){
  if(!sweep || !Array.isArray(sweep.calls)) return [];
  return sweep.calls.map(c=>{
    if(!c || (c.dir!=='call'&&c.dir!=='put') || c.t_open==null || c.entry==null || !isFinite(c.entry)) return null;
    const tOpen=+new Date(c.t_open); if(!isFinite(tOpen)) return null;
    let tClose=RP.t1;
    if(c.t_close!=null){ tClose=+new Date(c.t_close); if(!isFinite(tClose)) return null; }
    tClose=Math.max(Math.min(tClose,RP.t1), tOpen);
    return {...c, tOpen, tClose};
  }).filter(Boolean).sort((a,b)=>a.tOpen-b.tOpen);
}
// the fire's parent call: the sweep whose [t_open, t_close) covers the fire's timestamp
// (calls tile the session back-to-back, so a boundary ts belongs to the call that OPENED there)
function rpSweepCallAt(ms){
  const S=RP.swp||[];
  return S.find(c=>ms>=c.tOpen&&ms<c.tClose) || S.find(c=>ms>=c.tOpen&&ms<=c.tClose) || null;
}
// SVG for the shading — two clipped polygons per call, built ONCE at rpBuild from RP.path
// (zero per-rAF work). Each is the price path CLAMPED against the entry line: the favorable
// ribbon keeps only the excursion on the called side (flat at the entry elsewhere), the
// adverse ribbon only the other side — together they tile exactly the path↔entry region.
// Lives INSIDE the #rp-clip group so the area reveals with the scrub, UNDER the price path.
function rpSweepSVG(){
  return (RP.swp||[]).map(c=>{
    const pts=[{t:c.tOpen,p:rpPriceAt(c.tOpen)},
      ...RP.path.filter(p=>p.t>c.tOpen&&p.t<c.tClose).map(p=>({t:p.t,p:p.close})),
      {t:c.tClose,p:rpPriceAt(c.tClose)}];
    const yE=rpYP(c.entry), call=c.dir==='call';
    const x1=rpXT(c.tOpen).toFixed(1), x2=rpXT(c.tClose).toFixed(1);
    if(x1===x2) return '';
    const poly=(cls,fav)=>{   // smaller y = higher price → the called side of a CALL clamps with min()
      const cl=pts.map(q=>{ const y=rpYP(q.p);
        return `${rpXT(q.t).toFixed(1)},${((fav?call:!call)?Math.min(y,yE):Math.max(y,yE)).toFixed(1)}`; });
      return `<polygon class="${cls}" points="${x1},${yE.toFixed(1)} ${cl.join(' ')} ${x2},${yE.toFixed(1)}"/>`; };
    return `<g class="rp-swp">${poly('rp-swp-fav',true)}${poly('rp-swp-adv',false)}
      <line class="rp-swp-base" x1="${x1}" y1="${yE.toFixed(1)}" x2="${x2}" y2="${yE.toFixed(1)}"/></g>`;
  }).join('');
}

// ---- GW region labels (docs/gw-vocab.md) — the clustered wall set drawn INSIDE the
// heat area. The session splits into segments wherever the top-3-per-side peak set
// changes (walls recomputed per scan from its own net_by_strike); each stable stretch
// names its walls once, small mono, at the segment's x-center. Scans without the

function rpGwSegments(){

  const segs=[];

    const near=GW.nearestWalls(GW.clusterWalls(s.netByStrike, s.spot), s.spot, 3);
    if(!near.length) continue;
    const key=near.map(c=>c.side+c.peak).sort().join('|');

// Click a fire → a floating card of HOW THE STACK LEANED into that call. Reuses rpStream (the
// same residual-stream the console draws) so there's one source of layer truth — we only pick
// the DECISION layers (below) and re-order them by agreement. Pure context/data rows are dropped:
// Base map (raw spot/σ/regime), Event Lens and Range Ruler (they carry no directional read).
const RP_LAYER_META={   // decision layer → its own hue (matches the layer legend elsewhere)
  'Gravity':'--l-grav', 'Motion':'--l-motion', 'Flow':'--l-flow', 'Speedometer':'--l-speed',
  'Gamma Roll':'--l-roll', 'Fade Lens':'--l-fade', 'Break Lens':'--l-break',
  'Siege':'--l-seffort' };   // wt-7: the second deck's word rides the same popover

const RP_WHY_ORDER=['Gravity','Flow','Motion','Speedometer','Gamma Roll','Siege','Fade Lens','Break Lens'];
// one AGREEING layer → a human clause (no leading capital); dir is the tower's word (up/down)
function rpWhyPhrase(name,s,dir){
  switch(name){
    case 'Gravity': return (s.magnet!=null&&isFinite(s.magnet))?`gravity is pulling toward ${f(s.magnet,0)}`:`gravity is leaning ${dir}`;
    case 'Flow':{ const t=s.lob&&s.lob.tilt; return (t!=null&&Math.abs(t)>=0.02)?`${t>0?'buyers':'sellers'} are leaning in`:'the flow of trades agrees'; }
    case 'Motion': return `the map is opening ${dir}`;
    case 'Speedometer': return 'the move is picking up speed';
    case 'Gamma Roll': return `the pin may roll ${dir}`;
    case 'Fade Lens': return `it looks ready to turn ${dir}`;
    case 'Break Lens': return `price is breaking ${dir}`;
    case 'Siege': return `the ${dir==='up'?'ceiling':'floor'} is under siege — walls under siege break`;
    default: return '';
  }
}
// the plain-English "why" — synthesise from which layers backed the call; fall back to the
// tower's own scene sentence when the synthesis is thin, and stay honest when it stood down
function rpWhy(s,fired,dir,rows){
  const scene=(s.wt&&s.wt.scene)?s.wt.scene:'';
  if(!fired) return scene||'The tower stood down — no clear edge to call here.';
  const byOrder=(a,b)=>RP_WHY_ORDER.indexOf(a.name)-RP_WHY_ORDER.indexOf(b.name);
  const agree=rows.filter(r=>r.agree===true).sort(byOrder);
  const against=rows.filter(r=>r.agree===false).sort(byOrder);
  const reasons=agree.slice(0,2).map(r=>rpWhyPhrase(r.name,s,dir)).filter(Boolean);
  if(!reasons.length) return scene||`Called ${dir} on the tower's read, though the stack gave it little backing.`;
  let sent=`Called ${dir} because ${reasons.join(' and ')}`;
  if(against.length===1) sent+=` — only the ${against[0].name.toLowerCase()} disagreed.`;
  else if(against.length>1) sent+=`, though ${against.length} layers pushed back.`;
  else sent+=', and the rest of the stack leaned with it.';
  return sent;
}

  rows.sort((a,b)=> rank(a)-rank(b) || (RP_WHY_ORDER.indexOf(a.name)-RP_WHY_ORDER.indexOf(b.name)));

      +`<span class="rp-pop-name">${r.name}</span>`

  // independently), then flip above↔below and clamp so the card never leaves the chart frame
  const chart=RP.els.chart, cw=chart.clientWidth, chh=chart.clientHeight;
  const sx=cw/(RP.geo.w||cw), sy=chh/(RP.geo.h||chh);
  const px=fr.xF*sx, py=fr.yEntry*sy;
  pop.style.visibility='hidden'; pop.style.display='block';
  const pw=pop.offsetWidth, ph=pop.offsetHeight, gap=16;
  const below=(py-ph-gap)<4;                 // no room above → drop it below the fire
  let top=below?py+gap:py-ph-gap;
  top=Math.max(6,Math.min(top,chh-ph-6));    // vertical clamp = never clips top/bottom
  const left=Math.max(6,Math.min(px-pw/2,cw-pw-6));
  const caret=Math.max(14,Math.min(px-left,pw-14));   // keep the caret pointing at the fire
  pop.classList.toggle('below',below);
  pop.style.left=left.toFixed(1)+'px'; pop.style.top=top.toFixed(1)+'px';
  pop.style.setProperty('--caret',caret.toFixed(1)+'px');

  if(!liveDay && RP.barsCache[day]!==undefined) return RP.barsCache[day];
  try{ const res=await fetch(`/api/raw/file?root=state&path=reversion/bars/${day}-SPX.json&limit=1000`,{cache:'no-store'});
    const d=await res.json(); RP.barsCache[day]=(d&&d.kind==='json'&&Array.isArray(d.data))?d.data:null; }

async function rpLoadDay(di){
  if(!RP.days.length) return;
  RP.di=Math.max(0,Math.min(RP.days.length-1,di));
  const D0=RP.days[RP.di];
  RP.scans=D0.scans;
  // The session x-axis window must use the SAME UTC offset the scans were recorded in, not a
  // hardcoded EDT — a winter (EST) session is -05:00 and would otherwise plot ~1h skewed and
  // compressed against the 9:30/16:00 ticks (audit #5). Offset is read from the day's own data
  // (uniform per session; scan ts carry the true offset); fall back to -04:00 only if absent.
  const _tzm=((D0.scans.find(s=>s.ts)||{}).ts||'').match(/([+-]\d\d:\d\d|Z)$/);
  const _tz=_tzm?(_tzm[1]==='Z'?'+00:00':_tzm[1]):'-04:00';
  RP.t0=+new Date(D0.day+'T09:30:00'+_tz); RP.t1=+new Date(D0.day+'T16:00:00'+_tz);
  RP.playing=false; RP.pos=0; RP.last=0; rpSyncPlayBtn(); rpUpdateDayNav();
  RP.bars=await rpFetchBars(D0.day);

   actually SAYING at the moment the tower spoke?" — one row per judged scan, one column
   per lens, each cell an arrow (which way it pointed) plus the number behind it.

   Two columns carry a "was blind" tag: SHOVE and SPEED were computed on every scan since
   the Break Lens build and never reached the Watchtower prompt until wt-6/m8 (2026-07-13),
   the day all five of its CALLs fired into the absorbing side of the book and all five lost.
   The tag stays until the wt-6 record is long enough to retire it — it is the whole reason
   this table exists: a reading nobody can see is a reading nobody uses.

   The SIEGE column (wt-7, 2026-07-18) is the SECOND deck's word — underlying SPY effort
   at wall touches, reversed sign (SIEGE → break, QUIET → hold). It is set apart with the
   siege deck's own rule + hue so main-stack lenses and siege data never read as one
   stack; pre-wt-7 rows carry no field and say so instead of faking a quiet read. */
const rpArrow = d => d==='up'   ? '<span class="rp-arw rp-up">▲</span>'
                   : d==='down' ? '<span class="rp-arw rp-dn">▼</span>'
                   : d==='flat' ? '<span class="rp-arw rp-fl">–</span>'
                   :              '<span class="rp-arw rp-fl">·</span>';
const rpSig = (v,d=2) => (v==null||!isFinite(v)) ? '·' : (v>=0?'+':'')+(+v).toFixed(d);

/* which way is dealer hedging leaning? The shove test re-prices net dealer gamma at spot ±
   a flow shove: the LOWER (more negative) margin is the side that goes/stays SHORT gamma,
   where hedging pushes WITH the move — the ACCELERANT side. The other side absorbs. */
function rpAccelSide(s){
  const u=s.shove&&s.shove.up, d=s.shove&&s.shove.down;
  if(u==null||d==null||!isFinite(u)||!isFinite(d)) return null;
  if(Math.abs(u-d)<0.15) return null;                    // symmetric — do not manufacture an edge
  return d<u ? 'down' : 'up';
}
function rpTableRows(){
  // judged scans only — the slices where the tower actually looked

}

    <th class="lt-base" data-tip="Where the index was trading at that moment — context for the row, not a reading in itself.">Spot<span class="nw">context</span></th>
    <th class="lt-grav" data-tip="Whether dealers are LONG gamma (their hedging calms the market — moves get damped) or SHORT (their hedging amplifies — moves get fuel). This is the master switch for reading everything else.">Gamma<span class="nw">gravity</span></th>
    <th class="lt-grav" data-tip="The price level dealer positioning pulls toward; the arrow says which side of the current price it sits on. Under short gamma it is a location, not a target.">Magnet<span class="nw">gravity</span></th>
    <th class="lt-grav" data-tip="Which direction dealer hedging would FEED a move (the accelerant side) versus the side it would swallow. Calling into the absorbing side needs real flow behind it.">Shove<span class="nw">gravity · book slope</span></th>

    // rides beside the level: σ is the language the tower's payload actually spoke.

            :s.magnet>s.spot+mthr?'up':s.magnet<s.spot-mthr?'down':'flat';

      ? `${rpArrow(acc)} <span class="rp-sm" title="shove margins ${rpSig(s.shove.down)}↓ ${rpSig(s.shove.up)}↑ — the lower margin is the side hedging feeds">fuel ${acc==='down'?'▼':'▲'}</span>`
      : `${rpArrow(null)} <span class="rp-sm" title="both shove margins within 0.15 — neither side is the accelerant">symmetric</span>`;

    // in the stack), the sell-share follows (who owns the motion)

    const stance=(s.wt.stance==='fight'||s.wt.stance==='settle')
      ? `<span class="rp-sm" title="the tower's stance: fight = expects the range to erupt · settle = expects a pin/drift inside the walls"> · ${s.wt.stance}</span>`:'';

    // 60-min LEAN only, colored by its own sign — the ledger verdict lives in the row tint
    // (tr.win/tr.loss). A fire inside the last hour has no 60-min mark yet — say so.
    const m60 = (fr && mv!=null) ? `<span class="${mv<0?'rp-dn':'rp-up'}">${rpSig(mv)}σ</span>`
              : fr ? '<span class="rp-sm">no 60m yet</span>'
              : s.wt.dir ? '<span class="rp-pill mute">held</span>'
              : '';

    const gapC=s.fade&&s.fade.gap!=null&&s.fade.gap<0?'rp-dn':'';
    const vwpC=s.fade&&s.fade.vwap!=null&&s.fade.vwap<0?'rp-dn':'';

    // LEAN — the old chart-console consensus, one cell per moment: how many main-stack
    // layers pointed each way when the tower spoke (siege deliberately excluded — it has
    // its own column and must not read as one more main-stack vote)
    const strm=rpStream(s);
    const ld=strm.filter(r=>r.tier!=='siege'&&r.has&&(r.dir==='up'||r.dir==='down'));
    const lup=ld.filter(r=>r.dir==='up'), ldn=ld.filter(r=>r.dir==='down');
    const leanTip=[lup.length?`up: ${lup.map(r=>r.name).join(', ')}`:'',
                   ldn.length?`down: ${ldn.map(r=>r.name).join(', ')}`:''].filter(Boolean).join(' · ')||'no directional reads';
    const lean=`<span title="${leanTip}"><span class="rp-up">${lup.length}▲</span><span class="rp-sm">/</span><span class="rp-dn">${ldn.length}▼</span></span>`;

    return `<tr class="${cls}" data-ts="${s.ts||''}">
      <td class="rp-tcol">${rpClock(+new Date(s.ts))}<span class="et">${rpClockET(+new Date(s.ts))} ET</span></td>
      <td class="num">${s.spot!=null?Math.round(s.spot):'·'}</td>
      <td>${gam}</td>
      <td>${rpArrow(md)} <span class="rp-sm" title="the level dealer positioning pulls toward, and how far away it is in σ">${s.magnet!=null?Math.round(s.magnet):''}${msd!=null?` · ${rpSig(msd)}σ`:''}</span></td>
      <td>${shove}</td><td>${speed}</td><td>${soft}</td><td>${brk}</td><td>${fade}</td>
      <td class="num"><span class="${gapC}" title="gap: how far today opened/sits vs yesterday's close, in σ">${rpSig(s.fade&&s.fade.gap)}</span><span class="rp-sm"> · </span><span class="${vwpC}" title="vwap: how far price is stretched from today's average price, in σ">${rpSig(s.fade&&s.fade.vwap)}</span></td>
      <td>${flow}</td>
      <td class="num rp-leancol">${lean}</td>
      <td class="rp-sgcol">${siege}</td>
      <td class="rp-sgcol2 rp-sm">${sgOut}</td>
      <td class="rp-callcol ${against?'against':''}">${verdict}</td>
      <td class="num rp-60col">${m60}</td>
    </tr>`;
  }).join('');
  T.innerHTML=head+`<tbody>${body}</tbody>`;
  // A row is a moment: clicking it moves the PLAYHEAD there and STAYS in the table.
  // (It used to bounce you back to the chart — a view switch nobody asked for. Picking a
  // row is a scrub, not a change of view; the toggle is the only thing that changes views.)
  // ONE delegated listener (not 50 closures), and the Lean/Siege cells are the exception:
  // on a touch tablet the hover tooltips never show, so those cells TAP-EXPAND into the
  // per-moment layer detail (the old chart-console stream) instead of scrubbing.
  T.querySelector('tbody').onclick=e=>{
    const tr=e.target.closest('tr[data-ts]'); if(!tr) return;
    const td=e.target.closest('td');
    if(td&&(td.classList.contains('rp-leancol')||td.classList.contains('rp-sgcol')||td.classList.contains('rp-sgcol2'))){
      rpToggleDetail(T, tr); return;
    }
    const ts=tr.dataset.ts; if(!ts) return;
    const f=(+new Date(ts)-RP.t0)/((RP.t1-RP.t0)||1);
    RP.pos=Math.max(0,Math.min(1,f)); RP.playing=false;
    if(RP.els.scrub) RP.els.scrub.value=Math.round(RP.pos*1000);   // keep the scrubber honest
    rpSyncPlayBtn(); rpPaint();          // rpPaint marks the row and re-times the chart underneath
  };
  rpMarkTableAt();
}
// ---- header tips ----
// Hover a column head for ~0.6s (or tap it) → one floating card with the column's
// plain-english sentence. ONE card element, position:fixed (the scroller's overflow
// cannot clip it), listeners bound ONCE on the table (thead rebuilds don't shed them).
let _htipTmr=null;
function rpHeadTipEl(){
  let el=document.getElementById('rp-htip');
  if(!el){ el=document.createElement('div'); el.id='rp-htip'; el.className='rp-htip';
    el.setAttribute('role','tooltip'); document.body.appendChild(el);
    // shared dismiss: registered ONCE with the card itself so every surface using it
    // (replay table, sweep ledger) gets press-elsewhere-to-close for free
    document.addEventListener('pointerdown',e=>{
      if(!e.target.closest('[data-tip]')) rpHideHeadTip();
    });
  }
  return el;
}
function rpShowHeadTip(th){
  const el=rpHeadTipEl();
  if(el._th===th && el.classList.contains('on')){ rpHideHeadTip(); return; }   // tap-toggle
  const name=th.dataset.name||(th.childNodes[0]&&th.childNodes[0].textContent||'').trim()||'column';
  // GW notation is case-sensitive (docs/gw-vocab.md) — never uppercase those titles
  const verbatim=/(?:GW[cp]|MagP|Pin)/.test(name)?' class="gw-verbatim"':'';
  // the card tints toward what it is about: side ink for walls, lantern MagP, iris Pin
  const tint=/GWc/.test(name)?' tt-jade':/GWp/.test(name)?' tt-coral'
    :/^MagP/.test(name)?' tt-mag':/^Pin/.test(name)?' tt-pin':'';
  // '¦' breaks a tip into rows; a row may carry a role prefix — k:label=key (the loud
  // number), f:fact, m:share-meter (0-100), v:verdict, n:footnote. Un-prefixed rows
  // render as plain .tp-r, so prose tips (table headers, ledger) are untouched.
  const body=String(th.dataset.tip||'').split('¦').filter(Boolean).map(r=>{
    const m=/^([kfmvn]):/.exec(r); if(!m) return `<span class="tp-r">${r}</span>`;
    const s=r.slice(2);
    if(m[1]==='k'){ const i=s.indexOf('=');
      return `<span class="tp-k">${i>0?`<em>${s.slice(0,i)}</em>`:''}<b>${i>=0?s.slice(i+1):s}</b></span>`; }
    if(m[1]==='f') return `<span class="tp-f">${s}</span>`;
    if(m[1]==='m'){ const p=Math.max(0,Math.min(100,Math.round(+s||0)));
      return `<span class="tp-m"><i style="width:${p}%"></i></span>`; }
    if(m[1]==='v'){ const t=/^((?:MagP|Pin)'{0,3})([\s\S]*)$/.exec(s);   // leading notation token wears its accent
      if(t) return `<span class="tp-v"><b class="${t[1].startsWith('Pin')?'tv-pin':'tv-mag'}">${t[1]}</b>${t[2]}</span>`;
      return `<span class="tp-v${/^terrain/.test(s)?' mute':''}">${s}</span>`; }
    return `<span class="tp-n">${s}</span>`;
  }).join('');
  el.className='rp-htip'+tint;   // reset any prior tint; 'on' is re-added below
  el.innerHTML=`<b${verbatim}>${name}</b>${body}`;
  el._th=th;
  // measure, then place under the header, clamped to the viewport
  el.style.visibility='hidden'; el.classList.add('on');
  const r=th.getBoundingClientRect(), w=el.offsetWidth;
  el.style.left=Math.max(8, Math.min(r.left, window.innerWidth-w-8)).toFixed(0)+'px';
  el.style.top=(r.bottom+8).toFixed(0)+'px';
  el.style.visibility='';
}
function rpHideHeadTip(){ clearTimeout(_htipTmr); const el=document.getElementById('rp-htip');
  if(el){ el.classList.remove('on'); el._th=null; } }
function rpBindHeadTips(){
  const T=RP.els.table; if(!T||T._tipsBound) return; T._tipsBound=true;
  T.addEventListener('mouseover',e=>{
    const th=e.target.closest('thead th[data-tip]'); if(!th) return;
    const el=document.getElementById('rp-htip');
    if(el&&el._th===th&&el.classList.contains('on')) return;   // already up — moving within
    clearTimeout(_htipTmr); _htipTmr=setTimeout(()=>rpShowHeadTip(th),600);
  });
  T.addEventListener('mouseout',e=>{
    const th=e.target.closest('thead th[data-tip]'); if(!th) return;
    if(e.relatedTarget&&th.contains(e.relatedTarget)) return;  // still inside the same th
    rpHideHeadTip();
  });
  // tap = show now (touch has no hover); tapping the same head again closes it
  T.addEventListener('click',e=>{
    const th=e.target.closest('thead th[data-tip]'); if(!th) return;
    clearTimeout(_htipTmr); rpShowHeadTip(th);
  });
  // any scroll of the table takes the card down (press-elsewhere lives with the card)
  RP.els.tablewrap.addEventListener('scroll',rpHideHeadTip,true);
}
// tap detail — the per-moment layer stream (the chart console's old cards), one row at a
// time under the tapped moment. Tapping the same row's Lean/Siege again closes it; any
// re-render clears it naturally (innerHTML). Detail rows carry no data-ts, so the
// playhead marker and the scrub delegate both ignore them.
function rpToggleDetail(T, tr){
  const wasOpen=tr.nextElementSibling&&tr.nextElementSibling.classList.contains('rp-detail');
  T.querySelectorAll('tr.rp-detail').forEach(d=>d.remove());
  if(wasOpen) return;
  const s=RP.scans.find(x=>x.ts===tr.dataset.ts); if(!s) return;
  const chips=rpStream(s).map(r=>
    `<span class="rp-dchip${r.tier==='siege'?' siege':''}${!r.has?' nodata':''}">`+
    `<b>${r.name}</b><span class="rp-darr ${r.dir}">${RP_ARR[r.dir]}</span>${r.thought}</span>`).join('');
  const d=document.createElement('tr'); d.className='rp-detail';
  d.innerHTML=`<td colspan="16"><div class="rp-dwrap">${chips}</div></td>`;
  tr.after(d);
}
// keep the table's "you are here" band in step with the playhead
function rpMarkTableAt(){
  const T=RP.els&&RP.els.table; if(!T||RP.view!=='table') return;
  const now=RP.t0+(RP.t1-RP.t0)*RP.pos;
  let best=null;
  T.querySelectorAll('tbody tr[data-ts]').forEach(tr=>{
    tr.classList.remove('at');
    const t=+new Date(tr.dataset.ts);
    if(t<=now && (!best || t>+new Date(best.dataset.ts))) best=tr;
  });
  if(best) best.classList.add('at');
}
function rpSetView(v){
  rpPopClose();                    // switching away from the chart leaves no card behind
  RP.view=(v==='table')?'table':'chart';
  const E=RP.els; if(!E) return;
  const tbl=RP.view==='table';
  E.chart.hidden=tbl; E.controls.hidden=tbl; E.console.hidden=tbl; E.legend.hidden=tbl;
  E.tablewrap.hidden=!tbl;
  E.vChart.classList.toggle('on',!tbl); E.vTable.classList.toggle('on',tbl);
  E.vChart.setAttribute('aria-selected', String(!tbl));
  E.vTable.setAttribute('aria-selected', String(tbl));
  const on=tbl?E.vTable:E.vChart;
  E.thumb.style.left=on.offsetLeft+'px'; E.thumb.style.width=on.offsetWidth+'px';
  if(tbl) rpRenderTable(); else requestAnimationFrame(()=>{ if(RP.path){ rpBuild(); rpPaint(); } });
}

        <p class="fine">Un-prefixed (<span class="gw c">GWc''</span>) only where the whole surface is one tenor and says so once — like the live map’s “0DTE surface” caption.</p>
        <div class="dict-exs">
          ${ex("[0DTE]GWp'",'p','a minor put-side wall in today’s expiry.')}
          ${ex("[AUG21]GWc''",'c','a significant call wall in the Aug 21 dated book.')}
        </div>
      </div>

      <div class="dict-pipe">
        <div class="da-cap">How a wall is found</div>
        <div class="dict-steps">
          <div class="ds"><i>1</i><b>Floor</b><span>strikes under 25% of the heaviest are dropped first — keeps a wall a wall, not a smear.</span></div>
          <div class="ds"><i>2</i><b>Group</b><span>adjacent same-sign survivors join into one wall; one missing strike allowed inside.</span></div>
          <div class="ds"><i>3</i><b>Measure</b><span>strength = summed |gamma|; its price is the heaviest strike.</span></div>
          <div class="ds"><i>4</i><b>De-noise</b><span>clusters under 5% of the strongest are dropped.</span></div>
          <div class="ds"><i>5</i><b>Show</b><span>up to 3 walls above and 3 below spot — fewer when fewer exist, <b>never</b> forced to 3.</span></div>
        </div>
      </div>

      <div class="dict-doct"><b>Doctrine</b><span>Display language only — storage keys and code identifiers never rename. <span class="mono">call_wall</span> stays <span class="mono">call_wall</span> on disk; it <i>renders</i> as <span class="gw c">GWc</span>.</span></div>

    </div></div>`;
}

// ---------- tabs ----------
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.panel===name));
  if(name==='replay'){ if(!RP.els) initReplay();
    else requestAnimationFrame(()=>{ rpSetView(RP.view); if(RP.view==='chart'&&RP.path){ rpBuild(); rpPaint(); } }); }
  if(name==='map') requestAnimationFrame(()=>{ buildMap(); paintMap(); });
}
$("#rail").addEventListener("click", e=>{ const b=e.target.closest(".tab"); if(b) switchTab(b.dataset.tab); });

// ---------- boot ----------
renderLayers(); renderDict(); renderDiary(false); renderHeads(); startLive(); loadSiege();
const _modal=document.getElementById('modal');
_modal.addEventListener('click', e=>{ if(e.target===_modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
</body>
