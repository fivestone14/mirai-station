let selLayer = 'lob';

function pill(st){ return `<span class="pill ${st[0]}"><span class="dot"></span>${st[1]}</span>`; }
function pipRow(n,on){ let h=''; for(let i=0;i<n;i++) h+=`<i class="${i<on?'on':''}"></i>`; return `<div class="pips">${h}</div>`; }

function readinessHTML(L){
  const r=L.rd;
  if(r.kind==='live') return `<div class="rd">
    <div class="rd-h"><span class="lab">Status</span><span class="pct">Live</span></div>
    <div class="track"><i style="width:100%"></i></div>
    <div class="rd-fr">running every scan</div>
    <div class="blockers"><span class="blk ok">✓ feeding the stack</span></div>
    <div class="rd-sum">${r.note}</div></div>`;

  if(r.kind==='graded') return `<div class="rd">
    <div class="rd-h"><span class="lab">Directional grade · A/B</span><span class="pct">${(r.rate*100).toFixed(0)}% hit</span></div>
    <div class="track"><i style="width:${(r.rate*100).toFixed(0)}%"></i></div>
    <div class="rd-fr">n=${r.n} idea-episodes · ${(r.rate*100).toFixed(0)}% correct · ${(r.inv*100).toFixed(0)}% if inverted</div>
    <div class="blockers"><span class="blk">verdict · ${r.verdict}</span></div>
    <div class="rd-sum">${r.summary}</div></div>`;

  if(r.kind==='feature') return `<div class="rd">
    <div class="rd-h"><span class="lab">Promotion gate</span><span class="pct">none</span></div>
    <div class="track" style="opacity:.55"><i style="width:100%;background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 11px)"></i></div>
    <div class="rd-fr">feature / input — no gate of its own</div>
    <div class="blockers"><span class="blk ok">${r.feeds||'feeds Watchtower &amp; Break Lens'}</span></div>
    <div class="rd-sum">${r.summary}</div></div>`;

  if(r.kind==='days'){
    const pct=Math.round(r.decided/r.need*100);
    const blk=r.blockers.map(b=>`<span class="blk">⛔ ${b}</span>`).join('');
    const cell = r.scans
      ? `<div class="rd-stat"><div class="k">H2H today</div><div class="v" style="font-size:11px">both ${r.scans.both} · solo ${r.scans.solo} · veto ${r.scans.veto}</div></div>`
      : `<div class="rd-stat"><div class="k">Live switch</div><div class="v" style="font-size:11px">${r.sw}</div></div>`;
    return `<div class="rd">
      <div class="rd-h"><span class="lab">Distance to live</span><span class="pct">${pct}%</span></div>
      ${pipRow(r.need, r.decided)}
      <div class="rd-fr">${r.decided} / ${r.need} decided real-bar days${r.note?' · '+r.note:''}</div>
      <div class="rd-grid">
        <div class="rd-stat"><div class="k">Accuracy</div><div class="v">${r.rate!=null?(r.rate*100).toFixed(0)+'%':'—'}</div></div>
        <div class="rd-stat"><div class="k">Wilson floor</div><div class="v">${r.wl!=null?f(r.wl,2):'—'} <small style="color:var(--ink-faint)">/ .50</small></div></div>
        ${cell}
        <div class="rd-stat"><div class="k">Gate</div><div class="v" style="font-size:11px">≥12d · W&gt;.50 · ≥58%</div></div>
      </div>
      <div class="blockers">${blk}</div>
      <div class="rd-sum">${r.summary}</div></div>`;
  }

  if(r.kind==='lob'){
    const bPct=Math.round(r.baseDays/r.baseNeed*100), ePct=Math.round(r.episodes/r.epNeed*100);
    const blk=r.blockers.map(b=>`<span class="blk">⛔ ${b}</span>`).join('');
    return `<div class="rd">
      <div class="rd-h"><span class="lab">Baseline clock</span><span class="pct">${bPct}%</span></div>
      <div class="track"><i style="width:${bPct}%"></i></div>
      <div class="rd-fr">${r.baseDays} / ${r.baseNeed} clean days · ${r.tier}</div>
      <div class="rd-h" style="margin-top:13px"><span class="lab">Graded episodes vs control</span><span class="pct">${ePct}%</span></div>
      <div class="track"><i style="width:${ePct}%"></i></div>
      <div class="rd-fr">${r.episodes} / ${r.epNeed} · must clear spy_depth (has 0)</div>
      <div class="rd-grid">
        <div class="rd-stat"><div class="k">Defense · ${r.defNowLabel||'now'}</div><div class="v" style="font-size:12px;color:var(--${r.defNow.rate>=0.5?'jade':'coral'})">${r.defNow.hits}/${r.defNow.n} · ${(r.defNow.rate*100).toFixed(0)}%</div></div>
        <div class="rd-stat"><div class="k">Defense · ${r.defPrevLabel||'prev'}</div><div class="v" style="font-size:12px;color:var(--${r.defPrev.rate>=0.5?'jade':'coral'})">${r.defPrev.hits}/${r.defPrev.n} · ${(r.defPrev.rate*100).toFixed(0)}%</div></div>
      </div>
      <div class="blockers">${blk}</div>
      <div class="rd-sum">${r.summary}</div></div>`;
  }
  return '';
}

function renderDetail(){
  const L = LY.find(x=>x.id===selLayer);
  const dt=$("#dt");
  dt.style.setProperty('--c','var('+L.hue+')');
  const wchip = L.weight!=null ? `<span class="pill grey">weight ${L.weight.toFixed(2)}</span>` : '';
  const tierLabel={sensory:'sensory layer',lens:'lens',processor:'processor'}[L.tier]||L.tier;
  const tchip = `<span class="tier ${L.tier}"><i></i>${tierLabel}</span>`;
  dt.innerHTML = `
    <div class="dt-top">
      <div class="dt-badge ${L.base?'base':''}">${L.num}</div>
      <div class="dt-name">${L.name}<em>${L.code}</em></div>
    </div>
    <div class="dt-meta">${tchip}${pill(L.status)}${wchip}</div>
    <div class="dt-role">${L.role}</div>
    <p class="dt-plain">${L.plain}</p>
    <div class="dt-eg"><span class="eg-k">For example</span>${L.example}</div>
    ${readinessHTML(L)}`;
}

function selectLayer(id){
  selLayer=id;
  document.querySelectorAll('.plane').forEach(p=>p.classList.toggle('sel', p.dataset.id===id));
  renderDetail();
}

function renderLayers(){
  const shape = t => t==='lens' ? 'lens' : t==='processor' ? 'proc' : '';
  const tag = t => t==='lens' ? 'lens' : t==='processor' ? 'proc' : 'sensory';
  // deck depth stays bounded as layers land: ≤7 planes keeps the original 46px gap,
  // beyond that the gap shrinks so the projected stack never outgrows the scene card
  const zGap = Math.min(46, 300/Math.max(1, LY.length-1));
  const planes = LY.map((L,i)=>`
    <div class="plane ${L.base?'base':''} ${shape(L.tier)} ${L.id===selLayer?'sel':''}" data-id="${L.id}" tabindex="0" role="button" aria-label="${L.name} — ${L.tier}"
         style="--c:var(${L.hue}); --z:${((i-(LY.length-1)/2)*zGap).toFixed(1)}px; --d:${(i*0.07).toFixed(2)}s">
      <span class="pn"><i class="ptag ${tag(L.tier)}" title="${L.tier}"></i>${L.num}</span><span class="pc">${L.name}</span>
    </div>`).join('');
  const nShadow = LY.filter(l=>/shadow/.test(l.status[1])).length;
  const nTier = t => LY.filter(l=>l.tier===t).length;
  $("#p-layers").innerHTML = `
    <div class="phead">
      <div><h2>Layers</h2><div class="desc">Sensory layers → lenses → processor · tap any block for what it does</div></div>
      <span class="pill grey">Day 4 live · 0 / ${nShadow} shadow layers promotion-ready</span>
    </div>
    <div class="layers3d">
      <div class="scene-card">
        <div class="scene-top"><span class="st">forward pass · base → processor</span><span class="st" style="color:var(--iris)">decision ↑</span></div>
        <div class="cat-rail">
          <div class="cat" style="--f:${nTier('processor')}; --tc:var(--l-tower)"><i class="cat-ico proc"></i><span class="lbl">Processor</span></div>
          <div class="cat" style="--f:${nTier('lens')}; --tc:var(--l-fade)"><i class="cat-ico lens"></i><span class="lbl">Lenses</span></div>
          <div class="cat" style="--f:${nTier('sensory')}; --tc:var(--l-base)"><i class="cat-ico sensory"></i><span class="lbl">Sensory</span></div>
        </div>
        <div class="scene"><div class="deck hassel" id="deck">${planes}</div></div>
        <div class="deckhint">tap a block</div>
      </div>
      <div class="detail" id="dt"></div>
    </div>`;
  const deck=$("#deck");
  deck.addEventListener('click', e=>{ const p=e.target.closest('.plane'); if(p) selectLayer(p.dataset.id); });
  deck.addEventListener('keydown', e=>{
    const p=e.target.closest('.plane'); if(!p) return;
    const idx=LY.findIndex(x=>x.id===p.dataset.id);
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectLayer(p.dataset.id); }
    else if(e.key==='ArrowUp' && idx<LY.length-1){ e.preventDefault(); const n=deck.querySelector(`[data-id="${LY[idx+1].id}"]`); n.focus(); selectLayer(LY[idx+1].id); }
    else if(e.key==='ArrowDown' && idx>0){ e.preventDefault(); const n=deck.querySelector(`[data-id="${LY[idx-1].id}"]`); n.focus(); selectLayer(LY[idx-1].id); }
  });
  renderDetail();
}

// ---------- DIARY (book · page 1 = newest → oldest to the right) ----------
let dpage = 0; // 0 = most recent DAY
const _enOpt = o => iso => new Date(iso+'T12:00:00').toLocaleDateString('en-US',o);
const enWeekday  = _enOpt({weekday:'long'});
const enMonthDay = _enOpt({month:'long', day:'numeric', year:'numeric'});
const enDateShort= _enOpt({weekday:'short', month:'short', day:'numeric'});
const rowTime = s => new Date(scanTs(s)).toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit', timeZone:PT});
function diaryDayGroups(){
  const byDay=new Map();
  const put=rows=>{ for(const s of rows){ const d=scanTs(s).slice(0,10); if(!byDay.has(d)) byDay.set(d,new Map()); byDay.get(d).set(scanTs(s), s); } };
  put(DIARY_ROWS); put(LIVEROWS);            // live rows overwrite history on the same timestamp (freshest wins)
  return [...byDay.keys()].sort().reverse().map(day=>({
    day, entries:[...byDay.get(day).values()].sort((a,b)=>scanTs(b).localeCompare(scanTs(a)))   // newest entry first
  }));
}
// One kid-level sentence translating the whole diary entry — what its JSON is really saying.
function childSentence(s){
  const g=gateStates(s).filter(x=>x.on).length, w=s.wt;
  const wd = w.dir==='call' ? 'bounce back up' : 'drop back down';
  const fd = s.fade.dir==='call' ? 'spring back up' : 'come back down';
  if(w.fired && !w.agrees)
    return `The price slid close to an edge and the thinking robot wanted to bet it would ${wd}, but the careful rule robot said there wasn’t enough room yet — so it waited.`;
  if(s.fade.fired && w.fired && w.agrees)
    return `The price stretched too far from the middle, so both robots agreed it should ${fd} and pointed the same way — a clean, matching call.`;
  if(w.votes && w.votes.agree < 0.6)
    return `The market was wiggly and hard to read, so the thinking robot shrugged and decided to sit still instead of guessing.`;
  if(g < 4 && !w.fired)
    return `A trade was starting to take shape but wasn’t ready yet, so everyone just watched and waited.`;
  return `Nothing much happened — the price sat calmly near a big wall, so both robots just watched and did nothing.`;
}
// Annotated JSON for the modal — the real record, with plain-English comments on the key fields.
function annotatedJSON(s){
  const e=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const K=k=>`<span class="j-key">"${k}"</span>`, S=v=>`<span class="j-str">"${e(v)}"</span>`;
  const N=v=>`<span class="j-num">${v}</span>`, Bl=v=>`<span class="j-bool">${v}</span>`, NU=`<span class="j-null">null</span>`;
  const c=t=>`  <span class="j-cm">// ${t}</span>`, i=n=>'  '.repeat(n);
  const dir=s.fade.dir, wdir=s.wt.dir;
  const votes=`{ ${K('n')}: ${N(s.wt.votes.n)}, ${K('agreement')}: ${N(s.wt.votes.agree)} }`;
  const L=[
    '{',
    `${i(1)}${K('ts')}: ${S(scanTs(s))},${c('when this scan was taken (recorded in Eastern; shown in Pacific elsewhere)')}`,
    `${i(1)}${K('ticker')}: ${S('SPX')},${c('the index Mirai trades — SPX, 0DTE options')}`,
    `${i(1)}${K('spot')}: ${N(+s.spot.toFixed(2))},${c('SPX price at the moment of the scan')}`,
    `${i(1)}${K('gamma_sign')}: ${S(s.sign)},${c('dealer gamma at spot — positive = they dampen moves (pin), negative = amplify (storm)')}`,
    `${i(1)}${K('regime')}: ${S(s.regime)},${c('the regime read — "pinning" = mean-reverting, "trending" = directional')}`,
    `${i(1)}${K('gamma_flip')}: ${N(+s.flip.toFixed(2))},${c('zero-gamma level; above it dealers are long gamma (calm), below it short (volatile)')}`,
    `${i(1)}${K('call_γ')}: ${N(s.callWall)}, ${K('put_γ')}: ${N(s.putWall)},${c('the 0DTE at-the-money gamma peaks — they track spot, they are NOT the structural wall')}`,
    `${i(1)}${K('magnet')}: ${N(s.magnet)},${c('the fill-weighted 0DTE strike price gravitates toward')}`,
    `${i(1)}${K('pin_centroid')}: ${N(s.pin)},${c('gamma-weighted centre of the whole map')}`,
    `${i(1)}${K('reversion_extreme')}: {${c('HEAD A · FADE LENS — the 4-gate head that fades stretch back toward the magnet')}`,
    `${i(2)}${K('score')}: ${N(s.fade.score)},${c('signed conviction: + = fade long / − = fade short')}`,
    `${i(2)}${K('fired')}: ${Bl(s.fade.fired)},${c('did all four gates pass? — this is what fires the paper alert')}`,
    `${i(2)}${K('armed')}: ${Bl(s.fade.armed)},${c('gate 2 (stretch): price is ≥1σ stretched or tagging a wall')}`,
    `${i(2)}${K('reaction')}: ${Bl(s.fade.reaction)},${c('gate 4 (turn): the last bar turned back against the stretch')}`,
    `${i(2)}${K('direction')}: ${dir?S(dir):NU},${c('which way the fade leans — call = up, put = down')}`,
    `${i(2)}${K('runway_sigma')}: ${N(s.fade.runway)}, ${K('runway_ok')}: ${Bl(s.fade.runwayOk)}${c('gate 3 (runway): room to the magnet in σ — ok only when ≥ 0.35σ')}`,
    `${i(1)}},`,
    `${i(1)}${K('level_reclaim')}: {${c('HEAD C · BREAK LENS — the twin that bets the escape when flow overpowers the map')}`,
    `${i(2)}${K('break_state')}: ${S(s.brk.state)},${c('idle → cocked → fired state machine')}`,
    `${i(2)}${K('cock_count')}: ${N(s.brk.cocks)}${c('times it armed today')}`,
    `${i(1)}},`,
    `${i(1)}${K('watchtower')}: {${c('HEAD B · WATCHTOWER — the Claude reasoning second opinion (shadow only)')}`,
    `${i(2)}${K('fired')}: ${Bl(s.wt.fired)}, ${K('direction')}: ${wdir?S(wdir):NU},${c('the tower’s own call, formed blind to the gates')}`,
    `${i(2)}${K('magnitude_sigma')}: ${N(s.wt.mag)},${c('expected move size in σ — this drives the ▶▶ NEXT read on the map')}`,
    `${i(2)}${K('conviction')}: ${N(s.wt.conv)},${c('share of votes that agreed = the conviction we actually trust')}`,
    `${i(2)}${K('votes')}: ${votes},${c('times it was asked (up to 3 on a fire) and the agreement among them')}`,
    `${i(2)}${K('agrees_with_gates')}: ${Bl(s.wt.agrees)},${c('did the reasoning head and the machine gates concur?')}`,
    `${i(2)}${K('scene')}: ${S(s.wt.scene)}${c('the tower’s plain-English read of the setup')}`,
    `${i(1)}}`,
    '}',
  ];
  return `<pre class="jcode">${L.join('\n')}</pre>`;
}
function openModal(s){
  const M=document.getElementById('modal');
  M.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Diary entry">
      <div class="modal-head">
        <div class="mt">${enDateShort(scanTs(s).slice(0,10))} <em>${rowTime(s)} PT · SPX ${f(s.spot,2)}</em></div>
        <div class="modal-tabs"><button class="mtab" data-v="detail">Reading</button><button class="mtab" data-v="json">JSON</button></div>
        <button class="modal-x" id="modal-x" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>`;
  const body=document.getElementById('modal-body');
  const detail=()=>`
    <div class="modal-plain"><b>In plain words</b>${childSentence(s)}</div>
    <p class="md-scene">“${s.wt.scene||'Quiet scan — the Watchtower stood down.'}”</p>
    ${s.wt.change?`<div class="md-change"><b>What would change its mind</b>${s.wt.change}</div>`:''}
    <div class="md-stats">
      <div class="md-stat"><div class="k">Regime</div><div class="v" style="font-size:13px">${cap(s.regime)}</div></div>
      <div class="md-stat"><div class="k">Fade gates</div><div class="v">${gateStates(s).filter(g=>g.on).length} / 4</div></div>
      <div class="md-stat"><div class="k">Watchtower</div><div class="v" style="font-size:12px">${s.wt.fired?cap(s.wt.dir)+' · '+sig(s.wt.mag):'Stood down'}</div></div>
      <div class="md-stat"><div class="k">Break lens</div><div class="v" style="font-size:12px">${cap(s.brk.state)}</div></div>
    </div>`;
  const jsonView=()=>`${annotatedJSON(s)}<div class="jcode-legend"><b>legend</b><span class="j-key">key</span><span class="j-str">"string"</span><span class="j-num">number</span><span class="j-bool">true/false</span><span class="j-cm">// comment</span></div>`;
  const show=v=>{ body.innerHTML = v==='json'?jsonView():detail(); M.querySelectorAll('.mtab').forEach(t=>t.classList.toggle('active',t.dataset.v===v)); };
  show('detail');
  M.querySelectorAll('.mtab').forEach(t=> t.onclick=()=>show(t.dataset.v));
  M.classList.add('open'); M.setAttribute('aria-hidden','false');
  document.getElementById('modal-x').onclick=closeModal;
}

// ================= REPLAY (day scrubber) =================
// A play/pause + scrub timeline of a past session: the SPX price path with the
// Watchtower's directional fires plotted where they triggered, each coloured by how it
// resolved over its own stated horizon — win / loss / scratch. Watchtower-only, shadow:
// no paper P&L. Restricted to days that carry real Watchtower diary rows (07-06 onward);
// no historical-API backfill. Reuses the loaded diary rows + the same /api/raw file API.
const RP = {
  els:null, days:[], di:0,                 // day list (newest first) + selected index
  scans:[], fires:[], bars:null, path:null, barsCache:{},
  t0:0, t1:0, geo:null, dom:null,          // session window (ms) + chart geometry / price domain
  pos:0, playing:false, speed:1, raf:null, last:0, _rk:null,
};
const RP_SPEEDS=[1,2,4];
const RP_PLAY_MS=26000;                     // wall-clock ms to traverse one full session at 1×
const RP_ICON_PLAY ='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const RP_ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>';
const rpClock = ms => new Date(ms).toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit', timeZone:PT});
function rpMeasure(){ const cc=RP.els&&RP.els.chart; if(!cc) return null; const w=cc.clientWidth,h=cc.clientHeight; return (w<80||h<80)?null:{w,h}; }
function rpGeo(w,h){ const padL=50,padR=14,padT=14,padB=32; return {w,h,x0:padL,x1:w-padR,y0:padT,y1:h-padB}; }
function rpXT(ms){ const g=RP.geo,f=(ms-RP.t0)/((RP.t1-RP.t0)||1); return g.x0 + Math.max(0,Math.min(1,f))*(g.x1-g.x0); }
function rpYP(px){ const g=RP.geo,d=RP.dom,f=(d.hi-px)/((d.hi-d.lo)||1); return g.y0 + Math.max(-0.05,Math.min(1.05,f))*(g.y1-g.y0); }

// day list: reuse the normalized diary rows, keep only days with a real Watchtower narrative
function rpBuildDays(){
  RP.days = diaryDayGroups()
    .filter(g => g.entries.some(s => s.wt && s.wt.scene))
    .map(g => ({ day:g.day, scans:[...g.entries].sort((a,b)=>scanTs(a).localeCompare(scanTs(b))) }));
}
// minute bars → forward price path; fall back to the coarser 5-min scan spots
function rpPricePath(){
  if(RP.bars && RP.bars.length)
    return RP.bars.map(b=>({ t:+new Date(b.ts), hi:b.high, lo:b.low, close:b.close }));
  return RP.scans.map(s=>({ t:+new Date(scanTs(s)), hi:s.spot, lo:s.spot, close:s.spot }));
}
function rpPriceAt(ms){
  const P=RP.path; if(!P||!P.length) return RP.dom?((RP.dom.lo+RP.dom.hi)/2):0;
  if(ms<=P[0].t) return P[0].close;
  if(ms>=P[P.length-1].t) return P[P.length-1].close;
  for(let i=1;i<P.length;i++){ if(P[i].t>=ms){ const a=P[i-1],b=P[i],f=(ms-a.t)/((b.t-a.t)||1); return a.close+(b.close-a.close)*f; } }
  return P[P.length-1].close;
}
function rpScanAtMs(ms){ let cur=RP.scans[0]||null; for(const s of RP.scans){ if(+new Date(scanTs(s))<=ms) cur=s; else break; } return cur; }
// interpolate a recorded dealer level (magnet/flip/…) between scans at time ms — for the live marker
function rpLevelAt(key,ms){
  const S=RP.scans; if(!S||!S.length) return null;
  let prev=null;
  for(const s of S){ const v=s[key]; if(v==null||!isFinite(v)) continue; const t=+new Date(scanTs(s));
    if(t>=ms) return prev==null?v:prev.v+(v-prev.v)*((ms-prev.t)/((t-prev.t)||1));
    prev={t,v}; }
  return prev?prev.v:null;
}
function rpPriceDomain(){
  // Anchor the vertical scale on the PRICE PATH; let a level (magnet/flip/wall) stretch
  // it only if it sits within `band` of the price range — so a far magnet or an OI-fallback
  // wall clips to an edge chip instead of squashing the price action into a thin strip.
  let plo=Infinity,phi=-Infinity;
  for(const p of RP.path){ if(p.lo<plo)plo=p.lo; if(p.hi>phi)phi=p.hi; }
  if(!isFinite(plo)||!isFinite(phi)) for(const s of RP.scans){ if(s.spot!=null){ plo=Math.min(plo,s.spot); phi=Math.max(phi,s.spot); } }
  if(!isFinite(plo)||!isFinite(phi)){ plo=0; phi=1; }
  const span=phi-plo, band=Math.max(span*1.5, phi*0.006);
  let lo=plo, hi=phi;
  for(const s of RP.scans) for(const v of [s.magnet,s.flip,s.callWall,s.putWall]){
    if(v!=null&&isFinite(v)&&v>=plo-band&&v<=phi+band){ if(v<lo)lo=v; if(v>hi)hi=v; }
  }
  const pad=(hi-lo)*0.08 || 5; return {lo:lo-pad, hi:hi+pad};
}
// Outcomes come from the SERVER (/api/replay), graded by the canonical resolver so the
// tab agrees with the paper ledger exactly. If that endpoint is unreachable (older server),
// fall back to the same rule client-side: 0.30σ target-before-stop, ≤2h and to the close.
const RP_TARGET=0.30, RP_STOP=0.30, RP_HOLD_MIN=120;   // mirrors reversion_lens PAPER_* (fallback only)
async function rpFetchGraded(day){
  try{
    const r=await fetch(`/api/replay?day=${day}`,{cache:'no-store'}); if(!r.ok) return null;
    const j=await r.json(); if(!j||!Array.isArray(j.fires)) return null;
    return { target:j.target_sigma||RP_TARGET, stop:j.stop_sigma||RP_STOP,
      byTs:new Map(j.fires.map(fr=>[fr.ts,{ outcome:fr.outcome, ttr_min:fr.ttr_min,
        mfe:fr.mfe_sigma, mae:fr.mae_sigma, move60:fr.move_60m }])) };
  }catch(e){ return null; }
}
const RP_LOCK_MIN=60;   // the follow-through mark that decides "leaned right / wrong" (move_60m)
// one plot-ready fire: authoritative outcome/excursions `g` when present, else a client walk
function rpMakeFire(scan, g, tgt, stp){
  const dir=scan.wt.dir, sign=dir==='call'?1:dir==='put'?-1:0;
  const entry=scan.spot, sigma=scan.sigma||1, t=+new Date(scanTs(scan));
  const target=tgt||RP_TARGET, stop=stp||RP_STOP, winEnd=Math.min(t+RP_HOLD_MIN*60000, RP.t1);
  const lockT=Math.min(t+RP_LOCK_MIN*60000, RP.t1);
  let outcome='scratch', mfe=0, mae=0, move60=null;
  if(g){ outcome=g.outcome; mfe=g.mfe??0; mae=g.mae??0; move60=(g.move60==null?null:g.move60); }
  else if(sign) for(const p of RP.path){          // client fallback: excursions + target-before-stop
    if(p.t<=t) continue; if(p.t>winEnd) break;
    const fav=sign*((sign>0?p.hi:p.lo)-entry)/sigma, adv=sign*((sign>0?p.lo:p.hi)-entry)/sigma;
    if(fav>mfe)mfe=fav; if(adv<mae)mae=adv;
    if(outcome==='scratch'){
      const tgtHit=sign>0?p.hi>=entry+target*sigma:p.lo<=entry-target*sigma;
      const stpHit=sign>0?p.lo<=entry-stop*sigma:p.hi>=entry+stop*sigma;
      if(tgtHit&&stpHit) outcome='loss'; else if(tgtHit) outcome='win'; else if(stpHit) outcome='loss';
    }
  }
  if(move60==null && sign) move60=+(sign*(rpPriceAt(lockT)-entry)/sigma).toFixed(3);   // 60-min follow-through
  return { scan, dir, sign, entry, sigma, t, lockT, outcome,
    mfe:+(+mfe).toFixed(2), mae:+(+mae).toFixed(2), move60,
    mag:scan.wt.mag, horMin:scan.wt.horizon||60 };
}
// headline verdict — did price go the way the tower called, by the 60-min mark?
// (win=leaned right/green, loss=leaned wrong/red, scratch=too flat to call/grey)
function rpVerdict(fr){
  const mv=fr.move60;
  if(mv!=null) return mv>=0.05?'win':mv<=-0.05?'loss':'scratch';
  if(fr.outcome==='win'||fr.outcome==='loss') return fr.outcome;
  const net=(fr.mfe||0)+(fr.mae||0); return net>=0.05?'win':net<=-0.05?'loss':'scratch';
}
function rpAssembleFires(graded){
  if(graded && graded.byTs.size){
    const byTs=new Map(RP.scans.filter(s=>s.ts).map(s=>[s.ts,s]));
    const out=[];
    for(const [ts,g] of graded.byTs){
      const scan=byTs.get(ts) || rpScanAtMs(+new Date(ts));
      if(scan && scan.wt && scan.wt.dir) out.push(rpMakeFire(scan, g, graded.target, graded.stop));
    }
    return out.sort((a,b)=>a.t-b.t);
  }
  return RP.scans.filter(s=>s.wt&&s.wt.fired&&s.wt.dir).map(s=>rpMakeFire(s, null));
}

function rpBuild(){
  const m=rpMeasure(); if(!m) return;
  RP.geo=rpGeo(m.w,m.h); RP.dom=rpPriceDomain();
  const g=RP.geo,d=RP.dom;
  const grid=[],yLab=[];

  }

  for(let ms=RP.t0; ms<=RP.t1+1; ms+=90*60000){ const x=rpXT(ms);
    tTick.push(`<line class="rp-grid" x1="${x.toFixed(1)}" y1="${g.y0}" x2="${x.toFixed(1)}" y2="${g.y1}" opacity="0.5"/>`);

  }

  const level=(key,cls,label,cvar,side)=>{
    const inb=RP.scans.filter(s=>s[key]!=null&&isFinite(s[key])&&s[key]>=d.lo&&s[key]<=d.hi);
    const vals=RP.scans.map(s=>s[key]).filter(v=>v!=null&&isFinite(v));
    const last=vals.length?vals[vals.length-1]:null;
    let out='';
    if(inb.length>1){
      const pts=inb.map(s=>`${rpXT(+new Date(scanTs(s))).toFixed(1)},${rpYP(s[key]).toFixed(1)}`).join(' ');
      out+=`<polyline class="rp-lvl ${cls} fut" points="${pts}" style="stroke:var(${cvar})"/>`;
      out+=`<polyline class="rp-lvl ${cls} pst" points="${pts}" style="stroke:var(${cvar})" clip-path="url(#rp-clip)"/>`;
      const lp=side==='right'?inb[inb.length-1]:inb[0];
      const lx=(side==='right'?Math.min(rpXT(+new Date(scanTs(lp))),g.x1-4):rpXT(+new Date(scanTs(lp)))+5).toFixed(1);
      out+=`<text class="rp-lvllab" x="${lx}" y="${(rpYP(lp[key])-5).toFixed(1)}" text-anchor="${side==='right'?'end':'start'}" style="fill:var(${cvar})">${label}</text>`;
    }

      const y=last>d.hi?g.y0+11:g.y1-4, arr=last>d.hi?'↑':'↓';
      out+=`<text class="rp-wallchip" x="${(g.x1-2).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end" style="fill:var(${cvar});opacity:.8">${label} ${arr} ${Math.round(last)}</text>`;
    }
    return out; };
  const dstr=RP.path.map((p,i)=>`${i?'L':'M'}${rpXT(p.t).toFixed(1)} ${rpYP(p.close).toFixed(1)}`).join(' ');
  RP.fireByTs=new Map();
  RP.fires.forEach(fr=>{ fr.xF=rpXT(fr.t); fr.yEntry=rpYP(fr.entry);
    fr.xLock=rpXT(fr.lockT); fr.yLock=rpYP(rpPriceAt(fr.lockT));
    fr.verdict=rpVerdict(fr); if(fr.scan&&fr.scan.ts) RP.fireByTs.set(fr.scan.ts, fr); });
  const fireSVG=RP.fires.map((fr,k)=>{
    const arr=fr.dir==='call'?'▲':'▼', ay=fr.dir==='call'?fr.yEntry-9:fr.yEntry+17;
    return `<g class="rp-fire" data-i="${k}">
      <path class="rp-conn" d="M${fr.xF.toFixed(1)} ${fr.yEntry.toFixed(1)} L${fr.xF.toFixed(1)} ${fr.yEntry.toFixed(1)}"/>
      <circle class="rp-end" cx="${fr.xF.toFixed(1)}" cy="${fr.yEntry.toFixed(1)}" r="3"/>
      <circle class="rp-arrow" cx="${fr.xF.toFixed(1)}" cy="${fr.yEntry.toFixed(1)}" r="3.8"/>
      <text class="rp-arrow" x="${fr.xF.toFixed(1)}" y="${ay.toFixed(1)}" text-anchor="middle" style="font-size:14px">${arr}</text>
    </g>`; }).join('');
  // gravity heat zone — a soft band around the recorded magnet (± ~0.22σ), revealing with the playhead
  const HB=RP.scans.filter(s=>s.magnet!=null&&isFinite(s.magnet)&&s.magnet>=d.lo&&s.magnet<=d.hi&&s.sigma);
  let heat='';
  if(HB.length>1){
    const bw=s=>0.22*(s.sigma||1);
    const top=HB.map(s=>`${rpXT(+new Date(scanTs(s))).toFixed(1)},${rpYP(s.magnet+bw(s)).toFixed(1)}`);
    const bot=HB.slice().reverse().map(s=>`${rpXT(+new Date(scanTs(s))).toFixed(1)},${rpYP(s.magnet-bw(s)).toFixed(1)}`);
    const poly=`${top.join(' ')} ${bot.join(' ')}`;
    heat=`<polygon class="rp-heat fut" points="${poly}"/><polygon class="rp-heat pst" points="${poly}" clip-path="url(#rp-clip)"/>`;
  }
  RP.els.chart.innerHTML = `<svg viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="none">
    <clipPath id="rp-clip"><rect id="rp-clip-r" x="${g.x0}" y="0" width="0" height="${m.h}"/></clipPath>
    <g>${grid.join('')}${tTick.join('')}</g><g>${yLab.join('')}</g>
    ${heat}
    <g>${level('magnet','magnet','magnet','--lantern','left')}${level('flip','flip','flip','--ink-dim','left')}${level('callWall','wall','CALL γ','--jade','right')}${level('putWall','wall','PUT γ','--coral','right')}</g>   <!-- 0DTE γ peaks (≈ATM), NOT the structural wall — honest label, matches the live map's fix -->
    <path class="rp-future" d="${dstr}"/>
    <path class="rp-past" d="${dstr}" clip-path="url(#rp-clip)"/>
    <g id="rp-fires">${fireSVG}</g>
    <line class="rp-head" id="rp-head" x1="${g.x0}" y1="${g.y0}" x2="${g.x0}" y2="${g.y1}"/>
    <circle class="rp-lvl-mk flip" id="rp-mk-flip" r="3" cx="-9" cy="-9"/>
    <circle class="rp-lvl-mk magnet" id="rp-mk-magnet" r="4" cx="-9" cy="-9"/>
    <text class="rp-magval" id="rp-magval" text-anchor="end"></text>
    <circle class="rp-dot" id="rp-dot" r="4.5" cx="${g.x0}" cy="${g.y0}"/></svg>`;
  RP.els.clip=RP.els.chart.querySelector('#rp-clip-r');
  RP.els.head=RP.els.chart.querySelector('#rp-head');
  RP.els.dot =RP.els.chart.querySelector('#rp-dot');
  RP.els.mkMagnet=RP.els.chart.querySelector('#rp-mk-magnet');
  RP.els.mkFlip=RP.els.chart.querySelector('#rp-mk-flip');
  RP.els.magVal=RP.els.chart.querySelector('#rp-magval');
  RP.els.fireEls=[...RP.els.chart.querySelectorAll('.rp-fire')].map(g=>({ g, conn:g.querySelector('.rp-conn'), end:g.querySelector('.rp-end') }));
  RP._rk=null;
}
function rpPaint(){
  if(!RP.geo||!RP.els||!RP.els.clip) return;
  const now=RP.t0+RP.pos*(RP.t1-RP.t0), xNow=rpXT(now);
  RP.els.clip.setAttribute('width', Math.max(0,xNow-RP.geo.x0).toFixed(1));
  RP.els.head.setAttribute('x1',xNow.toFixed(1)); RP.els.head.setAttribute('x2',xNow.toFixed(1));
  RP.els.dot.setAttribute('cx',xNow.toFixed(1)); RP.els.dot.setAttribute('cy',rpYP(rpPriceAt(now)).toFixed(1));
  // live dealer levels at the playhead — a moving marker on the magnet/flip + the current magnet value
  if(RP.els.mkMagnet){
    const mag=rpLevelAt('magnet',now);
    if(mag!=null && mag>=RP.dom.lo && mag<=RP.dom.hi){ const my=rpYP(mag);
      RP.els.mkMagnet.setAttribute('cx',xNow.toFixed(1)); RP.els.mkMagnet.setAttribute('cy',my.toFixed(1));
      RP.els.magVal.setAttribute('x',(xNow-7).toFixed(1)); RP.els.magVal.setAttribute('y',(my-6).toFixed(1)); RP.els.magVal.textContent='magnet '+Math.round(mag);
    } else { RP.els.mkMagnet.setAttribute('cx','-9'); RP.els.magVal.textContent=''; }
    const fl=rpLevelAt('flip',now);
    if(fl!=null && fl>=RP.dom.lo && fl<=RP.dom.hi){ RP.els.mkFlip.setAttribute('cx',xNow.toFixed(1)); RP.els.mkFlip.setAttribute('cy',rpYP(fl).toFixed(1)); }
    else RP.els.mkFlip.setAttribute('cx','-9');
  }
  let win=0,loss=0,scr=0,live=0;
  RP.fires.forEach((fr,k)=>{ const ref=RP.els.fireEls[k]; if(!ref) return; let cls='rp-fire';
    if(now>=fr.t && now<fr.lockT){                 // live: connector traces the follow-through so far
      cls+=' on st-live'; live++;
      const cx=rpXT(now), cy=rpYP(rpPriceAt(now));
      if(ref.conn) ref.conn.setAttribute('d',`M${fr.xF.toFixed(1)} ${fr.yEntry.toFixed(1)} L${cx.toFixed(1)} ${cy.toFixed(1)}`);
      if(ref.end){ ref.end.setAttribute('cx',cx.toFixed(1)); ref.end.setAttribute('cy',cy.toFixed(1)); }
    } else if(now>=fr.lockT){                       // resolved: lock to the 60-min follow-through + verdict
      cls+=' on st-'+fr.verdict; if(fr.verdict==='win')win++; else if(fr.verdict==='loss')loss++; else scr++;
      if(ref.conn) ref.conn.setAttribute('d',`M${fr.xF.toFixed(1)} ${fr.yEntry.toFixed(1)} L${fr.xLock.toFixed(1)} ${fr.yLock.toFixed(1)}`);
      if(ref.end){ ref.end.setAttribute('cx',fr.xLock.toFixed(1)); ref.end.setAttribute('cy',fr.yLock.toFixed(1)); }
    }
    if(ref.g.getAttribute('class')!==cls) ref.g.setAttribute('class',cls);
  });
  if(RP.els.scrub && document.activeElement!==RP.els.scrub) RP.els.scrub.value=Math.round(RP.pos*1000);
  RP.els.time.textContent=rpClock(now);
  rpReadout(now,{win,loss,scr,live});
}
const RP_ARR={up:'▲',down:'▼',flat:'–',none:'·'};
// Every layer's read at the current slice → the residual-stream snapshot the console draws (top→bottom,
// lenses then sensory). Directional layers get an up/down/flat arrow + an agree badge vs the Watchtower;
// context layers (Base, Range Ruler, Event Lens) carry a plain reading with no arrow. Null data = "not recorded".
function rpStream(s){
  const hb=(s.wt&&s.wt.fired&&s.wt.dir)?(s.wt.dir==='call'?'up':'down'):null;
  const dv=(x,p,n)=> x==null?'none': x>p?'up': x<n?'down':'flat';
  const rows=[];
  const push=(name,tier,dir,thought,has)=>{
    const directional=(dir==='up'||dir==='down');
    rows.push({name,tier,dir:dir||'none',thought,has:has!==false,
      agree:(has!==false&&directional&&hb)?(dir===hb):null});
  };
  // — lenses (nearest the processor) —
  const bactive=s.brk&&((s.brk.state&&s.brk.state!=='idle')||(s.brk.dir&&s.brk.dir!=='none'));
  const bd=s.brk&&s.brk.dir;
  push('Break Lens','lens', bactive?(bd==='call'?'up':bd==='put'?'down':'flat'):'flat',
    bactive?`${s.brk.state} · escape ${bd==='call'?'up':'down'}`:'idle · contained', !!s.brk);
  const fd=s.fade&&s.fade.dir;
  push('Fade Lens','lens', fd==='call'?'up':fd==='put'?'down':'flat',
    (s.fade&&(s.fade.armed||s.fade.fired))?`fade ${fd==='call'?'up':'down'}${s.fade.fired?' · fired':''}`:'no fade armed', !!s.fade);
  // — sensory (top → base) —
  const ev=s.evl;
  push('Event Lens','sensory','none',
    ev?(ev.kind?`${ev.kind}${ev.ratio!=null?` · ratio ${f(ev.ratio,2)}`:''}`:'no event today'):'not recorded this day', !!ev);
  const gr=s.groll;
  const grDir=gr&&gr.div?(gr.dir==='far_above'?'up':gr.dir==='far_below'?'down':'flat'):'flat';   // divergence_dir = far_above/far_below
  push('Gamma Roll','sensory', grDir,
    gr?(gr.div?`pin may roll ${grDir==='up'?'up':grDir==='down'?'down':'sideways'}${gr.zw!=null&&gr.fw!=null?` (${f(gr.zw,0)}→${f(gr.fw,0)})`:''}`:'walls aligned'):'not recorded this day', !!gr);
  const rr=s.rr;
  push('Range Ruler','sensory','none',
    rr&&rr.cons!=null?`${Math.round(rr.cons*100)}% of ±${f(rr.emo??rr.em,0)}pt budget used`:'not recorded this day', !!(rr&&rr.cons!=null));
  const sp=s.spd;
  const spDir=sp?(sp.jsign==='up'?'up':sp.jsign==='down'?'down':sp.down==null?'flat':sp.down>0.6?'down':sp.down<0.4?'up':'flat'):'none';   // jump-sign first, else semivar down-share
  push('Speedometer','sensory', spDir,
    sp?(sp.jsign?`jolt ${sp.jsign==='up'?'↑':'↓'}${sp.jz!=null?` · z ${f(sp.jz,1)}`:''}`:`${sp.pace!=null?`pace ${f(sp.pace,1)}×`:'running'}${sp.down!=null?(sp.down>0.6?' · downside heavy':sp.down<0.4?' · upside tilt':''):''}`):'not recorded this day', !!sp);
  const tilt=s.lob&&s.lob.tilt;
  push('Flow','sensory', dv(tilt,0.02,-0.02),
    tilt==null?'no book read':Math.abs(tilt)<0.02?'balanced tape':`${tilt>0?'buyers':'sellers'} leaning`, tilt!=null);
  const soft=s.motion&&s.motion.soft;
  push('Motion','sensory', soft==='up'?'up':soft==='down'?'down':(s.motion?'flat':'none'),
    s.motion?(soft==='up'?'path opens up':soft==='down'?'path opens down':'map holding'):'no read', !!s.motion);
  const dmag=(s.magnet!=null&&s.spot)?(s.magnet-s.spot)/(s.sigma||1):null;
  push('Gravity','sensory', dv(dmag,0.05,-0.05),
    dmag==null?'no read':Math.abs(dmag)<0.05?`at the magnet (${f(s.magnet,0)})`:`pull ${dmag>0?'up':'down'} → ${f(s.magnet,0)}`, dmag!=null);
  push('Base map','sensory','none',
    s.spot!=null?`spot ${f(s.spot,0)} · σ ${f(s.sigma,0)}${s.regime?` · ${s.regime}`:''}`:'—', s.spot!=null);
  return rows;
}
function rpReadout(now,t){
  const s=rpScanAtMs(now)||{};
  const curFr=s.ts&&RP.fireByTs?RP.fireByTs.get(s.ts):null;
  const curState=curFr?(now>=curFr.lockT?curFr.verdict:'live'):'-';
  const key=(s.ts||'-')+`|${t.win}|${t.loss}|${t.scr}|${t.live}|${curState}`;
  if(key===RP._rk) return; RP._rk=key;
  const w=s.wt;
  const hbDir=(w&&w.fired&&w.dir)?(w.dir==='call'?'up':'down'):null;
  // --- the Watchtower head (the decision the stream feeds into) ---
  const scene=(w&&w.scene)?w.scene:'The watch is quiet — no read at this moment.';
  let call;
  if(w&&w.fired&&w.dir){
    const conv=w.conv!=null?` · ${Math.round(w.conv*100)}% sure`:'';
    const vs=w.agrees===false?` <span class="rp-vs">overrides Fade</span>`:'';
    call=`<span class="who">🗼 Watchtower</span> · <span class="dir">${w.dir==='call'?'UP ▲':'DOWN ▼'}</span> · ${sig(w.mag)}${conv}${vs}`;
  } else call=`<span class="who">🗼 Watchtower</span> · <span style="color:var(--ink-dim)">stands aside</span>`;
  const lab={win:'right',loss:'wrong',scratch:'flat',live:'live'}[curState];
  const verdict=curFr?`<span class="rp-wt-verdict ${curState}">${lab}</span>`:'';
  const dec=t.win+t.loss;
  RP.els.wthead.innerHTML=
    `<i class="rp-wt-mark"></i>`+
    `<div class="rp-wt-main"><div class="rp-wt-call">${call}</div><div class="rp-wt-scene">“${scene}”</div></div>`+
    `<div class="rp-wt-side">${verdict}<span class="rp-wt-rec">today ${t.win}–${t.loss}${dec?` · ${Math.round(100*t.win/dec)}%`:''}</span></div>`;
  // --- the layer stream + how it aligned ---
  const stream=rpStream(s);
  RP.els.stream.innerHTML=stream.map(r=>{
    const badge=r.agree===true?`<span class="rp-lbadge y">✓</span>`:r.agree===false?`<span class="rp-lbadge n">·</span>`:`<span class="rp-lbadge"></span>`;
    return `<div class="rp-cell${r.agree===true?' agree':''}${!r.has?' nodata':''}">`+
      `<div class="rp-cell-top"><i class="rp-lmark ${r.tier}"></i><span class="rp-lname">${r.name}</span>`+
      `<span class="rp-larr ${r.dir}">${RP_ARR[r.dir]}</span>${badge}</div>`+
      `<div class="rp-lthought">${r.thought}</div></div>`;
  }).join('');
  const dirs=stream.filter(r=>r.has&&(r.dir==='up'||r.dir==='down'));
  const up=dirs.filter(r=>r.dir==='up').length, down=dirs.filter(r=>r.dir==='down').length;
  const tally=`<span class="up">${up}▲</span> / <span class="dn">${down}▼</span>`;
  if(hbDir){
    const withMaj=hbDir==='up'?up>=down:down>=up;
    RP.els.consensus.innerHTML=`Stack leans ${tally} — the Watchtower went <b>${hbDir==='up'?'UP':'DOWN'}</b>, `+
      (withMaj?`with the stack.`:`<b style="color:var(--coral)">against the stack.</b>`);
  } else RP.els.consensus.innerHTML=`Stack leans ${tally} — the Watchtower stood aside.`;
}
function rpSyncPlayBtn(){ if(RP.els&&RP.els.play){ RP.els.play.innerHTML=RP.playing?RP_ICON_PAUSE:RP_ICON_PLAY; RP.els.play.setAttribute('aria-label',RP.playing?'Pause':'Play'); } }
function rpFrame(ts){
  if(!RP.playing){ RP.raf=null; return; }
  if(!RP.last) RP.last=ts;
  RP.pos += (ts-RP.last)/(RP_PLAY_MS/RP.speed); RP.last=ts;
  if(RP.pos>=1){ RP.pos=1; RP.playing=false; rpSyncPlayBtn(); }
  rpPaint();
  RP.raf = RP.playing ? requestAnimationFrame(rpFrame) : null;
}
function rpTogglePlay(){ if(!RP.days.length) return; RP.playing=!RP.playing; if(RP.playing){ if(RP.pos>=1) RP.pos=0; RP.last=0; RP.raf=requestAnimationFrame(rpFrame); } rpSyncPlayBtn(); }
function rpCycleSpeed(){ RP.speed=RP_SPEEDS[(RP_SPEEDS.indexOf(RP.speed)+1)%RP_SPEEDS.length]; RP.els.speed.textContent=RP.speed+'×'; }
function rpUpdateDayNav(){ const D0=RP.days[RP.di]; if(!D0) return;
  RP.els.dayLabel.innerHTML=`${enWeekday(D0.day)}<small>${enMonthDay(D0.day)} · ${RP.di+1}/${RP.days.length}</small>`;
  RP.els.newer.disabled=RP.di<=0; RP.els.older.disabled=RP.di>=RP.days.length-1; }
async function rpFetchBars(day){
  if(RP.barsCache[day]!==undefined) return RP.barsCache[day];
  try{ const res=await fetch(`/api/raw/file?root=state&path=reversion/bars/${day}-SPX.json&limit=1000`,{cache:'no-store'});
    const d=await res.json(); RP.barsCache[day]=(d&&d.kind==='json'&&Array.isArray(d.data))?d.data:null; }
  catch(e){ RP.barsCache[day]=null; }
  return RP.barsCache[day];
}
async function rpLoadDay(di){
  if(!RP.days.length) return;
  RP.di=Math.max(0,Math.min(RP.days.length-1,di));
  const D0=RP.days[RP.di];
  RP.scans=D0.scans;
  RP.t0=+new Date(D0.day+'T09:30:00-04:00'); RP.t1=+new Date(D0.day+'T16:00:00-04:00');
  RP.playing=false; RP.pos=0; RP.last=0; rpSyncPlayBtn(); rpUpdateDayNav();
  RP.bars=await rpFetchBars(D0.day);
  if(RP.days[RP.di]!==D0) return;            // day changed while awaiting — abort this load
  RP.path=rpPricePath();
  const graded=await rpFetchGraded(D0.day);
  if(RP.days[RP.di]!==D0) return;
  RP.fires=rpAssembleFires(graded);
  rpBuild(); rpPaint();
}
function rpEnsureDom(){
  if(RP.els) return;
  const p=document.getElementById('p-replay');
  p.innerHTML=`
    <div class="phead">
      <div><h2>Replay</h2><div class="desc">How each Watchtower call played out · Pacific time</div></div>
      <div class="rp-head-nav">
        <button class="rp-daybtn" id="rp-newer" title="Newer day">‹</button>
        <div class="rp-daylabel" id="rp-daylabel">—</div>
        <button class="rp-daybtn" id="rp-older" title="Older day">›</button>
      </div>
    </div>
    <div class="chartcard" id="rp-chart"></div>
    <div class="rp-controls">
      <button class="rp-play" id="rp-play" aria-label="Play">${RP_ICON_PLAY}</button>
      <button class="rp-speed" id="rp-speed">1×</button>
      <input class="rp-scrub" id="rp-scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub time"/>
      <div class="rp-time" id="rp-time">—</div>
    </div>
    <div class="rp-console">
      <div class="rp-wt-head" id="rp-wt-head"></div>
      <div class="rp-consensus" id="rp-consensus"></div>
      <div class="rp-stream" id="rp-stream"></div>
    </div>
    <div class="rp-legend">
      <span class="k">the stack now → 🗼 the Watchtower's call · ✓ = layer backs it · ▲up ▼down –flat ·context</span>
      <span class="k">markers +1h:</span>
      <span><i style="background:var(--jade)"></i>right</span>
      <span><i style="background:var(--coral)"></i>wrong</span>
      <span><i style="background:var(--lantern)"></i>live</span>
    </div>`;
  RP.els={ chart:p.querySelector('#rp-chart'), play:p.querySelector('#rp-play'), speed:p.querySelector('#rp-speed'),
    scrub:p.querySelector('#rp-scrub'), time:p.querySelector('#rp-time'),
    wthead:p.querySelector('#rp-wt-head'), consensus:p.querySelector('#rp-consensus'), stream:p.querySelector('#rp-stream'),
    dayLabel:p.querySelector('#rp-daylabel'), newer:p.querySelector('#rp-newer'), older:p.querySelector('#rp-older') };
  RP.els.play.onclick=rpTogglePlay;
  RP.els.speed.onclick=rpCycleSpeed;
  RP.els.scrub.oninput=()=>{ RP.playing=false; rpSyncPlayBtn(); RP.pos=(+RP.els.scrub.value)/1000; rpPaint(); };
  RP.els.newer.onclick=()=>{ if(RP.di>0) rpLoadDay(RP.di-1); };
  RP.els.older.onclick=()=>{ if(RP.di<RP.days.length-1) rpLoadDay(RP.di+1); };
  let rt=null; const ro=new ResizeObserver(()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(RP.path){ rpBuild(); rpPaint(); } },140); });
  ro.observe(p);
}
function rpEmpty(){ RP.els.chart.innerHTML=`<div class="rp-empty">No recorded sessions with Watchtower data yet.</div>`;
  RP.els.dayLabel.textContent='—'; RP.els.time.textContent='—';
  RP.els.wthead.innerHTML=''; RP.els.consensus.innerHTML=''; RP.els.stream.innerHTML=''; }
// (re)build the day list, preserving the selected day across refreshes
function rpSyncDays(reload){
  const prev=RP.days[RP.di]&&RP.days[RP.di].day, wasEmpty=!RP.days.length;
  rpBuildDays();
  if(!RP.days.length){ rpEmpty(); return; }
  let di=0; if(prev){ const j=RP.days.findIndex(d=>d.day===prev); if(j>=0) di=j; }
  RP.di=di;
  if(reload||wasEmpty) rpLoadDay(di); else rpUpdateDayNav();
}
function initReplay(){ rpEnsureDom(); rpSyncDays(true); }

// ---------- tabs ----------
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.panel===name));
  if(name==='replay'){ if(!RP.els) initReplay(); else requestAnimationFrame(()=>{ if(RP.path){ rpBuild(); rpPaint(); } }); }
  if(name==='map') requestAnimationFrame(()=>{ buildMap(); paintMap(); });
}
$("#rail").addEventListener("click", e=>{ const b=e.target.closest(".tab"); if(b) switchTab(b.dataset.tab); });

// ---------- boot ----------
renderLayers(); renderDiary(false); renderHeads(); startLive();
const _modal=document.getElementById('modal');
_modal.addEventListener('click', e=>{ if(e.target===_modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
