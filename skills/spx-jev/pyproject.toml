[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spx-jev"
version = "0.1.0"
description = "The JEV decision service beside the SPX diary: labels, requests, the sums, grading, the phone's card. Read-only sidecar."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["spx_jev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
