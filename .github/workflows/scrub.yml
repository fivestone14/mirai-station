name: scrub

# The leak police. Two jobs, because a leak hides in two different places:
#
#   tree     strings inside the files — an account name in a path, the LAN
#            address as a "realistic" fixture, a real ntfy topic
#   commits  the commit metadata itself — the personal e-mail from the global git
#            config, and the local -0700 stamp that pins the region
#
# Neither can un-push anything; they turn a leak from something nobody notices
# into a red X within a minute. The pre-push hook is the gate, this is the net.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tree:
    name: tree — machine-identifying strings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/scrub.sh

  commits:
    name: commits — noreply identity, +0000 stamp
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the range may reach back past a shallow clone
      # ONLY THE COMMITS UNDER REVIEW, on both event types.
      #
      # A push passed `before..after` and a pull_request passed nothing, so on
      # every PR the script fell back to its own HEAD~20..HEAD default. That
      # window is a fixed slice of history, not a diff, so a PR was audited
      # against twenty commits that were already on main — and against the
      # synthetic merge commit GitHub builds for `refs/pull/N/merge`, which is
      # authored with the account's real e-mail in the local timezone and is
      # not a commit anyone can rewrite. Both are guaranteed failures that say
      # nothing about the change being reviewed.
      #
      # It is self-perpetuating, which is why it looked like "scrub keeps
      # failing": once a bad commit lands, EVERY later PR re-finds it until it
      # scrolls out of the twenty. The five -0700 commits from 2026-08-30 are
      # still at HEAD~10 to HEAD~18 and were still failing PRs today.
      #
      # base.sha..head.sha is the PR's own range and excludes the merge commit.
      #
      # The third case is branch CREATION, where `github.event.before` is the
      # zero sha and `0000..sha` resolves to nothing — which lands right back in
      # the HEAD~20 fallback. What the new branch actually adds is what it holds
      # and the default branch does not, so that is what gets checked. A YAML
      # ternary cannot express three cases, so the range is computed in shell.
      - env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$PR_BASE" ]; then
              RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE##*[!0]*}" ]; then
              git fetch -q origin "$MAIN" 2>/dev/null || true
              RANGE="$AFTER --not origin/$MAIN"      # branch creation
          else
              RANGE="$BEFORE..$AFTER"
          fi
          RANGE="$RANGE" .github/scripts/commit-hygiene.sh
