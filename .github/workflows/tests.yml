name: tests

# Every push runs the whole suite on a throwaway Ubuntu box, so a green check on
# the commit means what the README loop means — without anyone remembering to run
# it on the mini.
#
# The thirteen suite directories each ship their own conftest.py and collide if
# pytest collects them together, so they run as thirteen parallel jobs. Same split as
# the README; the failing box is named in the job title. health_checks runs its
# always-on unit tests here; its live checks need MIRAI_LIVE=1 and the station.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false          # one red box must not hide the other ten
      matrix:
        suite:
          - health_checks
          - screens/desktop_and_phone_server/tests
          - alerts_and_phone_pushes/tests
          - data_collectors/schwab_market_data_client/tests
          - data_collectors/spx_options_tape_collector/tests
          - pipelines/spx_options_scanner/tests
          - screens/voice_desk/tests
          - data_collectors/spy_volume_at_walls_sensor/tests
          - pipelines/sndk_options_scanner_and_reader/tests
          - pipelines/spx_jev_questions_and_pools/tests
          - pipelines/spx_claude_forecast/tests
          - screens/desktop_options_trades_3d_view/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # what the mini's venv runs

      # The tests import nothing but pytest; the list is what the modules UNDER
      # test reach for, and it lives in one file so both repos and the port job
      # install exactly the same thing. See its header for what is left out.
      - name: install
        run: python -m pip install --disable-pip-version-check -q -r .github/requirements-ci.txt

      # The suites are offline by construction (every conftest fixes state on
      # tmp_path and asserts zero network) and the clock work is zoneinfo-based,
      # so the runner is pinned to UTC to keep a machine's timezone out of it.
      - name: pytest
        env:
          TZ: UTC
        run: python -m pytest "${{ matrix.suite }}" -q
