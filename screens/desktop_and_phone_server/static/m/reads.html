<title>SPX reads · Mirai</title>
<!--
  The SPX reads: every graded 30-minute call, a day at a time (Will's design D of 2026-10-09, drawn to his board
  Final-Reads of 2026-10-10). The last five days' score stays pinned at the top with the header, with its share
  right, the five days under it as bars, and a Collapse all / Open all control. Under it the days, newest first, a
  sliver apart: the newest open, the others folded to their score and one square per call, filled when the call was
  right, oldest on the left. An open day draws its price from the open to the close with a dot at each call, the
  wrong ones ringed, and lists its calls earliest to latest in the viewer's zone: the time, where the 30-minute
  average went and what was called, a picture of the window against the call, and Right or Wrong. A tap on a call
  opens its numbers.

  Reads the live lane's average-price grades (JEV_AVERAGE_PRICE_GRADES_BY_READ_AND_HORIZON in station_paths.py)
  through the viewstation's by-name store route, one row per graded window (pipelines/spx_jev_questions_and_pools grade.py, the average-price
  grade): horizon next_30 only, the last row of a read kept. ``from`` is the price the call was made at, ``edge`` its
  flat band either side, ``g`` the 30-minute average's move from it, ``worst`` and ``best`` the window's low and high,
  ``label`` where the average went, ``pick`` the call and ``verdict`` the grade. An open day's line is the day's
  one-minute bars (SPX_PRICE_BARS_BY_MINUTE, the SPX service's bars job, as the forecast page's chart reads them), fetched
  when the reader opens the day: once and kept for a done day, again on each draw while the day runs, since a page
  left open all session (the MacBook's tab) would otherwise draw the line only to the minute it was first asked for.
  Nothing in server.py changes for it.

  The picture: the call's price is the ink tick in the middle, its flat band the shaded box, the window's low to
  high the line, and the average, the number that is graded, the dot, coloured by where it went (up the page's
  blue, down its rust, flat ink). The scale is SCALE_PTS either side on every row, so the rows compare.

  Times are the viewer's, through viewerTime as on the forecast page; which day a call belongs to is its
  market day (the stamp's own date, written in New York's offset). Same paper as the forecast page: its tokens,
  its card, its label row, its header line, its tab bar, and from 1024px up its header row with the tabs in it,
  the days staying a centred column. Text goes in with textContent only; a failed fetch keeps the last list on
  screen and says so. Nothing here reads a viewport unit.
-->

    </a>

  </nav>

<script src="/m/press.js"></script>
<script>
(function(){
  'use strict';
  var GRADES_URL = '/api/store/file?name=JEV_AVERAGE_PRICE_GRADES_BY_READ_AND_HORIZON&lane=live&limit=400';
  var BARS_URL = '/api/store/file?name=SPX_PRICE_BARS_BY_MINUTE&day=';
  var DAYS_SUMMED = 5, SCALE_PTS = 32, POLL_MS = 60000;
  var STRIP_W = 104, STRIP_H = 18;
  var LINE_W = 300, LINE_H = 56, LINE_TOP = 8, LINE_AXIS = 42;   // LINE_W: the line's width for a card not laid out yet
  var NS = 'http://www.w3.org/2000/svg';
  var days = null, drawn = null, failed = false, opened = {};   // opened: each day's open or folded, the newest open at first
  var barsByDay = {};                                           // each done day's bars, asked for once; a running day's are never kept

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function svgEl(tag, attrs, text){
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
    if(text != null) e.textContent = text;
    return e;
  }
  // every time on the page in the phone's own zone, 24-hour, as the forecast page draws it
  var VIEWER_FMT = {};
  function viewerTime(t, how){
    var ms = typeof t === 'number' ? t : Date.parse(t);
    if(t == null || isNaN(ms)) return '?';
    how = how || {};
    var key = how.zone ? 'z' : '';
    try {
      var f = VIEWER_FMT[key] || (VIEWER_FMT[key] = new Intl.DateTimeFormat('en-US', {hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
                                   timeZoneName: how.zone ? 'short' : undefined}));
      var p = {}; f.formatToParts(new Date(ms)).forEach(function(x){ p[x.type] = x.value; });
      return ('0' + (+p.hour % 24)).slice(-2) + ':' + p.minute + (how.zone && p.timeZoneName ? ' ' + p.timeZoneName : '');
    } catch(e){ return '?'; }
  }
  // a market-clock "HH:MM" on a stamp's day as an instant: that date and the stamp's New York offset (the forecast page's)
  function marketAt(iso, hhmm){
    var m = /^(\d{4}-\d\d-\d\d)T.*?([+-]\d\d:\d\d|Z)$/.exec(iso || '');
    return m ? Date.parse(m[1] + 'T' + hhmm + ':00' + m[2]) : NaN;
  }
  function money(x){ return (+x).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
  function signed(x){ x = +x; return (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(1); }
  function cap(s){ s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }

  // the graded 30-minute calls by market day, newest day first and each day's calls earliest first; a read graded
  // twice keeps its last row
  function callDays(rows){
    var byRead = {}, byDay = {};
    (rows || []).forEach(function(r){ if(r && r.horizon === 'next_30' && r.graded && r.row_ts) byRead[r.row_ts] = r; });
    Object.keys(byRead).forEach(function(ts){ var d = ts.slice(0, 10); (byDay[d] = byDay[d] || []).push(byRead[ts]); });
    return Object.keys(byDay).sort().reverse().map(function(d){
      return {day: d, calls: byDay[d].sort(function(a, b){ return Date.parse(a.row_ts) - Date.parse(b.row_ts); })};
    });
  }
  function isRight(c){ return c.verdict === 'right'; }
  function score(calls){ return calls.filter(isRight).length + ' of ' + calls.length; }
  function rightOf(calls){ return score(calls) + ' right'; }
  function share(calls){ return Math.round(calls.filter(isRight).length / calls.length * 100); }
  // "Thu 10-08": the market day's weekday and date, never the viewer's
  function dayName(d){
    var t = Date.parse(d + 'T12:00:00Z');
    return isNaN(t) ? d : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(t).getUTCDay()] + ' ' + d.slice(5);
  }
  // the header's right side: the newest day, and once its close has passed that it is done
  function headLine(d){ return dayName(d.day) + (Date.now() >= marketAt(d.calls[0].row_ts, '16:00') ? ' · day done' : ''); }

  // the window against the call on one scale: the flat band as a box, low to high as a line, the call's price as
  // the tick in the middle, the graded average as the dot in where-it-went's colour; past the scale rests at an end
  function strip(c){
    var mid = STRIP_W / 2, y = STRIP_H / 2, per = (mid - 5) / SCALE_PTS;
    function x(v){ return Math.max(4, Math.min(STRIP_W - 4, mid + v * per)).toFixed(1); }
    var lo = c.worst ? c.worst.points : c.g, hi = c.best ? c.best.points : c.g, edge = +c.edge || 0;
    var svg = svgEl('svg', {viewBox: '0 0 ' + STRIP_W + ' ' + STRIP_H, 'class': 'strip', role: 'img',
                            'aria-label': 'Low ' + signed(lo) + ', average ' + signed(c.g) + ', high ' + signed(hi) + ' points; flat within ' + edge.toFixed(1)});
    svg.appendChild(svgEl('line', {x1: 2, y1: y, x2: STRIP_W - 2, y2: y, 'class': 'ax'}));
    svg.appendChild(svgEl('rect', {x: (mid - edge * per).toFixed(1), y: y - 5, width: (2 * edge * per).toFixed(1), height: 10, rx: 2, 'class': 'band'}));
    svg.appendChild(svgEl('line', {x1: x(lo), y1: y, x2: x(hi), y2: y, 'class': 'span'}));
    svg.appendChild(svgEl('line', {x1: mid, y1: y - 7, x2: mid, y2: y + 7, 'class': 'at'}));
    svg.appendChild(svgEl('circle', {cx: x(c.g), cy: y, r: 4.2, 'class': 'dot' + (c.label === 'up' || c.label === 'down' ? ' ' + c.label : '')}));
    return svg;
  }
  function squares(calls){
    var box = el('div', 'sq');
    calls.forEach(function(c){ box.appendChild(el('i', isRight(c) ? 'ok' : null)); });
    box.setAttribute('role', 'img'); box.setAttribute('aria-label', rightOf(calls) + ', oldest first');
    return box;
  }
  // a day's one-minute bars, as the route wraps them. A done day's are asked for once and kept, done once its close's
  // last bar has landed (16:05, where the forecast page's bars hours end); a running day's line is still growing, so
  // its bars are asked for on every draw of its card, one per new grade, and never kept. Only a day's rows are kept: a
  // fetch that failed, or that the station refused or answered with something else, is asked again next time
  function barsOf(d){
    var day = d.day, done = Date.now() >= marketAt(d.calls[0].row_ts, '16:05');
    if(done && barsByDay[day]) return barsByDay[day];
    var bars = fetch(BARS_URL + day + '&limit=420', {cache: 'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ return j && j.kind === 'jsonl' && Array.isArray(j.rows) ? j.rows : null; })
      .catch(function(){ return null; })
      .then(function(rows){ if(!rows) delete barsByDay[day]; return rows; });
    if(done) barsByDay[day] = bars;
    return bars;
  }
  // the day's price from the open to the close as a line W wide, the low on the axis, a dot at each call's read minute
  // (its bar's close, or the last bar's before it), a wrong call's ringed; the feet the open and the close in the
  // viewer's zone. Nothing under two bars. The drawing goes into the card over its calls (before ``list``) before the
  // wrong calls are named, so each name is measured as the phone draws it. A name takes the first spot inside the
  // drawing above its axis that keeps off the line, the dots and the names placed before: beside its dot, right then
  // left, on the row under it or the one over it, else centred on the dot (held inside the drawing's ends) a row
  // lower, then a row higher. A spot counts only while the name's box sits nearer its own ring than any other dot,
  // so a name never reads as a neighbour's. With no spot free the ring alone marks the call, as the list under the
  // line names every wrong call.
  function dayLine(d, rows, W, list){
    var pts = (rows || []).filter(function(b){ return b && typeof b.close === 'number' && !isNaN(Date.parse(b.ts)); })
      .map(function(b){ return {t: Date.parse(b.ts), c: b.close}; }).sort(function(a, b){ return a.t - b.t; });
    if(pts.length < 2) return null;
    var at = d.calls[0].row_ts, open = marketAt(at, '09:30'), close = marketAt(at, '16:00');
    var lo = Math.min.apply(null, pts.map(function(p){ return p.c; })), hi = Math.max.apply(null, pts.map(function(p){ return p.c; }));
    function x(t){ return Math.max(2, Math.min(W - 2, 2 + (t - open) / (close - open) * (W - 4))); }
    function y(c){ return hi > lo ? LINE_TOP + (hi - c) / (hi - lo) * (LINE_AXIS - LINE_TOP) : (LINE_TOP + LINE_AXIS) / 2; }
    // a word's box is clear when no point of the line falls in it and it meets nothing taken: a dot, or a word
    // placed before with a space either side of it; gap is how far a box sits from a dot's centre
    var taken = [], dots = [];
    function gap(b, o){ return Math.hypot(Math.max(b.x0 - o.cx, 0, o.cx - b.x1), Math.max(b.y0 - o.cy, 0, o.cy - b.y1)); }
    function clear(b){
      return !pts.some(function(p){ var px = x(p.t), py = y(p.c); return px >= b.x0 - 2 && px <= b.x1 + 2 && py >= b.y0 && py <= b.y1; })
          && !taken.some(function(o){ return o.x1 > b.x0 && o.x0 < b.x1 && o.y1 > b.y0 && o.y0 < b.y1; });
    }
    var wrong = d.calls.filter(function(c){ return !isRight(c); });
    var svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + LINE_H, 'class': 'price', role: 'img',
                            'aria-label': 'The day’s price from the ' + viewerTime(open) + ' open to the ' + viewerTime(close) + ' close, a dot at each of the '
                              + d.calls.length + ' calls' + (wrong.length ? ', the ' + (wrong.length === 1 ? 'wrong call' : wrong.length + ' wrong calls') + ' ringed: '
                              + wrong.map(function(c){ return viewerTime(c.row_ts); }).join(', ') : '')});
    svg.appendChild(svgEl('line', {x1: 2, y1: LINE_AXIS, x2: W - 2, y2: LINE_AXIS, 'class': 'ax'}));
    svg.appendChild(svgEl('polyline', {points: pts.map(function(p){ return x(p.t).toFixed(1) + ',' + y(p.c).toFixed(1); }).join(' ')}));
    var named = [];
    d.calls.forEach(function(c){
      var t = Date.parse(c.row_ts), p = null;
      pts.forEach(function(q){ if(q.t <= t) p = q; });
      if(!p) return;
      var cx = x(p.t), cy = y(p.c), ok = isRight(c), r = ok ? 2.2 : 4.2;
      svg.appendChild(svgEl('circle', {cx: cx.toFixed(1), cy: cy.toFixed(1), r: r, 'class': ok ? 'dot' : 'dot wrong'}));
      taken.push({x0: cx - r - 1, x1: cx + r + 1, y0: cy - r - 1, y1: cy + r + 1});
      dots.push({c: c, cx: cx, cy: cy});
      if(!ok) named.push(dots[dots.length - 1]);
    });
    svg.appendChild(svgEl('text', {x: 2, y: LINE_H - 2, 'class': 'foot'}, 'OPEN ' + viewerTime(open)));
    svg.appendChild(svgEl('text', {x: W - 2, y: LINE_H - 2, 'text-anchor': 'end', 'class': 'foot'}, 'CLOSE ' + viewerTime(close)));
    list.parentNode.insertBefore(svg, list);
    named.forEach(function(n){
      var words = svg.appendChild(svgEl('text', {x: 0, y: 0}, viewerTime(n.c.row_ts) + ' wrong')), m = words.getBBox(), spot = null;
      var beside = [n.cx + 8, n.cx - 8 - m.width], centred = [Math.max(2, Math.min(W - 2 - m.width, n.cx - m.width / 2))];
      [[n.cy + 10, beside], [n.cy - 6, beside], [n.cy + 19, centred], [n.cy - 15, centred]].forEach(function(row){
        row[1].forEach(function(x0){
          var b = {x0: x0, x1: x0 + m.width, y0: row[0] + m.y, y1: row[0] + m.y + m.height, base: row[0]};
          if(!spot && b.x0 >= 2 && b.x1 <= W - 2 && b.y0 >= 0 && b.y1 <= LINE_AXIS && clear(b)
             && dots.every(function(o){ return o === n || gap(b, o) > gap(b, n); })) spot = b;
        });
      });
      if(!spot){ svg.removeChild(words); return; }
      taken.push({x0: spot.x0 - 4, x1: spot.x1 + 4, y0: spot.y0, y1: spot.y1});
      words.setAttribute('x', spot.x0.toFixed(1)); words.setAttribute('y', spot.base.toFixed(1));
    });
    return svg;
  }
  function callRow(c){
    var row = el('button', 'call'), nums = el('div', 'nums');
    row.type = 'button'; row.setAttribute('aria-expanded', 'false'); row.setAttribute('data-press', '');
    row.appendChild(el('span', 't', viewerTime(c.row_ts)));
    var w = el('span', 'w'); w.appendChild(el('b', c.label, cap(c.label))); w.appendChild(document.createTextNode('called ' + c.pick));
    row.appendChild(w);
    row.appendChild(strip(c));
    row.appendChild(el('span', isRight(c) ? 'grade ok' : 'grade', isRight(c) ? 'Right' : 'Wrong'));
    var lo = c.worst ? c.worst.points : null, hi = c.best ? c.best.points : null;
    nums.appendChild(document.createTextNode('Low ' + (lo == null ? '?' : signed(lo)) + ' · average '));
    nums.appendChild(el('b', null, signed(c.g)));
    nums.appendChild(document.createTextNode(' · high ' + (hi == null ? '?' : signed(hi)) + ' pts'));
    nums.appendChild(el('br'));
    nums.appendChild(document.createTextNode('Called at ' + money(c.from) + ' · flat within ±' + (+c.edge).toFixed(1)));
    nums.hidden = true;
    row.addEventListener('click', function(){ var o = nums.hidden; nums.hidden = !o; row.setAttribute('aria-expanded', String(o)); });
    return [row, nums];
  }
  function dayCard(d, open){
    var card = el('section', 'card'), head = el('button', 'dh'), list = el('div', 'calls'), lined = false;
    head.type = 'button'; head.setAttribute('aria-expanded', String(open)); head.setAttribute('data-press', '');
    var lab = el('span', 'lab', dayName(d.day)); lab.appendChild(el('span', 'r', rightOf(d.calls)));
    head.appendChild(lab); head.appendChild(el('i', 'chev'));
    card.appendChild(head); card.appendChild(squares(d.calls));
    d.calls.forEach(function(c){ callRow(c).forEach(function(n){ list.appendChild(n); }); });
    list.hidden = !open;
    // the day's line is asked for the first time the day is open and put in over its calls when it comes, laid out at
    // the card's width as it stands then (the head's, which has no sides of its own)
    function line(){
      if(lined) return; lined = true;
      barsOf(d).then(function(rows){ dayLine(d, rows, head.clientWidth || LINE_W, list); });
    }
    if(open) line();
    head.addEventListener('click', function(){
      var now = list.hidden; list.hidden = !now; head.setAttribute('aria-expanded', String(now)); opened[d.day] = now; allLabel();
      if(now) line();
    });
    card.appendChild(list);
    return card;
  }
  // the pinned summary's insides: the last DAYS_SUMMED days' score with its share, Collapse all, or Open all once every
  // day is folded, and the days under them oldest first, the newest in ink
  function summary(box, ds){
    var recent = ds.slice(0, DAYS_SUMMED), all = [].concat.apply([], recent.map(function(d){ return d.calls; }));
    var left = el('div', 'sum-l'), btn = el('button', 'all'), byDay = el('div', 'byday'), oldest = recent.slice().reverse();
    left.appendChild(el('div', 'lab', 'Last ' + recent.length + (recent.length === 1 ? ' day' : ' days')));
    left.appendChild(el('div', 'sum-v', rightOf(all))).appendChild(el('span', null, ' · ' + share(all) + '%'));
    btn.type = 'button'; btn.id = 'all'; btn.setAttribute('data-press', '');
    btn.textContent = anyOpen() ? 'Collapse all' : 'Open all';
    btn.addEventListener('click', function(){ var open = !anyOpen(); days.forEach(function(d){ opened[d.day] = open; }); draw(); });
    oldest.forEach(function(d, i){
      var cell = el('div', i === oldest.length - 1 ? 'now' : null), bar = el('i', 'bar'), fill = el('i');
      fill.style.width = share(d.calls) + '%'; bar.appendChild(fill);
      cell.appendChild(el('b', null, dayName(d.day).slice(0, 3))); cell.appendChild(bar); cell.appendChild(el('span', null, score(d.calls)));
      byDay.appendChild(cell);
    });
    byDay.setAttribute('role', 'img');
    byDay.setAttribute('aria-label', 'By day: ' + oldest.map(function(d){ return dayName(d.day).slice(0, 3) + ' ' + score(d.calls); }).join(', '));
    box.textContent = ''; box.appendChild(left); box.appendChild(btn); box.appendChild(byDay); box.hidden = false;
  }
  function anyOpen(){ return (days || []).some(function(d){ return opened[d.day]; }); }
  function allLabel(){ var b = $('all'); if(b) b.textContent = anyOpen() ? 'Collapse all' : 'Open all'; }
  function draw(){
    var main = $('main'), sub = $('sub');
    sub.className = failed ? 'hd-2 err' : 'hd-2';
    var zone = viewerTime(Date.now(), {zone: true}).split(' ')[1] || '';
    sub.textContent = (failed ? 'Fetch failed, showing the last list · ' : '') + '30-min calls, graded on the average' + (zone ? ' · ' + zone : '');
    if(!days) return;
    main.textContent = '';
    $('hdR').textContent = days.length ? headLine(days[0]) : '';
    if(!days.length){ $('sum').hidden = true; main.appendChild(el('section', 'card', 'No graded calls yet.')); return; }
    days.forEach(function(d, i){ if(!(d.day in opened)) opened[d.day] = i === 0; });   // a new day opens only if it is the newest
    summary($('sum'), days);
    days.forEach(function(d){ main.appendChild(dayCard(d, opened[d.day])); });
  }
  function poll(){
    fetch(GRADES_URL, {cache: 'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if(!j || j.kind !== 'jsonl') throw new Error('no grades');
      // the same list again leaves the page alone, so a call the reader opened stays open
      var next = callDays(j.rows), key = JSON.stringify(next.map(function(d){ return [d.day, d.calls.length, d.calls[d.calls.length - 1].row_ts]; }));
      if(key === drawn && !failed) return;
      days = next; drawn = key; failed = false; draw();
    }).catch(function(){ failed = true; draw(); });
  }
  poll();
  setInterval(function(){ if(!document.hidden) poll(); }, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
})();
</script>
</body>
</html>
