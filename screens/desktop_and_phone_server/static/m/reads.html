<title>SPX · Results</title>
<!--
  The SPX results (Design B, 2026-10-14; Will's design D of 2026-10-09 before it, at the same address): every read
  the forecast page shows, graded, a day at a time. A picker of the last five market days; the square key; the day as
  one lane per read, each square at the time its call was made on one axis whose first hour is zoomed in to half the
  width, so the opening's calls five minutes apart keep apart: the pre-market call (its two checks), the opening calls,
  the combined call, the direction line, Claude, and for comparison JEV alone. A tap on a lane lists its calls under the
  lanes, earliest first, a graded window's numbers a tap away, and its last five days under the list.

  Reads, through the viewstation's by-name store route: the average-price grades (JEV_AVERAGE_PRICE_GRADES_BY_READ_AND_
  HORIZON in station_paths.py, one row per graded window, pipelines/spx_jev_questions_and_pools grade.py) of the live
  lane (horizon next_30), the opening lane (tape, next_10) and the pre-market lane (premarket, its checks open_10 and
  open_30, the day's last graded read standing for the day); the lanes' cards for today's calls still to grade, the
  30-minute card (JEV_LIVE_CARD), the opening card (JEV_OPENING_CARD) and the pre-market card (JEV_PREMARKET_CARD, its
  read's odds too); and a day at a time JEV's own answers (FORECASTS_BY_FORECASTER_READ_AND_HORIZON, voice jev_own), the
  direction line's grades (DIRECTION_LINE_GRADES_BY_READ) and Claude's answers and their outcomes
  (CLAUDE_FORECAST_ANSWERS_BY_READ, CLAUDE_FORECAST_OUTCOMES_BY_READ, written at the evening's finalize; a read whose
  answer failed scored on its starting odds, as the service and the forecast page count it). The files are only ever
  appended to, so a file read once is asked again for its last row alone, and when its count of rows grew for the rows
  added alone; a card only when it can have changed. The 60-minute grades are never shown. In a grade
  row ``from`` is the price the call was made at, ``edge`` its flat band either side, ``g`` the window's average's move
  from it, ``worst`` and ``best`` the window's low and high, ``label`` where the average went, ``pick`` the call and
  ``verdict`` the grade. Nothing in server.py changes for it.

  Times are the viewer's, through viewerTime as on the forecast page; which day a call belongs to is its market day (the
  stamp's own date, written in New York's offset), and the axis's open and close are the day's on the market clock.
  Same paper as the forecast page: its tokens, its card, its square key, its header line, its tab bar, and from 1024px
  up its header row with the tabs in it, the page staying a centred column. Text goes in with textContent only; a
  failed fetch keeps the last results on screen and says so. Nothing here reads a viewport unit, and no sheet opens.
-->

/* From 1024px up (the forecast page's one layout query, so the Results tab stands in the same place on both pages) the

<script>
(function(){
  'use strict';
  // the grades files, every day in each, their newest rows only: the 30-minute calls (lane live), the opening lane's
  // (tape) and the pre-market call's checks (premarket), each limit about a week of a lane's rows (some 26, 12 and 4 a
  // day) so the picker's five days are in it; and the files of one day each: JEV's own answers, the direction line's
  // grades, and Claude's answers and their outcomes
  var GRADES_URL = '/api/store/file?name=JEV_AVERAGE_PRICE_GRADES_BY_READ_AND_HORIZON&lane=';
  var GRADE_LIMITS = {live: 200, tape: 100, premarket: 40};
  var DAY_URLS = {jev: '/api/store/file?name=FORECASTS_BY_FORECASTER_READ_AND_HORIZON&day=',
                  direction: '/api/store/file?name=DIRECTION_LINE_GRADES_BY_READ&day=',
                  answers: '/api/store/file?name=CLAUDE_FORECAST_ANSWERS_BY_READ&day=',
                  outcomes: '/api/store/file?name=CLAUDE_FORECAST_OUTCOMES_BY_READ&day='};
  var DAY_LIMIT = 1000;
  // the lanes' cards, for today's calls still to grade: the 30-minute card, the opening lane's and the pre-market call's
  var CARD_URLS = {live: '/api/store/file?name=JEV_LIVE_CARD', tape: '/api/store/file?name=JEV_OPENING_CARD', pre: '/api/store/file?name=JEV_PREMARKET_CARD'};
  // once a minute in the busy hours of a weekday (the grades land from 09:45, Claude's outcomes at the evening's
  // finalize, 17:15), every five minutes outside them, never on a weekend; a fetch that failed asked again after RETRY_MS
  var DAYS_SHOWN = 5, POLL_MS = 60000, SLOW_MS = 300000, RETRY_MS = 20000, FETCHES_AT_ONCE = 2;   // the station reads two raw files at a time (_RAW_FILE_GATE)
  var BUSY_HOURS = ['09:25', '17:30'];
  var OPENING_END_MIN = 70;                                  // the opening's last call (10:30) is marked 70 minutes after the open
  var COMBINED_FROM = '2026-10-06';                          // the combined forecast is the call from this day; before it JEV alone was
  var NS = 'http://www.w3.org/2000/svg';
  // the lanes, in the order the page draws them: each its name, what it is, the short note over its list, and the hash
  // that picks it
  var LANES = [['premarket', 'Pre-market call', 'read before the open \u00B7 JEV alone', 'two checks \u00B7 JEV alone'],
               ['opening', 'Opening calls', 'every 5 min \u00B7 10-min average \u00B7 JEV alone', '10-min average \u00B7 JEV alone'],
               ['combined', 'Combined call', 'every 30 min \u00B7 30-min average', '30-min average'],
               ['direction', 'Direction line', 'if it moves, which way \u00B7 own mix + Claude', 'which way, if it moves'],
               ['claude', 'Claude', '30-min read \u00B7 not in the call', 'not in the call'], ['jev', 'JEV alone', '30-min raw answer \u00B7 not a call', 'not a call']];
  var grades = {}, live = null, tapeCard = null, preCard = null, perDay = {}, picked = null, lane = 'combined', open = {}, bad = {}, queue = [], running = 0;

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function svgEl(tag, attrs, text){
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
    if(text != null) e.textContent = text;
    return e;
  }
  // every time on the page in the phone's own zone, 24-hour, as the forecast page draws it
  var VIEWER_FMT = {};
  function viewerTime(t, how){
    var ms = typeof t === 'number' ? t : Date.parse(t);
    if(t == null || isNaN(ms)) return '?';
    how = how || {};
    var key = how.zone ? 'z' : '';
    try {
      var f = VIEWER_FMT[key] || (VIEWER_FMT[key] = new Intl.DateTimeFormat('en-US', {hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
                                   timeZoneName: how.zone ? 'short' : undefined}));
      var p = {}; f.formatToParts(new Date(ms)).forEach(function(x){ p[x.type] = x.value; });
      return ('0' + (+p.hour % 24)).slice(-2) + ':' + p.minute + (how.zone && p.timeZoneName ? ' ' + p.timeZoneName : '');
    } catch(e){ return '?'; }
  }
  // a market-clock "HH:MM" on a stamp's day as an instant: that date and the stamp's New York offset (the forecast page's)
  function marketAt(iso, hhmm){
    var m = /^(\d{4}-\d\d-\d\d)T.*?([+-]\d\d:\d\d|Z)$/.exec(iso || '');
    return m ? Date.parse(m[1] + 'T' + hhmm + ':00' + m[2]) : NaN;
  }
  // New York's market day, so the page's today is the forecast page's
  function marketDay(){
    try { return new Intl.DateTimeFormat('en-CA', {timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date()); }
    catch(e){ return null; }
  }
  function money(x){ return (+x).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
  function level(x){ return (+x).toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1}); }
  function signed(x){ x = +x; return (x > 0 ? '+' : x < 0 ? '\u2212' : '') + Math.abs(x).toFixed(1); }
  function cap(s){ s = String(s); return s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' '); }
  function pct(x){ return Math.round((x || 0) * 100) + '%'; }

    var pick = el('div', 'days'); pick.setAttribute('role', 'tablist'); pick.setAttribute('aria-label', 'Day');
    days.forEach(function(d){
      var b = el('button', d === picked ? 'on' : null); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(d === picked)); b.setAttribute('data-k', 'day ' + d);
      b.appendChild(el('b', null, dayName(d).slice(0, 3))); b.appendChild(el('span', null, d.slice(5)));
      b.addEventListener('click', function(){ picked = d; draw(); want(d); });
      pick.appendChild(b);
    });
    main.appendChild(pick);
    main.appendChild(squareKey());
    var isToday = picked === today, head = el('div', 'sec');
    head.appendChild(el('h2', null, (isToday ? 'Today' : dayName(picked)) + ', by read')); head.appendChild(el('span', 'r', 'one lane per read'));
    main.appendChild(head);
    var card = el('section', 'card lanes'); card.setAttribute('aria-label', (isToday ? 'Today' : dayName(picked)) + '\u2019s results, one lane per read');
    main.appendChild(card);
    card.appendChild(el('div', 'cnote', 'Each square sits at the time its call was made (pre-market: at its two checks). Tap a lane to list its calls.'));
    var W = Math.max(240, Math.round(card.clientWidth || 312) - 32), nowAt = isToday && now < closeOf(picked) ? now : null;
    LANES.forEach(function(l){
      if(l[0] === 'jev') card.appendChild(el('div', 'cmp', 'For comparison, not a call'));
      var items = laneItems(l[0], picked), b = el('button', l[0] === lane ? 'lane sel' : 'lane'), h = el('span', 'lane-h'), n = el('span');
      b.type = 'button'; b.setAttribute('aria-pressed', String(l[0] === lane)); b.setAttribute('data-k', 'lane ' + l[0]);
      n.appendChild(el('span', 'lane-n', l[1]));
      n.appendChild(el('span', 'lane-d', laneNote(l, items)));
      h.appendChild(n);
      var tot = items ? laneTotal(l[0], items, picked) : ['\u2026', null], t = el('span', 'lane-t', tot[0]);
      if(tot[1]) t.appendChild(el('small', null, tot[1]));
      h.appendChild(t); b.appendChild(h);
      b.appendChild(laneSvg(W, items || [], picked, nowAt));
      b.setAttribute('aria-label', l[1] + ': ' + tot[0] + (tot[1] ? ', ' + tot[1] : '') + '. List its calls');
      b.addEventListener('click', function(){ lane = l[0]; if(history.replaceState) history.replaceState(null, '', '#' + lane); draw(); });
      card.appendChild(b);
    });
    var ax = el('div', 'lane-ax'); ax.appendChild(axisSvg(W, picked, nowAt)); card.appendChild(ax);
    // the lane picked: its calls, then its last five days
    var meta = LANES.filter(function(l){ return l[0] === lane; })[0], items = laneItems(lane, picked) || [];
    var sh = el('div', 'sec'); sh.appendChild(el('h2', null, meta[1])); sh.appendChild(el('span', 'r', meta[3] + (lane === 'combined' && voices() ? ' \u00B7 mix of ' + voices() + ' voices' : '')));
    main.appendChild(sh);
    var list = el('section', 'card list'), lh = el('div', 'ls-h');
    ['', 'Read', 'Called \u00B7 what happened', 'Result'].forEach(function(x){ lh.appendChild(el('span', null, x)); });
    list.appendChild(lh);
    items.forEach(function(k){ list.appendChild(callRow(lane, k)); });
    if(!items.length) list.appendChild(el('div', 'cnote', laneItems(lane, picked) ? 'No call on this day.' : 'Reading this lane\u2019s day\u2026'));
    var tt = laneTotal(lane, items, picked);
    if(items.length) list.appendChild(el('div', 'cnote ls-f', tt[0] + (tally(items).n ? ' right' : '') + (tt[1] ? ' \u00B7 ' + tt[1] : '') + '.'
      + (lane === 'combined' ? ' The combined call is the mix since ' + COMBINED_FROM.slice(5) + '.' : '')));
    main.appendChild(list);
    main.appendChild(fiveDays(lane, days));
    main.appendChild(el('div', 'foot', 'Scored on the average price over each window, not the last price. pts = S&P index points.'));
    drawnW = main.clientWidth;
    var back = focusKey && main.querySelector('[data-k="' + focusKey + '"]');
    if(back) back.focus({preventScroll: true});
  }
  // the header's right side: the newest day, and under it the zone the page's times are in and whether the day is still
  // running, said done once its close has passed
  function headLine(d0, now){
    var zone = viewerTime(now, {zone: true}).split(' ')[1] || '';
    return [dayName(d0), (zone ? 'Times ' + zone + ' \u00B7 ' : '') + (d0 === marketDay() && now < closeOf(d0) ? 'day in progress, ' + viewerTime(now) : 'day done')];
  }
  // the key, said once over the lanes: the forecast page's squares
  function squareKey(){
    var k = el('div', 'legend'); k.setAttribute('aria-label', 'Square key');
    [['r', 'right'], ['f', 'flat or passed'], ['w', 'wrong'], ['o', 'open']].forEach(function(x){
      var s = el('span'), q = el('span', 'sq'); q.appendChild(el('i', x[0])); s.appendChild(q); s.appendChild(el('span', null, x[1])); k.appendChild(s);
    });
    return k;
  }
  // the lane's last five days, named short ("pre-market", the list above naming the lane whole) so they and their total
  // share a line: each day's score under its name, the picked day ringed, and their total with its share; a line under
  // them says whose days they are
  function fiveDays(name, days){
    var box = el('section', 'card five'), head = el('div', 'five-h'), row = el('div', 'd5'), right = 0, n = 0;
    var meta = LANES.filter(function(l){ return l[0] === name; })[0];
    head.appendChild(el('div', 'lab', 'Last ' + days.length + ' days \u00B7 ' + meta[1].replace(/ calls?$/, '').toLowerCase()));
    days.forEach(function(d){
      var items = laneItems(name, d), t = items ? tally(items) : null, cell = el('span', d === picked ? 'on' : null);
      cell.appendChild(el('span', null, dayName(d).slice(0, 3)));
      cell.appendChild(el('b', null, t ? (t.n ? t.right + ' of ' + t.n : '\u2014') : '\u2026'));
      if(t){ right += t.right; n += t.n; }
      row.appendChild(cell);
    });
    head.appendChild(el('div', 'five-t', n ? right + ' of ' + n + ' \u00B7 ' + Math.round(right / n * 100) + '%' : '\u2014'));
    box.appendChild(head); box.appendChild(row);
    box.appendChild(el('div', 'cnote five-n', 'Each lane has its own 5-day line; this one follows the lane you picked.'));
    days.forEach(function(d){ want(d); });
    return box;
  }

  // ---- the fetching: the grades files, and per day the files a lane needs, the picked day first; a file read once is
  // asked again for its count of rows alone and for the rows it gained only when it grew, a done day's never; every
  // fetch, two at a time (the station reads two raw files at a time)
  // a store file as the station answers it, its rows' count (total) whatever the limit; null when it has no such file
  // ("not found": a day the store has nothing for); a refused or broken answer throws, so the caller keeps what it had
  function stored(url){
    return gate(function(){
      return fetch(url, {cache: 'no-store'}).then(function(r){ if(!r.ok) throw new Error('the station answered ' + r.status); return r.json(); })
        .then(function(j){
          if(j && (j.kind === 'jsonl' && Array.isArray(j.rows) || j.kind === 'json')) return j;
          if(j && j.error === 'not found') return null;
          throw new Error('not a store file');
        });
    });
  }
  function gate(task){ return new Promise(function(ok, no){ queue.push(function(){ return task().then(ok, no); }); pump(); }); }
  function pump(){
    while(running < FETCHES_AT_ONCE && queue.length){
      var task = queue.shift(); running++;
      task().catch(function(){}).then(function(){ running--; pump(); });
    }
  }
  // a jsonl file's rows, its newest `limit`, when they changed since the page last read them, else null: once read, a
  // file is asked for its last row alone (a kilobyte, with the file's count), and when that count grew only the rows
  // added are asked for (the one row in hand when one was) and put after those held, the files being only ever appended
  // to; a count that fell or grew by `limit` or more, rows added between the two asks, or a held last row the station
  // could not parse (a line caught mid-write) read the newest `limit` again; a file the station does not have reads as
  // no rows
  function fresh(key, url, limit){
    var had = held[key];
    function whole(){ return stored(url + '&limit=' + limit).then(function(j){ return hold(key, j, j ? j.rows : []); }); }
    if(!had) return whole();
    return stored(url + '&limit=1').then(function(j){
      var added = (j ? j.total : 0) - had.total, last = had.rows[had.rows.length - 1];
      if(!added) return null;
      if(added < 0 || added >= limit || (last && last._unparsed)) return whole();
      return (added === 1 ? Promise.resolve(j) : stored(url + '&limit=' + added)).then(function(n){
        return n && n.total === had.total + n.rows.length ? hold(key, n, had.rows.concat(n.rows).slice(-limit)) : whole();
      });
    });
  }
  // a file's rows as the page holds them, with the count of rows the station had when they were read
  function hold(key, j, rows){ held[key] = {total: j ? j.total : 0, rows: rows}; return rows; }
  // a fetch's outcome on the header's error line, said until the same fetch succeeds again; true when the page should
  // be drawn again (what it read moved, or the line changes)
  function track(key, p){
    return p.then(function(moved){ var was = bad[key]; delete bad[key]; return moved || !!was; }, function(){ bad[key] = true; return true; });
  }
  // the market clock now, "HH:MM" in New York, and whether it is a weekend there
  function marketClock(){
    try {
      var p = {};
      new Intl.DateTimeFormat('en-US', {timeZone: 'America/New_York', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'})
        .formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
      return {hhmm: ('0' + (+p.hour % 24)).slice(-2) + ':' + p.minute, weekend: p.weekday === 'Sat' || p.weekday === 'Sun'};
    } catch(e){ return null; }
  }
  // how long the page waits between polls: POLL_MS in a weekday's busy hours, SLOW_MS outside them, 0 (none) on a weekend
  function pollEvery(){
    var c = marketClock();
    return !c ? POLL_MS : c.weekend ? 0 : c.hhmm >= BUSY_HOURS[0] && c.hhmm < BUSY_HOURS[1] ? POLL_MS : SLOW_MS;
  }
  // whether a card is worth its download now (some 50 KB the 30-minute card, 20 to 35 the others), never twice in a
  // poll's minute: the first time; the 30-minute card in the busy hours from the mark its next read is due at until
  // that read is on hand, before the close, and every SLOW_MS while today has none; the opening card while the
  // morning's run is on (its first call to its last's mark) and it lags its schedule by a read two minutes old; the
  // pre-market card while today's is still to come, before the checks' close-out (10:06), or its reads are, to five
  // minutes after the last
  function cardDue(k, now){
    var at = cardAt[k], today = marketDay(), open = openOf(today);
    if(at != null && now - at < POLL_MS - 5000) return false;
    if(k === 'live'){
      var c = live, mine = c && String(c.row_ts || '').slice(0, 10) === today;
      if(at == null) return true;
      if(pollEvery() !== POLL_MS) return false;
      return mine ? now >= ((c.marks && Date.parse(c.marks.next_30)) || Date.parse(c.row_ts) + 1800000) && now < closeOf(today) : now - at >= SLOW_MS;
    }
    if(k === 'tape'){
      if(now < open + 5 * 60000 || now > open + (OPENING_END_MIN + 2) * 60000) return false;
      var t = tapeCard, reads = t && String(t.row_ts || '').slice(0, 10) === today && t.schedule && t.schedule.reads;
      if(!reads) return true;
      var due = reads.map(function(r){ return Date.parse(r); }).filter(function(r){ return r <= now - 120000; });
      return due.length > 0 && due[due.length - 1] - Date.parse(t.row_ts) > 60000;
    }
    var p = preCard && preCard.day === today ? preCard : null, jr = p && p.schedule && p.schedule.jev_reads;
    if(at == null) return true;
    if(!p) return now < open + 36 * 60000;
    return !!(jr && jr.length) && now < Date.parse(jr[jr.length - 1]) + 5 * 60000;
  }
  // a card fetched, kept when it moved (a card the station does not have keeps the last); true when the page should be
  // drawn again
  function askCard(k){
    cardAt[k] = Date.now();
    return track('card ' + k, stored(CARD_URLS[k]).then(function(j){
      var c = j && j.kind === 'json' && j.data ? j.data : null;
      if(!c || sig(c) === sig(k === 'live' ? live : k === 'tape' ? tapeCard : preCard)) return false;
      if(k === 'live') live = c; else if(k === 'tape') tapeCard = c; else preCard = c;
      return true;
    }));
  }
  // what makes a card new: a read, or a grading or close-out run (the forecast page's)
  function sig(x){ return x ? [x.generated_at, x.row_ts, x.graded_at || '', x.closed_out_at || ''].join('|') : ''; }
  // the files a lane reads a day at a time
  var LANE_FILES = {jev: ['jev'], direction: ['direction'], claude: ['answers', 'outcomes']};
  var asked = {}, held = {}, cardAt = {}, polledAt = 0, drawnW = 0, resizeTimer = null;
  // a day's files a lane needs, the picked day's all of them, each asked once (poll asks today's again), and today's
  // cards while today is picked; a file that failed keeps its lane unknown, or its last rows, and is asked again after
  // RETRY_MS
  function want(d){
    var files = d === picked ? Object.keys(DAY_URLS) : LANE_FILES[lane] || [], f = perDay[d] = perDay[d] || {};
    files.forEach(function(k){
      var key = d + k;
      if(asked[key]) return;
      asked[key] = 'asking';
      track(key, fresh(key, DAY_URLS[k] + d, DAY_LIMIT).then(function(rows){ asked[key] = 'read'; if(rows) f[k] = rows; return !!rows; }))
        .then(function(redraw){
          if(bad[key]) setTimeout(function(){ asked[key] = false; want(d); }, RETRY_MS);
          if(redraw) draw();
        });
    });
    if(d === picked && d === marketDay()) ['tape', 'pre'].forEach(function(k){ if(cardDue(k, Date.now())) askCard(k).then(function(redraw){ if(redraw) draw(); }); });
  }
  // the grades files and the 30-minute card, then the page; in the busy hours today's day files are asked again (each
  // read only for the rows it gained)
  function poll(){
    polledAt = Date.now();
    var today = marketDay(), jobs = Object.keys(GRADE_LIMITS).map(function(k){
      return track('grades ' + k, fresh('grades ' + k, GRADES_URL + k, GRADE_LIMITS[k]).then(function(rows){ if(rows) grades[k] = rows; return !!rows; }));
    });
    if(cardDue('live', polledAt)) jobs.push(askCard('live'));
    Promise.all(jobs).then(function(){
      if(pollEvery() === POLL_MS) Object.keys(DAY_URLS).forEach(function(k){ if(asked[today + k] === 'read') asked[today + k] = false; });
      draw();
    });
  }
  var HASH = {'#premarket': 'premarket', '#opening': 'opening', '#combined': 'combined', '#direction': 'direction', '#claude': 'claude', '#jev': 'jev'};
  if(HASH[location.hash]) lane = HASH[location.hash];
  poll();
  // the page asks once a minute whether a poll is due; brought back to the screen it polls at once if its last is
  // older than its wait (SLOW_MS on a weekend)
  setInterval(function(){ var every = pollEvery(); if(!document.hidden && every && Date.now() - polledAt >= every - 5000) poll(); }, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && Date.now() - polledAt >= (pollEvery() || SLOW_MS)) poll(); });
  // a turn of the phone or a resized window lays the lanes out again at the card's new width, once it settles
  window.addEventListener('resize', function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(function(){ if($('main').clientWidth !== drawnW) draw(); }, 150); });
})();
</script>
</body>
