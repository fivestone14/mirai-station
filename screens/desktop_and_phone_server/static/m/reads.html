<title>SPX · Results</title>
<!--
  The SPX results (Design B, 2026-10-14; Will's design D of 2026-10-09 before it, at the same address): every read
  the forecast page shows, graded, a day at a time. A picker of the last five market days; the square key; the day as
  one lane per read, each square at the time its call was made on one axis whose first hour is zoomed in to half the
  width, so the opening's calls five minutes apart keep apart: the pre-market call (its two checks), the opening calls,
  the combined call, the direction line, Claude, and for comparison JEV alone. A tap on a lane lists its calls under the
  lanes, earliest first, a graded window's numbers a tap away, and its last five days under the list.

  Reads, through the viewstation's by-name store route: the average-price grades (JEV_AVERAGE_PRICE_GRADES_BY_READ_AND_
  HORIZON in station_paths.py, one row per graded window, pipelines/spx_jev_questions_and_pools grade.py) of the live
  lane (horizon next_30), the opening lane (tape, next_10) and the pre-market lane (premarket, its checks open_10 and
  open_30, the day's last graded read standing for the day); the 30-minute card (JEV_LIVE_CARD) for today's open call;
  and a day at a time JEV's own answers (FORECASTS_BY_FORECASTER_READ_AND_HORIZON, voice jev_own), the direction line's
  grades (DIRECTION_LINE_GRADES_BY_READ) and Claude's answers and their outcomes (CLAUDE_FORECAST_ANSWERS_BY_READ,
  CLAUDE_FORECAST_OUTCOMES_BY_READ, written at the evening's finalize). The 60-minute grades are never shown. In a grade
  row ``from`` is the price the call was made at, ``edge`` its flat band either side, ``g`` the window's average's move
  from it, ``worst`` and ``best`` the window's low and high, ``label`` where the average went, ``pick`` the call and
  ``verdict`` the grade. Nothing in server.py changes for it.

  Times are the viewer's, through viewerTime as on the forecast page; which day a call belongs to is its market day (the
  stamp's own date, written in New York's offset), and the axis's open and close are the day's on the market clock.
  Same paper as the forecast page: its tokens, its card, its square key, its header line, its tab bar, and from 1024px
  up its header row with the tabs in it, the page staying a centred column. Text goes in with textContent only; a
  failed fetch keeps the last results on screen and says so. Nothing here reads a viewport unit, and no sheet opens.
-->

<script>
(function(){
  'use strict';
  // the grades files, every day in each: the 30-minute calls (lane live), the opening lane's (tape) and the pre-market
  // call's checks (premarket); and the files of one day each: JEV's own answers, the direction line's grades, and
  // Claude's answers and their outcomes
  var GRADES_URL = '/api/store/file?name=JEV_AVERAGE_PRICE_GRADES_BY_READ_AND_HORIZON&lane=';
  var GRADE_LIMITS = {live: 2000, tape: 20000, premarket: 2000};
  var DAY_URLS = {jev: '/api/store/file?name=FORECASTS_BY_FORECASTER_READ_AND_HORIZON&limit=1000&day=',
                  direction: '/api/store/file?name=DIRECTION_LINE_GRADES_BY_READ&day=',
                  answers: '/api/store/file?name=CLAUDE_FORECAST_ANSWERS_BY_READ&limit=500&day=',
                  outcomes: '/api/store/file?name=CLAUDE_FORECAST_OUTCOMES_BY_READ&day='};
  var LIVE_URL = '/api/store/file?name=JEV_LIVE_CARD';
  var DAYS_SHOWN = 5, POLL_MS = 60000, FETCHES_AT_ONCE = 2;   // the station reads two raw files at a time (_RAW_FILE_GATE)
  var COMBINED_FROM = '2026-10-06';                          // the combined forecast is the call from this day; before it JEV alone was
  var NS = 'http://www.w3.org/2000/svg';
  // the lanes, in the order the page draws them: each its name, what it is, and the hash that picks it
  var LANES = [['premarket', 'Pre-market call', 'read before the open \u00B7 JEV alone'], ['opening', 'Opening calls', 'every 5 min \u00B7 10-min average \u00B7 JEV alone'],
               ['combined', 'Combined call', 'every 30 min \u00B7 30-min average'], ['direction', 'Direction line', 'if it moves, which way \u00B7 own mix + Claude'],
               ['claude', 'Claude', '30-min read \u00B7 not in the call'], ['jev', 'JEV alone', '30-min raw answer \u00B7 not a call']];
  var grades = {}, live = null, perDay = {}, picked = null, lane = 'combined', open = {}, failed = false, queue = [], running = 0;

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function svgEl(tag, attrs, text){
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
    if(text != null) e.textContent = text;
    return e;
  }
  // every time on the page in the phone's own zone, 24-hour, as the forecast page draws it
  var VIEWER_FMT = {};
  function viewerTime(t, how){
    var ms = typeof t === 'number' ? t : Date.parse(t);
    if(t == null || isNaN(ms)) return '?';
    how = how || {};
    var key = how.zone ? 'z' : '';
    try {
      var f = VIEWER_FMT[key] || (VIEWER_FMT[key] = new Intl.DateTimeFormat('en-US', {hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
                                   timeZoneName: how.zone ? 'short' : undefined}));
      var p = {}; f.formatToParts(new Date(ms)).forEach(function(x){ p[x.type] = x.value; });
      return ('0' + (+p.hour % 24)).slice(-2) + ':' + p.minute + (how.zone && p.timeZoneName ? ' ' + p.timeZoneName : '');
    } catch(e){ return '?'; }
  }
  // a market-clock "HH:MM" on a stamp's day as an instant: that date and the stamp's New York offset (the forecast page's)
  function marketAt(iso, hhmm){
    var m = /^(\d{4}-\d\d-\d\d)T.*?([+-]\d\d:\d\d|Z)$/.exec(iso || '');
    return m ? Date.parse(m[1] + 'T' + hhmm + ':00' + m[2]) : NaN;
  }
  // New York's market day, so the page's today is the forecast page's
  function marketDay(){
    try { return new Intl.DateTimeFormat('en-CA', {timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date()); }
    catch(e){ return null; }
  }
  function money(x){ return (+x).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
  function level(x){ return (+x).toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1}); }
  function signed(x){ x = +x; return (x > 0 ? '+' : x < 0 ? '\u2212' : '') + Math.abs(x).toFixed(1); }
  function cap(s){ s = String(s); return s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' '); }
  function pct(x){ return Math.round((x || 0) * 100) + '%'; }
  // "Thu 10-08": the market day's weekday and date, never the viewer's
  function dayName(d){
    var t = Date.parse(d + 'T12:00:00Z');
    return isNaN(t) ? d : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(t).getUTCDay()] + ' ' + d.slice(5);
  }

  // a grades file's graded calls of one horizon by market day, newest day first and each day's calls earliest first; a
  // read graded twice keeps its last row
  function callDays(rows, horizon){
    var byRead = {}, byDay = {};
    (rows || []).forEach(function(r){ if(r && r.horizon === horizon && r.graded && r.row_ts) byRead[r.row_ts] = r; });
    Object.keys(byRead).forEach(function(ts){ var d = ts.slice(0, 10); (byDay[d] = byDay[d] || []).push(byRead[ts]); });
    return Object.keys(byDay).sort().reverse().map(function(d){
      return {day: d, calls: byDay[d].sort(function(a, b){ return Date.parse(a.row_ts) - Date.parse(b.row_ts); })};
    });
  }
  function dayOf(rows, horizon, d){ return (callDays(rows, horizon).filter(function(x){ return x.day === d; })[0] || {calls: []}).calls; }
  // the days the picker offers: the newest DAYS_SHOWN market days with a graded 30-minute call, today among them once its
  // first card is written
  function pickDays(){
    var ds = callDays(grades.live, 'next_30').map(function(x){ return x.day; }), today = liveDay();
    if(today && ds.indexOf(today) < 0) ds.unshift(today);
    return ds.slice(0, DAYS_SHOWN).reverse();
  }
  // the 30-minute card's day when it is today's: its open call is the Combined call's open square
  function liveDay(){ return live && String(live.row_ts || '').slice(0, 10) === marketDay() ? marketDay() : null; }

  // the header's right side: the newest day, and under it the zone the page's times are in and whether the day is still

  // ---- the fetching: the grades files once and once a minute; the per-day files of a day when a lane needs them, the

    }
  }
  // the files a lane reads a day at a time
  var LANE_FILES = {jev: ['jev'], direction: ['direction'], claude: ['answers', 'outcomes']};
  var asked = {};
  function want(d){
    var files = d === picked ? Object.keys(DAY_URLS) : LANE_FILES[lane] || [], f = perDay[d] = perDay[d] || {};
    files.forEach(function(k){
      var key = d + k;
      if(asked[key]) return;
      asked[key] = true;
      // a day with no such file (the direction line began 10-12) has none of its calls; a fetch that failed is asked again
      gate(function(){ return rawRows(DAY_URLS[k] + d).then(function(rows){ f[k] = rows || []; draw(); }, function(){ asked[key] = false; }); });
    });
  }
  function poll(){
    var all = Object.keys(GRADE_LIMITS).map(function(k){
      return rawRows(GRADES_URL + k + '&limit=' + GRADE_LIMITS[k]).then(function(rows){ if(!rows) throw new Error('no grades'); grades[k] = rows; });
    });
    var card = fetch(LIVE_URL, {cache: 'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ live = j && j.kind === 'json' ? j.data : live; }).catch(function(){});
    Promise.all(all.concat([card])).then(function(){ failed = false; }).catch(function(){ failed = true; }).then(function(){
      // today's day files are asked for again with every poll, a done day's kept
      var today = marketDay(); Object.keys(DAY_URLS).forEach(function(k){ asked[today + k] = false; });
      draw();
    });
  }
  var HASH = {'#premarket': 'premarket', '#opening': 'opening', '#combined': 'combined', '#direction': 'direction', '#claude': 'claude', '#jev': 'jev'};
  if(HASH[location.hash]) lane = HASH[location.hash];
  poll();
  setInterval(function(){ if(!document.hidden) poll(); }, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
})();
</script>
